/* =========================================================================
   PISTE : génération ligne par ligne (trous + relief)
   ========================================================================= */
function resetTrack(seed, modifier) {
  S.seed = seed;
  rng = prng(seed);
  S.tiles = [];
  S.H = [0];
  S.obst = {};
  S.curvePhase = rng() * 1000;
  S.ringPhase = rng() * 6.283;
  S.gen = {
    gap: 0, sx: 2, sw: 3,             // chemin principal
    slope: 0, target: 0, seg: 0, rate: 0.009, next: null,   // relief
    mod: modifier || '',
    safe: START_ROWS,                 // lignes pleines et plates jusqu'ici
    sec: null, secCool: 60, full: 0,  // sections d'obstacles
  };
  buildRows(VIEW_ROWS + 4);
}

function pickSlope(g, row) {
  const modK = g.mod === 'steep' ? 1.5 : 1;
  const steep = modK * Math.min(1, 0.6 + row / 1500);
  g.rate = 0.009;                                   // vitesse de transition normale
  if (g.sec) {                                      // pas de plongée au milieu des obstacles
    g.target = -(rng() * 0.08); g.seg = 10; g.next = null; return;
  }
  // Enchaînement forcé (après une rampe ou une plongée)
  if (g.next) {
    const n = g.next; g.next = null;
    if (n === 'kick') { g.target = 0; g.rate = 0.16; g.seg = 14 + ((rng() * 10) | 0); return; }   // sortie sèche : envol
    if (n === 'recover') { g.target = -0.1; g.rate = 0.03; g.seg = 16 + ((rng() * 12) | 0); return; }
  }
  const r = rng();
  if (row < 220) {
    // Début de partie : relief modéré pour prendre la main
    g.target = r < 0.65 ? -(0.05 + rng() * 0.1) : 0;
    g.seg = 18 + ((rng() * 30) | 0);
    return;
  }
  const dropChance = Math.min(0.26, 0.12 + row / 12000);
  const rampChance = Math.min(0.14, 0.05 + row / 20000);
  if (r < dropChance) {
    // Plongée : pente très raide et courte, entrée brutale qui fait décoller la balle
    g.target = -(0.34 + rng() * 0.26) * modK;
    g.rate = 0.13;
    g.seg = 10 + ((rng() * 14) | 0);
    g.next = 'recover';
  } else if (r < dropChance + rampChance) {
    // Tremplin : montée raide et courte, puis sortie sèche qui projette en l'air
    g.target = (0.2 + rng() * 0.12) * modK;
    g.rate = 0.05;
    g.seg = 6 + ((rng() * 5) | 0);
    g.next = 'kick';
  } else if (r < 0.62) {
    g.target = -(0.07 + rng() * 0.2) * steep;      // descente franche (majoritaire)
    g.seg = 16 + ((rng() * 36) | 0);
  } else if (r < 0.82) {
    g.target = 0;                                   // plat
    g.seg = 14 + ((rng() * 30) | 0);
  } else {
    g.target = (0.05 + rng() * 0.1) * steep;       // montée
    g.seg = 12 + ((rng() * 24) | 0);
  }
}

function startSection(g, i) {
  const types = [];
  if (i >= UNLOCK_AT.barrier) types.push('barrier', 'barrier');
  if (i >= UNLOCK_AT.slider && g.mod !== 'narrow') types.push('slider');
  if (!types.length) return;
  const type = types[(rng() * types.length) | 0];
  g.sec = { type: type, left: 26 + ((rng() * 20) | 0), next: 6 };
}

function placeObstacle(g, i) {
  const T = S.tiles;
  // zone franche autour de l'obstacle : pas de trou juste avant ni juste après
  g.gap = Math.min(g.gap, -1);
  for (let k = 1; k <= 3; k++) if (T[i - k]) T[i - k].fill(1);
  g.full = 5;
  if (g.sec.type === 'barrier') {
    let segs;
    if (rng() < 0.5 || g.mod === 'narrow') segs = [[0, LANES - 1]];          // pleine largeur : il faut sauter
    else {
      const o = (rng() * (LANES - 1)) | 0;                                     // passage de 2 dalles
      segs = [];
      if (o > 0) segs.push([0, o - 1]);
      if (o + 2 <= LANES - 1) segs.push([o + 2, LANES - 1]);
    }
    S.obst[i] = { type: 'bar', segs: segs };
    g.sec.next = 11 + ((rng() * 7) | 0);
  } else {
    S.obst[i] = { type: 'slide', center: g.sx + g.sw / 2 - 0.5 - 3, amp: Math.max(1.2, g.sw / 2 + 0.6), phase: rng() * 6.283 };
    g.sec.next = 9 + ((rng() * 6) | 0);
  }
}

function buildRows(upTo) {
  const g = S.gen, T = S.tiles, Hh = S.H;
  for (let i = T.length; i <= upTo; i++) {
    // Sections d'obstacles : elles remplacent une partie des trous
    if (!g.sec && i >= g.safe + 10 && !g.next && Math.abs(g.slope) < 0.15) {
      if (--g.secCool <= 0 && rng() < 0.04) startSection(g, i);
    }
    const inSec = !!g.sec;
    const comp = inSec ? 0.35 : 1;                         // compensation : moins de trous
    const holeChance = Math.min(0.16, i / 16000) * comp;
    const tileLoss = Math.min(0.12, i / 20000) * comp;
    const spacing = 14 - Math.min(6, i / 500);

    if (g.gap < -spacing && g.full <= 0 && rng() < holeChance) {
      const len = 2 + Math.min(3.5, i / 700);
      g.gap = g.mod === 'giant_holes' ? len * 2.5 : len;
    }
    if (rng() < 0.1) {
      g.sw = 2 + ((rng() * 3) | 0);
      g.sx = clamp(g.sx - 2 + ((rng() * 5) | 0), 0, LANES - g.sw);
    }
    if (g.mod === 'narrow') {
      g.sw = 1;
      if (rng() < 0.18) g.sx = (LANES - 1) >> 1;
      g.sx = clamp(g.sx, 0, LANES - 1);
    }
    g.gap--;

    const row = new Uint8Array(LANES);
    for (let j = 0; j < LANES; j++) {
      const onPath = j >= g.sx && j < g.sx + g.sw;
      row[j] = (i < g.safe || g.full > 0
        || rng() > 0.9
        || (g.gap < 0 && onPath && rng() > tileLoss)) ? 1 : 0;
    }
    if (g.full > 0) g.full--;

    // Contenu de la section en cours : on pose barrières et blocs
    if (g.sec) {
      if (--g.sec.next <= 0) {
        T[i] = row;
        placeObstacle(g, i);
        row.fill(1);
      }
      if (--g.sec.left <= 0) { g.sec = null; g.secCool = 40 + ((rng() * 40) | 0); }
    }
    // Pads d'accélération : récompense occasionnelle, hors obstacles
    if (i >= UNLOCK_AT.boost && !S.obst[i] && i >= g.safe && rng() < 0.006) {
      const lanes = [];
      for (let j = 0; j < LANES; j++) if (row[j] === 1) lanes.push(j);
      if (lanes.length) row[lanes[(rng() * lanes.length) | 0]] = T_BOOST;
    }
    T[i] = row;

    if (i >= g.safe) {
      if (--g.seg <= 0) pickSlope(g, i);
      g.slope += clamp(g.target - g.slope, -(g.rate || 0.009), g.rate || 0.009);
    } else {
      g.slope = 0;
    }
    Hh[i + 1] = Hh[i] + g.slope;
  }
}

function tileAt(z, col) {
  const r = Math.floor(z);
  if (col < 0 || col >= LANES || r < 0) return 0;
  const row = S.tiles[r];
  if (!row) return 0;
  return row[col] ? 1 : 0;
}
function tileType(z, col) {
  const r = Math.floor(z);
  if (col < 0 || col >= LANES || r < 0 || !S.tiles[r]) return 0;
  return S.tiles[r][col];
}
function groundAt(z) {
  if (z < 0) return 0;
  const r = Math.floor(z);
  if (r + 1 >= S.H.length) buildRows(r + 2);
  const f = z - r;
  return S.H[r] + (S.H[r + 1] - S.H[r]) * f;
}
function slopeAt(z) { return groundAt(z + 0.5) - groundAt(z - 0.5); }

/* Courbure visuelle de l'horizon (n'affecte pas la physique) */
function curveAt(z) {
  const p = S.curvePhase;
  return 0.008 * Math.sin((z + p) / 57) * (0.6 + 0.4 * Math.sin((z + p) / 23));
}

/* =========================================================================
   CAMÉRA ET PROJECTION
   ========================================================================= */
let cosP = 1, sinP = 0, FE = 1;
const P = [0, 0, 0];   // sortie de project() : x écran, y écran, échelle

function project(x, y, z) {
  const vz = z - S.camZ;
  const ahead = vz - camBack;
  const bend = ahead > 0 ? S.curve * ahead * ahead : 0;
  const vx = x + bend - S.camX;
  const vy = y - S.camY;
  const zc = vz * cosP - vy * sinP;
  if (zc < 0.15) return false;
  const yc = vy * cosP + vz * sinP;
  const s = FE / zc;
  P[0] = CX + vx * s;
  P[1] = CY - yc * s;
  P[2] = s;
  return true;
}

function updateCamera(snap) {
  const g = groundAt(S.pz);
  const followY = Math.max(S.py, g - 0.8) * 0.35 + g * 0.65;
  const k = snap ? 1 : 0.12;
  S.camX += (S.px * 0.85 - S.camX) * k;
  S.camY += (followY + camUp - S.camY) * (snap ? 1 : 0.15);
  S.camZ = S.pz - camBack;
  const look = 9;
  const ty = groundAt(S.pz + look) + 0.2;
  const follow = Math.atan2(S.camY - ty, look + camBack);
  const level = Math.atan2(camUp - 0.2, look + camBack);
  const want = level + (follow - level) * 0.45;
  S.pitch += (clamp(want, -0.2, 0.85) - S.pitch) * (snap ? 1 : 0.07);
  S.curve += (curveAt(S.pz) - S.curve) * 0.05;
  cosP = Math.cos(S.pitch); sinP = Math.sin(S.pitch);
  S.boostE += ((S.boost > 0 ? 1 : 0) - S.boostE) * (S.boost > 0 ? 0.15 : 0.05);
  FE = F * (1 - 0.16 * S.boostE);
}

/* =========================================================================
   PHYSIQUE
   ========================================================================= */
function jumpWanted() {
  return S.jumpBuf > 0 || S.jumpHeld || S.modifier === 'jumpy';
}

function doJump(groundVy) {
  S.vy = JUMP_VEL + Math.max(0, groundVy);
  S.grounded = false;
  S.coyote = 0;
  S.jumpBuf = 0;
  S.jumps++;
  S.airStart = S.pz;
  if (S.jumps === 1) unlock('first_jump');
  Sound.jump();
}

function stepPhysics() {
  S.frames++;
  if (S.jumpBuf > 0) S.jumpBuf--;

  // Direction
  let dx = 0;
  const k = S.keys;
  if (k.ArrowLeft || k.a || k.q || k.A || k.Q) dx -= STEER_KEYS;
  if (k.ArrowRight || k.d || k.D) dx += STEER_KEYS;
  if (dx === 0 && S.steerTarget !== null) {
    dx = clamp((S.steerTarget - S.px) * 0.3, -0.2, 0.2);
  }
  S.px += dx;
  if (S.modifier === 'windy') S.px += Math.sin(S.time * 0.021) * 0.035;

  // Vitesse : progression + bonus de descente
  const sl = slopeAt(S.pz);
  S.slopeBoost += (clamp(-sl * 0.2, 0, 0.07) - S.slopeBoost) * 0.06;
  // 12 m/s au départ, ~16 m/s à 1 000 m, ~19 m/s à 2 000 m, plafond ~25 m/s
  const base = (BASE_SPEED + (MAX_SPEED - BASE_SPEED) * (1 - Math.exp(-S.pz / 3000))) * speedMul;
  if (S.ramp < 1) S.ramp = Math.min(1, S.ramp + 1 / 50);
  S.speed = (base + S.slopeBoost) * (0.25 + 0.75 * S.ramp);

  if (S.boost > 0 || S.hover > 0) S.speed *= 1 + 0.55 * S.boostE;

  const gPrev = groundAt(S.pz);
  const zPrev = S.pz;
  S.pz += S.speed;
  if (Math.floor(S.pz) + VIEW_ROWS + 2 >= S.tiles.length) buildRows(Math.floor(S.pz) + VIEW_ROWS + 6);
  const g = groundAt(S.pz);
  const col = Math.round(S.px + 3);
  const solid = tileAt(S.pz, col);

  // Survol pendant le boost : on passe au-dessus des trous, on pulvérise les obstacles
  if (S.boost > 0 || S.hover > 0) {
    if (S.boost > 0) S.boost--;
    else S.hover--;
    if (S.boost === 0 && S.hover === 0 && !S.hoverArmed) { S.hover = 60; S.hoverArmed = true; }
    S.py += (g + 0.4 - S.py) * 0.25;
    S.vy = 0; S.grounded = false; S.airStart = -1;
    if (S.boost === 0 && solid) { S.hover = 0; S.hoverArmed = false; land(g); }
    checkObstacles(zPrev, g);
    return;
  }

  if (S.grounded) {
    const groundVy = g - gPrev;
    if (solid && S.vy - groundVy > GRAVITY * gravMul * 1.2 && !jumpWanted()) {
      // crête ou fin de tremplin : la balle garde son élan et décolle
      S.grounded = false;
      S.coyote = COYOTE;
      S.airStart = S.pz;
    } else if (solid) {
      S.py = g;
      S.vy = groundVy;
      if (tileType(S.pz, col) === T_BOOST) startBoost();
      S.lastSafeZ = S.pz; S.lastSafeCol = col;
      if (jumpWanted()) doJump(S.vy);
    } else {
      S.grounded = false;       // on quitte le bord avec l'élan de la pente
      S.coyote = COYOTE;
      S.airStart = S.pz;
    }
  }

  if (!S.grounded) {
    if (S.coyote > 0) {
      S.coyote--;
      if (S.jumpBuf > 0) doJump(0);
    }
    S.vy -= GRAVITY * gravMul;
    S.py += S.vy;

    if (solid && S.vy <= 0 && S.py <= g && S.py > g - LAND_TOLERANCE) {
      land(g);
      if (tileType(S.pz, col) === T_BOOST) startBoost();
    } else if (S.py < g - FALL_LIMIT) {
      die();
      return;
    }
  }
  checkObstacles(zPrev, g);
}

function startBoost() {
  if (S.boost > 0) return;
  S.boost = BOOST_FRAMES; S.hover = 0; S.hoverArmed = false;
  S.flash = 0; S.shake = Math.max(S.shake, 6);
  Sound.boost();
  burst(S.px, S.py, S.pz, 16, 0.08);
}

// Barrières et blocs glissants : collision si la balle les traverse trop bas
function checkObstacles(zPrev, g) {
  if (S.mode !== 'playing') return;
  const r0 = Math.floor(zPrev) - 1, r1 = Math.floor(S.pz) + 1;
  const boosting = S.boost > 0 || S.hover > 0;
  for (let r = r0; r <= r1; r++) {
    const o = S.obst[r];
    if (!o || o.broken) continue;
    let hit = false;
    if (o.type === 'bar') {
      const zb = r + 0.5;
      if (zPrev <= zb + 0.1 && S.pz >= zb - 0.1) {
        const inLane = o.segs.some(function (sg) { return S.px > sg[0] - 3.5 - PLAYER_R * 0.6 && S.px < sg[1] - 2.5 + PLAYER_R * 0.6; });
        if (inLane && S.py - groundAt(zb) < BAR_H - 0.02) hit = true;
      }
    } else {
      if (S.pz > r + 0.1 - PLAYER_R && S.pz < r + 0.9 + PLAYER_R) {
        const bx = sliderX(o);
        if (Math.abs(S.px - bx) < 0.45 + PLAYER_R * 0.8 && S.py - groundAt(r + 0.5) < SLIDE_H) hit = true;
      }
    }
    if (!hit) continue;
    if (boosting) {
      o.broken = true;
      S.shake = Math.max(S.shake, 9);
      burst(S.px, S.py + 0.2, r + 0.5, 22, 0.1);
      Sound.smash();
    } else {
      S.vy = 0.02; S.pz = Math.min(S.pz, r + 0.3);
      die();
      return;
    }
  }
}
function sliderX(o) { return o.center + o.amp * Math.sin(S.pz * 0.45 + o.phase); }

function land(g) {
  const impact = Math.min(1, -S.vy * 8);
  S.py = g; S.vy = 0; S.grounded = true;
  if (S.airStart >= 0) {
    const d = S.pz - S.airStart;
    S.airTotal += d;
    if (d >= 15) unlock('air_15');
    S.airStart = -1;
  }
  Sound.land(impact);
  if (!reducedMotion) {
    S.shake = Math.max(S.shake, 1.5 + impact * 5);
    dust(S.px, g, S.pz, 12 + Math.round(impact * 10), 0.04 + impact * 0.04);
  }
}

/* ---------------- Particules (espace monde) ---------------- */
/* Gerbe au point de contact : les grains partent du sol sous la balle,
   s'écartent sur les côtés, restent près de la piste et traînent derrière. */
function dust(x, y, z, n, power) {
  for (let i = 0; i < n; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    S.particles.push({
      x: x + side * Math.random() * 0.08, y: y + 0.01, z: z,
      vx: side * (0.3 + Math.random()) * power,
      vy: Math.random() * power * 0.7,
      vz: S.speed * (0.25 + Math.random() * 0.5),
      life: 0.8 + Math.random() * 0.2,
    });
  }
}
function burst(x, y, z, n, power) {
  for (let i = 0; i < n; i++) {
    S.particles.push({
      x: x, y: y + 0.05, z: z,
      vx: (Math.random() - 0.5) * power * 2,
      vy: Math.random() * power * 1.4,
      vz: (Math.random() - 0.3) * power * 2 + S.speed * 0.6,
      life: 1,
    });
  }
}
function stepParticles() {
  const ps = S.particles;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.x += p.vx; p.y += p.vy; p.z += p.vz;
    p.vy -= 0.004;
    p.life -= 0.035;
    if (p.life <= 0) ps.splice(i, 1);
  }
  if (S.mode === 'playing') {
    S.trail.push({ x: S.px, y: S.py, z: S.pz });
    if (S.trail.length > 8) S.trail.shift();
  }
}

/* ---------------- Lignes de vitesse (décor) ---------------- */
function initStreaks() {
  S.streaks = [];
  for (let i = 0; i < 46; i++) S.streaks.push(newStreak(true));
}
function newStreak(anywhere) {
  const side = Math.random() < 0.5 ? -1 : 1;
  return {
    x: side * (5 + Math.random() * 14),
    y: (Math.random() - 0.35) * 12,
    dz: anywhere ? 2 + Math.random() * 48 : 44 + Math.random() * 8,
  };
}

/* =========================================================================
   RENDU
   ========================================================================= */
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STARS = [];
for (let i = 0; i < 90; i++) STARS.push({ x: Math.random(), y: Math.random() * 0.75, s: Math.random() * 1.4 + 0.3, t: Math.random() * 6 });

function pal() { return PAL_BY_ID[S.palette] || PALETTES[0]; }

/* =========================================================================
   SATURNE ET SES ANNEAUX
   Le plan des anneaux remplace l'horizon. On le traverse régulièrement,
   vers le haut ou vers le bas, au milieu d'un nuage de cristaux de glace.
   Tout est calculé à partir de la distance parcourue (jamais de l'horloge),
   donc les replays et les défis partagés sont identiques.
   ========================================================================= */
const CRYSTALS = [];

/* Poussière de glace en suspension : quelques milliers de cristaux qui
   filent près de la caméra et donnent l'échelle et la vitesse. */
function initCrystals() {
  CRYSTALS.length = 0;
  const n = clamp(Math.round(W * H / 2600), 150, 300);
  for (let i = 0; i < n; i++) CRYSTALS.push(newCrystal(true));
}
function newCrystal(anywhere) {
  const d = anywhere ? 2 + Math.random() * 90 : 76 + Math.random() * 20;
  return {
    x: S.camX + (Math.random() - 0.5) * (6 + d * 0.55),
    y: S.camY + (Math.random() - 0.5) * (4 + d * 0.3),
    z: S.camZ + d,
    s: 0.5 + Math.random() * 0.9,
    t: Math.random() * 6.283,
  };
}
function stepCrystals() {
  for (let i = 0; i < CRYSTALS.length; i++) {
    const c = CRYSTALS[i];
    const d = c.z - S.camZ;
    if (d < 1.2 || Math.abs(c.x - S.camX) > 6 + d * 0.7 || Math.abs(c.y - S.camY) > 6 + d * 0.4) {
      CRYSTALS[i] = newCrystal(false);
    }
  }
}
// Rendu groupé : 3 niveaux d'intensité x 2 teintes, pour ne faire que
// quelques appels de dessin même avec des centaines de grains.
const DUST_A = [0.22, 0.45, 0.8];
const DUST_C = ['#f4fbff', '#f2e8d2'];
function drawCrystals(far) {
  const hy = CY - Math.tan(S.pitch) * FE;
  const streak = S.speed * 16;
  const dots = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  const lines = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  let used = 0;
  for (let i = 0; i < CRYSTALS.length; i++) {
    const c = CRYSTALS[i];
    const d = c.z - S.camZ;
    if (far ? d < 14 : d >= 14) continue;
    if (!project(c.x, c.y, c.z)) continue;
    const x = P[0], y = P[1];
    if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    let a = clamp(1.3 - d / 85, 0, 1) * (0.55 + 0.25 * Math.sin(S.time * 0.25 + c.t));
    if (d > 10 && y > hy && Math.abs(x - CX) < W * 0.34) a *= 0.3;
    if (a < 0.06) continue;
    const lvl = a > 0.6 ? 2 : a > 0.3 ? 1 : 0;
    const gi = lvl * 2 + (i % 5 === 0 ? 1 : 0);
    used |= 1 << gi;
    const sz = clamp(0.026 * P[2] * c.s, 1, 4);
    if (d < 60 && streak > 1.5) {
      lines[gi].moveTo(x, y);
      lines[gi].lineTo(x, y + streak * P[2] * 0.02);
    } else {
      dots[gi].rect(x - sz / 2, y - sz / 2, sz, sz);
    }
  }
  for (let gi = 0; gi < 6; gi++) {
    if (!(used & (1 << gi))) continue;
    ctx.globalAlpha = DUST_A[gi >> 1];
    ctx.fillStyle = ctx.strokeStyle = DUST_C[gi & 1];
    ctx.fill(dots[gi]);
    ctx.lineWidth = 1 + (gi >> 1) * 0.6;
    ctx.stroke(lines[gi]);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Points de repère : on croise un astre de temps en temps ----
   Position calculée à partir de la distance : chaque astre est un objet 3D
   placé sur le côté, qui grossit et défile quand on le dépasse. */
const LANDMARK_SPACING = 620;
const PLANET_SKINS = [
  ['#7fd2ff', '#2b6fa8', '#07223a'],   // glacée
  ['#ffb07a', '#c1552b', '#2c0f08'],   // rouille
  ['#ffe6a3', '#c89a3c', '#3a2708'],   // dorée
  ['#d7b0ff', '#6a3fb0', '#1d0c33'],   // violette
  ['#b9ffd9', '#2f9e6b', '#07281a'],   // émeraude
];

function landmarkAt(i) {
  const rnd = prng(hash('lm' + S.seed + '_' + i));
  rnd(); rnd();
  const side = rnd() < 0.5 ? 1 : -1;
  return {
    z: i * LANDMARK_SPACING + 260,
    x: side * (70 + rnd() * 70),                        // sur le côté de la piste
    y: 12 + rnd() * 34,                                 // au-dessus
    r: 20 + rnd() * 34,
    hole: rnd() < 0.18,                                 // parfois un trou noir
    ring: rnd() < 0.3,
    skin: PLANET_SKINS[(rnd() * PLANET_SKINS.length) | 0],
    tilt: 0.14 + rnd() * 0.3,
    spin: rnd() < 0.5 ? 1 : -1,
  };
}

/* Les astres sont dessinés une fois dans un petit sprite, puis simplement
   collés à l'écran : leur taille est arrondie par paliers, donc le sprite
   n'est reconstruit que de loin en loin. */
const LM_CACHE = new Map();
function landmarkSprite(lm, i, r) {
  const key = i + ':' + Math.round(r / 6);
  let spr = LM_CACHE.get(key);
  if (spr) return spr;
  const pad = Math.ceil(r * (lm.hole ? 3.1 : lm.ring ? 1.95 : 1.15)) + 2;
  if (pad < 3 || pad > 1200) return null;
  const c = document.createElement('canvas');
  const dpr = Math.min(DPR, 2);
  c.width = Math.ceil(pad * 2 * dpr); c.height = c.width;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const x = pad, y = pad;
  if (lm.hole) {
    const halo = g.createRadialGradient(x, y, r * 0.9, x, y, r * 3);
    halo.addColorStop(0, 'rgba(120,90,220,.35)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(x, y, r * 3, 0, Math.PI * 2); g.fill();
    g.save(); g.translate(x, y); g.rotate(lm.tilt * lm.spin);
    g.strokeStyle = 'rgba(255,214,150,.85)';
    g.lineWidth = Math.max(1, r * 0.13);
    g.beginPath(); g.ellipse(0, 0, r * 1.7, r * 0.42, 0, 0, Math.PI * 2); g.stroke();
    g.restore();
    g.fillStyle = '#000';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,238,210,.9)';
    g.lineWidth = Math.max(0.8, r * 0.07);
    g.beginPath(); g.arc(x, y, r * 1.06, 0, Math.PI * 2); g.stroke();
  } else {
    const col = lm.skin;
    if (lm.ring) {
      g.save(); g.translate(x, y); g.rotate(lm.tilt * lm.spin);
      g.strokeStyle = 'rgba(236,228,210,.35)';
      g.lineWidth = Math.max(1, r * 0.18);
      g.beginPath(); g.ellipse(0, 0, r * 1.75, r * 0.45, 0, Math.PI, Math.PI * 2); g.stroke();
      g.restore();
    }
    const bg = g.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.05, x, y, r);
    bg.addColorStop(0, col[0]); bg.addColorStop(0.55, col[1]); bg.addColorStop(1, col[2]);
    g.fillStyle = bg;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.save(); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.clip();
    const n = g.createLinearGradient(x - r * 0.3, y - r * 0.5, x + r, y + r * 0.7);
    n.addColorStop(0, 'rgba(0,0,0,0)');
    n.addColorStop(0.55, 'rgba(2,1,8,.35)');
    n.addColorStop(1, 'rgba(2,1,8,.9)');
    g.fillStyle = n; g.fillRect(x - r, y - r, r * 2, r * 2);
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.22)';
    g.lineWidth = Math.max(0.6, r * 0.04);
    g.beginPath(); g.arc(x, y, r * 1.02, Math.PI * 0.75, Math.PI * 1.85); g.stroke();
    if (lm.ring) {
      g.save(); g.translate(x, y); g.rotate(lm.tilt * lm.spin);
      g.strokeStyle = 'rgba(236,228,210,.5)';
      g.lineWidth = Math.max(1, r * 0.18);
      g.beginPath(); g.ellipse(0, 0, r * 1.75, r * 0.45, 0, 0, Math.PI); g.stroke();
      g.restore();
    }
  }
  spr = { c: c, pad: pad };
  if (LM_CACHE.size > 6) LM_CACHE.clear();
  LM_CACHE.set(key, spr);
  return spr;
}

function drawLandmark(lm, i) {
  const d = lm.z - S.camZ;
  if (d < -40 || d > 900) return;
  if (!project(S.camX * 0.15 + lm.x, S.camY + lm.y, lm.z)) return;
  const x = P[0], y = P[1], r = lm.r * P[2];
  if (r < 0.7 || x < -r * 3 || x > W + r * 3 || y < -r * 3 || y > H + r * 3) return;
  const spr = landmarkSprite(lm, i, r);
  if (!spr) return;
  const fade = clamp((900 - d) / 300, 0, 1) * clamp(1 - Math.abs(x - CX) / (W * 1.4), 0.25, 1);
  ctx.globalAlpha = fade;
  ctx.drawImage(spr.c, x - spr.pad, y - spr.pad, spr.pad * 2, spr.pad * 2);
  ctx.globalAlpha = 1;
}

function drawLandmarks() {
  const i0 = Math.floor((S.camZ - 300) / LANDMARK_SPACING);
  for (let i = i0; i <= i0 + 2; i++) {
    if (i < 0) continue;
    drawLandmark(landmarkAt(i), i);
  }
}

function drawBackground() {
  const p = pal();
  const dark = S.modifier === 'dark';
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, dark ? '#000000' : p.bgTop);
  g.addColorStop(1, dark ? '#050208' : p.bgBot);
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // deux couches d'étoiles : la plus proche dérive plus vite
  for (let layer = 0; layer < 2; layer++) {
    const par = layer ? 14 : 5;
    const sc = layer ? 1 : 0.65;
    for (let i = layer; i < STARS.length; i += 2) {
      const s = STARS[i];
      const a = (0.2 + 0.4 * Math.sin(S.time * 0.03 + s.t)) * (layer ? 1 : 0.6);
      ctx.fillStyle = 'rgba(255,255,255,' + (dark ? a * 0.4 : a) + ')';
      const x = ((s.x * W - S.camX * par) % W + W) % W;
      ctx.fillRect(x, s.y * H, s.s * sc, s.s * sc);
    }
  }

  drawLandmarks();
  drawCrystals(true);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

function drawStreaks() {
  const p = pal();
  ctx.strokeStyle = hexA(p.accent, 0.28);
  ctx.lineWidth = 1;
  ctx.beginPath();
  const len = 1 + S.speed * 9;
  for (let i = 0; i < S.streaks.length; i++) {
    const s = S.streaks[i];
    if (!project(S.camX + s.x, S.camY + s.y, S.camZ + s.dz)) continue;
    const x1 = P[0], y1 = P[1];
    if (!project(S.camX + s.x, S.camY + s.y, S.camZ + s.dz + len)) continue;
    ctx.moveTo(x1, y1); ctx.lineTo(P[0], P[1]);
  }
  ctx.stroke();
}
function stepStreaks(speed) {
  for (let i = 0; i < S.streaks.length; i++) {
    const s = S.streaks[i];
    s.dz -= speed * 1.4;
    if (s.dz < 1) S.streaks[i] = newStreak(false);
  }
}

// points réutilisés pour limiter les allocations
const Q = [];
for (let i = 0; i < 8; i++) Q.push([0, 0]);
function q(i, x, y, z) { if (!project(x, y, z)) return false; Q[i][0] = P[0]; Q[i][1] = P[1]; return true; }

function drawTrack() {
  const p = pal();
  const dark = S.modifier === 'dark';
  const fogNear = dark ? 3 : VIEW_ROWS * 0.45;
  const fogFar = dark ? 13 : VIEW_ROWS - 1;
  const rFirst = Math.max(0, Math.floor(S.camZ + 0.4));
  const rLast = Math.min(S.tiles.length - 2, Math.floor(S.camZ) + VIEW_ROWS);

  for (let r = rLast; r >= rFirst; r--) {
    const row = S.tiles[r];
    if (!row) continue;
    const vz = r + 0.5 - S.camZ;
    const alpha = clamp(1 - (vz - fogNear) / (fogFar - fogNear), 0, 1);
    if (alpha <= 0.01) continue;

    const z0 = Math.max(r, S.camZ + 0.4);
    const z1 = r + 1;
    const h0 = groundAt(z0), h1 = S.H[r + 1];
    const prev = S.tiles[r - 1];
    const hue = p.hues[Math.floor(r / 250) % p.hues.length];

    const topA = new Path2D(), topB = new Path2D(), sides = new Path2D(), edges = new Path2D();
    let any = false;
    const boosts = [];
    const solidN = function (v) { return v === 1 || v === T_BOOST; };

    for (let j = 0; j < LANES; j++) {
      const tv = row[j];
      if (!tv) continue;
      const x0 = j - 3.5, x1 = j - 2.5;
      if (!q(0, x0, h0, z0) || !q(1, x1, h0, z0) || !q(2, x1, h1, z1) || !q(3, x0, h1, z1)) continue;
      any = true;
      const T = TILE_DEPTH;

      // face avant (visible au bord d'un trou)
      if ((!prev || !solidN(prev[j]) || z0 > r) && q(4, x1, h0 - T, z0) && q(5, x0, h0 - T, z0)) {
        sides.moveTo(Q[0][0], Q[0][1]); sides.lineTo(Q[1][0], Q[1][1]);
        sides.lineTo(Q[4][0], Q[4][1]); sides.lineTo(Q[5][0], Q[5][1]); sides.closePath();
      }
      // flanc gauche / droit
      if ((j === 0 || !solidN(row[j - 1])) && S.camX < x0 && q(6, x0, h1 - T, z1) && q(7, x0, h0 - T, z0)) {
        sides.moveTo(Q[0][0], Q[0][1]); sides.lineTo(Q[3][0], Q[3][1]);
        sides.lineTo(Q[6][0], Q[6][1]); sides.lineTo(Q[7][0], Q[7][1]); sides.closePath();
      }
      if ((j === LANES - 1 || !solidN(row[j + 1])) && S.camX > x1 && q(6, x1, h1 - T, z1) && q(7, x1, h0 - T, z0)) {
        sides.moveTo(Q[1][0], Q[1][1]); sides.lineTo(Q[2][0], Q[2][1]);
        sides.lineTo(Q[6][0], Q[6][1]); sides.lineTo(Q[7][0], Q[7][1]); sides.closePath();
      }

      const top = ((r + j) & 1) ? topA : topB;
      top.moveTo(Q[0][0], Q[0][1]); top.lineTo(Q[1][0], Q[1][1]);
      top.lineTo(Q[2][0], Q[2][1]); top.lineTo(Q[3][0], Q[3][1]); top.closePath();
      edges.moveTo(Q[0][0], Q[0][1]); edges.lineTo(Q[1][0], Q[1][1]);
      edges.lineTo(Q[2][0], Q[2][1]); edges.lineTo(Q[3][0], Q[3][1]); edges.closePath();
      if (tv === T_BOOST) boosts.push([Q[0].slice(), Q[1].slice(), Q[2].slice(), Q[3].slice()]);
    }
    if (!any && !S.obst[r]) continue;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'hsl(' + hue + ',75%,7%)';
    ctx.fill(sides);
    ctx.fillStyle = 'hsl(' + hue + ',65%,11%)';
    ctx.fill(topA);
    ctx.fillStyle = 'hsl(' + hue + ',65%,15%)';
    ctx.fill(topB);
    const near = clamp(1 - vz / 30, 0.25, 1);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'hsla(' + hue + ',100%,60%,' + (0.22 * near) + ')';
    ctx.lineWidth = 1 + 4 * near;
    ctx.stroke(edges);
    ctx.strokeStyle = 'hsl(' + hue + ',100%,' + (dark ? 45 : 62) + '%)';
    ctx.lineWidth = 0.6 + 0.9 * near;
    ctx.stroke(edges);

    for (let b = 0; b < boosts.length; b++) drawBoostPad(boosts[b], p, near);
    const ob = S.obst[r];
    if (ob && !ob.broken) { ctx.globalAlpha = alpha; drawObstacle(r, ob, near); }
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Obstacles : rendu ---------------- */
function bil(c, u, v) {           // point dans une dalle projetée (u gauche-droite, v près-loin)
  const ax = c[0][0] + (c[1][0] - c[0][0]) * u, ay = c[0][1] + (c[1][1] - c[0][1]) * u;
  const bx = c[3][0] + (c[2][0] - c[3][0]) * u, by = c[3][1] + (c[2][1] - c[3][1]) * u;
  return [ax + (bx - ax) * v, ay + (by - ay) * v];
}
function drawBoostPad(c, p, near) {
  ctx.fillStyle = hexA(p.accent, 0.22 + 0.1 * Math.sin(S.time * 0.3));
  ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]); ctx.lineTo(c[1][0], c[1][1]); ctx.lineTo(c[2][0], c[2][1]); ctx.lineTo(c[3][0], c[3][1]); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, 2.4 * near);
  ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  const off = (S.time * 0.05) % 1;
  for (let k = 0; k < 2; k++) {
    const v = (k * 0.5 + off) % 1 * 0.7 + 0.05;
    const a = bil(c, 0.22, v), t = bil(c, 0.5, v + 0.22), b = bil(c, 0.78, v);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(t[0], t[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.strokeStyle = p.accent;
  ctx.lineWidth = Math.max(1, 1.6 * near);
  ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]); ctx.lineTo(c[1][0], c[1][1]); ctx.lineTo(c[2][0], c[2][1]); ctx.lineTo(c[3][0], c[3][1]); ctx.closePath(); ctx.stroke();
}

function quad(pts, fill, stroke, glow, near) {
  for (let i = 0; i < 4; i++) if (!q(i, pts[i][0], pts[i][1], pts[i][2])) return;
  ctx.beginPath();
  ctx.moveTo(Q[0][0], Q[0][1]); ctx.lineTo(Q[1][0], Q[1][1]); ctx.lineTo(Q[2][0], Q[2][1]); ctx.lineTo(Q[3][0], Q[3][1]); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = glow; ctx.lineWidth = 1 + 5 * near; ctx.stroke();
  ctx.strokeStyle = stroke; ctx.lineWidth = 0.8 + 1.2 * near; ctx.stroke();
}
function drawObstacle(r, o, near) {
  const hb = groundAt(r + 0.5);
  if (o.type === 'bar') {
    const z = r + 0.5, H = BAR_H, d = 0.14;
    const pulse = 0.5 + 0.5 * Math.sin(S.time * 0.35);
    for (let i = 0; i < o.segs.length; i++) {
      const xa = o.segs[i][0] - 3.5, xb = o.segs[i][1] - 2.5;
      quad([[xa, hb + H, z], [xb, hb + H, z], [xb, hb + H, z + d], [xa, hb + H, z + d]], 'rgba(255,46,166,.6)', '#ffd6f0', 'rgba(255,46,166,.35)', near);
      quad([[xa, hb, z], [xb, hb, z], [xb, hb + H, z], [xa, hb + H, z]], 'rgba(255,46,166,' + (0.28 + 0.12 * pulse) + ')', '#ffffff', 'rgba(255,46,166,.45)', near);
      // rayon laser central
      if (q(0, xa, hb + H * 0.5, z) && q(1, xb, hb + H * 0.5, z)) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 + 0.4 * pulse) + ')';
        ctx.lineWidth = Math.max(1, 1.5 * near);
        ctx.beginPath(); ctx.moveTo(Q[0][0], Q[0][1]); ctx.lineTo(Q[1][0], Q[1][1]); ctx.stroke();
      }
    }
  } else {
    const bx = sliderX(o), x0 = bx - 0.45, x1 = bx + 0.45, zA = r + 0.1, zB = r + 0.9, H = SLIDE_H;
    if (S.camX < x0) quad([[x0, hb, zA], [x0, hb, zB], [x0, hb + H, zB], [x0, hb + H, zA]], 'rgba(120,10,25,.85)', '#ff8093', 'rgba(255,43,74,.3)', near);
    if (S.camX > x1) quad([[x1, hb, zA], [x1, hb, zB], [x1, hb + H, zB], [x1, hb + H, zA]], 'rgba(120,10,25,.85)', '#ff8093', 'rgba(255,43,74,.3)', near);
    quad([[x0, hb + H, zA], [x1, hb + H, zA], [x1, hb + H, zB], [x0, hb + H, zB]], 'rgba(255,43,74,.75)', '#ffd0d6', 'rgba(255,43,74,.35)', near);
    quad([[x0, hb, zA], [x1, hb, zA], [x1, hb + H, zA], [x0, hb + H, zA]], 'rgba(200,20,45,.8)', '#ffffff', 'rgba(255,43,74,.45)', near);
    // chevrons d'avertissement sur la face avant
    if (q(0, x0, hb, zA) && q(1, x1, hb, zA) && q(2, x1, hb + H, zA) && q(3, x0, hb + H, zA)) {
      const c = [Q[0].slice(), Q[1].slice(), Q[2].slice(), Q[3].slice()];
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(1, 2 * near);
      for (let k = 0; k < 3; k++) {
        const u = 0.2 + k * 0.3;
        const a = bil(c, u - 0.1, 0.25), m = bil(c, u + 0.05, 0.5), b = bil(c, u - 0.1, 0.75);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(m[0], m[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }
  }
}

function drawPlayer() {
  const p = pal();
  const g = groundAt(S.pz);
  const col = Math.round(S.px + 3);

  // ombre portée
  const h = S.py - g;
  if (tileAt(S.pz, col) && h > -0.2 && h < 5 && project(S.px, g, S.pz)) {
    const k = 1 - h / 5;
    const rx = PLAYER_R * P[2] * 1.1 * k;
    ctx.fillStyle = 'rgba(0,0,0,' + (0.55 * k) + ')';
    ctx.beginPath(); ctx.ellipse(P[0], P[1], rx, rx * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(S.skin === 'ember' ? '#ff7a1a' : p.glow, 0.5 * k);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // traînée
  for (let i = 0; i < S.trail.length - 1; i++) {
    const t = S.trail[i];
    if (!project(t.x, t.y + PLAYER_R, t.z)) continue;
    const f = i / S.trail.length;
    ctx.fillStyle = hexA(S.skin === 'ember' ? '#ff5a10' : p.glow, (S.skin === 'ember' ? 0.2 : 0.12) * f);
    ctx.beginPath(); ctx.arc(P[0], P[1], PLAYER_R * P[2] * (0.4 + 0.6 * f), 0, Math.PI * 2); ctx.fill();
  }

  if (!project(S.px, S.py + PLAYER_R, S.pz)) return;
  const x = P[0], y = P[1], r = PLAYER_R * P[2];
  drawSkin(S.skin, x, y, r, p);
}

function drawSkin(id, x, y, r, p, fx) {
  const t = S.time;
  if (id === 'ember') { drawEmber(x, y, r, fx || EMBER_MAIN); return; }
  if (id === 'void') { drawBlackHole(x, y, r, p, fx || EMBER_MAIN); return; }
  const roll = fx ? fx.roll : S.roll, rate = fx ? fx.rate : S.spinRate;
  // halo commun
  const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.2);
  halo.addColorStop(0, hexA(p.glow, 0.45));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2); ctx.fill();

  if (id === 'glitch') {
    const j = (Math.sin(t * 0.7) * 0.5 + (Math.random() < 0.08 ? (Math.random() - 0.5) * 3 : 0)) * r * 0.18;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ff2ea6'; ctx.beginPath(); ctx.arc(x - r * 0.12 + j, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1ef2ff'; ctx.beginPath(); ctx.arc(x + r * 0.12 - j, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fill();
    drawSpin(x, y, r, roll, rate, true);
    ctx.fillStyle = 'rgba(6,3,13,.8)';
    for (let i = 0; i < 3; i++) ctx.fillRect(x - r, y - r + ((t * 3 + i * 17) % (2 * r)), 2 * r, Math.max(1, r * 0.08));
    return;
  }
  const body = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  if (id === 'skull') {
    body.addColorStop(0, '#ffffff'); body.addColorStop(1, '#bdb6c9');
  } else if (id === 'eye') {
    body.addColorStop(0, '#ffffff'); body.addColorStop(1, '#d9d3e6');
  } else {
    body.addColorStop(0, '#ffffff'); body.addColorStop(0.45, p.player); body.addColorStop(1, p.glow);
  }
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (id !== 'core') drawSpin(x, y, r, roll, rate, true);

  if (id === 'eye') {
    const look = clamp(((S.steerTarget !== null ? S.steerTarget : S.px) - S.camX) * 0.25, -0.35, 0.35);
    const ix = x + look * r, iy = y + r * 0.05;
    ctx.fillStyle = p.accent; ctx.beginPath(); ctx.arc(ix, iy, r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#05020a'; ctx.beginPath(); ctx.arc(ix, iy, r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ix - r * 0.1, iy - r * 0.1, r * 0.07, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'skull') {
    ctx.fillStyle = '#16111d';
    ctx.beginPath(); ctx.ellipse(x - r * 0.36, y - r * 0.1, r * 0.22, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.36, y - r * 0.1, r * 0.22, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y + r * 0.12); ctx.lineTo(x - r * 0.1, y + r * 0.32); ctx.lineTo(x + r * 0.1, y + r * 0.32); ctx.fill();
    ctx.fillRect(x - r * 0.38, y + r * 0.5, r * 0.76, Math.max(1, r * 0.07));
    for (let i = -2; i <= 2; i++) ctx.fillRect(x + i * r * 0.15 - 0.5, y + r * 0.42, Math.max(1, r * 0.05), r * 0.22);
    ctx.fillStyle = p.accent;
    ctx.beginPath(); ctx.arc(x - r * 0.36, y - r * 0.08, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.36, y - r * 0.08, r * 0.07, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, r * 0.38, 0, Math.PI * 2); ctx.fill();
    drawSpin(x, y, r, roll, rate, true);
  }
}

/* ---------------- Effet de rotation ----------------
   La balle roule vers l'avant : vue de derrière, sa surface défile vers le
   haut. Méridiens (arcs) et points fixés sur la sphère, avec un flou de
   mouvement dont la longueur suit la vitesse de rotation. */
const SPIN_DOTS = (function () {
  const rnd = prng(4242), out = [];
  for (let i = 0; i < 18; i++) out.push({ u: (rnd() * 2 - 1) * 0.85, th: rnd() * Math.PI * 2 });
  return out;
})();
function drawSpin(x, y, r, roll, rate, dark) {
  const col = dark ? '14,8,30' : '255,255,255';
  const blur = clamp(rate / 0.65, 0, 1);
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r * 0.98, 0, Math.PI * 2); ctx.clip();
  ctx.lineCap = 'round';
  // méridiens autour de l'axe de rotation, avec copies de flou
  ctx.lineWidth = Math.max(0.7, r * 0.045);
  for (let i = 0; i < 4; i++) {
    for (let k = 0; k < 3; k++) {
      const th = i * Math.PI / 2 - roll + k * rate * 0.45;
      const z = Math.sin(th);
      if (z <= 0.05) continue;
      const c = Math.cos(th);
      ctx.strokeStyle = 'rgba(' + col + ',' + ((0.2 - 0.07 * blur) * z * (1 - k * 0.38)) + ')';
      ctx.beginPath();
      if (c >= 0) ctx.ellipse(x, y, r, Math.max(0.01, r * c), 0, Math.PI, Math.PI * 2);
      else ctx.ellipse(x, y, r, Math.max(0.01, -r * c), 0, 0, Math.PI);
      ctx.stroke();
    }
  }
  // points qui s'étirent en traits quand ça va vite
  for (let i = 0; i < SPIN_DOTS.length; i++) {
    const d = SPIN_DOTS[i], rho = Math.sqrt(1 - d.u * d.u);
    const th = d.th - roll, z = rho * Math.sin(th);
    if (z < 0.08) continue;
    const sx = x + d.u * r, sy = y - rho * Math.cos(th) * r;
    const ty = y - rho * Math.cos(th + rate * (0.6 + 1.8 * blur)) * r;
    ctx.strokeStyle = 'rgba(' + col + ',' + (0.34 * z) + ')';
    ctx.lineWidth = Math.max(0.8, r * 0.075 * (0.6 + 0.4 * z));
    ctx.beginPath(); ctx.moveTo(sx, ty); ctx.lineTo(sx, sy + 0.01); ctx.stroke();
  }
  ctx.restore();
}

const LENS = document.createElement('canvas');
const LENS_CTX = LENS.getContext('2d');
function lensWarp(x, y, r) {
  const R = r * 3.2;
  const size = Math.ceil(2 * R * DPR);
  if (size < 8 || size > 2400) return;
  if (LENS.width !== size) { LENS.width = size; LENS.height = size; }
  LENS_CTX.clearRect(0, 0, size, size);
  LENS_CTX.drawImage(canvas, (x - R) * DPR, (y - R) * DPR, size, size, 0, 0, size, size);
  const k = 2.2, N = 16;
  for (let i = 0; i < N; i++) {
    const ro = R - (R - r) * (i / N), ri = R - (R - r) * ((i + 1) / N);
    const rm = (ro + ri) / 2;
    const src = rm + k * r * r * (1 / rm - 1 / R);        // rayon d'origine de la lumière
    const sc = rm / src;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, ro + 0.5, 0, Math.PI * 2);
    ctx.arc(x, y, ri, 0, Math.PI * 2, true);
    ctx.clip();
    ctx.drawImage(LENS, x - R * sc, y - R * sc, 2 * R * sc, 2 * R * sc);
    ctx.restore();
  }
}

/* ---------------- Trou noir ----------------
   Un puits sombre qui avale la lumière autour de lui, des ondes d'espace
   aspirées vers le centre, un disque d'accrétion incliné (moitié arrière
   derrière l'horizon, moitié avant devant), l'arc lumineux de la lentille
   gravitationnelle au-dessus, et de la matière qui spirale en accélérant. */
function drawBlackHole(x, y, r, p, fx) {
  const t = S.time, tilt = 0.2, rot = -0.14;
  const cR = Math.cos(rot), sR = Math.sin(rot);
  const disk = function (a, d) { const ex = Math.cos(a) * d, ey = Math.sin(a) * d * tilt; return [x + ex * cR - ey * sR, y + ex * sR + ey * cR]; };

  // matière en chute : spirale qui accélère près de l'horizon
  if (fx.dlast < 0) fx.dlast = t;
  const steps = Math.min(4, t - fx.dlast); fx.dlast = t;
  for (let k = 0; k < steps; k++) {
    if (fx.dust.length < 70 && Math.random() < 0.7) fx.dust.push({ a: Math.random() * 6.283, d: r * (2.6 + Math.random() * 0.9), life: 0 });
    for (let i = fx.dust.length - 1; i >= 0; i--) {
      const q0 = fx.dust[i], k0 = r / q0.d;
      q0.pa = q0.a; q0.pd = q0.d;
      q0.a += 0.02 + 0.28 * Math.pow(k0, 1.5);
      q0.d -= r * (0.006 + 0.07 * k0 * k0);
      q0.life = Math.min(1, q0.life + 0.06);
      if (q0.d < r * 1.02) fx.dust.splice(i, 1);
    }
  }

  // 0. lentille gravitationnelle : la piste réelle est aspirée et courbée
  //    autour du trou (chaque anneau montre ce qui se trouve plus loin)
  if (ctx.canvas === canvas) lensWarp(x, y, r);

  // 1. puits : la scène s'assombrit vers le centre
  const well = ctx.createRadialGradient(x, y, r * 0.95, x, y, r * 2.8);
  well.addColorStop(0, 'rgba(0,0,0,.97)');
  well.addColorStop(0.35, 'rgba(0,0,0,.6)');
  well.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = well;
  ctx.beginPath(); ctx.arc(x, y, r * 2.8, 0, Math.PI * 2); ctx.fill();

  // 2. ondes d'espace aspirées vers l'intérieur
  for (let i = 0; i < 3; i++) {
    const ph = ((t * 0.012 + i / 3) % 1);
    const rr = r * (3.3 - 2.1 * ph * ph);
    ctx.strokeStyle = hexA(p.accent, 0.22 * ph);
    ctx.lineWidth = Math.max(0.6, r * 0.04 * (1 + ph));
    ctx.beginPath(); ctx.ellipse(x, y, rr, rr * (0.55 + 0.45 * (1 - ph)), rot, 0, Math.PI * 2); ctx.stroke();
  }

  const drawDisk = function (from, to) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.globalCompositeOperation = 'lighter';
    const bands = [[1.95, 'rgba(255,80,30,', 0.3, r * 0.16], [1.65, 'rgba(255,160,70,', 0.5, r * 0.14], [1.38, 'rgba(255,240,200,', 0.9, r * 0.1]];
    for (let b = 0; b < bands.length; b++) {
      const bd = bands[b];
      ctx.strokeStyle = bd[1] + bd[2] + ')';
      ctx.lineWidth = Math.max(1, bd[3]);
      ctx.setLineDash([r * 0.5, r * 0.25]);
      ctx.lineDashOffset = -t * (1.2 + b * 0.9) * r * 0.08;
      ctx.beginPath(); ctx.ellipse(0, 0, r * bd[0], r * bd[0] * tilt, 0, from, to); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = bd[1] + (bd[2] * 0.35) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, r * bd[0], r * bd[0] * tilt, 0, from, to); ctx.stroke();
    }
    ctx.restore();
  };
  const drawDust = function (back) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < fx.dust.length; i++) {
      const q0 = fx.dust[i];
      if ((Math.sin(q0.a) < 0) !== back) continue;
      const hot = clamp(1.6 - q0.d / r * 0.6, 0, 1);
      const a = disk(q0.pa !== undefined ? q0.pa : q0.a, q0.pd || q0.d), b2 = disk(q0.a, q0.d);
      ctx.strokeStyle = 'rgba(255,' + Math.round(150 + 100 * hot) + ',' + Math.round(80 + 170 * hot) + ',' + (0.8 * q0.life) + ')';
      ctx.lineWidth = Math.max(0.8, r * 0.05);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b2[0], b2[1]); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  };

  // 3. moitié arrière du disque (au-dessus de l'horizon à l'écran)
  drawDisk(Math.PI, Math.PI * 2);
  drawDust(true);
  // 4. arc de lentille : la face cachée du disque, courbée au-dessus du trou
  ctx.globalCompositeOperation = 'lighter';
  const lens = ctx.createLinearGradient(x, y - r * 1.5, x, y);
  lens.addColorStop(0, 'rgba(255,220,160,.75)');
  lens.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.strokeStyle = lens;
  ctx.lineWidth = Math.max(1.2, r * 0.2);
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.3, r * 1.25, rot, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
  ctx.lineWidth = Math.max(0.8, r * 0.07);
  ctx.strokeStyle = 'rgba(255,200,140,.35)';
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.22, r * 1.12, rot, Math.PI * 0.05, Math.PI * 0.95); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  // 5. horizon des événements
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  // anneau de photons, fin et vif
  ctx.strokeStyle = 'rgba(255,240,215,' + (0.75 + 0.2 * Math.sin(t * 0.2)) + ')';
  ctx.lineWidth = Math.max(0.8, r * 0.06);
  ctx.beginPath(); ctx.arc(x, y, r * 1.04, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = hexA(p.accent, 0.35);
  ctx.lineWidth = Math.max(1.5, r * 0.16);
  ctx.beginPath(); ctx.arc(x, y, r * 1.12, 0, Math.PI * 2); ctx.stroke();

  // 6. moitié avant du disque (passe devant le trou)
  drawDisk(0, Math.PI);
  drawDust(false);
}

/* ---------------- Noyau Braise ----------------
   Flammes : particules additives (sprites dégradés pré-rendus) qui montent,
   refroidissent (blanc > jaune > orange > rouge > fumée) et traînent derrière
   la balle quand elle bouge. Étincelles : points incandescents projetés en
   arc, qui scintillent, avec un crépitement sonore. */
function flameSprite(r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
  gr.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',.55)');
  gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return c;
}
const FLAME = [flameSprite(255, 248, 210), flameSprite(255, 196, 64), flameSprite(255, 110, 20), flameSprite(200, 30, 8)];
const SMOKE = flameSprite(40, 22, 30);
function makeEmberFx() { return { flames: [], sparks: [], dust: [], last: -1, px: 0, py: 0, heat: 1, lean: 0, roll: 0, rate: 0.26, dlast: -1 }; }
const EMBER_MAIN = makeEmberFx();

function stepEmber(fx, x, y, r, sound) {
  if (fx.last < 0) { fx.last = S.time; fx.px = x; fx.py = y; }
  const steps = Math.min(4, S.time - fx.last);
  fx.last = S.time;
  const vx = (x - fx.px) / Math.max(1, steps), vy = (y - fx.py) / Math.max(1, steps);
  fx.px = x; fx.py = y;
  fx.lean += (clamp(-vx * 1.2, -r * 0.9, r * 0.9) - fx.lean) * 0.2;
  for (let k = 0; k < steps; k++) {
    // respiration irrégulière du foyer
    fx.heat = 0.82 + 0.18 * Math.sin(S.time * 0.21 + k) * Math.sin(S.time * 0.057) + Math.random() * 0.08;
    const n = 4;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
      const d = r * (0.55 + Math.random() * 0.4);
      fx.flames.push({
        x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * 0.85,
        vx: (Math.random() - 0.5) * r * 0.02 - vx * 0.08,
        vy: -r * (0.045 + Math.random() * 0.05),
        s: r * (0.26 + Math.random() * 0.26),
        life: 1, decay: 0.028 + Math.random() * 0.028,
        wob: Math.random() * 6.28,
      });
    }
    if (Math.random() < 0.22) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
      fx.sparks.push({
        x: x + Math.cos(a) * r * 0.7, y: y + Math.sin(a) * r * 0.7,
        vx: Math.cos(a) * r * (0.03 + Math.random() * 0.06),
        vy: -r * (0.06 + Math.random() * 0.09),
        life: 1, decay: 0.018 + Math.random() * 0.025,
      });
      if (sound && Math.random() < 0.6) Sound.crackle();
    }
  }
  for (let k = 0; k < steps; k++) {
    for (let i = fx.flames.length - 1; i >= 0; i--) {
      const f = fx.flames[i];
      f.wob += 0.25;
      f.x += f.vx + Math.sin(f.wob) * r * 0.012;
      f.y += f.vy;
      f.vy *= 0.985;
      f.life -= f.decay;
      if (f.life <= 0) fx.flames.splice(i, 1);
    }
    for (let i = fx.sparks.length - 1; i >= 0; i--) {
      const sp = fx.sparks[i];
      sp.ox = sp.x; sp.oy = sp.y;
      sp.x += sp.vx; sp.y += sp.vy;
      sp.vy += r * 0.004;
      sp.vx *= 0.99;
      sp.life -= sp.decay;
      if (sp.life <= 0) fx.sparks.splice(i, 1);
    }
  }
  if (fx.flames.length > 120) fx.flames.splice(0, fx.flames.length - 120);
}

// Veines de lave : tracés irréguliers fixes (angle, rayon relatif)
const VEINS = (function () {
  const rnd = prng(7331), out = [];
  for (let v = 0; v < 7; v++) {
    let a = rnd() * Math.PI * 2, d = 0.1 + rnd() * 0.3;
    const pts = [[a, d]];
    const segs = 3 + ((rnd() * 3) | 0);
    for (let k = 0; k < segs; k++) {
      a += (rnd() - 0.5) * 0.9;
      d = Math.min(1.08, d + 0.12 + rnd() * 0.22);
      pts.push([a, d]);
      if (rnd() < 0.3 && k > 0) out.push([[a, d], [a + (rnd() - 0.5) * 1.2, Math.min(1.08, d + 0.2)]]);
    }
    out.push(pts);
  }
  return out;
})();
/* Langues de flamme procédurales : forme en goutte étirée, hauteur et
   balancement animés, penchées dans le sens opposé au déplacement. */
function drawTongues(x, y, r, fx, n, scale, rgb, alpha) {
  const t = S.time;
  for (let i = 0; i < n; i++) {
    const u = n === 1 ? 0 : i / (n - 1) - 0.5;          // -0.5 .. 0.5
    const a = -Math.PI / 2 + u * 2.1 * scale;
    const bx = x + Math.cos(a) * r * 0.78, by = y + Math.sin(a) * r * 0.78;
    const flick = 0.75 + 0.25 * Math.sin(t * 0.23 + i * 2.1) + 0.15 * Math.sin(t * 0.61 + i * 5.3);
    const h = r * (1.1 - Math.abs(u) * 0.9) * 1.6 * scale * flick * fx.heat;
    const w = r * 0.34 * (0.6 + scale * 0.5);
    const sway = Math.sin(t * 0.17 + i * 1.7) * r * 0.22 * scale + fx.lean;
    const tx = bx + Math.cos(a) * h * 0.25 + sway, ty = by - h;
    const nx = -Math.sin(a), ny = Math.cos(a);             // perpendiculaire à la surface
    const lx = bx - nx * w, ly = by - ny * w, rx = bx + nx * w, ry = by + ny * w;
    const g = ctx.createLinearGradient(bx, by, tx, ty);
    g.addColorStop(0, rgb + alpha + ')');
    g.addColorStop(0.55, rgb + (alpha * 0.55) + ')');
    g.addColorStop(1, rgb + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.bezierCurveTo(lx - nx * w * 0.2, ly - h * 0.35, tx - w * 0.35 + sway * 0.2, ty + h * 0.35, tx, ty);
    ctx.bezierCurveTo(tx + w * 0.35 + sway * 0.2, ty + h * 0.35, rx + nx * w * 0.2, ry - h * 0.35, rx, ry);
    ctx.closePath();
    ctx.fill();
  }
}

function drawEmber(x, y, r, fx) {
  stepEmber(fx, x, y, r, fx === EMBER_MAIN && S.mode === 'playing');
  const heat = fx.heat;

  // lueur ambiante chaude, vacillante
  const halo = ctx.createRadialGradient(x, y - r * 0.3, r * 0.4, x, y - r * 0.3, r * 3.2);
  halo.addColorStop(0, 'rgba(255,120,20,' + (0.42 * heat) + ')');
  halo.addColorStop(0.5, 'rgba(255,60,10,' + (0.14 * heat) + ')');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x, y - r * 0.3, r * 3.2, 0, Math.PI * 2); ctx.fill();

  // fumée derrière les flammes
  for (let i = 0; i < fx.flames.length; i++) {
    const f = fx.flames[i];
    if (f.life > 0.35) continue;
    const s = f.s * (1.6 - f.life);
    ctx.globalAlpha = f.life * 0.5;
    ctx.drawImage(SMOKE, f.x - s, f.y - s - r * 0.3, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;

  // langues de feu arrière (derrière la sphère)
  ctx.globalCompositeOperation = 'lighter';
  drawTongues(x, y, r, fx, 7, 1.0, 'rgba(255,90,10,', 0.55);
  ctx.globalCompositeOperation = 'source-over';

  // sphère de lave : croûte sombre et veines incandescentes
  const body = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  body.addColorStop(0, '#ff9a3a');
  body.addColorStop(0.45, '#c2320a');
  body.addColorStop(1, '#3a0600');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r * 0.97, 0, Math.PI * 2); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  const rot = S.time * 0.008;
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass === 0 ? 'rgba(255,110,20,' + (0.4 * heat) + ')' : 'rgba(255,225,130,' + (0.75 * heat) + ')';
    ctx.lineWidth = Math.max(pass ? 0.7 : 1.6, r * (pass ? 0.035 : 0.12));
    ctx.lineJoin = 'round';
    for (let v = 0; v < VEINS.length; v++) {
      const pts = VEINS[v];
      ctx.beginPath();
      for (let k = 0; k < pts.length; k++) {
        const a = pts[k][0] + rot, d = pts[k][1] * r;
        if (k === 0) ctx.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.95);
        else ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.95);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
  // liseré incandescent sur le haut de la sphère
  const rim = ctx.createRadialGradient(x, y + r * 0.2, r * 0.7, x, y, r * 1.08);
  rim.addColorStop(0, 'rgba(255,160,40,0)');
  rim.addColorStop(1, 'rgba(255,190,80,' + (0.55 * heat) + ')');
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.arc(x, y, r * 1.08, 0, Math.PI * 2); ctx.fill();

  // langues de feu avant, plus chaudes
  ctx.globalCompositeOperation = 'lighter';
  drawTongues(x, y, r, fx, 5, 0.7, 'rgba(255,200,70,', 0.7);
  drawTongues(x, y, r, fx, 3, 0.42, 'rgba(255,250,210,', 0.8);
  ctx.globalCompositeOperation = 'source-over';

  // flammes (additif) : du rouge vers le blanc selon la chaleur restante
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < fx.flames.length; i++) {
    const f = fx.flames[i];
    const L = f.life;
    const spr = L > 0.9 ? FLAME[0] : L > 0.62 ? FLAME[1] : L > 0.32 ? FLAME[2] : FLAME[3];
    const s = f.s * (0.45 + 0.7 * L);
    ctx.globalAlpha = Math.min(1, L * 1.5) * 0.32 * heat;
    ctx.drawImage(spr, f.x - s, f.y - s * 1.8, s * 2, s * 3.2);
  }
  // étincelles : traits brillants qui scintillent
  for (let i = 0; i < fx.sparks.length; i++) {
    const sp = fx.sparks[i];
    const tw = Math.random() < 0.25 ? 0.25 : 1;
    ctx.globalAlpha = sp.life * tw;
    ctx.strokeStyle = sp.life > 0.5 ? '#fff4c2' : '#ffae3a';
    ctx.lineWidth = Math.max(1, r * 0.06);
    ctx.beginPath();
    ctx.moveTo(sp.ox !== undefined ? sp.ox : sp.x, sp.oy !== undefined ? sp.oy : sp.y);
    ctx.lineTo(sp.x, sp.y);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sp.x - 0.75, sp.y - 0.75, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles() {
  const p = pal();
  ctx.fillStyle = p.accent;
  for (let i = 0; i < S.particles.length; i++) {
    const q0 = S.particles[i];
    if (!project(q0.x, q0.y, q0.z)) continue;
    const s = Math.max(0.8, 0.0175 * P[2] * q0.life);
    ctx.globalAlpha = q0.life;
    ctx.fillRect(P[0] - s / 2, P[1] - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- HUD ---------------- */
const DISPLAY_FONT = '"Big Shoulders Display", Impact, "Arial Narrow", sans-serif';
function drawHUD() {
  const p = pal();
  const safeL = 14, top = 12;
  const big = Math.round(clamp(Math.min(W, H) * 0.1, 34, 58));
  const dist = Math.floor(S.pz);

  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = '900 ' + big + 'px ' + DISPLAY_FONT;
  ctx.fillStyle = p.accent;
  ctx.fillText(fmt(dist), safeL + 2, top);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(fmt(dist), safeL, top);
  const w = ctx.measureText(fmt(dist)).width;
  ctx.font = '700 ' + Math.round(big * 0.42) + 'px ' + DISPLAY_FONT;
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText(UNIT, safeL + w + 5, top + big * 0.46);

  let y = top + big + 2;
  ctx.font = '700 ' + Math.round(big * 0.36) + 'px ' + DISPLAY_FONT;
  ctx.fillStyle = p.accent;
  ctx.fillText((S.speed * 60).toFixed(1) + ' ' + UNIT_SPEED + (S.boost > 0 || S.hover > 0 ? '  BOOST' : ''), safeL, y);
  y += Math.round(big * 0.36) + 6;
  ctx.font = '600 13px system-ui, sans-serif';
  const beaten = S.best > 0 && dist > S.best;
  ctx.fillStyle = beaten ? '#d7ff1f' : 'rgba(236,232,255,.7)';
  ctx.fillText(beaten ? 'New record' : 'Best ' + fmt(S.best) + ' ' + UNIT, safeL, y);
  y += 19;

  if (S.challenge && !S.isWeekly) {
    const target = S.challenge.score;
    const done = dist > target;
    ctx.fillStyle = done ? '#d7ff1f' : '#ff2ea6';
    ctx.fillText(done ? 'Challenge beaten' : 'Challenge: ' + fmt(target) + ' ' + UNIT, safeL, y);
    const bw = Math.min(150, W * 0.35);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(safeL, y + 17, bw, 3);
    ctx.fillStyle = done ? '#d7ff1f' : '#ff2ea6'; ctx.fillRect(safeL, y + 17, bw * clamp(dist / target, 0, 1), 3);
    y += 26;
  }
  if (S.isWeekly && MOD_BY_ID[S.modifier]) {
    ctx.fillStyle = '#ff2ea6';
    ctx.fillText('Weekly: ' + MOD_BY_ID[S.modifier].name, safeL, y);
    y += 19;
  }
  const d = S.daily;
  if (d.obj && d.done !== d.date) {
    const def = dailyDef(d.obj.id);
    const v = Math.min(Math.floor(def.val(S)), d.obj.target);
    ctx.fillStyle = 'rgba(236,232,255,.55)';
    ctx.fillText('Daily ' + v + ' / ' + d.obj.target + ' ' + def.unit, safeL, y);
  }
}

function drawReplayTag() {
  const pulse = 0.5 + 0.5 * Math.sin(S.time * 0.2);
  const label = 'REPLAY';
  ctx.font = '900 18px ' + DISPLAY_FONT;
  const tw = ctx.measureText(label).width;
  const x = W / 2 - (tw + 26) / 2, y = 16;
  ctx.fillStyle = 'rgba(255,43,74,.9)';
  ctx.fillRect(x, y, tw + 26, 26);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + pulse * 0.6) + ')';
  ctx.beginPath(); ctx.arc(x + 11, y + 13, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 20, y + 14);
}

function render() {
  ctx.save();
  if (S.shake > 0.1 && !reducedMotion) {
    ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
  }
  drawBackground();
  drawStreaks();
  drawTrack();
  const showPlayer = S.mode === 'playing' || S.mode === 'paused' || S.mode === 'photo' || S.mode === 'continue' || S.replayOn;
  if (showPlayer) drawPlayer();
  drawParticles();
  drawCrystals(false);
  ctx.restore();


  if (S.boostE > 0.02) {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, hexA(pal().accent, 0.32 * S.boostE));
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  if (S.flash > 0) {
    ctx.fillStyle = 'rgba(255,43,74,' + (S.flash * 0.45) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (S.replayOn) {
    if (S.py < groundAt(S.pz) - 0.3) {
      const k = clamp((groundAt(S.pz) - S.py) / FALL_LIMIT, 0, 1);
      const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.85);
      v.addColorStop(0, 'rgba(255,43,74,0)');
      v.addColorStop(1, 'rgba(255,43,74,' + (0.5 * k) + ')');
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    }
    drawReplayTag();
  }
  if (S.mode === 'playing' || S.mode === 'paused' || S.mode === 'continue') drawHUD();
}

/* =========================================================================
   SON : effets + boucle musicale synthétisée
   ========================================================================= */
const Sound = {
  ac: null, master: null, musicGain: null, noise: null,
  musicOn: false, nextTime: 0, step: 0, timer: null,
  init: function () {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = S.muted ? 0 : 0.7;
      this.master.connect(this.ac.destination);
      this.musicGain = this.ac.createGain();
      this.musicGain.gain.value = 0;
      this.musicGain.connect(this.master);
      const len = this.ac.sampleRate * 0.5;
      this.noise = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  setMuted: function (m) {
    S.muted = m; save('muted', m);
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.7, this.ac.currentTime, 0.05);
    updateMuteIcon();
  },
  tone: function (o, dest) {
    if (!this.ac) return;
    const t = (o.at || this.ac.currentTime);
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + o.d);
    g.gain.setValueAtTime(o.v || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
    osc.connect(g); g.connect(dest || this.master);
    osc.start(t); osc.stop(t + o.d + 0.02);
  },
  hit: function (o, dest) {
    if (!this.ac) return;
    const t = (o.at || this.ac.currentTime);
    const src = this.ac.createBufferSource(); src.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = o.filter || 'highpass'; f.frequency.value = o.freq || 6000;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(o.v || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
    src.connect(f); f.connect(g); g.connect(dest || this.master);
    src.start(t); src.stop(t + o.d + 0.02);
  },
  jump:   function () { this.tone({ f: 320, f2: 760, d: 0.1, type: 'square', v: 0.05 }); },
  land:   function (k) { this.tone({ f: 140, f2: 60, d: 0.08, type: 'sine', v: 0.08 + k * 0.1 }); },
  death:  function () { this.tone({ f: 420, f2: 40, d: 0.7, type: 'sawtooth', v: 0.12 }); this.hit({ d: 0.5, v: 0.12, filter: 'lowpass', freq: 900 }); },
  record: function () { const self = this; [523, 659, 784, 1046].forEach(function (f, i) { self.tone({ f: f, d: 0.14, v: 0.06, type: 'square', at: self.ac ? self.ac.currentTime + i * 0.07 : 0 }); }); },
  unlock: function () { const self = this; [880, 1320].forEach(function (f, i) { self.tone({ f: f, d: 0.12, v: 0.05, type: 'triangle', at: self.ac ? self.ac.currentTime + i * 0.09 : 0 }); }); },
  crackle: function () {
    if (!this.ac) return;
    const now = this.ac.currentTime;
    if (now - (this.lastCrackle || 0) < 0.035) return;
    this.lastCrackle = now;
    const pops = 1 + (Math.random() < 0.35 ? 1 : 0) + (Math.random() < 0.15 ? 1 : 0);
    for (let i = 0; i < pops; i++) {
      this.hit({ d: 0.006 + Math.random() * 0.018, v: 0.03 + Math.random() * 0.05, filter: 'bandpass', freq: 1800 + Math.random() * 4200, at: now + i * (0.012 + Math.random() * 0.03) });
    }
  },
  boost: function () {
    this.tone({ f: 180, f2: 900, d: 0.35, type: 'sawtooth', v: 0.07 });
    this.hit({ d: 0.35, v: 0.08, filter: 'bandpass', freq: 2500 });
  },
  smash: function () {
    this.hit({ d: 0.25, v: 0.16, filter: 'lowpass', freq: 1400 });
    this.tone({ f: 220, f2: 60, d: 0.2, type: 'square', v: 0.06 });
  },
  click:  function () { this.tone({ f: 600, d: 0.04, v: 0.04, type: 'square' }); },

  // Boucle 128 BPM : kick, basse en la mineur, charleston, claquement
  music: function (on) {
    if (!this.ac) return;
    const now = this.ac.currentTime;
    this.musicGain.gain.cancelScheduledValues(now);
    this.musicGain.gain.setTargetAtTime(on ? 0.5 : 0, now, on ? 0.2 : 0.15);
    if (on && !this.timer) {
      this.nextTime = now + 0.05; this.step = 0;
      const self = this;
      this.timer = setInterval(function () { self.schedule(); }, 25);
    }
    this.musicOn = on;
  },
  schedule: function () {
    const spb = 60 / 128 / 4;
    const bassRoots = [55, 55, 65.41, 49];
    while (this.nextTime < this.ac.currentTime + 0.12) {
      const st = this.step % 16, bar = Math.floor(this.step / 16) % 4, t = this.nextTime;
      const dest = this.musicGain;
      if (st % 4 === 0) this.tone({ f: 150, f2: 45, d: 0.18, type: 'sine', v: 0.5, at: t }, dest);
      if (st % 4 === 2) this.hit({ d: 0.04, v: 0.08, at: t }, dest);
      if (st === 4 || st === 12) this.hit({ d: 0.12, v: 0.14, filter: 'bandpass', freq: 1800, at: t }, dest);
      if (st % 2 === 1 || st === 0) {
        const root = bassRoots[bar] * (st === 14 ? 2 : 1);
        this.tone({ f: root, d: spb * 0.9, type: 'sawtooth', v: 0.09, at: t }, dest);
      }
      if (bar === 3 && st % 3 === 0) this.tone({ f: 440 * (st % 6 === 0 ? 1.5 : 1.2), d: 0.08, type: 'square', v: 0.025, at: t }, dest);
      this.nextTime += spb; this.step++;
    }
    if (!this.musicOn && this.musicGain.gain.value < 0.01) { clearInterval(this.timer); this.timer = null; }
  },
};

/* =========================================================================
   PROGRESSION : succès, série, défis, cosmétiques
   ========================================================================= */
function unlock(id) {
  if (S.ach[id]) return;
  S.ach[id] = Date.now();
  save('ach', S.ach);
  const a = ACH_BY_ID[id];
  if (a) { toast('Achievement unlocked: ' + a.name); Sound.unlock(); }
  refreshAchCount();
}
function isUnlocked(item) {
  if (item.unlock === -1) return !!S.ach.streak_5;
  return S.total >= item.unlock;
}
function checkCosmetics() {
  PALETTES.concat(SKINS).forEach(function (it) {
    const key = '_cos_' + it.id;
    if (isUnlocked(it) && !S.ach[key]) {
      S.ach[key] = 1;
      if (it.unlock !== 0) toast((PAL_BY_ID[it.id] ? 'Theme unlocked: ' : 'Core unlocked: ') + it.name);
    }
  });
  save('ach', S.ach);
  if (PALETTES.every(isUnlocked)) unlock('palette_all');
  if (SKINS.every(isUnlocked)) unlock('skin_all');
}
function updateStreak() {
  const t = today();
  if (S.streak.last === t) return;
  S.streak.count = S.streak.last === today(-1) ? S.streak.count + 1 : 1;
  S.streak.last = t;
  save('streak', S.streak);
  if (S.streak.count >= 3) unlock('streak_3');
  if (S.streak.count >= 5) { unlock('streak_5'); checkCosmetics(); }
}
function refreshDaily() {
  const t = today();
  if (S.daily.date !== t || !S.daily.obj) {
    S.daily = { date: t, obj: makeDaily(t), done: '' };
    save('daily', S.daily);
  }
}
function checkDaily() {
  const d = S.daily;
  if (!d.obj || d.done === d.date) return;
  if (dailyDef(d.obj.id).val(S) >= d.obj.target) {
    d.done = d.date; save('daily', d);
    unlock('daily_done');
    toast('Daily challenge complete');
  }
}
function refreshWeekly() {
  const wk = isoWeek(new Date());
  if (S.weekly.week !== wk) {
    const seed = hash('weekly-' + wk);
    S.weekly = { week: wk, mod: MODIFIERS[seed % MODIFIERS.length].id, seed: seed, best: 0 };
    save('weekly', S.weekly);
  }
}

/* ---------------- Messages de fin ---------------- */
function endMessage(score, isRecord) {
  if (isRecord && score > 0) return pick([
    'New record. The void wants revenge.',
    'Record smashed. Now do it again.',
    'Nobody can stop you. Except the next gap.',
  ]);
  if (S.best > 0 && score >= S.best * 0.85) return fmt(S.best - score) + ' ' + UNIT + ' short of your record. That has to sting.';
  if (score < 30) return pick([
    'The void didn’t even notice you.',
    'Was that a jump or a resignation?',
    'A rock would have gone further.',
    'You lasted less than the loading screen.',
  ]);
  if (score < 100) return pick([
    'You’re improving. Slowly. Very slowly.',
    'Warm-up over? Because that wasn’t it.',
    'The gap was right there. Big. Obvious.',
  ]);
  if (score < 300) return pick([
    'Decent. Forgettable, but decent.',
    'You’re starting to get it. So is the void.',
    'Not bad. Your record is looking down on you.',
  ]);
  if (score < 700) return pick([
    'Now we’re getting serious.',
    'Nice reflexes. Shame about the ending.',
    'Great run. Ridiculous fall.',
  ]);
  if (score < 1500) return pick([
    'Impressive. Almost.',
    'Who even plays at this level?',
    'The void respects you. A little.',
  ]);
  return pick([
    'Indecent score. Take a break, seriously.',
    'You’re not a player anymore, you’re a bug.',
    'Even the void got scared.',
  ]);
}

/* =========================================================================
   DÉROULEMENT D'UNE PARTIE
   ========================================================================= */
function applyModifier(mod) {
  S.modifier = mod || '';
  gravMul = mod === 'gravity_x2' ? 2 : mod === 'low_gravity' ? 0.5 : 1;
  speedMul = mod === 'speed_x2' ? 1.6 : 1;
}

function startGame(kind) {
  Sound.init();
  kind = kind || S.lastKind || 'free';
  if (kind === 'challenge' && !S.challenge) kind = 'free';
  S.lastKind = kind;
  S.watching = false; $('replayBack').classList.add('hidden');
  let seed, mod = '';
  if (kind === 'weekly') {
    refreshWeekly();
    seed = S.weekly.seed; mod = S.weekly.mod;
    if (S.weeklyPlayed.indexOf(S.weekly.week) === -1) {
      S.weeklyPlayed.push(S.weekly.week);
      if (S.weeklyPlayed.length > 60) S.weeklyPlayed.shift();
      save('weeklyPlayed', S.weeklyPlayed);
      if (S.weeklyPlayed.length >= 5) unlock('weekly_5');
    }
  } else if (kind === 'challenge') {
    seed = S.challenge.seed; mod = S.challenge.mod;
  } else {
    seed = (Math.random() * 0x7fffffff) | 0;
  }
  S.isWeekly = kind === 'weekly';
  S.runSeed = seed; S.runMod = mod;
  applyModifier(mod);
  resetTrack(seed, mod);

  Object.assign(S, {
    px: 0, py: 0, pz: 0, vy: 0, grounded: true, coyote: 0, jumpBuf: 0,
    speed: BASE_SPEED, slopeBoost: 0, ramp: 1,
    frames: 0, jumps: 0, airStart: -1, airTotal: 0,
    lastSafeZ: 0, lastSafeCol: 3, continueUsed: false,
    particles: [], trail: [], replay: [], replayOn: false,
    shake: 0, flash: 0, recordFlag: false, jumpHeld: false, keys: {},
    boost: 0, boostE: 0, hover: 0, hoverArmed: false,
  });
  S.steerTarget = isTouch ? 0 : S.steerTarget;
  updateStreak();
  refreshDaily();
  updateCamera(true);
  S.mode = 'playing';
  showScreen(null);
  Sound.music(true);
}

function die() {
  S.shake = 12; S.flash = 1;
  if (isTouch && navigator.vibrate) { try { navigator.vibrate(45); } catch (e) {} }
  burst(S.px, S.py, S.pz, 26, 0.12);
  Sound.death();
  const now = Date.now();
  S.deathTimes = S.deathTimes.filter(function (t) { return now - t < 60000; });
  S.deathTimes.push(now);
  if (S.deathTimes.length >= 10) unlock('death_10_30');

  S.lastScore = Math.floor(S.pz);
  if (!S.continueUsed && S.pz > 15) {
    S.mode = 'continue';
    Sound.music(false);
    showScreen('continue');
  } else {
    finishRun();
  }
}

function continueRun() {
  requestRewardedAd(function () {
    // On repart sur une zone de départ neuve à la distance atteinte :
    // le score continue, le parcours qui suit est régénéré.
    const z0 = Math.floor(S.pz);
    const base = Math.max(0, z0 - 3);
    S.tiles.length = base;
    S.H.length = base + 1;
    rng = prng((Math.random() * 0x7fffffff) | 0);
    Object.assign(S.gen, { gap: 0, sx: 2, sw: 3, slope: 0, target: 0, seg: 0, safe: base + START_ROWS, sec: null, secCool: 60, full: 0, next: null });
    for (const k in S.obst) if (+k >= base) delete S.obst[k];
    S.boost = 0; S.hover = 0; S.hoverArmed = false;
    buildRows(base + VIEW_ROWS + 6);
    S.pz = z0 + 0.2; S.px = 0;
    S.py = groundAt(S.pz); S.vy = 0; S.grounded = true;
    S.ramp = 0; S.trail = []; S.jumpBuf = 0; S.jumpHeld = false; S.keys = {};
    S.steerTarget = isTouch ? S.px : null;
    S.continueUsed = true;
    updateCamera(true);
    S.mode = 'playing';
    showScreen(null);
    Sound.music(true);
    unlock('continue_used');
    toast('Back in. No second time.');
  });
}

function finishRun() {
  S.mode = 'gameover';
  Sound.music(false);
  const score = Math.floor(S.pz);
  S.lastScore = score;
  S.isRecord = score > S.best;
  if (S.isRecord) { S.best = score; save('best', score); }
  S.total += score; save('total', S.total);

  if (score >= 100) unlock('score_100');
  if (score >= 500) unlock('score_500');
  if (score >= 1000) unlock('score_1000');
  if (score >= 2500) unlock('score_2500');
  if (S.isWeekly) {
    unlock('weekly_done');
    if (score > S.weekly.best) { S.weekly.best = score; save('weekly', S.weekly); }
  }
  S.challengeResult = null;
  if (S.challenge && S.lastKind === 'challenge') {
    S.challengeResult = score > S.challenge.score ? 'won' : 'lost';
    if (S.challengeResult === 'won') unlock('challenge_won');
  }
  checkCosmetics();
  if (S.isRecord && score > 0) setTimeout(function () { Sound.record(); }, 300);

  S.endMsg = endMessage(score, S.isRecord);
  S.watching = false;
  S.replayOn = S.replay.length > 20;
  S.replayIdx = 0; S.replayAcc = 0; S.replayHold = 0;
  showScreen('gameover');
}

function stepReplay() {
  const fr = S.replay;
  if (!fr.length) return;
  if (S.replayHold > 0) {
    if (--S.replayHold === 0) { S.replayIdx = 0; S.replayAcc = 0; S.trail = []; }
  } else {
    S.replayAcc += 0.5;
    while (S.replayAcc >= 1) {
      S.replayAcc--;
      if (++S.replayIdx >= fr.length - 1) { S.replayIdx = fr.length - 1; S.replayHold = 50; break; }
    }
  }
  const f = fr[S.replayIdx];
  S.px = f[0]; S.py = f[1]; S.pz = f[2];
  S.trail.push({ x: S.px, y: S.py, z: S.pz });
  if (S.trail.length > 8) S.trail.shift();
}

function pauseGame() {
  if (S.mode !== 'playing') return;
  S.mode = 'paused';
  S.jumpHeld = false; S.keys = {};
  Sound.music(false);
  showScreen('pause');
}
function resumeGame() {
  if (S.mode !== 'paused') return;
  S.mode = 'playing';
  showScreen(null);
  Sound.music(true);
}
function toMenu() {
  S.watching = false; $('replayBack').classList.add('hidden');
  S.mode = 'title';
  S.replayOn = false;
  S.px = 0;
  applyModifier('');
  Sound.music(false);
  showScreen('title');
}

/* ---------------- Pub récompensée ----------------
   Simulation fidèle d'un rewarded ad. Pour la vraie monétisation,
   remplacer le corps de requestRewardedAd par l'appel du SDK
   (ex. adBreak({ type: 'reward', ... }) d'AdSense H5 Games Ads)
   et n'appeler onReward() que si la vidéo a été vue en entier.
--------------------------------------------------- */
let adTimers = [];
function requestRewardedAd(onReward) {
  const ad = pick(AD_CATALOG);
  $('adLogo').textContent = ad.logo;
  $('adLogo').style.background = ad.color;
  $('adTitle').textContent = ad.title;
  $('adSub').textContent = ad.sub;
  $('adCta').textContent = ad.cta;
  const root = $('adOverlay');
  root.classList.remove('visible'); void root.offsetWidth; root.classList.add('visible');
  const wasMuted = S.muted;
  if (Sound.master) Sound.master.gain.value = 0;
  adTimers.forEach(clearTimeout); adTimers = [];
  let left = AD_DURATION / 1000;
  $('adTimer').textContent = left + 's';
  for (let i = 1; i <= left; i++) {
    adTimers.push(setTimeout(function () { $('adTimer').textContent = Math.max(0, left - i) + 's'; }, i * 1000));
  }
  adTimers.push(setTimeout(function () {
    root.classList.remove('visible');
    if (Sound.master && !wasMuted) Sound.master.gain.value = 0.7;
    onReward();
  }, AD_DURATION));
}
$('adCta').addEventListener('click', function () { toast('Simulated ad: no link.'); });

/* ---------------- Défi entre amis ---------------- */
function readChallenge() {
  let qs = location.search;
  try { if (!/[?&]seed=/.test(qs) && window.top !== window) qs = window.top.location.search; } catch (e) {}
  const p = new URLSearchParams(qs);
  const seed = parseInt(p.get('seed'), 10), score = parseInt(p.get('score'), 10);
  const mod = p.get('mod') || '';
  if (Number.isFinite(seed) && Number.isFinite(score) && score > 0) {
    S.challenge = { seed: seed >>> 0, score: score, mod: MOD_BY_ID[mod] ? mod : '' };
  }
}
function challengeUrl() {
  let href = location.href;
  try { if (window.top !== window) href = window.top.location.href; } catch (e) {}
  const u = new URL(href);
  ['seed', 'score', 'mod'].forEach(function (k) { u.searchParams.delete(k); });
  u.searchParams.set('seed', String(S.runSeed >>> 0));
  u.searchParams.set('score', String(S.lastScore));
  if (S.runMod) u.searchParams.set('mod', S.runMod);
  return u.toString();
}
function shareChallenge() {
  const url = challengeUrl();
  const text = 'I made it ' + fmt(S.lastScore) + ' ' + UNIT + ' on ' + GAME_NAME + '. Same track for you. Beat that.';
  if (navigator.share) {
    navigator.share({ title: GAME_NAME, text: text, url: url })
      .then(function () { unlock('challenge_sent'); })
      .catch(function (e) { if (!e || e.name !== 'AbortError') copyLink(text + ' ' + url, url); });
    return;
  }
  copyLink(text + ' ' + url, url);
}
function copyLink(full, url) {
  const done = function () { toast('Challenge link copied. Send it.'); unlock('challenge_sent'); };
  const fallback = function () {
    const ta = document.createElement('textarea');
    ta.value = full; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (ok) done();
    else {
      $('linkBox').classList.remove('hidden');
      $('linkInput').value = url;
      $('linkInput').focus(); $('linkInput').select();
      toast('Copy blocked: copy the link manually.');
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(done, fallback);
  else fallback();
}

function btn(label, cls, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener('click', function (e) { e.stopPropagation(); Sound.init(); Sound.click(); b.blur(); fn(); });

function setActions(list) {
  ui.actions.innerHTML = '';

function hideAll() {

function showScreen(kind) {

  }
