<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOIDFALL</title>
<meta name="description" content="VOIDFALL: race a neon track through deep space. Jump the gaps, survive the plunges, beat your record.">
<meta name="theme-color" content="#06030d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #06030d;
    --deep: #140a26;
    --cyan: #1ef2ff;
    --magenta: #ff2ea6;
    --acid: #d7ff1f;
    --blood: #ff2b4a;
    --ink: #ece8ff;
    --muted: #9d94c4;
    --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cut: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--void);
    font-family: var(--body); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }
  #customizeOverlay, #achOverlay { background: rgba(6, 3, 13, 0.94); z-index: 12; }

  /* ---------- Boutons HUD (pause / son) ---------- */
  #hudBtns {
    position: fixed; z-index: 5;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    display: flex; gap: 8px;
  }
  #hudBtns button {
    width: 42px; height: 42px; padding: 0;
    background: rgba(6, 3, 13, 0.55);
    border: 1px solid rgba(30, 242, 255, 0.45);
    color: var(--cyan); cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    display: grid; place-items: center;
  }
  #hudBtns button svg { width: 18px; height: 18px; fill: currentColor; }
  #hudBtns button:active { background: rgba(30,242,255,.25); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 40%, rgba(20, 10, 38, 0.35), rgba(6, 3, 13, 0.88));
  }
  .overlay.bottom {
    align-items: center;
    background: radial-gradient(ellipse at 50% 50%, rgba(6,3,13,0.55), rgba(6,3,13,0.2));
  }
  .panel {
    position: relative;
    width: min(94vw, 440px);
    max-height: calc(100vh - 28px);
    max-height: calc(100dvh - 28px);
    overflow-y: auto;
    padding: 24px 24px 20px;
    background: linear-gradient(160deg, rgba(20, 10, 38, 0.92), rgba(6, 3, 13, 0.94));
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    text-align: center;
    scrollbar-width: thin; scrollbar-color: rgba(30,242,255,.3) transparent;
  }
  /* bordures posées sur la boîte elle-même : elles ne défilent pas avec le contenu */
  .panel { border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--magenta); }

  /* panneau à liste : en-tête et bouton fixes, seule la liste défile */
  .panel.scroller { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 16px; }
  .panel.scroller > .ach-list { flex: 1 1 auto; overflow-y: auto; min-height: 0; margin-right: -6px; padding-right: 6px; }
  .panel.scroller > h2.section, .panel.scroller > .tagline, .panel.scroller > .actions { flex: none; }

  /* Titre principal : décalage RVB */
  .title {
    margin: 0; line-height: .86;
    font-family: var(--display); font-weight: 900;
    font-size: clamp(46px, 14vw, 76px);
    letter-spacing: .01em;
    color: var(--ink);
    text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan);
  }
  .title.death { color: var(--blood); text-shadow: -3px 0 #7a0020, 3px 0 var(--ink); animation: jolt .35s steps(3) 1; }
  .title.record { color: var(--acid); text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan); }
  @keyframes jolt {
    0% { transform: translate(-6px, 2px); } 33% { transform: translate(5px, -3px); }
    66% { transform: translate(-3px, 1px); } 100% { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title.death { animation: none; } }
  .tagline { margin: 8px 0 18px; font-size: 14px; color: var(--muted); }

  .banner {
    display: block; margin: 0 0 10px; padding: 10px 14px;
    font-size: 13px; line-height: 1.45; text-align: left;
    background: rgba(255, 255, 255, 0.035);
    border-left: 3px solid var(--cyan);
  }
  .banner b { color: var(--ink); }
  .banner.streak { border-color: var(--acid); }
  .banner.challenge { border-color: var(--magenta); background: rgba(255, 46, 166, 0.08); }
  .banner.weekly { border-color: var(--magenta); cursor: pointer; }
  .banner.weekly:hover, .banner.weekly:focus-visible { background: rgba(255, 46, 166, 0.1); outline: none; }
  .banner .kicker { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--magenta); letter-spacing: .03em; }
  .banner .go { display: block; margin-top: 4px; color: var(--cyan); font-weight: 700; }
  .banner.done { border-color: var(--acid); }
  .msg { margin: 0 0 14px; font-size: 15px; font-weight: 600; line-height: 1.45; color: var(--ink); }

  .stats { display: flex; justify-content: center; gap: 28px; margin: 10px 0 12px; }
  .stat .v { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: .5em; color: var(--muted); margin-left: 2px; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat.best .v { color: var(--acid); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .actions button, .panel > button {
    font: 700 15px var(--body);
    padding: 12px 18px; border: 0; cursor: pointer;
    color: var(--void); background: var(--cyan);
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    transition: transform .12s, background .12s;
    white-space: nowrap;
  }
  .actions button:hover { transform: translateY(-1px); }
  .actions button:active { transform: translateY(1px); }
  .actions button:focus-visible, .panel > button:focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }
  .actions button.primary { font-size: 18px; padding: 14px 44px; flex-basis: 100%; max-width: 280px; }
  .actions button.ad { background: var(--acid); }
  .actions button.share { background: var(--magenta); color: #fff; }
  .actions button.ghost { background: transparent; color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(30,242,255,.5); clip-path: none; }
  .row-break { flex-basis: 100%; height: 0; }

  .controls { margin-top: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .controls b { color: var(--ink); font-weight: 600; }

  h2.section { font-family: var(--display); font-weight: 900; font-size: 38px; margin: 0 0 12px; line-height: 1; }

  /* ---------- Personnaliser ---------- */
  .cos-block { text-align: left; margin: 12px 0; }
  .cos-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .cos-head strong { color: var(--ink); font-size: 15px; }
  .cos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .cos-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 6px 9px; cursor: pointer;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08);
    font: 600 12.5px var(--body); color: var(--ink);
  }
  .cos-item:focus-visible { outline: 2px solid var(--acid); outline-offset: 2px; }
  .cos-item.sel { border-color: var(--cyan); background: rgba(30,242,255,.1); box-shadow: inset 0 0 0 1px var(--cyan); }
  .cos-item.locked { cursor: not-allowed; }
  .cos-item.locked canvas { opacity: .35; filter: grayscale(.7); }
  .cos-item.locked .nm { opacity: .55; }
  .cos-item canvas { display: block; }
  .cos-item.pal canvas { width: 88px; height: 56px; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  .cos-item.skin canvas { width: 76px; height: 76px; }
  .cos-item .nm { line-height: 1.2; text-align: center; }
  .cos-item .lk { font-weight: 400; font-size: 11px; color: var(--muted); }
  @media (max-width: 420px) {
    .cos-grid { grid-template-columns: repeat(3, 1fr); }
    .cos-item.pal canvas { width: 76px; height: 48px; }
    .cos-item.skin canvas { width: 66px; height: 66px; }
  }
  .panel.wide { width: min(94vw, 560px); }

  /* ---------- Succès ---------- */
  .ach-list { display: flex; flex-direction: column; gap: 6px; text-align: left; margin: 6px 0 16px; }
  .ach { display: flex; gap: 12px; align-items: center; padding: 9px 12px; background: rgba(255,255,255,.03); }
  .ach .dot { width: 10px; height: 10px; flex: none; background: rgba(255,255,255,.18); transform: rotate(45deg); }
  .ach.on .dot { background: var(--acid); box-shadow: 0 0 10px var(--acid); }
  .ach .n { font-weight: 700; font-size: 14px; }
  .ach .d { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .ach:not(.on) { opacity: .55; }

  /* ---------- Pub simulée ---------- */
  #adOverlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(0, 0, 0, 0.9);
  }
  #adOverlay.visible { display: flex; }
  .ad-card {
    position: relative; width: min(92vw, 460px);
    padding: 40px 30px 28px; text-align: center; border-radius: 16px;
    background: linear-gradient(160deg, #1b2c56 0%, #2a1b56 100%);
    border: 2px solid rgba(255, 210, 120, 0.4);
    box-shadow: 0 30px 90px rgba(0,0,0,.85);
    font-family: var(--body);
  }
  .ad-badge { position: absolute; top: 12px; left: 12px; font-size: 10px; font-weight: 800; letter-spacing: .15em; background: rgba(255,210,120,.18); color: #ffd878; padding: 4px 9px; border-radius: 5px; }
  .ad-timer { position: absolute; top: 12px; right: 14px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
  .ad-logo { width: 84px; height: 84px; margin: 4px auto 14px; border-radius: 20px; display: grid; place-items: center; font: 900 30px var(--body); color: #fff; }
  .ad-title { font-size: 25px; font-weight: 900; margin: 0 0 8px; color: #ffd878; }
  .ad-sub { font-size: 14px; opacity: .82; margin: 0 0 20px; line-height: 1.5; }
  .ad-cta { font: 800 16px var(--body); padding: 12px 32px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #ffd878, #ffb84a); color: #2a1304; cursor: pointer; }
  .ad-progress { height: 4px; background: rgba(255,255,255,.12); border-radius: 99px; margin-top: 22px; overflow: hidden; }
  .ad-progress > div { height: 100%; width: 0; background: linear-gradient(90deg, #ffd878, #ff9b6c); }
  #adOverlay.visible .ad-progress > div { animation: adProg 5s linear forwards; }
  @keyframes adProg { to { width: 100%; } }
  .ad-hint { font-size: 11px; opacity: .5; margin-top: 10px; }

  /* ---------- Mode photo ---------- */
  #photoBar {
    position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    display: none; gap: 8px; padding: 8px;
    background: rgba(6,3,13,.85); border-top: 2px solid var(--cyan);
  }
  #photoBar.visible { display: flex; }
  #photoBar button { font: 700 13px var(--body); padding: 9px 14px; border: 0; cursor: pointer; background: var(--cyan); color: var(--void); }
  #photoBar button.alt { background: transparent; color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(30,242,255,.5); }

  /* ---------- Retour depuis le replay ---------- */
  #replayBack {
    position: fixed; z-index: 15;
    top: 52px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    padding: 11px 18px 11px 14px; border: 0; cursor: pointer;
    font: 700 15px var(--body); color: var(--void); background: var(--cyan);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  #replayBack svg { width: 18px; height: 18px; fill: currentColor; }
  #replayBack:focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; z-index: 200; left: 50%;
    top: calc(56px + env(safe-area-inset-top, 0px));
    transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
    padding: 11px 18px; max-width: 90vw; text-align: center;
    background: var(--deep); border-left: 3px solid var(--acid);
    font: 600 14px var(--body); color: var(--ink);
    transition: opacity .2s, transform .2s;
  }
  #toast.visible { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) { #toast { top: calc(128px + env(safe-area-inset-top, 0px)); } }
  @media (max-height: 480px) { #toast { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); } }

  /* ---------- Lien de défi (repli si partage/copie impossible) ---------- */
  #linkBox { margin: 10px 0 0; text-align: left; }
  #linkBox input { width: 100%; padding: 10px; font: 13px var(--body); color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(30,242,255,.4); user-select: text; -webkit-user-select: text; }

  /* ---------- Petits écrans ---------- */
  @media (max-width: 520px) {
    .panel { padding: 20px 16px 16px; }
    .stats { gap: 22px; }
    .stat .v { font-size: 40px; }
    .actions button { flex: 1 1 100%; }
    .actions button.primary { max-width: none; }
  }
  @media (max-height: 560px) {
    .panel { padding: 14px 18px 12px; }
    .title { font-size: clamp(42px, 11vh, 64px); }
    .tagline { margin: 4px 0 10px; }
    .stats { margin: 4px 0 6px; }
    .stat .v { font-size: 34px; }
    .controls { margin-top: 8px; line-height: 1.5; }
    .actions button { padding: 9px 14px; }
    .actions button.primary { padding: 11px 32px; font-size: 16px; }
    .banner { padding: 7px 12px; margin-bottom: 6px; }
  }
  @media (max-height: 560px) and (min-width: 600px) {
    .overlay.bottom .panel { width: min(94vw, 640px); }
    .overlay.bottom .tagline { display: none; }
    .overlay.bottom .actions button { flex: 0 1 auto; }
    .overlay.bottom .actions button.primary { flex-basis: auto; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Boutons de jeu mobile (masqués sur desktop, qui utilise le clavier) -->
<div id="hudBtns" class="hidden">
  <button id="btnMute" aria-label="Mute">
    <svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
  </button>
  <button id="btnPhoto" aria-label="Photo mode">
    <svg viewBox="0 0 24 24"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
  </button>
  <button id="btnRestart" aria-label="Restart">
    <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
  </button>
  <button id="btnPause" aria-label="Pause">
    <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
</div>

<!-- Main screen: menu, pause, continue, game over -->
<div id="overlay" class="overlay">
  <div class="panel" id="mainPanel">
    <h1 class="title" id="uiTitle">VOIDFALL</h1>
    <p class="tagline" id="uiTagline">The void forgives nothing.</p>

    <div id="uiChallenge" class="banner challenge hidden"></div>
    <div id="uiStreak" class="banner streak hidden"></div>
    <div id="uiDaily" class="banner hidden"></div>
    <div id="uiWeekly" class="banner weekly hidden" role="button" tabindex="0"></div>

    <div id="uiStats" class="stats hidden">
      <div class="stat"><div class="v" id="uiScore">0</div><div class="l">Distance</div></div>
      <div class="stat best"><div class="v" id="uiBest">0</div><div class="l">Best</div></div>
    </div>
    <p id="uiMsg" class="msg hidden"></p>

    <div class="actions" id="uiActions">
      <button id="btnPlay" class="primary">Play</button>
      <button id="btnContinue" class="ad hidden">Continue with an ad</button>
      <button id="btnShare" class="share hidden">Challenge a friend</button>
      <button id="btnCustomize" class="ghost">Customize</button>
      <button id="btnAch" class="ghost">Achievements <span id="uiAchCount"></span></button>
      <button id="btnMenu" class="ghost hidden">Menu</button>
    </div>
    <div id="linkBox" class="hidden"><input id="linkInput" readonly aria-label="Challenge link"></div>

    <div id="uiControls" class="controls"></div>
  </div>
</div>

<div id="customizeOverlay" class="overlay hidden">
  <div class="panel wide">
    <h2 class="section">Customize</h2>
    <div class="cos-block">
      <div class="cos-head"><strong>Themes</strong><span id="uiPalInfo"></span></div>
      <div class="cos-grid" id="uiPalGrid"></div>
    </div>
    <div class="cos-block">
      <div class="cos-head"><strong>Cores</strong><span id="uiSkinInfo"></span></div>
      <div class="cos-grid" id="uiSkinGrid"></div>
    </div>
    <div class="actions"><button id="btnCustomClose" class="primary">Close</button></div>
  </div>
</div>

<div id="achOverlay" class="overlay hidden">
  <div class="panel scroller">
    <h2 class="section">Achievements</h2>
    <p class="tagline" id="achSummary"></p>
    <div id="achList" class="ach-list"></div>
    <div class="actions"><button id="btnAchClose" class="primary">Close</button></div>
  </div>
</div>

<!-- Simulated ad (replace with the real rewarded ad, see requestRewardedAd) -->
<div id="adOverlay" role="dialog" aria-label="Advertisement">
  <div class="ad-card">
    <div class="ad-badge">SPONSORED</div>
    <div class="ad-timer" id="adTimer">5s</div>
    <div class="ad-logo" id="adLogo">CB</div>
    <div class="ad-title" id="adTitle">CloudBoost</div>
    <p class="ad-sub" id="adSub"></p>
    <button class="ad-cta" id="adCta">Learn more</button>
    <div class="ad-progress"><div></div></div>
    <div class="ad-hint">The ad will end automatically…</div>
  </div>
</div>

<div id="photoBar">
  <button id="pDownload">Download</button>
  <button id="pResume" class="alt">Resume</button>
</div>

<button id="replayBack" class="hidden" aria-label="Back to results"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>Back</button>

<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
(function () {

/* =========================================================================
   VOIDFALL — moteur original
   Piste en tuiles suspendue dans le vide, relief variable (pentes),
   caméra perspective avec tangage, rendu néon sur canvas 2D.
   ========================================================================= */

const GAME_NAME = 'VOIDFALL';

/* ---------------- Unité affichée ----------------
   Une dalle = une unité. Ces deux constantes changent TOUT l'affichage
   (distance, record, vitesse, défis, succès, partage). Elles ne touchent
   ni à la vitesse réelle, ni aux valeurs : ce sont de simples étiquettes.
   Pour repasser en mètres : UNIT = 'm' et UNIT_SPEED = 'm/s'. */
const UNIT = 'm';
const UNIT_SPEED = 'm/s';
const STORE = 'voidfall.';

/* ---------------- Réglages de jeu ---------------- */
const LANES          = 7;       // largeur de la piste en tuiles
const VIEW_ROWS      = 52;      // profondeur affichée
const START_ROWS     = 35;      // zone de départ sans trou
const GRAVITY        = 0.006;
const JUMP_VEL       = 0.1;
const BASE_SPEED     = 0.2;
const MAX_SPEED      = 0.42;    // plafond approché en douceur (~25 m/s)
const STEER_KEYS     = 0.1;
const FALL_LIMIT     = 3;       // mètres sous la piste = mort
const LAND_TOLERANCE = 0.5;     // marge d'atterrissage sous la surface
const JUMP_BUFFER    = 8;       // frames : saut mémorisé avant l'atterrissage
const COYOTE         = 6;       // frames : saut encore permis après le bord
const TILE_DEPTH     = 0.45;    // épaisseur visuelle des dalles
const PLAYER_R       = 0.27;
const FIXED_DT       = 1000 / 60;
const REPLAY_FRAMES  = 300;

/* ---------------- Obstacles ---------------- */
// Valeurs de tuile : 0 vide, 1 normale, 3 pad d'accélération
const T_BOOST        = 3;
const BAR_H          = 0.3;     // hauteur des barrières (saut toujours suffisant)
const SLIDE_H        = 0.5;
const BOOST_FRAMES   = 80;      // ~1,3 s de survol
const UNLOCK_AT = { boost: 400, barrier: 700, slider: 1200 };

/* ---------------- Utilitaires ---------------- */
function prng(seed) {
  // xorshift32 + mélange
  let s = (seed >>> 0) || 0x9e3779b9;
  return function () {
    s ^= s << 13; s >>>= 0;
