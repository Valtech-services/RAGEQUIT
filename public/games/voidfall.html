/* ---------------- Revoir sa mort ----------------
   Le panneau disparaît, le replay repart du début et un bouton Back
   en haut permet de revenir à l'écran de fin. */
function watchReplay() {
  if (S.mode !== 'gameover' && S.mode !== 'continue') return;
  if (S.replay.length < 2) return;
  // on mémorise l'état de la chute : le replay déplace la balle
  S.deathState = { px: S.px, py: S.py, pz: S.pz, vy: S.vy };
  S.watching = true;
  S.replayOn = true; S.replayIdx = 0; S.replayAcc = 0; S.replayHold = 0; S.trail = [];
  ui.overlay.classList.add('hidden');
  $('replayBack').classList.remove('hidden');
}
function closeReplay() {
  if (!S.watching) return;
  S.watching = false;
  $('replayBack').classList.add('hidden');
  if (S.mode === 'continue') {
    S.replayOn = false; S.trail = [];
    if (S.deathState) Object.assign(S, S.deathState);
    showScreen('continue');
  } else {
    showScreen('gameover');
  }
}
$('replayBack').addEventListener('click', function (e) { e.stopPropagation(); Sound.click(); closeReplay(); });

// Mort validée sans passer par l'écran de fin (bouton « Rejouer à zéro »)
function finishRunSilent() {
  const score = Math.floor(S.pz);
  if (score > S.best) { S.best = score; save('best', score); }
  S.total += score; save('total', S.total);
  checkCosmetics();
}

$('uiWeekly').addEventListener('click', function () { Sound.init(); startGame('weekly'); });
$('uiWeekly').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame('weekly'); } });

/* ---------------- Toasts ---------------- */
const toastQueue = [];
let toastBusy = false;
function toast(msg) {
  toastQueue.push(msg);
  if (!toastBusy) nextToast();
}
function nextToast() {
  const el = $('toast');
  if (!toastQueue.length) { toastBusy = false; return; }
  toastBusy = true;
  el.textContent = toastQueue.shift();
  el.classList.add('visible');
  setTimeout(function () { el.classList.remove('visible'); setTimeout(nextToast, 250); }, 2300);
}

/* ---------------- Personnaliser ---------------- */
function openCustomize() { $('customizeOverlay').classList.remove('hidden'); renderCustomize(); animatePreviews(); }
function renderCustomize() {
  const pg = $('uiPalGrid'), sg = $('uiSkinGrid');
  pg.innerHTML = ''; sg.innerHTML = ''; previews.length = 0;
  const card = function (grid, item, selected, lockText, onPick, kind) {
    const open = isUnlocked(item);
    const el = document.createElement('button');
    el.className = 'cos-item ' + kind + (selected ? ' sel' : '') + (open ? '' : ' locked');
    const c = document.createElement('canvas');
    if (kind === 'pal') { c.width = 176; c.height = 112; } else { c.width = 136; c.height = 136; }
    el.appendChild(c);
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = item.name; el.appendChild(n);
    if (!open) { const l = document.createElement('span'); l.className = 'lk'; l.textContent = lockText; el.appendChild(l); }
    el.addEventListener('click', function () { if (!open) { toast(item.unlock === -1 ? 'Play 5 days in a row to unlock' : 'Run ' + fmt(item.unlock) + ' ' + UNIT + ' in total to unlock'); return; } onPick(); });
    grid.appendChild(el);
    previews.push({ c: c, id: item.id, kind: kind, fx: makeEmberFx() });
  };
  PALETTES.forEach(function (p) {
    card(pg, p, S.palette === p.id, fmt(p.unlock) + ' ' + UNIT, function () { S.palette = p.id; save('palette', p.id); renderCustomize(); }, 'pal');
  });
  SKINS.forEach(function (sk) {
    card(sg, sk, S.skin === sk.id, sk.unlock === -1 ? '5-day streak' : fmt(sk.unlock) + ' ' + UNIT, function () { S.skin = sk.id; save('skin', sk.id); renderCustomize(); }, 'skin');
  });
  const next = function (list) {
    const n = list.filter(function (i) { return i.unlock > 0 && !isUnlocked(i); }).sort(function (a, b) { return a.unlock - b.unlock; })[0];
    return n ? 'Next at ' + fmt(n.unlock) + ' ' + UNIT + ' (' + fmt(S.total) + ' so far)' : 'All unlocked';
  };
  $('uiPalInfo').textContent = next(PALETTES);
  $('uiSkinInfo').textContent = next(SKINS);
}
const previews = [];

/* Aperçu d'ambiance : mini-piste en perspective qui défile */
function drawThemePreview(c, p, t) {
  const w = c.width, h = c.height, g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, p.bgTop); bg.addColorStop(1, p.bgBot);
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  const hy = h * 0.36, vx = w / 2;
  const hg = g.createLinearGradient(0, hy - h * 0.25, 0, hy + 2);
  hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(1, hexA(p.horizon, 0.45));
  g.fillStyle = hg; g.fillRect(0, hy - h * 0.25, w, h * 0.25 + 2);
  g.fillStyle = hexA(p.horizon, 0.9); g.fillRect(0, hy, w, 1.5);
  const hue = p.hues[0];
  const bw = w * 1.3;
  const px = function (lane, depth) { return vx + (lane / 7 - 0.5) * bw * depth; };
  const py = function (depth) { return hy + (h - hy) * depth; };
  // dalles en damier (profondeur = 1/z)
  const scroll = (t * 0.04) % 1;
  for (let z = 14; z >= 1; z--) {
    const z0 = z - scroll, z1 = z0 + 1;
    if (z0 < 0.6) continue;
    const d0 = 1 / z0, d1 = 1 / z1;
    for (let l = 0; l < 7; l++) {
      if ((l === 1 && (z % 5) === 2) || (l === 5 && (z % 4) === 1)) continue;
      g.fillStyle = 'hsl(' + hue + ',65%,' + (((l + z) & 1) ? 11 : 16) + '%)';
      g.beginPath();
      g.moveTo(px(l, d0), py(d0)); g.lineTo(px(l + 1, d0), py(d0));
      g.lineTo(px(l + 1, d1), py(d1)); g.lineTo(px(l, d1), py(d1)); g.closePath();
      g.fill();
      g.strokeStyle = 'hsl(' + hue + ',100%,60%)'; g.lineWidth = 1.2; g.stroke();
    }
  }
  // noyau
  const ox = vx, oy = h * 0.74, orr = h * 0.1;
  const glow = g.createRadialGradient(ox, oy, orr * 0.4, ox, oy, orr * 2.4);
  glow.addColorStop(0, hexA(p.glow, 0.6)); glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(ox, oy, orr * 2.4, 0, Math.PI * 2); g.fill();
  const body = g.createRadialGradient(ox - orr * 0.3, oy - orr * 0.3, 1, ox, oy, orr);
  body.addColorStop(0, '#fff'); body.addColorStop(0.5, p.player); body.addColorStop(1, p.glow);
  g.fillStyle = body; g.beginPath(); g.arc(ox, oy, orr, 0, Math.PI * 2); g.fill();
}

function animatePreviews() {
  if ($('customizeOverlay').classList.contains('hidden')) { previews.length = 0; return; }
  requestAnimationFrame(animatePreviews);
  const keep = ctx;
  for (let i = 0; i < previews.length; i++) {
    const pv = previews[i];
    if (!pv.c.isConnected) continue;
    if (pv.kind === 'pal') { drawThemePreview(pv.c, PAL_BY_ID[pv.id], S.time); continue; }
    ctx = pv.c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, pv.c.width, pv.c.height);
    pv.fx.rate = 0.3; pv.fx.roll += 0.3 * 0.5;
    const cx = pv.c.width / 2;
    const rr = pv.id === 'void' ? 22 : pv.id === 'ember' ? 30 : 40;
    const cy = pv.id === 'ember' ? pv.c.height * 0.6 : pv.c.height / 2;
    try { drawSkin(pv.id, cx, cy, rr, pal(), pv.fx); } catch (e) {}
  }
  ctx = keep;
}
$('btnCustomClose').addEventListener('click', function () { $('customizeOverlay').classList.add('hidden'); });

/* ---------------- Succès ---------------- */
function achCountText() {
  const n = ACHIEVEMENTS.filter(function (a) { return S.ach[a.id]; }).length;
  return n + '/' + ACHIEVEMENTS.length;
}
function refreshAchCount() { if (S.mode === 'title') showScreen('title'); }
function openAch() {
  const list = $('achList');
  list.innerHTML = '';
  ACHIEVEMENTS.forEach(function (a) {
    const el = document.createElement('div');
    el.className = 'ach' + (S.ach[a.id] ? ' on' : '');
    el.innerHTML = '<span class="dot"></span><div><div class="n"></div><div class="d"></div></div>';
    el.querySelector('.n').textContent = a.name;
    el.querySelector('.d').textContent = a.desc;
    list.appendChild(el);
  });
  $('achSummary').textContent = achCountText() + ' unlocked';
  $('achOverlay').classList.remove('hidden');
}
$('btnAchClose').addEventListener('click', function () { $('achOverlay').classList.add('hidden'); });

/* ---------------- Son / pause ---------------- */
function updateMuteIcon() {
  $('muteIcon').setAttribute('d', S.muted
    ? 'M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z'
    : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z');
  $('btnMute').setAttribute('aria-label', S.muted ? 'Unmute' : 'Mute');
}
$('btnMute').addEventListener('click', function (e) { e.stopPropagation(); Sound.init(); Sound.setMuted(!S.muted); this.blur(); });
$('btnPause').addEventListener('click', function (e) { e.stopPropagation(); this.blur(); pauseGame(); });
$('btnRestart').addEventListener('click', function (e) { e.stopPropagation(); this.blur(); if (S.mode === 'playing') startGame(); });
$('btnPhoto').addEventListener('click', function (e) { e.stopPropagation(); this.blur(); enterPhoto(); });

/* ---------------- Mode photo ---------------- */
function enterPhoto() {
  if (S.mode !== 'playing') return;
  S.mode = 'photo'; Sound.music(false);
  ui.hudBtns.classList.add('hidden');
  S.jumpHeld = false;
  $('photoBar').classList.add('visible');
}
function exitPhoto() {
  if (S.mode !== 'photo') return;
  $('photoBar').classList.remove('visible');
  S.mode = 'playing'; showScreen(null); Sound.music(true);
}
$('pResume').addEventListener('click', exitPhoto);
$('pDownload').addEventListener('click', function () {
  render();
  canvas.toBlob(function (blob) {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'voidfall-' + Math.floor(S.pz) + 'm.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    unlock('photo');
  });
});

/* =========================================================================
   ENTRÉES
   ========================================================================= */
const JUMP_KEYS = { ' ': 1, ArrowUp: 1, w: 1, W: 1, z: 1, Z: 1 };
const STEER_KEY_LIST = { ArrowLeft: 1, ArrowRight: 1, a: 1, A: 1, q: 1, Q: 1, d: 1, D: 1 };

function panelOpen() {
  return !$('customizeOverlay').classList.contains('hidden') || !$('achOverlay').classList.contains('hidden') || $('adOverlay').classList.contains('visible');
}

window.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
  if (e.key === 'Escape' && panelOpen()) {
    $('customizeOverlay').classList.add('hidden'); $('achOverlay').classList.add('hidden'); return;
  }
  if (panelOpen()) return;
  if (e.key === 'm' || e.key === 'M') { Sound.init(); Sound.setMuted(!S.muted); return; }
  if (S.watching && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ' || e.key === 'Backspace')) { e.preventDefault(); closeReplay(); return; }

  if (S.mode === 'photo') {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') exitPhoto();
    return;
  }
  if (e.key === 'Escape') {
    if (S.mode === 'playing') pauseGame(); else if (S.mode === 'paused') resumeGame();
    return;
  }
  if (e.key === 'r' || e.key === 'R') {
    if (S.mode === 'continue') finishRunSilent();
    if (S.mode !== 'title') startGame();
    return;
  }
  if ((e.key === 'p' || e.key === 'P') && S.mode === 'playing') { enterPhoto(); return; }

  if (S.mode === 'title' && (e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body) {
    startGame(S.challenge ? 'challenge' : 'free'); return;
  }
  if (S.mode === 'gameover' && (e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body) {
    startGame(); return;
  }
  if (S.mode !== 'playing') return;
  if (STEER_KEY_LIST[e.key]) { S.keys[e.key] = true; S.steerTarget = null; }
  if (JUMP_KEYS[e.key]) { if (!e.repeat) S.jumpBuf = JUMP_BUFFER; S.jumpHeld = true; }
});
window.addEventListener('keyup', function (e) {
  S.keys[e.key] = false;
  if (JUMP_KEYS[e.key]) S.jumpHeld = false;
});

/* Souris : position horizontale = position sur la piste */
let lastTouchAt = 0;
window.addEventListener('mousemove', function (e) {
  if (Date.now() - lastTouchAt < 800) return;
  if (S.mode !== 'playing') return;
  S.steerTarget = clamp((e.clientX / W - 0.5) * 8.4, -3.4, 3.4);
});
canvas.addEventListener('mousedown', function (e) {
  if (Date.now() - lastTouchAt < 800 || S.mode !== 'playing') return;
  Sound.init();
  S.jumpBuf = JUMP_BUFFER; S.jumpHeld = true;
});
window.addEventListener('mouseup', function () { if (Date.now() - lastTouchAt > 800) S.jumpHeld = false; });

/* Tactile : glisser = diriger (relatif), tap ou glissé vers le haut = sauter,
   un deuxième doigt posé = saut maintenu */
let steerT = null, extraT = null;
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  lastTouchAt = Date.now();
  Sound.init();
  if (S.mode !== 'playing') return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (!steerT) {
      steerT = { id: t.identifier, x0: t.clientX, y0: t.clientY, t0: performance.now(), p0: S.px, moved: false, swiped: false };
      S.steerTarget = S.px;
    } else if (!extraT) {
      extraT = t.identifier;
      S.jumpBuf = JUMP_BUFFER; S.jumpHeld = true;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  lastTouchAt = Date.now();
  if (!steerT || S.mode !== 'playing') return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== steerT.id) continue;
    const dx = t.clientX - steerT.x0, dy = t.clientY - steerT.y0;
    const perLane = Math.max(11, Math.min(W, H) * 0.26 / LANES);   // un simple pivot du pouce traverse la piste
    S.steerTarget = clamp(steerT.p0 + dx / perLane, -3.4, 3.4);
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) steerT.moved = true;
    if (!steerT.swiped && -dy > 32 && -dy > Math.abs(dx) * 0.8 && performance.now() - steerT.t0 < 300) {
      S.jumpBuf = JUMP_BUFFER; steerT.swiped = true;
    }
  }
}, { passive: false });
function touchEnd(e) {
  lastTouchAt = Date.now();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (steerT && t.identifier === steerT.id) {
      if (S.mode === 'playing' && !steerT.moved && performance.now() - steerT.t0 < 260) S.jumpBuf = JUMP_BUFFER;
      steerT = null;
    } else if (t.identifier === extraT) {
      extraT = null; S.jumpHeld = false;
    }
  }
}
canvas.addEventListener('touchend', function (e) { e.preventDefault(); touchEnd(e); }, { passive: false });
canvas.addEventListener('touchcancel', touchEnd);

window.addEventListener('blur', function () { pauseGame(); S.jumpHeld = false; S.keys = {}; });
document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

/* =========================================================================
   BOUCLE (pas fixe à 60 Hz)
   ========================================================================= */
function update() {
  S.time++;
  if (S.mode === 'playing') {
    stepPhysics();
    if (S.mode === 'playing') {
      S.replay.push([S.px, S.py, S.pz]);
      if (S.replay.length > REPLAY_FRAMES) S.replay.shift();
      checkDaily();
      if (!S.recordFlag && S.best > 0 && S.pz > S.best) {
        S.recordFlag = true;
        toast('New record. Don’t let go now.');
        Sound.record();
      }
    } else {
      S.replay.push([S.px, S.py, S.pz]);
    }
  } else if (S.mode === 'title') {
    S.pz += 0.14;
    if (S.pz + VIEW_ROWS + 4 >= S.tiles.length) buildRows(Math.floor(S.pz) + VIEW_ROWS + 8);
    S.px += (0 - S.px) * 0.05;
    S.py = groundAt(S.pz);
    if (S.pz > 3000) { resetTrack((Math.random() * 1e9) | 0, ''); S.pz = 0; updateCamera(true); }
  } else if (S.mode === 'continue' && !S.watching) {
    S.vy -= GRAVITY * gravMul; S.py += S.vy;
  }
  if (S.replayOn && (S.mode === 'gameover' || S.mode === 'continue')) stepReplay();
  if (S.mode === 'playing' || S.replayOn) {
    const want = S.replayOn ? 0.3 : S.speed * 1.3;
    S.spinRate = S.grounded || S.replayOn ? want : S.spinRate * 0.995;
    S.roll += S.spinRate;
  }

  if (S.mode !== 'paused' && S.mode !== 'photo') {
    updateCamera(false);
    stepParticles();
    stepStreaks(S.mode === 'playing' ? S.speed : S.mode === 'title' ? 0.14 : 0.02);
    stepCrystals();
  }
  S.shake *= 0.86;
  S.flash = Math.max(0, S.flash - 0.04);
}

let lastT = 0, acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, t - lastT);
  lastT = t;
  acc += dt;
  let n = 0;
  while (acc >= FIXED_DT && n < 6) { update(); acc -= FIXED_DT; n++; }
  if (n === 6) acc = 0;
  render();
}

/* =========================================================================
   DÉMARRAGE
   ========================================================================= */
readChallenge();
refreshDaily();
refreshWeekly();
checkCosmetics();
initStreaks();
initCrystals();
window.addEventListener('resize', initCrystals);
resetTrack((Math.random() * 1e9) | 0, '');
updateCamera(true);
updateMuteIcon();
showScreen('title');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { /* le canvas reprend la police au prochain rendu */ });
requestAnimationFrame(function (t) { lastT = t; loop(t); });

})();
</script>
