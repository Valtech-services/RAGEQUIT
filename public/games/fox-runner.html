<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fox Runner</title>
<style>
  :root{
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --ink: #5C4638;
    --ink-soft: #8B7A6B;
    --cream: #F5EBDC;
    --parchment-a: #FBF4E5;
    --parchment-b: #F0E3CC;
    --edge: #C4A67E;
    --sage: #9DC4A5;
    --moss: #7DAA87;
    --honey: #F4D58D;
    --serif: Georgia, "Noto Serif", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #DCEAF2;
    color: var(--ink);
    font-family: var(--sans);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage{
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    overflow: hidden;
  }
  #game{ display: block; width: 100%; height: 100%; touch-action: none; }

  /* Top-right controls (top-left stays free for the site's back button) */
  .hud-btns{
    position: absolute;
    top: calc(var(--safe-top) + 10px);
    right: calc(var(--safe-right) + 10px);
    display: flex; gap: 8px;
    z-index: 60;
  }
  .icon-btn{
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: rgba(245, 235, 220, 0.92);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    -webkit-appearance: none; appearance: none;
    box-shadow: 0 2px 8px rgba(92, 70, 56, 0.2);
    transition: background .12s ease, transform .08s ease;
    cursor: pointer;
  }
  .icon-btn:hover{ background: #EBDFC9; }
  .icon-btn:active{ transform: scale(0.94); }
  .icon-btn svg{ width: 20px; height: 20px; display: block; }
  .icon-btn.idle{ opacity: .4; pointer-events: none; }
  .icon-btn.hide{ display: none; }
  #muteBtn .off{ display: none; }
  #muteBtn.muted .on{ display: none; }
  #muteBtn.muted .off{ display: block; }
  @media (max-height: 460px){
    .icon-btn{ width: 38px; height: 38px; }
    .icon-btn svg{ width: 17px; height: 17px; }
  }
  button:focus-visible{ outline: 3px solid #4C8A63; outline-offset: 2px; }

  /* Overlays */
  .overlay{
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding:
      calc(var(--safe-top) + 12px)
      calc(var(--safe-right) + 12px)
      calc(var(--safe-bottom) + 12px)
      calc(var(--safe-left) + 12px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 50;
  }
  .overlay.on{ display: flex; }
  #menu{
    background: radial-gradient(circle at 50% 45%, rgba(245,235,220,0.5) 0%, rgba(92,70,56,0.62) 100%);
  }
  #pause, #over, #ad{
    background: rgba(92, 70, 56, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  .panel{
    position: relative;
    background: linear-gradient(180deg, var(--parchment-a) 0%, var(--parchment-b) 100%);
    border: 1px solid var(--edge);
    border-radius: 18px;
    padding: 22px 22px;
    width: min(420px, 100%);
    max-height: 100%;
    box-shadow: 0 12px 40px rgba(92, 70, 56, 0.4), inset 0 0 40px rgba(196, 166, 126, 0.18);
    text-align: center;
  }
  .serif{ font-family: var(--serif); font-style: italic; font-weight: 700; color: var(--ink); }
  h1.serif{
    margin: 0 0 2px;
    font-size: clamp(32px, 6vw, 50px);
    line-height: 1.05;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.55), 0 0 22px rgba(244,213,141,0.55);
  }
  h2.serif{ margin: 0 0 8px; font-size: 24px; line-height: 1.15; }

  .btn{
    display: block; width: 100%; min-height: 50px;
    margin-top: 10px;
    padding: 11px 16px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    color: var(--ink);
    background: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    -webkit-appearance: none; appearance: none;
    transition: transform .08s ease, background .15s ease;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn svg{ width: 18px; height: 18px; flex: 0 0 auto; }
  .btn:hover{ background: #EBDFC9; }
  .btn.primary{ background: var(--sage); box-shadow: 0 3px 0 rgba(125,170,135,0.9); }
  .btn.primary:hover{ background: #8AB795; }
  .btn:active{ transform: translateY(2px); box-shadow: none; }
  .btn.big{ min-height: 60px; font-size: 18px; box-shadow: 0 4px 0 rgba(125,170,135,0.9); }
  .btn.quiet{ background: transparent; border-color: rgba(92,70,56,0.45); font-weight: 600; }

  /* Menu */
  .menu-card{
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; text-align: center;
    width: min(460px, 100%);
    animation: rise .5s ease-out;
  }
  @keyframes rise{ from{ opacity: 0; transform: translateY(12px); } to{ opacity: 1; transform: none; } }
  #menuFox{ width: min(220px, 60vw); height: auto; display: block; }
  .menu-text{ width: 100%; }
  .menu-text .btn{ max-width: 340px; margin-left: auto; margin-right: auto; margin-top: 14px; }
  .hint{ margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink); opacity: .85; }
  .best{ margin: 6px 0 0; font-size: 13px; color: var(--ink); opacity: .85; }
  .best b{ color: #4C8A63; font-size: 15px; }
  @media (min-aspect-ratio: 13/10){
    .menu-card{ flex-direction: row; gap: 26px; width: min(720px, 100%); }
    #menuFox{ width: min(260px, 34vw); flex: 0 0 auto; }
    .menu-text{ text-align: left; }
    .menu-text .btn{ margin-left: 0; }
  }

  /* Game over */
  .panel.go{ width: min(640px, 100%); display: flex; flex-direction: row; gap: 22px; align-items: center; padding: 18px 22px; }
  .go-left, .go-right{ flex: 1 1 0; min-width: 0; }
  #medalCanvas{ width: 68px; height: 68px; display: block; margin: 0 auto; }
  .medal-label{ margin: 2px 0 0; font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-soft); }
  .big{ margin: 4px 0 0; font-size: 46px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .big small{ font-size: 20px; font-weight: 700; margin-left: 3px; }
  .record{ margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
  .record b{ color: #4C8A63; }
  .go-right .btn:first-child{ margin-top: 0; }
  @media (max-aspect-ratio: 1/1){
    .panel.go{ flex-direction: column; gap: 12px; width: min(400px, 100%); }
    .go-right{ width: 100%; flex: 0 0 auto; }
  }
  @media (max-height: 460px){
    .panel{ padding: 14px 18px; }
    h2.serif{ font-size: 20px; margin-bottom: 4px; }
    #medalCanvas{ width: 54px; height: 54px; }
    .big{ font-size: 36px; }
    .btn{ min-height: 44px; margin-top: 8px; }
    .btn.big{ min-height: 52px; }
    #menuFox{ width: 150px; }
    .hint{ margin-top: 8px; }
  }


  /* Modes, challenge banner */
  .mode-row{ display: flex; gap: 8px; max-width: 340px; margin: 10px auto 0; }
  .mode-row .btn{ margin-top: 0; }
  .btn.small{ min-height: 44px; font-size: 14px; padding: 8px 10px; }
  .challenge{
    display: none; margin: 8px 0 0; padding: 8px 12px;
    border-radius: 10px; background: rgba(244,213,141,0.6);
    border: 1px solid var(--edge);
    font-size: 14px; font-weight: 700; line-height: 1.3;
  }
  .challenge.on{ display: block; }
  @media (min-aspect-ratio: 13/10){ .mode-row{ margin-left: 0; } }

  /* Skins */
  #skins{ background: rgba(92,70,56,0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #skins .panel{ width: min(600px, 100%); }
  .skin-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-top: 10px; }
  .skin{
    border: 1.5px solid rgba(92,70,56,0.4); border-radius: 12px;
    background: rgba(255,255,255,0.45); padding: 6px 4px 8px;
    cursor: pointer; font: inherit; color: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .skin canvas{ width: 84px; height: 62px; display: block; margin: 0 auto; }
  .skin.sel{ border-color: #3E7A55; background: rgba(157,196,165,0.5); box-shadow: 0 0 0 2px #3E7A55 inset; }
  .skin.locked{ opacity: .65; cursor: default; }
  .skin .nm{ display: block; font-weight: 700; font-size: 13px; margin-top: 2px; }
  .skin .st{ display: block; font-size: 11px; color: var(--ink-soft); }
  .go-note{ margin: 8px 0 0; font-size: 13px; font-weight: 600; line-height: 1.35; white-space: pre-line; }
  .toast{
    position: absolute; left: 50%; bottom: calc(var(--safe-bottom) + 24px);
    transform: translateX(-50%);
    background: rgba(60,46,36,0.94); color: #FFF6D6;
    padding: 9px 16px; border-radius: 999px; font-size: 14px;
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: 90%; text-align: center;
  }
  .toast.on{ opacity: 1; }
  @media (max-height: 460px){
    .go-note{ margin-top: 4px; font-size: 12px; }
    .menu-text .hint{ display: none; }
    .skin canvas{ width: 70px; height: 52px; }
    .go-right .btn{ margin-top: 6px; }
  }

  /* Rewarded ad (simulated, swappable for a real SDK) */
  .ad-panel{
    background: linear-gradient(180deg, #5C4638 0%, #4A3830 100%);
    color: var(--cream);
    border: 3px solid var(--moss);
    box-shadow: 0 0 0 6px rgba(157,196,165,0.22), 0 0 0 12px rgba(157,196,165,0.10), 0 12px 40px rgba(0,0,0,0.45);
    width: min(360px, 100%);
  }
  .ad-label{ margin: 0 0 10px; font-size: 12px; letter-spacing: 2px; color: #C9B6E4; }
  .ad-box{
    display: flex; align-items: center; justify-content: center;
    width: 100%; aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #9DC4A5, #B8D8E8);
    border-radius: 10px;
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
    color: var(--ink);
  }
  @media (max-height: 460px){ .ad-box{ aspect-ratio: 21 / 6; } }
  .ad-count{ margin: 12px 0 4px; font-size: 14px; color: #CDE8D4; }
  .ad-count b{ color: var(--honey); font-size: 16px; }
  .ad-fireflies{ display: flex; justify-content: center; gap: 10px; min-height: 24px; margin-top: 8px; }
  .ad-firefly{
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle, #FFF8DC 0%, #F4D58D 45%, transparent 72%);
    box-shadow: 0 0 14px 5px rgba(244,213,141,0.7);
    transition: opacity .35s ease, transform .35s ease, box-shadow .35s ease;
  }
  .ad-firefly.dim{ opacity: .12; transform: scale(.6); box-shadow: none; }
  .ad-firefly.fly{ animation: flyAway .7s ease-out forwards; }
  @keyframes flyAway{
    0%{ transform: translateY(0) scale(1); opacity: 1; }
    60%{ transform: translateY(-40px) scale(1.4); opacity: 1; }
    100%{ transform: translateY(-90px) scale(.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    .menu-card{ animation: none; }
    .ad-firefly.fly{ animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud-btns">
    <button id="pauseBtn" class="icon-btn idle" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <button id="muteBtn" class="icon-btn" type="button" aria-label="Sound on or off">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>

  <div id="menu" class="overlay on">
    <div class="menu-card">
      <canvas id="menuFox" width="480" height="340"></canvas>
      <div class="menu-text">
        <h1 class="serif">Fox Runner</h1>
        <p class="challenge" id="challenge"></p>
        <button id="playBtn" class="btn primary big" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
          <span id="playLabel">Enter the forest</span>
        </button>
        <div class="mode-row">
          <button id="dailyBtn" class="btn small" type="button">Daily run</button>
          <button id="hardBtn" class="btn small" type="button">Hard mode</button>
        </div>
        <div class="mode-row" style="margin-top:8px">
          <button id="skinsBtn" class="btn small" type="button">Fox skins</button>
        </div>
        <p class="hint" id="hint">Tap to hop. Hold to leap higher.</p>
        <p class="best">Best run: <b id="menuBest">0 m</b> <span id="menuDaily"></span></p>
      </div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="panel">
      <h2 class="serif">Taking a breath</h2>
      <button id="resumeBtn" class="btn primary" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
        Resume
      </button>
      <button id="quitBtn" class="btn" type="button">Back to menu</button>
    </div>
  </div>

  <div id="over" class="overlay">
    <div class="panel go">
      <div class="go-left">
        <h2 class="serif">The forest caught you</h2>
        <canvas id="medalCanvas" width="144" height="144"></canvas>
        <p class="medal-label" id="medalLabel">Oak leaf</p>
        <p class="big serif"><span id="finalScore">0</span><small>m</small></p>
        <p class="record">Best run: <b id="finalBest">0 m</b></p>
        <p class="go-note" id="goNote"></p>
      </div>
      <div class="go-right">
        <button id="reviveBtn" class="btn primary" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
          Keep running (watch an ad)
        </button>
        <button id="againBtn" class="btn" type="button">Run again</button>
        <button id="shareBtn" class="btn" type="button">Challenge a friend</button>
        <button id="menuBtn" class="btn quiet" type="button">Back to menu</button>
      </div>
    </div>
  </div>

  <div id="skins" class="overlay">
    <div class="panel">
      <h2 class="serif">Fox skins</h2>
      <p class="record">Fireflies collected: <b id="skinFF">0</b></p>
      <div class="skin-grid" id="skinGrid"></div>
      <button id="skinsDone" class="btn primary" type="button">Done</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="ad" class="overlay">
    <div class="panel ad-panel">
      <p class="ad-label">Advertisement</p>
      <div class="ad-box">AD</div>
      <div class="ad-fireflies" id="adFireflies"></div>
      <p class="ad-count">Back in <b id="adCount">5</b> s</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================================================================== */
  /* INTEGRATION SETTINGS: adjust to match games.js                     */
  /* ================================================================== */
  var GAME_ID = 'fox-runner';
  var SCORE_EVENT = 'FOX_RUNNER_SCORE';
  var PFX = 'fox-runner-';
  var SITE_URL = 'https://ragequit-arcade.com/game/fox-runner';   // base of the "Challenge a friend" links
  var MUSIC_VOL = 1;           // background music volume: 0 = off, 1 = default, up to 1.5
  var DAILY_MODE_KEY = null;   // set to 'daily' (and add 'daily' to modes in games.js) to send daily scores to the leaderboard

  /* ================================================================== */
  /* REWARDED AD: replace this object with the real SDK later           */
  /* ================================================================== */
  var AdSDK = {
    isAvailable: function () { return false; },
    showRewarded: function (onReward) { return false; }
  };

  /* ================================================================== */
  /* Tuning                                                             */
  /* ================================================================== */
  var STEP = 1 / 60;
  var PX_PER_M = 50;            // 50 world pixels = 1 meter of score
  var JUMP_V = 760;             // px/s, launch speed
  var G_HOLD = 2800;            // px/s^2 while rising with the button held
  var G_FALL = 3600;            // px/s^2 otherwise
  var CUT_V = 420;              // rising speed kept when the button is released
  var MAX_FALL = 1100;
  var COYOTE = 0.09;            // seconds of grace after leaving an edge
  var BUFFER = 0.12;            // seconds a press is remembered before landing
  var STEP_UP = 14;             // ledges up to this height are climbed automatically
  var WALL_GRAB = true;         // classic: a late jump grabs the next platform's side and can jump again (Hard mode never does)
  var H_MIN = 64, H_MAX = 210;  // platform top height range above the bottom
  var TIER_METERS = 200;        // the time of day changes every 200 m
  var FOX_W = 30, FOX_H = 26;
  var BOUNCE_V = 1000, BOUNCE_VX = 200;     // mushroom launch
  var T_COLLAPSE = 0.45, COLLAPSE_EARLY = 0.18;   // crumbling logs
  var FLOW_STREAK = 4, FLOW_SPEED = 1.1;    // perfect jumps in a row that trigger Flow

  /* Speed grows until 2000 m, then keeps creeping up, with short surges after that */
  function baseSpeed(m) { return m < 2000 ? 340 + m * 0.16 : 660 + Math.min(100, (m - 2000) * 0.033); }
  function surgeAt(m) {
    if (m < 2000) return 1;
    var ph = m % 500;
    return (ph > 430 && ph < 475) ? 1 + 0.12 * Math.sin(Math.PI * (ph - 430) / 45) : 1;
  }
  function speedAt(m, hard) { var v = baseSpeed(m) * surgeAt(m); return hard ? v * 1.14 : v; }
  /* Timing window (seconds) that every gap leaves the player; it keeps shrinking */
  function windowAt(m, hard) {
    var w = 0.13 - 0.08 * Math.min(1, m / 2500);
    if (m > 2500) w -= Math.min(0.02, (m - 2500) / 100000);
    if (hard) w -= 0.02;
    return Math.max(0.03, w);
  }

  /* ================================================================== */
  /* Small helpers                                                      */
  /* ================================================================== */
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function hash(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function mixRGB(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  function rgb(a) { return 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')'; }
  function rgba(a, al) { return 'rgba(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ',' + al + ')'; }
  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function ellipse(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); c.fill(); }
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var isTouch = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);

  function store(key, val) { try { localStorage.setItem(PFX + key, String(val)); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(PFX + key); } catch (e) { return null; } }


  /* ================================================================== */
  /* Times of day: each one has its own rule                            */
  /* ================================================================== */
  var TIERS = [
    { name: 'Morning',     sub: 'A fresh start',          top: [110,190,242], mid: [150,222,236], bot: [238,246,226], sun: [255,226,140], sx: .78, sy: .22, night: 0, stars: 0, tint: [255,236,200], ta: 0,   ff: .25 },
    { name: 'Midday',      sub: 'Run into mushrooms to bounce', top: [64,156,240], mid: [140,210,246], bot: [230,246,226], sun: [255,242,180], sx: .58, sy: .12, night: 0, stars: 0, tint: [255,250,225], ta: 0,   ff: .15 },
    { name: 'Golden hour', sub: 'Logs crumble under you', top: [255,150,120], mid: [255,196,140], bot: [255,232,184], sun: [255,190,110], sx: .84, sy: .40, night: 0, stars: 0, tint: [255,180,100], ta: .14, ff: .5 },
    { name: 'Night',       sub: 'Low light and gusty wind', top: [30,44,100],  mid: [60,84,146],   bot: [104,124,176], sun: [236,240,255], sx: .74, sy: .22, night: 1, stars: 1, tint: [40,50,110],   ta: .40, ff: 1 }
  ];
  var tp = null;                 // current interpolated parameters
  function tierParams(p) {
    var n = TIERS.length;
    var i = Math.floor(p), t = smooth(p - i);

  var tierProgress = 0, tierTarget = 0;
  var bests = { classic: parseInt(load('best'), 10) || 0, hard: parseInt(load('best-hard'), 10) || 0, daily: 0 };
  var lifeFF = parseInt(load('ff'), 10) || 0;
  var hitStop = 0;
  var dyingT = 0;
  var overSince = 0;
  var challenge = null;          // { seed, score, mode } when the page was opened from a friend's link
  var skinsOpen = false;
  tp = tierParams(0);

  function todayKey() { var d = new Date(); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); }
  function dailySeed() { return (todayKey() * 2654435761) >>> 0; }
  bests.daily = parseInt(load('daily-' + todayKey()), 10) || 0;

  /* Flight time of a full jump / of a mushroom bounce, used to place platforms fairly */
  var ftCache = {};
  function flightTime(rise) {
    var key = Math.round(rise / 2) * 2;
    if (ftCache[key] !== undefined) return ftCache[key];
    var h = 0, vh = JUMP_V, t = 0, dt = 1 / 240;
    while (t < 2) {
      var g = vh > 0 ? G_HOLD : G_FALL;
      vh -= g * dt; h += vh * dt; t += dt;

    }
    ftCache[key] = t;
    return t;
  }
  function bounceTime(rise) { return (BOUNCE_V + Math.sqrt(Math.max(0, BOUNCE_V * BOUNCE_V - 2 * G_FALL * rise))) / G_FALL; }

  /* ---------------- seeded helpers (only for the track) ---------------- */
  function R() { return run.rng(); }
  function rr(a, b) { return a + R() * (b - a); }
  function pickW(list) {
    var tot = 0, i;
    for (i = 0; i < list.length; i++) tot += list[i][1];
    var x = R() * tot;
    for (i = 0; i < list.length; i++) { x -= list[i][1]; if (x <= 0) return list[i][0]; }
    return list[list.length - 1][0];
  }
  var TYPES = ['log', 'log', 'log', 'moss', 'moss', 'stone'];

  function newPlat(wx, w, top, type) {
    return {
      wx: wx, x: wx - run.cam, w: w, top: top, type: type, seed: Math.floor(R() * 1000), squash: 0,
      col: null, oneWay: false, bodyH: 1e9, bramble: null, branch: null, mush: null, dead: false, fall: 0, fvy: 0
    };
  }
  function ctxAt(prev) {
    var m = (prev.wx + prev.w) / PX_PER_M;
    return { m: m, theme: themeAt(m), v: speedAt(m, run.hard), w0: windowAt(m, run.hard), d: clamp(m / 2500, 0, 1) };
  }
  function add(p) { run.platforms.push(p); run.last = p; return p; }

  /* Places the next platform. The gap is always crossable with a full jump and
     leaves at least the timing window for this distance (minus wind or crumbling). */
  function nextPlat(prev, k, o) {
    o = o || {};
    var minGap = o.minGap || 46, rise = o.rise || 0, tries = 0, top, T, gapMax;
    var early = prev.col ? k.v * COLLAPSE_EARLY : 0;
    var wind = k.theme === 3 ? 1 : 0;
    for (;;) {
      top = clamp(prev.top + rise, H_MIN, H_MAX);
      T = flightTime(top - prev.top);
      gapMax = k.v * T - k.v * k.w0 - (wind ? 70 * T + 6 : 0) - early;
      if (gapMax >= minGap + 14 || tries >= 8) break;
      rise *= 0.6; tries++;
    }
    if (gapMax < minGap + 14) {
      top = prev.top; T = flightTime(0);
      gapMax = Math.max(70, k.v * T - k.v * k.w0 - (wind ? 70 * T + 6 : 0) - early);
    }
    gapMax = Math.min(gapMax, 380);
    var gap = lerp(minGap, gapMax, clamp(o.gf === undefined ? 0.5 : o.gf, 0, 1));
    var w = o.w || Math.round(Math.max(o.wmin || 240, k.v * (o.wf || 0.55)) + rr(0, o.wr === undefined ? 150 : o.wr));
    var type = o.type || TYPES[Math.floor(R() * TYPES.length)];
    if (o.crumble) { type = 'crumble'; w = Math.round(k.v * (T_COLLAPSE + COLLAPSE_EARLY)); }
    var p = newPlat(prev.wx + prev.w + gap, w, top, type);
    if (o.crumble) { p.col = { state: 0, t: 0 }; p.bodyH = 46; }
    return p;
  }

  function arc(a, b, n) {
    var x0 = a.wx + a.w - 20, x1 = b.wx + 20;
    if (x1 - x0 < 60) return;
    for (var i = 1; i <= n; i++) {
      var t = i / (n + 1);
      run.pickups.push({ wx: x0 + (x1 - x0) * t, h: lerp(a.top, b.top, t) + 34 + 44 * Math.sin(Math.PI * t), taken: false, ph: R() * 6 });
    }
  }
  function row(p, n, from, step) {
    for (var i = 0; i < n; i++) run.pickups.push({ wx: p.wx + from + i * step, h: p.top + 24, taken: false, ph: R() * 6 });
  }

  /* ---------------- track patterns ---------------- */
  function chunkRun(prev, k, n) {
    for (var i = 0; i < n; i++) {
      var gf = clamp(0.30 + 0.5 * k.d + rr(-0.12, 0.15) - (k.theme === 3 ? 0.08 : 0), 0.15, 0.9);
      var p = nextPlat(prev, k, { rise: rr(-70, 50) * (k.m < 40 ? 0.35 : 1), gf: gf });
      if (R() < 0.55) arc(prev, p, 3);
      prev = add(p); k = ctxAt(prev);
    }
  }
  function chunkRest(prev, k) {
    var p = nextPlat(prev, k, { rise: rr(-40, 40), gf: 0.35, wf: 1.5, wmin: 420, wr: 200 });
    arc(prev, p, 3);
    add(p);
    if (R() < 0.7) row(p, 4, 90, 60);
  }
  function chunkStairs(prev, k, up) {
    for (var i = 0; i < 3; i++) {
      var rise = up ? rr(38, 52) : -rr(46, 70);
      var p = nextPlat(prev, k, { rise: rise, gf: rr(0.45, 0.72), wf: 0.5, wr: 40 });
      arc(prev, p, 2);
      prev = add(p); k = ctxAt(prev);
    }
  }
  function chunkWave(prev, k) {
    var rises = [48, -62, 52];
    for (var i = 0; i < 3; i++) {
      var p = nextPlat(prev, k, { rise: rises[i] + rr(-8, 8), gf: rr(0.5, 0.75) - (k.theme === 3 ? 0.08 : 0), wf: 0.5, wr: 50 });
      arc(prev, p, 3);
      prev = add(p); k = ctxAt(prev);
    }
  }
  function chunkStones(prev, k) {
    for (var i = 0; i < 4; i++) {
      var p = nextPlat(prev, k, { rise: rr(-14, 14), gf: rr(0.18, 0.4), minGap: 44, w: Math.round(rr(112, 134) + Math.max(0, k.v - 550) * 0.18), type: 'stone' });
      arc(prev, p, 2);
      prev = add(p); k = ctxAt(prev);
    }
  }
  function chunkBramble(prev, k, withBranch) {
    var v = k.v;
    var w = Math.round(110 + v * 1.06 + rr(0, 80) + (withBranch ? 70 : 0));
    var p = nextPlat(prev, k, { rise: rr(-30, 30), gf: 0.4 + 0.3 * k.d, w: w, type: 'log' });
    var bw = 40, bh = 22;
    var lo = 60 + v * 0.34 + (withBranch ? 42 : 0);
    var hi = w - bw - v * 0.72 - 10 - (withBranch ? 42 : 0);
    var ox = Math.round(hi > lo ? rr(lo, hi) : lo);
    p.bramble = { ox: ox, w: bw, h: bh };
    if (withBranch) p.branch = { ox: ox - 42, w: bw + 84, bottom: 112 };
    arc(prev, p, 2);
    add(p);
  }
  function chunkBridge(prev, k) {
    var v = k.v;
    var wA = Math.round(120 + v * 1.0 + rr(0, 60));
    var targetTop = rr(H_MIN, 100);
    var A = nextPlat(prev, k, { rise: targetTop - prev.top, gf: 0.35, w: wA, type: 'log' });
    if (A.top > 104) A.top = 104;
    var padOx = wA - 54 - 22;
    A.mush = { ox: padOx, w: 44, h: 16, sq: 0 };
    var topB = Math.min(H_MAX, A.top + rr(106, 120));
    var rB = topB - (A.top + A.mush.h);
    var t = bounceTime(rB);
    var D = (v + BOUNCE_VX) * t;
    var padCenter = A.wx + padOx + 22;
    var Bwx = padCenter + D - 100;
    var gap = Math.max(46, Bwx - (A.wx + A.w));
    var B = newPlat(A.wx + A.w + gap, Math.round(340 + rr(0, 100)), topB, pickW([['log', 2], ['moss', 2], ['stone', 1]]));
    arc(A, B, 0);
    add(A); add(B);
    run.pickups.push({ wx: padCenter + D * 0.5, h: (A.top + 16) + rB * 0.75 + 30, taken: false, ph: R() * 6 });
    run.pickups.push({ wx: padCenter + D * 0.72, h: topB + 30, taken: false, ph: R() * 6 });
  }
  function chunkCanopy(prev, k) {
    var v = k.v;
    var rest = nextPlat(prev, k, { rise: rr(-30, 20), gf: 0.35, w: Math.round(v * 3.3 + rr(0, 120)), type: 'log' });
    arc(prev, rest, 2);
    add(rest);
    var n = 2 + (R() < 0.5 ? 1 : 0);
    var x = rest.wx + 140;
    var top = rest.top + rr(78, 88);
    var maxGap = Math.max(50, (v * flightTime(0) - v * k.w0) * 0.7);
    for (var i = 0; i < n; i++) {
      var w = Math.round(rr(120, 150));
      var s = newPlat(x, w, top + rr(-4, 4), 'slab');
      s.oneWay = true; s.bodyH = 12;
      run.platforms.push(s);
      for (var j = 0; j < 3; j++) run.pickups.push({ wx: x + 24 + j * ((w - 48) / 2), h: s.top + 26, taken: false, ph: R() * 6 });
      x += w + Math.min(rr(60, 90), maxGap);
    }
  }
  function chunkCrumble(prev, k) {
    var n = 1 + Math.floor(R() * 3);
    for (var i = 0; i < n; i++) {
      var p = nextPlat(prev, k, { crumble: true, rise: rr(-30, 30), gf: clamp(0.45 + 0.3 * k.d + rr(-0.1, 0.1), 0.2, 0.9) });
      arc(prev, p, 2);
      prev = add(p); k = ctxAt(prev);
    }
    var safe = nextPlat(prev, k, { rise: rr(-40, 30), gf: 0.4 });
    arc(prev, safe, 2);
    add(safe);
  }

  var HARD_CHUNKS = { stones: 1, bramblebranch: 1, bridge: 1, crumble: 1, wave: 1 };
  function genChunk() {
    var prev = run.last, k = ctxAt(prev), m = k.m, d = k.d, th = k.theme, name;
    var tier = tierAtM(m);
    if (tier !== run.lastTierGen && tier > 0) {
      run.lastTierGen = tier;
      name = th === 1 ? 'bridge' : (th === 2 ? 'crumble' : (th === 3 ? 'canopy' : 'run'));
    } else {
      run.lastTierGen = tier;
      var pool = [['run', 34], ['rest', 12], ['stairsUp', 10], ['stairsDown', 10]];
      if (m >= 120) pool.push(['wave', 8 + 8 * d]);
      if (m >= 60) pool.push(['bramble', 10 + 10 * d]);
      if (m >= 250) pool.push(['bramblebranch', 6 + 10 * d]);
      if (m >= 300 && th !== 3) pool.push(['stones', 6 + 12 * d]);
      if (th === 1) { pool.push(['bridge', 30]); pool.push(['canopy', 12]); }
      if (th === 2) { pool.push(['crumble', 34]); }
      if (th === 3) { pool.push(['canopy', 10]); }
      if (m < 40) name = R() < 0.65 ? 'run' : 'rest';
      else if (run.tension >= 2 && R() < 0.75) name = 'rest'; else name = pickW(pool);
    }
    if (HARD_CHUNKS[name]) run.tension++; else run.tension = Math.max(0, run.tension - 1);
    if (name === 'run') chunkRun(prev, k, 1 + Math.floor(R() * 3));
    else if (name === 'rest') chunkRest(prev, k);
    else if (name === 'stairsUp') chunkStairs(prev, k, true);
    else if (name === 'stairsDown') chunkStairs(prev, k, false);
    else if (name === 'wave') chunkWave(prev, k);
    else if (name === 'stones') chunkStones(prev, k);
    else if (name === 'bramble') chunkBramble(prev, k, false);
    else if (name === 'bramblebranch') chunkBramble(prev, k, true);
    else if (name === 'bridge') chunkBridge(prev, k);
    else if (name === 'canopy') chunkCanopy(prev, k);
    else if (name === 'crumble') chunkCrumble(prev, k);
    run.lastChunk = name;
  }

  function fillTrack() {
    var guard = 0;
    while (run.last.wx + run.last.w < run.cam + view.W + 800 && guard++ < 40) genChunk();
  }

  function placeFox() {
    run.fox = {
      x: view.baseX, h: 110, vh: 0, w: FOX_W, hh: FOX_H,
      grounded: true, pinned: false, coyote: COYOTE, jumping: false, bouncing: false,
      phase: 0, squash: 0, wallCd: 0, dustT: 0, inv: 0, kick: 0, ground: null
    };
  }

  function startTrack() {
    var first = newPlat(run.cam - 160, 820, 110, 'log');
    first.seed = 7;
    run.platforms = [first]; run.pickups = []; run.crows = [];
    run.last = first;
    fillTrack();
  }

  function newRun(mode, seed) {
    mode = mode || 'classic';
    if (seed === undefined || seed === null) seed = Math.floor(Math.random() * 4294967296) >>> 0;
    run = {
      mode: mode, hard: mode === 'hard', seed: seed >>> 0,
      rng: mulberry32(seed), rngE: mulberry32((seed ^ 0x5bd1e995) >>> 0),
      cam: 0, dist: 0, speed: speedAt(0, mode === 'hard'), flowK: 1,
      platforms: [], pickups: [], crows: [], last: null, fox: null,
      usedRevive: false, sentScore: 0, milestone: 0, tension: 0, lastTierGen: 0, lastChunk: '',
      ff: 0, ff0: lifeFF, streak: 0, flow: false, perfectPending: false, tookGap: false, takeoffPlat: null,
      nextCrowM: 400 + 60 * 0.5, gust: { t: -1, dur: 1.7, amp: 0, next: 12 }, windV: 0, surging: false,
      chal: null, lastGround: null
    };
    run.nextCrowM = 400 + 60 * run.rngE();
    placeFox();
    startTrack();
    particles.length = 0; messages.length = 0;
    input.held = false; input.buffer = 0;
    tierProgress = 0; tierTarget = 0;
    hitStop = 0;
  }
  function meters() { return run ? Math.floor(run.dist / PX_PER_M) : 0; }

  /* ================================================================== */
  /* Effects                                                            */
  /* ================================================================== */
  function addP(p) { if (particles.length > 280) particles.shift(); particles.push(p); }
  function dust(x, y, n, col, spread) {
    for (var i = 0; i < n; i++) addP({ t: 'dust', x: x + rand(-6, 6), y: y, vx: rand(-70, 30) - (spread || 0), vy: -rand(20, 80), g: 140, life: 0, max: rand(0.3, 0.55), r: rand(1.5, 3.6), col: col || '245,235,220' });
  }
  function chips(x, y, n, col) {
    for (var i = 0; i < n; i++) addP({ t: 'dust', x: x + rand(-14, 14), y: y + rand(-4, 8), vx: rand(-90, 90), vy: -rand(40, 150), g: 700, life: 0, max: rand(0.5, 0.9), r: rand(2, 4), col: col });
  }
  function sparks(x, y) {
    for (var i = 0; i < 8; i++) addP({ t: 'spark', x: x + rand(-8, 8), y: y, vx: rand(-40, 40), vy: rand(10, 70), g: 40, life: 0, max: rand(0.4, 0.7), r: rand(8, 15), col: '' });
  }
  function ring(x, y) { addP({ t: 'ring', x: x, y: y, vx: 0, vy: 0, g: 0, life: 0, max: 0.35, r: 0, col: '' }); }
  function fireflyRain() {
    for (var i = 0; i < 34; i++) addP({ t: 'spark', x: rand(0, view.W), y: view.H + rand(0, 30), vx: rand(-12, 12), vy: -rand(40, 110), g: 0, life: 0, max: rand(1.6, 2.6), r: rand(10, 20), col: '' });
  }
  function doShake(a, d) { if (reduceMotion) return; shake.amp = a; shake.dur = d; shake.t = 0; }
  function doFlash(a, d) { if (reduceMotion) return; flash.a = a; flash.dur = d; flash.t = 0; }
  function say(text, big, sub) {
    // One message at a time: a big one replaces everything, small ones never cover a big one
    var i;
    if (big) messages.length = 0;
    else { for (i = 0; i < messages.length; i++) if (messages[i].big) return; messages.length = 0; }
    messages.push({ text: text, sub: sub || '', life: 0, max: big ? 2.4 : 1.6, big: !!big });
  }
  function platColor(type) {
    return type === 'log' || type === 'crumble' ? '176,138,94' : (type === 'moss' ? '125,170,135' : '168,176,160');
  }
  function screenY(h) { return view.wb - h; }

  /* ================================================================== */
  /* Simulation step                                                    */
  /* ================================================================== */
  function hurt(kind) {
    var f = run.fox;
    if (f.inv > 0 || state !== 'playing') return;
    f.inv = 0.85; f.kick = -470;
    run.streak = 0; run.flow = false; run.perfectPending = false;
    if (kind === 'branch') f.vh = Math.min(f.vh, -160); else f.vh = Math.max(f.vh, 220);
    var y = screenY(f.h + 12);
    chips(f.x + f.w / 2, y, 8, kind === 'crow' ? '40,30,60' : '90,150,80');
    doShake(6, 0.22); hitStop = 0.05; Sound.bonk();
  }

  function landOn(p, wasAir, hadFall) {
    var f = run.fox;
    f.h = p.top; f.vh = 0; f.grounded = true; f.jumping = false; f.bouncing = false; f.ground = p;
    if (wasAir) {
      if (hadFall < -220) {
        p.squash = 1; f.squash = 0.12;
        dust(f.x + f.w / 2, screenY(p.top), 6, platColor(p.type));
        doShake(2, 0.08); Sound.land();
      }
      if (!p.oneWay && p !== run.takeoffPlat) {
        if (run.perfectPending) {
          run.streak++;
          Sound.perfect(run.streak);
          if (run.streak >= 2) say('Perfect x' + run.streak);
          if (run.streak >= FLOW_STREAK && !run.flow) { run.flow = true; say('Flow!', true, 'Faster, and fireflies count double'); Sound.flow(); }
        } else if (run.tookGap) {
          run.streak = 0; run.flow = false;
        }
        run.perfectPending = false; run.tookGap = false;
      }
    }
    if (p.col && p.col.state === 0) { p.col.state = 1; p.col.t = 0; Sound.crack(); }
  }

  function findNextMain(p) {
    var P = run.platforms;
    for (var i = 0; i < P.length; i++) if (!P[i].oneWay && !P[i].dead && P[i].wx > p.wx) return P[i];
    return null;
  }

  function step() {
    var f = run.fox;
    var dying = state === 'dying';
    var mW = run.dist / PX_PER_M;
    run.speed = speedAt(mW, run.hard);
    run.flowK += ((run.flow ? FLOW_SPEED : 1) - run.flowK) * Math.min(1, STEP * 3);
    var v = run.speed * run.flowK;
    var scroll = v * STEP * (dying ? 0.3 : 1);
    run.cam += scroll;
    if (!dying) run.dist += scroll;
    mW = run.dist / PX_PER_M;
    var P = run.platforms, i, p;

    for (i = 0; i < P.length; i++) {
      p = P[i];
      p.x = p.wx - run.cam;
      if (p.squash > 0) p.squash = Math.max(0, p.squash - STEP * 5);
      if (p.mush && p.mush.sq > 0) p.mush.sq = Math.max(0, p.mush.sq - STEP * 3);
      if (p.col) {
        if (p.col.state === 1) {
          p.col.t += STEP * (dying ? 0.3 : 1);
          if (p.col.t >= T_COLLAPSE) {
            p.col.state = 2; p.dead = true;
            chips(p.x + p.w / 2, screenY(p.top), 10, '176,138,94');
            Sound.crumble();
          }
        }
      }
      if (p.dead) { p.fvy += 1500 * STEP; p.fall += p.fvy * STEP; }
    }
    while (P.length && P[0].x + P[0].w < -140) P.shift();
    fillTrack();
    for (i = run.pickups.length - 1; i >= 0; i--) if (run.pickups[i].wx - run.cam < -60) run.pickups.splice(i, 1);

    // Vertical motion
    var prevH = f.h;
    var g = f.bouncing ? G_FALL : ((f.vh > 0 && input.held && !dying) ? G_HOLD : G_FALL);
    f.vh = Math.max(-MAX_FALL, f.vh - g * STEP);
    if (!dying && f.jumping && !input.held && f.vh > CUT_V) f.vh = CUT_V;
    f.h += f.vh * STEP;
    if (f.inv > 0) f.inv = Math.max(0, f.inv - STEP);

    if (dying) { f.x -= scroll * 0.2; return; }

    input.buffer = Math.max(0, input.buffer - STEP);
    f.wallCd = Math.max(0, f.wallCd - STEP);
    var wasAirborne = !f.grounded;
    var hadFall = f.vh;
    f.grounded = false;
    f.pinned = false;

    // Horizontal: launch boost, wind, knock-back
    if (f.bouncing) f.x += BOUNCE_VX * STEP;
    if (wasAirborne && run.windV) f.x += run.windV * STEP;
    if (f.kick < 0) { f.x += f.kick * STEP; f.kick = Math.min(0, f.kick + 1800 * STEP); }
    if (f.x > view.W * 0.55) f.x = view.W * 0.55;

    // Collisions
    var left = f.x + 4, right = f.x + f.w - 4;
    for (i = 0; i < P.length; i++) {
      p = P[i];
      if (p.dead) continue;
      if (right <= p.x || left >= p.x + p.w) continue;
      if (f.h >= p.top) continue;
      if (p.oneWay) {
        if (f.vh <= 0 && prevH >= p.top - 2) landOn(p, wasAirborne, hadFall);
        continue;
      }
      if (f.vh <= 0 && (prevH >= p.top - 2 || p.top - f.h <= STEP_UP)) {
        landOn(p, wasAirborne, hadFall);
      } else if (f.h < p.top - STEP_UP && f.h > p.top - p.bodyH - 8) {
        // Ran into the side of a platform
        if (run.hard || !WALL_GRAB) { die(); return; }
        f.pinned = true;
        f.x = p.x - f.w + 4;
        if (f.wallCd <= 0) {
          f.wallCd = 0.4;
          f.vh = Math.max(f.vh, 260);
          run.streak = 0; run.flow = false; run.perfectPending = false;
          dust(f.x + f.w, screenY(f.h) - 12, 8, platColor(p.type), 40);
          doShake(5, 0.2); hitStop = 0.06; Sound.wall();
        }
      }
    }

    // Recover horizontal position after a bump
    if (!f.pinned && !f.bouncing && f.kick === 0 && f.x < view.baseX) f.x = Math.min(view.baseX, f.x + 140 * STEP);
    if (f.grounded && f.x > view.baseX) f.x = Math.max(view.baseX, f.x - 140 * STEP);

    // Mushrooms, brambles, low branches
    left = f.x + 4; right = f.x + f.w - 4;
    for (i = 0; i < P.length; i++) {
      p = P[i];
      if (p.dead || p.x > view.W + 50 || p.x + p.w < -50) continue;
      if (p.mush && !f.bouncing && f.vh <= 100) {
        var pm = p.mush, px0 = p.x + pm.ox, cx = f.x + f.w / 2;
        if (cx >= px0 + pm.w * 0.35 && cx <= px0 + pm.w && f.h <= p.top + pm.h + 12 && f.h >= p.top - 6) {
          f.vh = BOUNCE_V; f.bouncing = true; f.grounded = false; f.jumping = false; f.coyote = 0; input.buffer = 0;
          run.takeoffPlat = p; run.tookGap = false; run.perfectPending = false;
          pm.sq = 1;
          ring(cx, screenY(p.top + pm.h)); sparks(cx, screenY(p.top + pm.h)); Sound.boing();
        }
      }
      if (p.bramble && f.inv <= 0) {
        var b = p.bramble, bx0 = p.x + b.ox + 6, bx1 = p.x + b.ox + b.w - 6;
        if (right > bx0 && left < bx1 && f.h < p.top + b.h * 0.8 && f.h + f.hh > p.top) hurt('bramble');
      }
      if (p.branch && f.inv <= 0) {
        var br = p.branch, rx0 = p.x + br.ox, rx1 = rx0 + br.w;
        if (right > rx0 && left < rx1 && f.h + f.hh > p.top + br.bottom && f.h < p.top + br.bottom + 20) hurt('branch');
      }
    }

    // Fireflies
    var fcx = f.x + f.w / 2, fcy = f.h + f.hh / 2;
    for (i = 0; i < run.pickups.length; i++) {
      var pk = run.pickups[i];
      if (pk.taken) continue;
      if (Math.abs(pk.wx - run.cam - fcx) < 26 && Math.abs(pk.h - fcy) < 30) {
        pk.taken = true;

      }

    // Crows and wind
    updateEvents(v, mW);
    for (i = run.crows.length - 1; i >= 0; i--) {
      var c = run.crows[i];

      if (c.x < -60) { run.crows.splice(i, 1); continue; }
      if (f.inv <= 0 && c.x < view.W + 10 && right > c.x - 15 && left < c.x + 15 && f.h < c.h + 18 && f.h + f.hh > c.h - 2) hurt('crow');

    if (f.grounded || f.pinned) f.coyote = COYOTE; else f.coyote = Math.max(0, f.coyote - STEP);

    if (input.buffer > 0 && f.coyote > 0 && !f.bouncing) {
      var P0 = f.ground && f.grounded ? f.ground : run.lastGround;
      if (f.pinned) P0 = null;
      f.vh = JUMP_V; f.coyote = 0; input.buffer = 0; f.jumping = true; f.grounded = false;
      run.perfectPending = false; run.tookGap = false; run.takeoffPlat = P0 || null;

      f.phase += run.speed * 0.055 * STEP;
      f.dustT -= STEP;
      if (f.dustT <= 0) { f.dustT = 0.13; dust(f.x + 2, screenY(f.h), 1, '245,235,220', run.speed * 0.15); }
    }
    if (f.squash > 0) f.squash = Math.max(0, f.squash - STEP);

    // Milestones, times of day
    var tn = Math.floor(mW / TIER_METERS);
    if (tn > tierTarget) {
      tierTarget = tn;
      run.milestone = Math.floor(mW / 100);
      var ti = TIERS[tn % TIERS.length];
      say(ti.name, true, ti.sub);
      fireflyRain(); Sound.tier();
    } else {
      var mi = Math.floor(mW / 100);
      if (mi > run.milestone) { run.milestone = mi; say(fmt(mi * 100) + ' m'); Sound.milestone(); }
    }

    // Defeat
    if (f.h < -Math.max(70, view.H - view.wb + 50) || f.x + f.w < 0) die();
  }

  /* Crows (from 400 m) and night gusts: scheduled by distance, so a seed gives the same events */
  function updateEvents(v, mW) {
    var f = run.fox;
    var fTier = ((Math.floor(mW / TIER_METERS) % 4) + 4) % 4;
    // Surges after 2000 m
    var sg = surgeAt(mW) > 1.02;
    if (sg && !run.surging) { say('Surge!', false); }
    run.surging = sg;
    // Wind at night
    var G = run.gust;
    if (fTier === 3) {
      if (G.t < 0 && mW >= G.next) {
        G.t = 0; G.dur = 1.7; G.amp = (run.rngE() < 0.5 ? -1 : 1) * (35 + 35 * run.rngE());
        say(G.amp < 0 ? 'Headwind' : 'Tailwind'); Sound.gust();
      }
      if (G.t >= 0) {
        G.t += STEP; run.windV = G.amp * Math.sin(Math.PI * Math.min(1, G.t / G.dur));
        if (G.t >= G.dur) { G.t = -1; G.next = mW + 20 + 18 * run.rngE(); run.windV = 0; }
      }
    } else { G.t = -1; run.windV = 0; if (G.next < mW) G.next = mW + 6 + 8 * run.rngE(); }
    // Crows
    if (mW >= run.nextCrowM - 3 && run.crows.length === 0) {
      var vc = v + 240, x0 = view.W + 0.9 * vc;
      var tArr = (x0 - (f.x + f.w / 2)) / vc;
      var worldArr = run.cam + view.baseX + f.w / 2 + v * tArr;
      var P = run.platforms;
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        if (p.oneWay || p.dead || p.col || p.mush || p.bramble) continue;
        if (worldArr > p.wx + 220 && worldArr < p.wx + p.w - 160) {
          run.crows.push({ x: x0, h: p.top + 8, vx: vc, t: 0 });
          Sound.caw();
          run.nextCrowM = mW + lerp(90, 45, clamp(mW / 2500, 0, 1)) * (0.8 + 0.4 * run.rngE());
          break;
        }
      }
    }
  }

  function die() {
    if (state !== 'playing') return;
    state = 'dying';
    dyingT = 0.8;

  function post(msg) { try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {} }

  /* Sent as soon as the run ends (so nothing is lost if the player leaves from the
     game over screen), and again only if a revive leads to a better distance.
     The site keeps the best score per player, so a second message is harmless.
     Classic and Hard have their own leaderboard modes. The daily run stays local
     unless DAILY_MODE_KEY is set. */
  function flushScore() {
    if (!run) return;
    var m = meters();
    if (m <= 0 || m <= (run.sentScore || 0)) return;
    var mode = run.mode === 'hard' ? 'hard' : (run.mode === 'daily' ? DAILY_MODE_KEY : 'classic');
    if (!mode) return;
    run.sentScore = m;
    post({ type: SCORE_EVENT, game: GAME_ID, mode: mode, score: m, scoreLabel: fmt(m) + ' m' });
  }

  function medalFor(m) {
    if (m >= 1000) return { key: 'crown', label: 'Ivy crown' };
    if (m >= 500) return { key: 'star', label: 'Shooting star' };
    if (m >= 250) return { key: 'flower', label: 'Moon flower' };
    if (m >= 100) return { key: 'clover', label: 'Four-leaf clover' };
    return { key: 'leaf', label: 'Oak leaf' };
  }

  function drawMedal(cv, key) {
    var c = cv.getContext('2d'), S = cv.width / 72;
    c.setTransform(S, 0, 0, S, 0, 0);
    c.clearRect(0, 0, 72, 72);
    drawGlow(c, 36, 36, 72, 0.6);
    var g = c.createRadialGradient(30, 28, 4, 36, 36, 28);
    g.addColorStop(0, '#FFF8E4'); g.addColorStop(1, '#EAD9B4');
    c.fillStyle = g; c.beginPath(); c.arc(36, 36, 26, 0, TAU); c.fill();
    c.strokeStyle = '#C4A67E'; c.lineWidth = 2; c.stroke();
    c.save(); c.translate(36, 36);
    var i;
    if (key === 'leaf') {
      c.rotate(-0.6); c.fillStyle = '#7DAA87'; ellipse(c, 0, 0, 9, 15);
      c.strokeStyle = '#5E8A69'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(0, -13); c.lineTo(0, 14); c.stroke();
    } else if (key === 'clover') {
      c.fillStyle = '#7DAA87';
      for (i = 0; i < 4; i++) { c.beginPath(); c.arc(Math.cos(i * TAU / 4 + 0.785) * 7, Math.sin(i * TAU / 4 + 0.785) * 7, 7, 0, TAU); c.fill(); }
      c.strokeStyle = '#5E8A69'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, 2); c.lineTo(3, 17); c.stroke();
    } else if (key === 'flower') {
      c.fillStyle = '#FFFFFF'; c.strokeStyle = '#C7D3E4'; c.lineWidth = 1;
      for (i = 0; i < 6; i++) { c.save(); c.rotate(i * TAU / 6); c.beginPath(); c.ellipse(0, -9, 5, 9, 0, 0, TAU); c.fill(); c.stroke(); c.restore(); }
      c.fillStyle = '#F4D58D'; c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.fill();
    } else if (key === 'star') {
      c.fillStyle = '#F4D58D'; c.strokeStyle = '#D9B45E'; c.lineWidth = 1.4;
      c.beginPath();
      for (i = 0; i < 10; i++) { var r = i % 2 ? 6.5 : 16, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill(); c.stroke();
    } else {
      c.fillStyle = '#7DAA87';
      for (i = 0; i < 8; i++) { c.save(); c.rotate(i * TAU / 8); c.beginPath(); c.ellipse(0, -13, 4, 7, 0, 0, TAU); c.fill(); c.restore(); }
      c.fillStyle = '#F4D58D'; c.beginPath(); c.arc(0, 0, 6, 0, TAU); c.fill();
    }
    c.restore();
  }

  function skinUnlocked(s) { return lifeFF >= s.need; }
  (function () {

  })();

  /* ---------------- challenge links ---------------- */
  function readParams() {
    var qs = '';
    try { qs = window.parent.location.search; } catch (e) {}
    if (!qs) qs = window.location.search;
    var o = {};
    String(qs).replace(/^\?/, '').split('&').forEach(function (kv) {
      var a = kv.split('=');
      if (a[0]) o[a[0]] = decodeURIComponent(a[1] || '');
    });
    return o;
  }
  (function () {
    var o = readParams();
    var seed = parseInt(o.c, 36), score = parseInt(o.s, 10);
    if (isFinite(seed) && isFinite(score) && score > 0) challenge = { seed: seed >>> 0, score: score, mode: o.m === 'h' ? 'hard' : 'classic' };
  })();

  function shareRun() {
    var m = meters();
    var url = SITE_URL + '?c=' + run.seed.toString(36) + '&s=' + m + '&m=' + (run.mode === 'hard' ? 'h' : 'c');
    var text = 'I ran ' + fmt(m) + ' m in Fox Runner' + (run.mode === 'hard' ? ' (Hard mode)' : '') + '. Can you beat me?';
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text + ' ' + url).then(function () { toast('Challenge link copied'); }, function () { toast(url); });
      } else toast(url);
    }
    if (navigator.share) { navigator.share({ title: 'Fox Runner', text: text, url: url }).catch(function (e) { if (!e || e.name !== 'AbortError') copy(); }); }
    else copy();

  function showGameOver() {

    var m = meters(), mode = run.mode, prev = bests[mode] || 0, notes = [];
    if (m > prev) {
      bests[mode] = m;
      store(mode === 'classic' ? 'best' : (mode === 'hard' ? 'best-hard' : 'daily-' + todayKey()), m);
      if (prev > 0) notes.push('New best!');

    el.medalLabel.textContent = md.label;
    el.finalScore.textContent = fmt(m);
    el.finalBest.textContent = fmt(bests[mode]) + ' m' + (mode === 'hard' ? ' (Hard)' : (mode === 'daily' ? ' (Daily)' : ''));
    if (run.ff > 0) notes.push('+' + run.ff + ' fireflies collected');
    SKINS.forEach(function (s) { if (s.need > run.ff0 && s.need <= lifeFF) notes.push('New skin unlocked: ' + s.name); });
    if (run.chal) notes.push(m > run.chal.score ? 'You beat the challenge (' + fmt(run.chal.score) + ' m)!' : (fmt(run.chal.score - m) + ' m short of the challenge (' + fmt(run.chal.score) + ' m)'));

  function hillY(x, seed, amp) {
    return Math.sin(x * 0.0042 + seed) * amp + Math.sin(x * 0.011 + seed * 2.3) * amp * 0.4;
  }
  function drawHills(c, off, seed, base, amp, color) {
    var W = view.W, H = view.H;
    c.fillStyle = color;
    c.beginPath(); c.moveTo(-12, H);
    for (var x = -12; x <= W + 10; x += 10) c.lineTo(x, view.wb - 360 * (1 - base) + hillY(x + off, seed, amp));
    c.lineTo(W + 10, H); c.closePath(); c.fill();
  }
  function drawTrees(c, off, seed, base, amp, spacing, size, canopy, trunk) {
    var W = view.W, H = view.H;
    var n0 = Math.floor(off / spacing) - 1, n1 = Math.floor((off + W) / spacing) + 1;
    for (var n = n0; n <= n1; n++) {
      var wx = n * spacing + hash(n + seed) * spacing * 0.6;
      var sx = wx - off;
      var gy = view.wb - 360 * (1 - base) + hillY(wx, seed, amp) + 4;
      var s = size * (0.8 + hash(n * 3 + seed) * 0.5);
      var th = s * 1.35;
      c.fillStyle = trunk;
      c.fillRect(sx - s * 0.06, gy - th, s * 0.12, th + 6);
      c.fillStyle = canopy;
      c.beginPath(); c.arc(sx, gy - th - s * 0.1, s * 0.62, 0, TAU); c.fill();
      c.beginPath(); c.arc(sx - s * 0.42, gy - th + s * 0.15, s * 0.42, 0, TAU); c.fill();
      c.beginPath(); c.arc(sx + s * 0.44, gy - th + s * 0.12, s * 0.44, 0, TAU); c.fill();
    }
  }
  function drawCloud(c, x, y, s, a) {
    c.fillStyle = 'rgba(255,255,255,' + a + ')';
    ellipse(c, x, y, 34 * s, 11 * s); ellipse(c, x + 22 * s, y - 8 * s, 24 * s, 13 * s); ellipse(c, x - 22 * s, y - 4 * s, 22 * s, 10 * s);
  }

  function drawBackground(c, scroll) {
    var W = view.W, H = view.H, i;

    c.strokeStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')'; c.lineWidth = 2; c.lineCap = 'round';
    for (var i = 0; i < 14; i++) {
      var x = ((hash(i + 900) * (view.W + 200) + time * 320 * dir * (0.6 + hash(i + 910))) % (view.W + 200) + (view.W + 200)) % (view.W + 200) - 100;
      var y = view.H * (0.15 + 0.75 * hash(i + 920)), l = 30 + 40 * hash(i + 930);
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + dir * l, y); c.stroke();
    }
  }

  function drawNight(c) {
    if (tp.night < 0.05 || !run) return;
    var f = run.fox, fx = f.x + f.w / 2, fy = screenY(f.h + 14), R0 = Math.max(view.W * 0.3, 210);
    var g = c.createRadialGradient(fx, fy, R0 * 0.55, fx, fy, R0 * 1.7);
    g.addColorStop(0, 'rgba(8,12,40,0)'); g.addColorStop(1, 'rgba(8,12,40,' + (0.58 * tp.night).toFixed(3) + ')');
    c.fillStyle = g; c.fillRect(-20, -20, view.W + 40, view.H + 40);
  }

  /* ================================================================== */
  /* Particles, HUD, frame                                              */
  /* ================================================================== */
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  function drawParticles(c) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i], t = p.life / p.max;
      if (p.t === 'dust') { c.fillStyle = 'rgba(' + p.col + ',' + ((1 - t) * 0.6).toFixed(3) + ')'; c.beginPath(); c.arc(p.x, p.y, p.r * (1 + t * 0.4), 0, TAU); c.fill(); }
      else if (p.t === 'spark') { drawGlow(c, p.x, p.y, p.r * 2, (t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8) * 0.9); }
      else if (p.t === 'ring') { c.strokeStyle = 'rgba(255,248,220,' + ((1 - t) * 0.7).toFixed(3) + ')'; c.lineWidth = 2; c.beginPath(); c.ellipse(p.x, p.y, 8 + t * 22, 2 + t * 5, 0, 0, TAU); c.stroke(); }
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawPill(c, cx, cy, text, opts) {
    opts = opts || {};
    c.font = 'italic 700 13px Georgia, "Noto Serif", serif';
    var tw = c.measureText(text).width, w = tw + 22 + (opts.icon ? 18 : 0), h = 22, x = cx - w / 2, y = cy - h / 2;
    roundRect(c, x, y, w, h, 11);
    c.fillStyle = opts.fill || 'rgba(251,244,229,0.88)'; c.fill();
    c.strokeStyle = opts.stroke || 'rgba(196,166,126,0.9)'; c.lineWidth = 1.2; c.stroke();
    var tx = x + 11;
    if (opts.icon) { drawGlow(c, x + 15, cy, 22, 0.9); c.fillStyle = '#FFF6D6'; c.beginPath(); c.arc(x + 15, cy, 2.2, 0, TAU); c.fill(); tx += 15; }
    c.fillStyle = opts.color || '#5C4638'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(text, tx, cy + 1);
    return w;
  }

  function drawHud(c) {
    var W = view.W;
    var text = fmt(meters()) + ' m';
    c.font = 'italic 800 24px Georgia, "Noto Serif", "Times New Roman", serif';
    var tw = c.measureText(text).width;
    var pw = tw + 52, ph = 40, px = W / 2 - pw / 2, py = 10;
    roundRect(c, px, py, pw, ph, 12);
    c.fillStyle = 'rgba(251,244,229,0.92)'; c.fill();
    c.strokeStyle = run.flow ? 'rgba(240,170,40,1)' : 'rgba(196,166,126,0.9)'; c.lineWidth = run.flow ? 2.2 : 1.2; c.stroke();
    var pulse = 0.65 + 0.35 * Math.abs(Math.sin(time * 3));
    drawGlow(c, px + 20, py + ph / 2, 30, pulse);
    c.fillStyle = '#FFF6D6'; c.beginPath(); c.arc(px + 20, py + ph / 2, 3.2, 0, TAU); c.fill();
    c.fillStyle = '#5C4638'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(text, px + 38, py + ph / 2 + 1);
    var tag = run.mode === 'hard' ? ' | Hard' : (run.mode === 'daily' ? ' | Daily' : '');
    var bt = 'Best ' + fmt(Math.max(bests[run.mode] || 0, meters())) + ' m' + tag;
    c.font = 'italic 700 12px Georgia, "Noto Serif", serif';
    c.textAlign = 'center';
    var night = tp.night > 0.5;
    c.lineWidth = 3; c.strokeStyle = night ? 'rgba(10,14,40,0.6)' : 'rgba(255,255,255,0.65)';
    c.strokeText(bt, W / 2, py + ph + 12);
    c.fillStyle = night ? '#F5EBDC' : '#5C4638';
    c.fillText(bt, W / 2, py + ph + 12);
    // chips: fireflies, perfect streak, flow
    var items = [];
    items.push({ t: 'x' + run.ff, o: { icon: true } });
    if (run.streak >= 2) items.push({ t: 'Perfect x' + run.streak, o: {} });
    if (run.flow) items.push({ t: 'FLOW', o: { fill: 'rgba(255,214,110,0.95)', stroke: 'rgba(214,140,20,1)', color: '#5A3300' } });
    var total = 0, i, widths = [];
    for (i = 0; i < items.length; i++) { c.font = 'italic 700 13px Georgia, "Noto Serif", serif'; widths[i] = c.measureText(items[i].t).width + 22 + (items[i].o.icon ? 18 : 0); total += widths[i] + 6; }
    var cx = W / 2 - total / 2 + 3;
    for (i = 0; i < items.length; i++) { drawPill(c, cx + widths[i] / 2, py + ph + 36, items[i].t, items[i].o); cx += widths[i] + 6; }
  }
  function drawDanger(c) {
    var f = run.fox;
    var d = clamp((view.baseX - f.x) / (view.baseX + 10), 0, 1);
    if (d < 0.12) return;
    var g = c.createLinearGradient(0, 0, 150, 0);
    g.addColorStop(0, 'rgba(200,70,60,' + (0.5 * d).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(200,70,60,0)');
    c.fillStyle = g; c.fillRect(0, 0, 150, view.H);
  }
  function drawMessages(c) {
    for (var i = messages.length - 1; i >= 0; i--) {
      var m = messages[i], t = m.life / m.max;
      var a = t < 0.15 ? t / 0.15 : (t > 0.7 ? (1 - t) / 0.3 : 1);
      c.globalAlpha = clamp(a, 0, 1);
      c.font = 'italic 800 ' + (m.big ? 34 : 22) + 'px Georgia, "Noto Serif", serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      var y = view.H * 0.3 + 40 - t * 14;
      c.lineWidth = 4; c.strokeStyle = 'rgba(92,70,56,0.55)'; c.strokeText(m.text, view.W / 2, y);
      c.fillStyle = '#FFF6D6'; c.fillText(m.text, view.W / 2, y);
      if (m.sub) {
        c.font = 'italic 700 16px Georgia, "Noto Serif", serif';
        c.strokeText(m.sub, view.W / 2, y + 26); c.fillText(m.sub, view.W / 2, y + 26);
      }
    }
    c.globalAlpha = 1;
  }

  function render() {
    var c = ctx, k = view.s * view.dpr;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.setTransform(k, 0, 0, k, 0, 0);
    var playing = run && state !== 'menu';
    var scroll = playing ? run.cam : menuScroll;
    if (shake.amp > 0) {
      var q = 1 - shake.t / shake.dur;
      c.translate((Math.random() - 0.5) * shake.amp * q, (Math.random() - 0.5) * shake.amp * q);
    }
    drawBackground(c, scroll);
    if (playing) {
      var i, P = run.platforms, f = run.fox;
      for (i = 0; i < P.length; i++) if (P[i].type !== 'slab') drawPlatform(c, P[i]);
      for (i = 0; i < P.length; i++) if (P[i].type === 'slab') drawPlatform(c, P[i]);
      drawFeatures(c);
      var mode = f.grounded || f.pinned ? 'run' : 'air';
      var sx = 1, sy = 1, tilt = 0;
      if (f.squash > 0) { var tt = 1 - f.squash / 0.12; sx = 1 + 0.25 * (1 - tt); sy = 0.8 + 0.2 * tt; }
      else if (f.vh > 200) { sx = 0.92; sy = 1.12; tilt = -0.08; }
      else if (f.vh < -300) { sx = 1.05; sy = 0.95; tilt = 0.18; }
      c.save();
      c.translate(f.x + f.w / 2, screenY(f.h));
      if (run.flow) drawGlow(c, 0, -16, 130, 0.55 + 0.2 * Math.sin(time * 8));
      if (f.inv > 0 && Math.floor(time * 18) % 2 === 0) c.globalAlpha = 0.4;
      drawFox(c, { t: time, phase: f.phase, mode: mode, vh: f.vh, sx: sx, sy: sy, tilt: tilt, halo: tp.night, blink: false });
      c.restore();
      for (i = 0; i < run.crows.length; i++) drawCrow(c, run.crows[i]);
      drawParticles(c);
      drawWind(c);
    }
    drawAmbientFront(c, scroll);
    if (playing) {
      drawNight(c);
      drawPickups(c);
      if (state === 'playing') drawDanger(c);
      drawHud(c); drawMessages(c);
    }
    c.setTransform(k, 0, 0, k, 0, 0);
    if (flash.a > 0) {
      c.fillStyle = 'rgba(255,255,255,' + (flash.a * (1 - flash.t / flash.dur)).toFixed(3) + ')';
      c.fillRect(0, 0, view.W, view.H);
    }
  }

  /* Menu fox (idle, blinking, with a firefly circling) */
  var menuCtx = el.menuFox.getContext('2d');
  function drawMenuFox() {
    var c = menuCtx, w = el.menuFox.width, h = el.menuFox.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    var s = w / 240;
    c.setTransform(s * 2.3, 0, 0, s * 2.3, w * 0.56, h * 0.82);
    c.fillStyle = 'rgba(92,70,56,0.18)'; ellipse(c, 0, 4, 34, 5);
    drawFox(c, { t: time, phase: 0, mode: 'idle', sx: 1, sy: 1 + Math.sin(time * 2) * 0.012, tilt: 0, blink: (time % 3.4) < 0.14, halo: 0.6 });
    var fx = Math.cos(time * 1.3) * 34 + 8, fy = -30 + Math.sin(time * 2.1) * 12;
    drawGlow(c, fx, fy, 15, 0.6 + 0.4 * Math.sin(time * 5) * Math.sin(time * 5));
  }

  var last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    time += dt;
    el.pauseBtn.classList.toggle('idle', state !== 'playing');

    if (shake.amp > 0) { shake.t += dt; if (shake.t >= shake.dur) shake.amp = 0; }
    if (flash.a > 0) { flash.t += dt; if (flash.t >= flash.dur) flash.a = 0; }
    if (tierProgress < tierTarget) tierProgress = Math.min(tierTarget, tierProgress + dt / 2);
    else if (tierProgress > tierTarget) tierProgress = Math.max(tierTarget, tierProgress - dt / 2);
    tp = tierParams(tierProgress);

    if (state === 'menu') {
      menuScroll += 40 * dt;
      drawMenuFox();
    } else if (state === 'playing') {
      if (hitStop > 0) hitStop -= dt;
      else {
        acc += dt;
        var guard = 0;
        while (acc >= STEP && guard < 5) {
          step(); acc -= STEP; guard++;
          if (state !== 'playing' || hitStop > 0) break;
        }
        if (acc > STEP * 2) acc = 0;
      }
    } else if (state === 'dying') {
      acc += dt * 0.3;
      var g2 = 0;
      while (acc >= STEP && g2 < 3) { step(); acc -= STEP; g2++; }
      if (acc > STEP * 2) acc = 0;
      dyingT -= dt;
      if (dyingT <= 0) showGameOver();
    } else { acc = 0; }

    for (var i = messages.length - 1; i >= 0; i--) { messages[i].life += dt; if (messages[i].life >= messages[i].max) messages.splice(i, 1); }
    if (state !== 'paused') updateParticles(dt);
    render();
  }

  /* ================================================================== */
  /* Input                                                              */
  /* ================================================================== */
  function pressJump() { input.held = true; input.buffer = BUFFER; }
  function releaseJump() { input.held = false; }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Sound.unlock();
    if (state === 'playing') pressJump();
  }, false);
  window.addEventListener('pointerup', releaseJump, false);
  window.addEventListener('pointercancel', releaseJump, false);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

  function jumpKey(e) {
    var code = e.code || '';
    return code === 'Space' || code === 'ArrowUp' || code === 'KeyW';
  }
  function again() { flushScore(); startRun(run.mode, run.mode === 'daily' ? run.seed : undefined); }
  window.addEventListener('keydown', function (e) {
    Sound.unlock();
    var onButton = e.target && e.target.tagName === 'BUTTON';
    var code = e.code || '';
    if (code === 'KeyP' || code === 'Escape') {
      e.preventDefault();
      if (skinsOpen) closeSkins();
      else if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
      return;
    }
    if (state === 'playing' && jumpKey(e)) {
      e.preventDefault();
      if (!e.repeat) pressJump();
      return;
    }
    if (!onButton && !skinsOpen && (code === 'Space' || code === 'Enter')) {
      if (state === 'menu') { e.preventDefault(); startRun(); }
      else if (state === 'over' && performance.now() - overSince > 700) { e.preventDefault(); again(); }
    }
  }, false);
  window.addEventListener('keyup', function (e) { if (jumpKey(e)) releaseJump(); }, false);

  // Anything that takes focus away pauses the run
  window.addEventListener('blur', function () { input.held = false; if (state === 'playing') pauseGame(); }, false);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      input.held = false;
      if (state === 'playing') pauseGame();
      if (state === 'over') flushScore();
    }
  }, false);
  window.addEventListener('pagehide', function () { if (state === 'over' || state === 'dying') flushScore(); }, false);
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); }, false);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout, false);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);

  /* Buttons */
  function bind(node, fn) {
    node.addEventListener('pointerdown', function (e) { e.stopPropagation(); }, false);
    node.addEventListener('click', function () { Sound.unlock(); Sound.click(); fn(); }, false);
  }
  bind(el.playBtn, function () { startRun(); });
  bind(el.dailyBtn, function () { startRun('daily', dailySeed()); });
  bind(el.hardBtn, function () { startRun('hard'); });
  bind(el.skinsBtn, openSkins);
  bind(el.skinsDone, closeSkins);
  bind(el.pauseBtn, pauseGame);
  bind(el.resumeBtn, resumeGame);
  bind(el.quitBtn, function () { flushScore(); showMenu(); });
  bind(el.againBtn, again);
  bind(el.shareBtn, shareRun);
  bind(el.menuBtn, function () { flushScore(); showMenu(); });
  bind(el.reviveBtn, function () {
    if (run.usedRevive) return;
    hide(el.over);
    state = 'ad';
    showRewardedAd(revive);
  });
  el.muteBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); }, false);
  el.muteBtn.addEventListener('click', function () { Sound.unlock(); Sound.toggleMute(); }, false);

  /* ================================================================== */
  /* Boot                                                               */
  /* ================================================================== */
  Sound.stateFn = function () {
    var mood = 0, flow = false;
    if (run && state !== 'menu') {
      mood = ((Math.floor(tierProgress + 0.5) % 4) + 4) % 4;
      flow = !!run.flow && state === 'playing';
    }
    return { mood: mood, flow: flow };
  };
  Sound.init();
  Sound.refreshButton();
  layout();
  refreshMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
