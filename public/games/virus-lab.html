/* ---------------- COMBAT ---------------- */
function drawBattle(dt){
  drawBackground();

  if(battle.running){
    battle.acc+=dt*1000;
    while(battle.acc>=TICK){battle.acc-=TICK;tickBattle();}
  }

  const c=census();
  const pRatio=c.p/c.total,eRatio=c.e/c.total;
  const v=D.virusList[D.selected];
  const pColor=v?v.color:C.cyan;
  const enemyColor=enemyColorFor(pColor);
  const enemyName=battle.arena?((battle.arenaOpponent&&battle.arenaOpponent.name)||'Opponent'):enemyAt(battle.level-1).name;
  const enemyLook=battle.arena?(battle.arenaOpponent&&battle.arenaOpponent.look):null;

  // === FICHE ENNEMI (carte 20% moins haute, virus 50% plus gros) ===
  const boxTop=arenaCY-arenaR;
  const ecTop=16;
  const ecHfull=(boxTop-38)-ecTop;      // hauteur précédente
  const ecH=Math.max(78,ecHfull*0.8);    // 20% moins haute
  const ecMidY=ecTop+ecH*0.42;
  panel(14,ecTop,W-28,ecH,C.red,'rgba(34,10,16,.95)',14);
  const eLook=enemyLook||{palette:'crimson',accent:'amber',spike:'triangle',spikeCount:12,core:'nucleus',body:'ridged'};
  drawStrain(66,ecMidY,45,eLook,T,{halo:false,detail:false});
  text(enemyName.toUpperCase(),120,ecMidY-16,19,enemyColor,'left','800',6);
  text(battle.arena?'ARENA CHALLENGER':'ENEMY',120,ecMidY+4,9.5,C.textDim,'left','700');
  // barre de % ennemi dans la carte
  const epw=110;
  rr(120,ecMidY+14,epw,7,3);ctx.fillStyle='rgba(80,20,26,.8)';ctx.fill();
  rr(120,ecMidY+14,epw*eRatio,7,3);ctx.fillStyle=enemyColor;ctx.fill();
  // gros % à droite
  text(Math.round(eRatio*100)+'%',W-38,ecMidY-4,32,enemyColor,'right','800',12);
  // rappel du génome ennemi (icônes) en bas de la carte
  {
    const ePat=battle.arena?((battle.arenaOpponent&&battle.arenaOpponent.genome)||[]):enemyAt(battle.level-1).pattern;
    const gs=16,gg=4;
    const gy=ecTop+ecH-gs-9;
    const gn=Math.min(ePat.length,Math.floor((W-52)/(gs+gg)));
    ePat.slice(0,gn).forEach((k,i)=>{
      const bx=28+i*(gs+gg);
      const ac=ACT_COLOR[k]||C.red;
      rr(bx,gy,gs,gs,4);ctx.fillStyle='rgba(52,14,20,.9)';ctx.fill();
      ctx.strokeStyle=ac;ctx.lineWidth=1;ctx.stroke();
      text(ACTIONS[k].icon,bx+gs/2,gy+gs/2,10,ac,'center','700');
    });
    if(ePat.length>gn)text('+'+(ePat.length-gn),28+gn*(gs+gg)+2,gy+gs/2,9,C.textDim,'left','700');
  }

  // Timer : bien AU-DESSUS de la boîte, dans l'espace dégagé (hors du cadre)
  const tt=Math.max(0,battle.timer);
  const urgent=tt<10;
  text(tt.toFixed(1)+'s',W/2,ecTop+ecH+22,22,urgent?C.red:C.gold,'center','800',urgent?12:6);

  // Arène
  drawChassis();
  ctx.save();
  ctx.beginPath();ctx.arc(arenaCX,arenaCY,arenaR,0,7);ctx.clip();
  const bg=ctx.createRadialGradient(arenaCX,arenaCY-arenaR*.3,arenaR*.1,arenaCX,arenaCY,arenaR);
  bg.addColorStop(0,'#0d2038');bg.addColorStop(1,'#050c18');
  ctx.fillStyle=bg;ctx.fillRect(arenaCX-arenaR,arenaCY-arenaR,arenaR*2,arenaR*2);

  // cellules — dessinées opaques et légèrement débordantes (ceil) pour ne
  // laisser AUCUNE couture sombre entre les carrés (bug des traits noirs).
  const cw=Math.ceil(cell)+1;
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(!valid[y][x])continue;
      const val=grid[gi(x,y)];
      if(!val)continue;
      const px=Math.floor(originX+x*cell),py=Math.floor(originY+y*cell);
      ctx.fillStyle=val===1?pColor:enemyColor;
      ctx.fillRect(px,py,cw,cw);
    }
  }

  // flashs de conversion (glow néon)
  for(let i=battle.flashes.length-1;i>=0;i--){
    const f=battle.flashes[i];
    f.t-=dt*3.2;
    if(f.t<=0){battle.flashes.splice(i,1);continue;}
    const px=Math.floor(originX+f.x*cell),py=Math.floor(originY+f.y*cell);
    ctx.globalAlpha=f.t*.5;
    ctx.fillStyle=f.owner===1?pColor:enemyColor;
    ctx.fillRect(px-1,py-1,cw+2,cw+2);
  }
  ctx.globalAlpha=1;
  if(battle.flashes.length>500)battle.flashes.splice(0,battle.flashes.length-500);

  // têtes — discrètes : petit point centré, semi-transparent, sans glow lourd.
  // Elles suggèrent l'activité sans parasiter la lecture du territoire.
  const hs=Math.max(1.5,cell*0.55);
  const hoff=(cell-hs)/2;
  ctx.globalAlpha=0.5;
  ctx.fillStyle='#eaf7ff';
  for(const h of headsP){
    if(!inB(h.x,h.y))continue;
    ctx.fillRect(originX+h.x*cell+hoff,originY+h.y*cell+hoff,hs,hs);
  }
  ctx.fillStyle='#ffe4e4';
  for(const h of headsE){
    if(!inB(h.x,h.y))continue;
    ctx.fillRect(originX+h.x*cell+hoff,originY+h.y*cell+hoff,hs,hs);
  }
  ctx.globalAlpha=1;

  // scanlines
  ctx.fillStyle='rgba(0,0,0,.14)';
  for(let y=arenaCY-arenaR;y<arenaCY+arenaR;y+=3)ctx.fillRect(arenaCX-arenaR,y,arenaR*2,1);
  // reflet verre
  const gl=ctx.createLinearGradient(arenaCX-arenaR,arenaCY-arenaR,arenaCX,arenaCY);
  gl.addColorStop(0,'rgba(255,255,255,.10)');gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl;ctx.fillRect(arenaCX-arenaR,arenaCY-arenaR,arenaR*2,arenaR*2);
  ctx.restore();

  // === ANNEAU DE TERRITOIRE autour de la boîte (bas=joueur, haut=ennemi) ===
  drawTerritoryRing(arenaCX,arenaCY,arenaR,pRatio,eRatio,pColor,enemyColor);

  // === FICHE VIRUS JOUEUR (carte 20% moins haute, virus 50% plus gros) ===
  const boxBot=arenaCY+arenaR;
  const pcBot=H-16;
  const pcHfull=pcBot-(boxBot+22);        // hauteur précédente
  const pcH=Math.max(78,pcHfull*0.8);      // 20% moins haute
  const pcTop=pcBot-pcH;                    // ancrée en bas
  const pcMidY=pcTop+pcH*0.42;
  panel(14,pcTop,W-28,pcH,pColor,'rgba(8,22,44,.95)',14);
  if(v)drawStrain(66,pcMidY,45,v.look,T,{halo:false,detail:false});
  text(v?v.name.toUpperCase():'YOUR VIRUS',120,pcMidY-16,19,pColor,'left','800',5);
  text('YOUR VIRUS',120,pcMidY+4,9.5,C.textDim,'left','700');
  // barre de % joueur + gros %
  const ppw=110;
  rr(120,pcMidY+14,ppw,7,3);ctx.fillStyle='rgba(20,52,96,.8)';ctx.fill();
  rr(120,pcMidY+14,ppw*pRatio,7,3);ctx.fillStyle=pColor;ctx.fill();
  text(Math.round(pRatio*100)+'%',W-38,pcMidY-4,32,pColor,'right','800',10);
  // rappel du génome (icônes) en bas de la carte
  if(v){
    const gs=16,gg=4;
    const gy=pcTop+pcH-gs-9;
    const gn=Math.min(v.actions.length,Math.floor((W-52)/(gs+gg)));
    v.actions.slice(0,gn).forEach((k,i)=>{
      const bx=28+i*(gs+gg);
      const ac=ACT_COLOR[k]||pColor;
      rr(bx,gy,gs,gs,4);ctx.fillStyle='rgba(16,40,74,.9)';ctx.fill();
      ctx.strokeStyle=ac;ctx.lineWidth=1;ctx.stroke();
      text(ACTIONS[k].icon,bx+gs/2,gy+gs/2,10,ac,'center','700');
    });
    if(v.actions.length>gn)text('+'+(v.actions.length-gn),28+gn*(gs+gg)+2,gy+gs/2,9,C.textDim,'left','700');
  }

  if(battle.ended){
    drawBattleResult(c);
  }
}

function drawBattleResult(c){
  drawBackground();
  const win=battle.winner==='player';
  const draw=battle.winner==='draw';
  const loss=!win&&!draw;
  const col=win?'#4dffa6':(draw?C.gold:C.red);
  const r=D.lastReport;

  const top=8,visH=H-top;
  applyScrollPhysics();
  ctx.save();ctx.beginPath();ctx.rect(0,top,W,visH);ctx.clip();
  let y=top+8-scroll.y;

  // --- Bandeau résultat : TON virus à gauche, résultat au centre, ENNEMI à droite ---
  const pv=D.virusList[D.selected];
  const eColorR=enemyColorFor(pv?pv.color:C.cyan);
  const eName=battle.arena?((battle.arenaOpponent&&battle.arenaOpponent.name)||'Opponent'):enemyAt(battle.level-1).name;
  const eLookR=battle.arena?(battle.arenaOpponent&&battle.arenaOpponent.look):{palette:'crimson',accent:'amber',spike:'triangle',spikeCount:12,core:'nucleus',body:'ridged'};
  const bh=210;
  panel(16,y,W-32,bh,col,'rgba(6,16,34,.98)',16);
  if(win){
    rr(16,y,W-32,bh,16);ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.stroke();ctx.shadowBlur=0;
  }
  // virus joueur (gauche) et ennemi (droite)
  const sideY=y+62, lx=W*0.20, rx=W*0.80;
  if(pv)drawStrain(lx,sideY,40,pv.look,T,{halo:win}); else drawVirus(lx,sideY,36,col,13,T);
  drawStrain(rx,sideY,40,eLookR,T,{halo:false});
  // titre au centre
  text(win?'VICTORY':(draw?'DRAW':'DEFEAT'),W/2,y+56,30,col,'center','800',16);
  // % + nom sous chaque virus
  const pColBanner=pv?pv.color:col;
  text(Math.round(c.p/c.total*100)+'%',lx,y+116,24,pColBanner,'center','800',8);
  text((pv?pv.name:'you').slice(0,10),lx,y+138,10,C.textDim,'center','600');
  text(Math.round(c.e/c.total*100)+'%',rx,y+116,24,eColorR,'center','800',8);
  text(eName.slice(0,10),rx,y+138,10,C.textDim,'center','600');
  // ligne +DNA ... Level X unlocked (même carte, même ligne ; rien pour le niveau si défaite)
  const lineY=y+bh-30;
  const levelTxt=(win&&!battle.arena&&battle.level===D.progress-1)?('Level '+D.progress+' unlocked'):
                 (battle.arena?((win?'Beat ':(draw?'Tied ':'Lost to '))+eName):'');
  if(levelTxt){
    dnaLabel(W/2-70,lineY,'+'+battle.rewardGiven+' DNA',15,'center');
    text(levelTxt,W/2+64,lineY,12,win?'#4dffa6':C.textDim,'center','700',4);
  }else{
    dnaLabel(W/2,lineY,'+'+battle.rewardGiven+' DNA',15,'center');
  }
  y+=bh+22;

  if(r){
    // --- Courbe de territoire ---
    text('TERRITORY OVER TIME',24,y,11,C.textDim,'left','700');y+=18;
    const gx=24,gw=W-48,gh=130;
    panel(gx,y,gw,gh,'rgba(63,208,255,.2)','rgba(4,12,26,.9)',8);
    const hist=r.hist||[];
    if(hist.length>1){
      const maxV=Math.max(1,...hist.map(h=>Math.max(h.p,h.e)));
      const v=D.virusList[D.selected];
      const pc=v?paletteById(normaliseLook(v.look,0).palette).main:C.cyan;
      ctx.strokeStyle='rgba(63,208,255,.08)';ctx.lineWidth=1;
      for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(gx,y+gh*i/4);ctx.lineTo(gx+gw,y+gh*i/4);ctx.stroke();}
      const plot=(key,color)=>{
        ctx.beginPath();
        hist.forEach((h,i)=>{const px=gx+(i/(hist.length-1))*gw;const py=y+gh-(h[key]/maxV)*(gh-12)-6;
          i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
        ctx.strokeStyle=color;ctx.lineWidth=2.2;ctx.shadowColor=color;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
      };
      plot('p',pc);plot('e',eColorR);
      text('you',gx+8,y+14,10,pc,'left','700');
      text('enemy',gx+40,y+14,10,eColorR,'left','700');
    }
    y+=gh+22;

    // --- Diagnostic ---
    text('DIAGNOSIS',24,y,11,C.textDim,'left','700');y+=18;
    r.lines.forEach(l=>{
      ctx.font="500 12px 'Segoe UI',system-ui,sans-serif";
      const words=l.split(' ');const rows=[];let ln='';
      for(const wd of words){if(ctx.measureText(ln+wd).width>W-76){rows.push(ln);ln=wd+' ';}else ln+=wd+' ';}
      if(ln)rows.push(ln);
      const bhh=Math.max(42,14+rows.length*15);
      panel(20,y,W-40,bhh,'rgba(245,197,66,.22)','rgba(10,22,44,.9)',8);
      rows.forEach((rw,i)=>text(rw,32,y+19+i*15,12,C.text,'left','500'));
      y+=bhh+9;
    });
  }
  y+=12;

  // --- Boutons ---
  const wasArena=battle.arena;const arenaOpp=battle.arenaOpponent;
  button(24,y,(W-56)/2,50,'RETRY',()=>{
    const vv=D.virusList[D.selected];
    if(!vv||!vv.actions.length){notify('Invalid virus');sfx.err();return;}
    if(wasArena&&arenaOpp){startBattle(vv.actions.slice(),arenaOpp.genome.slice(),0);battle.arena=true;battle.arenaOpponent=arenaOpp;}
    else{startBattle(vv.actions.slice(),enemyAt(battle.level-1).pattern.slice(),battle.level);}
    page=P.BATTLE;sfx.click();
  },{size:15});
  button(24+(W-56)/2+8,y,(W-56)/2,50,win?'CONTINUE':'EDIT VIRUS',()=>{
    if(win)go(wasArena?P.ARENA:P.CAMPAIGN);
    else{editIndex=D.selected;go(P.EDITOR);}
  },{accent:win?'#4dffa6':C.cyan,size:15});
  y+=60;
  if(!win){
    button(24,y,W-48,42,wasArena?'BACK TO ARENA':'BACK TO CAMPAIGN',()=>{go(wasArena?P.ARENA:P.CAMPAIGN);},{accent:C.gold,size:13});
    y+=50;
  }

  ctx.restore();
  scroll.max=Math.max(0,(y+scroll.y)-H+40);
}

/* ---------------- DEBRIEF ---------------- */
function drawDebrief(dt){
  drawBackground();header('BATTLE REPORT',P.MAIN);
  const r=D.lastReport||D.lastDefeat;
  if(!r){
    text('No report available.',W/2,300,15,C.textDim,'center','600');
    return;
  }
  const won=r.won;
  const accent=won?'#4dffa6':C.red;
  const top=72,visH=H-top-8;
  applyScrollPhysics();
  ctx.save();ctx.beginPath();ctx.rect(0,top,W,visH);ctx.clip();
  let y=top+6-scroll.y;

  // --- Résultat / adversaire ---
  panel(16,y,W-32,84,accent,won?'rgba(10,34,22,.94)':'rgba(34,10,16,.94)',11);
  drawStrain(56,y+42,26,{palette:won?'mint':'crimson',accent:'amber',spike:'triangle',
                         spikeCount:12,core:'nucleus',body:'ridged'},T,{halo:false});
  text(won?'YOU DEFEATED':'DEFEATED BY',96,y+24,9.5,C.textDim,'left','700');
  text((r.enemy||'Enemy').toUpperCase(),96,y+45,20,accent,'left','800',8);
  const ctx2=(r.arena?'Arena':'Level '+r.level);
  text(ctx2+'  \u2022  '+r.pct+'% vs '+r.epct+'%',96,y+66,11,C.textDim,'left','600');
  y+=94;

  // --- Génome ennemi DANS sa propre carte (intégré, sans débordement) ---
  const ep=r.enemyPattern||[];
  const es=40,eg=6;
  const perRow=Math.floor((W-52)/(es+eg));
  const rows=Math.max(1,Math.ceil(ep.length/perRow));
  const gcH=28+rows*(es+16);
  panel(16,y,W-32,gcH,C.red,'rgba(30,10,16,.9)',12);
  text('ENEMY GENOME',30,y+18,10.5,C.textDim,'left','700');
  ep.forEach((k,i)=>{
    const col=i%perRow,row=(i/perRow)|0;
    const bx=30+col*(es+eg),by=y+28+row*(es+16);
    const ac=ACT_COLOR[k]||C.red;
    rr(bx,by,es,es,7);ctx.fillStyle='rgba(52,14,20,.92)';ctx.fill();
    ctx.strokeStyle=ac;ctx.lineWidth=1.4;ctx.stroke();
    text(ACTIONS[k].icon,bx+es/2,by+es/2-4,18,ac,'center','700',5);
    text(ACTIONS[k].name.slice(0,7),bx+es/2,by+es-8,6.5,C.textDim,'center','600');
  });
  y+=gcH+12;

  // --- Your genome ---
  const pp=r.playerPattern||[];
  if(pp.length){
    const ps=34,pg=5;
    const perRowP=Math.floor((W-52)/(ps+pg));
    const rowsP=Math.max(1,Math.ceil(pp.length/perRowP));
    const pcH=28+rowsP*(ps+8);
    const pcol=(D.virusList[D.selected]&&D.virusList[D.selected].color)||C.cyan;
    panel(16,y,W-32,pcH,pcol,'rgba(8,20,42,.9)',12);
    text('YOUR GENOME',30,y+18,10.5,C.textDim,'left','700');
    pp.forEach((k,i)=>{
      const col=i%perRowP,row=(i/perRowP)|0;
      const bx=30+col*(ps+pg),by=y+28+row*(ps+8);
      const ac=ACT_COLOR[k]||C.cyan;
      rr(bx,by,ps,ps,6);ctx.fillStyle='rgba(16,40,74,.9)';ctx.fill();
      ctx.strokeStyle=ac;ctx.lineWidth=1.1;ctx.stroke();
      text(ACTIONS[k].icon,bx+ps/2,by+ps/2,15,ac,'center','700');
    });
    y+=pcH+12;
  }

  // --- Territory curve ---
  text('TERRITORY OVER TIME',20,y,10.5,C.textDim,'left','700');
  y+=14;
  const gx=20,gw=W-40,gh=126;
  panel(gx,y,gw,gh,'rgba(63,208,255,.2)','rgba(4,12,26,.9)',8);
  const hist=r.hist||[];
  if(hist.length>1){
    const maxV=Math.max(1,...hist.map(h=>Math.max(h.p,h.e)));
    const v=D.virusList[D.selected];
    const pc=v?paletteById(normaliseLook(v.look,0).palette).main:C.cyan;
    ctx.strokeStyle='rgba(63,208,255,.08)';ctx.lineWidth=1;
    for(let i=1;i<4;i++){
      ctx.beginPath();ctx.moveTo(gx,y+gh*i/4);ctx.lineTo(gx+gw,y+gh*i/4);ctx.stroke();
    }
    const plot=(key,color)=>{
      ctx.beginPath();
      hist.forEach((h,i)=>{
        const px=gx+(i/(hist.length-1))*gw;
        const py=y+gh-(h[key]/maxV)*(gh-12)-6;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      });
      ctx.strokeStyle=color;ctx.lineWidth=2.2;
      ctx.shadowColor=color;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
    };
    plot('p',pc);plot('e',C.red);
    text('you',gx+8,y+14,10,pc,'left','700');
    text('enemy',gx+40,y+14,10,C.red,'left','700');
  }
  y+=gh+16;

  // --- Diagnosis ---
  text('DIAGNOSIS',20,y,10.5,C.textDim,'left','700');
  y+=16;
  r.lines.forEach(l=>{
    ctx.font="500 11.5px 'Segoe UI',system-ui,sans-serif";
    const words=l.split(' ');const rows=[];let line='';
    for(const wd of words){
      if(ctx.measureText(line+wd).width>W-76){rows.push(line);line=wd+' ';}
      else line+=wd+' ';
    }
    if(line)rows.push(line);
    const bh=Math.max(40,14+rows.length*15);
    panel(16,y,W-32,bh,'rgba(245,197,66,.25)','rgba(10,22,44,.9)',8);
    rows.forEach((rw,i)=>text(rw,28,y+18+i*15,11.5,C.text,'left','500'));
    y+=bh+8;
  });

  y+=4;
  button(20,y,W-40,46,'EDIT MY GENOME',()=>{
    editIndex=D.selected;go(P.EDITOR);
  },{accent:'#4dffa6'});
  y+=58;

  ctx.restore();
  scroll.max=Math.max(0,(y+scroll.y)-H+20);
}

/* ---------------- SCORES ---------------- */
function drawScores(dt){
  drawBackground();header('RECORDS',P.MAIN);
  const s=D.scores;
  const rows=[
    ['CAMPAIGN',null,null],
    ['Level reached',D.progress+'/30',C.cyan],
    ['Total wins',String(s.wins),C.cyan],
    ['Current streak',String(s.streak),C.gold],
    ['Best streak',String(s.bestStreak),C.gold],
    ['Best territory',s.best+'%','#4dffa6'],
    ['ARENA',null,null],
    ['Arena wins',String(D.arenaWins|0),'#4dffa6'],
    ['Arena losses',String(D.arenaLosses|0),C.red],
    ['Arena score',String(arenaScore()),C.dna],
    ['COLLECTION',null,null],
    ['Viruses created',String(D.virusList.length),C.cyan],
    ['Actions unlocked',D.unlocked.filter(k=>ACTIONS[k]).length+'/'+Object.keys(ACTIONS).length,'#c48bff'],
    ['Genome budget',slotBudget()+' slots',C.dna],
    ['DNA banked',String(D.dna),C.dna]
  ];
  const top=76,visH=H-top-8;
  applyScrollPhysics();
  ctx.save();ctx.beginPath();ctx.rect(0,top,W,visH);ctx.clip();
  let y=top+6-scroll.y;
  rows.forEach((r)=>{
    if(r[1]===null){
      // section header
      text(r[0],28,y+18,12,C.gold,'left','800',4);
      ctx.strokeStyle='rgba(245,197,66,.25)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(28,y+28);ctx.lineTo(W-28,y+28);ctx.stroke();
      y+=40;
    }else{
      panel(24,y,W-48,50,'rgba(63,208,255,.2)');
      text(r[0],44,y+27,14,C.textDim,'left','600');
      if(r[2]===C.dna){dnaLabel(W-44,y+27,r[1],20,'right');}
      else text(r[1],W-44,y+27,20,r[2],'right','800',8);
      y+=58;
    }
  });
  ctx.restore();
  scroll.max=Math.max(0,(y+scroll.y)-H+20);
}

/* ---------------- ENTRÉES ---------------- */
function toLocal(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return{x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H};
}
const SCROLLABLE=[P.VIRUSES,P.LAB,P.CAMPAIGN,P.DEBRIEF,P.APPEARANCE,P.ARENA,P.SCORES,P.ARENA_BOARD,P.EDITOR];

let pointerDown=false,downPos={x:0,y:0},downTime=0;

let activeSlider=null;
function onDown(x,y){
  initAudio();
  pointerDown=true;downPos={x,y};downTime=performance.now();
  activeSlider=null;
  for(let i=hitzones.length-1;i>=0;i--){
    const h=hitzones[i];
    if(h.slider&&x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){activeSlider=h;h.cb(x,y);break;}
  }
  scroll.dragging=(SCROLLABLE.includes(page)||(page===P.BATTLE&&battle.ended))&&!modal&&!keyboard&&!dialog;
  scroll.lastY=y;scroll.vel=0;scroll.moved=0;
}
function onMove(x,y){
  if(!pointerDown)return;
  if(activeSlider){activeSlider.cb(x,y);return;}
  const dy=y-scroll.lastY;
  scroll.moved+=Math.abs(dy);
  if(scroll.dragging){
    scroll.y-=dy;
    scroll.vel=-dy*0.85;
    scroll.y=Math.max(0,Math.min(scroll.max,scroll.y));
  }
  scroll.lastY=y;
}
function onUp(x,y){
  if(!pointerDown)return;
  pointerDown=false;scroll.dragging=false;
  if(activeSlider){activeSlider=null;return;}
  if(scroll.moved>12)return; // c'était un scroll, pas un tap
  // hit test en ordre inverse (dernier dessiné = au-dessus)
  for(let i=hitzones.length-1;i>=0;i--){
    const h=hitzones[i];
    if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.cb(x,y);return;}
  }
}

canvas.addEventListener('mousedown',e=>{const p=toLocal(e.clientX,e.clientY);onDown(p.x,p.y);});
canvas.addEventListener('mousemove',e=>{const p=toLocal(e.clientX,e.clientY);onMove(p.x,p.y);});
canvas.addEventListener('mouseup',e=>{const p=toLocal(e.clientX,e.clientY);onUp(p.x,p.y);});
canvas.addEventListener('mouseleave',()=>{pointerDown=false;scroll.dragging=false;});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.changedTouches[0];const p=toLocal(t.clientX,t.clientY);onDown(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();const t=e.changedTouches[0];const p=toLocal(t.clientX,t.clientY);onMove(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();const t=e.changedTouches[0];const p=toLocal(t.clientX,t.clientY);onUp(p.x,p.y);
},{passive:false});

canvas.addEventListener('wheel',e=>{
  if(!SCROLLABLE.includes(page))return;
  e.preventDefault();
  scroll.y=Math.max(0,Math.min(scroll.max,scroll.y+e.deltaY*0.6));
},{passive:false});

/* ---------------- BOUCLE ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;T+=dt;
  hitzones=[];

  switch(page){
    case P.MAIN:drawMain(dt);break;
    case P.VIRUSES:drawViruses(dt);break;
    case P.EDITOR:drawEditor(dt);break;
    case P.LAB:drawLab(dt);break;
    case P.APPEARANCE:drawAppearance(dt);break;
    case P.TUTORIAL:drawTutorial(dt);break;
    case P.CAMPAIGN:drawCampaign(dt);break;
    case P.INFO:drawInfo(dt);break;
    case P.BATTLE:drawBattle(dt);break;
    case P.DEBRIEF:drawDebrief(dt);break;
    case P.SCORES:drawScores(dt);break;
    case P.ARENA:drawArena(dt);break;
    case P.ARENA_PREVIEW:drawArenaPreview(dt);break;
    case P.ARENA_BOARD:drawArenaBoard(dt);break;
    default:drawMain(dt);
  }
  drawDialog();
  drawKeyboard(dt);
  drawNotif(dt);
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

// Nouvel onboarding guidé (surbrillances). Le jeu démarre sur le MENU.
// Un joueur qui n'a jamais joué (pas de virus) commence l'onboarding à l'étape 0.
if(typeof D.onb!=='number'){
  D.onb=(D.virusList&&D.virusList.length)?99:0; // 99 = terminé
}
D.tutorial=99; // ancien tutoriel désactivé
page=P.MAIN;

requestAnimationFrame(frame);
})();
</script>
