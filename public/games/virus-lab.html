let actx=null;
function initAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function beep(f,d,type='square',v=.05,slide=0){
  if(!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,actx.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),actx.currentTime+d);
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}

  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return r>150 && r>g+50 && r>b+50; // dominante rouge marquée
}

// Surbrillance pulsée : toutes les ~2s elle grossit de 5% puis revient.
// Renvoie true si l'élément est la cible courante.
function onbHighlight(id,x,y,w,h,rad){
  if(!onbTarget(id))return false;
  // cycle de 2s : 0->1 (grossit) puis retour ; échelle max +5%
  const cycle=(T%2)/2;                  // 0..1 sur 2 secondes
  const grow=Math.sin(cycle*Math.PI);   // 0->1->0 en douceur
  const scale=1+0.05*grow;              // jusqu'à +5%
  const cx=x+w/2, cy=y+h/2;
  const nw=w*scale, nh=h*scale;
  const nx=cx-nw/2, ny=cy-nh/2;
  const glow=0.5+0.5*Math.sin(T*3);
  rr(nx-3,ny-3,nw+6,nh+6,(rad||10)+2);
  ctx.strokeStyle=C.dna;ctx.lineWidth=2.6;
  ctx.shadowColor=C.dna;ctx.shadowBlur=12+glow*16;ctx.stroke();ctx.shadowBlur=0;
  return true;
}

/* ---------------- ARÈNE ---------------- */
const COLS=76,ROWS=76;
const arenaR=Math.min(W,H)*0.40;
const arenaCX=W/2,arenaCY=H/2;
const cell=(arenaR*2)/COLS;
const originX=arenaCX-arenaR,originY=arenaCY-arenaR;

const valid=[];let validTotal=0;
(function(){
  for(let y=0;y<ROWS;y++){
    valid[y]=[];
    for(let x=0;x<COLS;x++){
      const px=originX+x*cell+cell/2,py=originY+y*cell+cell/2;
      const ok=Math.hypot(px-arenaCX,py-arenaCY)<=arenaR-cell*0.9;
      valid[y][x]=ok;if(ok)validTotal++;
    }
  }
})();

const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const rot=(d,t)=>(d+t+4)%4;

const BATTLE_TIME=45;
const TICK=90;
const MAX_HEADS=90;
const HEAD_BUD=0.5;
const INFECT_RATE=0.10, INFECT_STEAL=0.038;
// Anti-boule-de-neige : le territoire fraîchement colonisé est fragile pendant
// FRESH_TIME ticks (l'adversaire le reprend bien plus facilement). Étaler trop
// vite crée un grand front vulnérable qui se fait grignoter.
const FRESH_TIME=13;
const INFECT_STEAL_FRESH=0.19;   // vol d'une case fraîche adverse (élevé)

let grid=null,shieldGrid=null,freshGrid=null,headsP=[],headsE=[];
let battle={
  running:false,ended:false,timer:BATTLE_TIME,winner:null,
  pPattern:null,ePattern:null,level:0,acc:0,
  flashes:[],history:[],peakEnemy:0,peakPlayer:0,firstLeadLost:null,
  rewardGiven:0
};

function initGrid(){
  grid=new Uint8Array(COLS*ROWS);
  shieldGrid=new Uint8Array(COLS*ROWS);
  freshGrid=new Uint8Array(COLS*ROWS);
}
const gi=(x,y)=>y*COLS+x;
const inB=(x,y)=>x>=0&&x<COLS&&y>=0&&y<ROWS&&valid[y][x];

function census(){
  let p=0,e=0;
  for(let i=0;i<grid.length;i++){const v=grid[i];if(v===1)p++;else if(v===2)e++;}
  return{p,e,total:validTotal};
}

function seed(owner,cx,cy,dir){
  const heads=owner===1?headsP:headsE;
  heads.push({x:cx,y:cy,dir:dir,idx:0});
  if(inB(cx,cy))grid[gi(cx,cy)]=owner;
}

function startBattle(playerPattern,enemyPattern,level){
  initGrid();headsP=[];headsE=[];
  battle.running=true;battle.ended=false;battle.timer=BATTLE_TIME;
  battle.winner=null;battle.pPattern=playerPattern;battle.ePattern=enemyPattern;
  battle.level=level;battle.acc=0;battle.flashes=[];battle.history=[];
  battle.peakEnemy=0;battle.peakPlayer=0;battle.firstLeadLost=null;battle.rewardGiven=0;battle.annihilation=false;
  battle.arena=false;battle.arenaOpponent=null;
  budAccum[1]=0;budAccum[2]=0;
  const mid=Math.floor(COLS/2);
  // Noyau de départ : 5 têtes orientées en éventail, croissance immédiate.
  const nucleus=[[0,0],[-2,0],[2,0],[0,-2],[0,2]];
  nucleus.forEach(([ox,oy],i)=>{
    seed(1,mid+ox,ROWS-13+oy,i===0?0:[0,3,1,0,2][i]);
    seed(2,mid+ox,12+oy,i===0?2:[2,1,3,2,0][i]);
  });
}

const budAccum={1:0,2:0};
function convert(owner,x,y,heads,pending,dir){
  if(!inB(x,y))return false;
  const k=gi(x,y);
  if(grid[k]===owner)return false;
  if(shieldGrid[k]>0&&grid[k]!==0&&grid[k]!==owner)return false;
  grid[k]=owner;
  freshGrid[k]=FRESH_TIME; // territoire fraîchement pris = fragile un instant
  battle.flashes.push({x,y,t:1,owner});
  budAccum[owner]+=HEAD_BUD;
  if(budAccum[owner]>=1&&heads.length+pending.length<MAX_HEADS){
    budAccum[owner]-=1;
    pending.push({x,y,dir:rot(dir,Math.random()<0.5?1:-1),idx:0});
  }
  return true;
}

function largestEmptyDir(h){
  let best=h.dir,bestC=-1;
  for(let d=0;d<4;d++){const[dx,dy]=DIRS[d];let c=0;
    for(let s=1;s<=12;s++){const nx=h.x+dx*s,ny=h.y+dy*s;
      if(!inB(nx,ny))break;if(grid[gi(nx,ny)]===0)c++;}
    if(c>bestC){bestC=c;best=d;}}
  return best;
}
function ownTerritoryDir(h,owner){
  let best=h.dir,bestC=-1;
  for(let d=0;d<4;d++){const[dx,dy]=DIRS[d];let c=0;
    for(let s=1;s<=8;s++){const nx=h.x+dx*s,ny=h.y+dy*s;
      if(!inB(nx,ny))break;if(grid[gi(nx,ny)]===owner)c++;}
    if(c>bestC){bestC=c;best=d;}}
  return best;
}
function nearestEnemyDir(h,owner){
  const foe=owner===1?2:1;
  let best=-1,bestD=1e9;
  for(let d=0;d<4;d++){
    const[dx,dy]=DIRS[d];
    for(let s=1;s<=14;s++){
      const nx=h.x+dx*s,ny=h.y+dy*s;
      if(!inB(nx,ny))break;
      if(grid[gi(nx,ny)]===foe){if(s<bestD){bestD=s;best=d;}break;}
    }
  }
  return best;
}

function doAction(owner,h,act,heads,pending){
  switch(act){
    case 'avancer':{
      const[dx,dy]=DIRS[h.dir];const nx=h.x+dx,ny=h.y+dy;
      if(inB(nx,ny)){convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}
      else h.dir=rot(h.dir,2);
      break;
    }
    case 'tournerG':h.dir=rot(h.dir,-1);break;
    case 'tournerD':h.dir=rot(h.dir,1);break;
    case 'reculer':{
      // recule d'une case selon l'orientation, sans pivoter, en colonisant la case
      const[dx,dy]=DIRS[h.dir];const nx=h.x-dx,ny=h.y-dy;
      if(inB(nx,ny)){convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}
      break;
    }
    case 'sauter':{
      const[dx,dy]=DIRS[h.dir];const nx=h.x+dx*2,ny=h.y+dy*2;
      if(inB(nx,ny)){convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}
      else h.dir=rot(h.dir,2);
      break;
    }
    case 'boost':{
      const[dx,dy]=DIRS[h.dir];
      for(let s=0;s<3;s++){
        const nx=h.x+dx,ny=h.y+dy;
        if(!inB(nx,ny)){h.dir=rot(h.dir,2);break;}
        convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;
      }
      break;
    }
    case 'acide':{
      const foe=owner===1?2:1;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const ax=h.x+dx,ay=h.y+dy;
        if(inB(ax,ay)&&grid[gi(ax,ay)]===foe)convert(owner,ax,ay,heads,pending,h.dir);
      }
      break;
    }
    case 'diviser':{
      const side=rot(h.dir,Math.random()<0.5?1:-1);
      const[sdx,sdy]=DIRS[side];const sx=h.x+sdx,sy=h.y+sdy;
      if(inB(sx,sy)&&heads.length+pending.length<MAX_HEADS){
        if(grid[gi(sx,sy)]!==owner){grid[gi(sx,sy)]=owner;battle.flashes.push({x:sx,y:sy,t:1,owner});}
        pending.push({x:sx,y:sy,dir:side,idx:0});
      }
      const[dx,dy]=DIRS[h.dir];const nx=h.x+dx,ny=h.y+dy;
      if(inB(nx,ny)){convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}
      else h.dir=rot(h.dir,2);
      break;
    }
    case 'muter':{
      const d=nearestEnemyDir(h,owner);
      if(d>=0)h.dir=d;else h.dir=rot(h.dir,1);
      // avance dans la foulée : la traque ne coûte plus un tour mort
      {const[dx,dy]=DIRS[h.dir];const nx=h.x+dx,ny=h.y+dy;
       if(inB(nx,ny)){convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}}
      break;
    }
    case 'dash':{
      const[dx,dy]=DIRS[h.dir];const foe=owner===1?2:1;
      for(let s=0;s<6;s++){
        const nx=h.x+dx,ny=h.y+dy;
        if(!inB(nx,ny)){h.dir=rot(h.dir,2);break;}
        const wasFoe=grid[gi(nx,ny)]===foe;
        convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;
        if(wasFoe)break;
      }
      break;
    }
    case 'sprint':{h.sprint=(h.sprint||0)+1;break;}
    case 'sense':{
      h.dir=largestEmptyDir(h);
      // avance de 2 cases vers l'espace ouvert : expansion optimisée, pas de tour mort
      {const[dx,dy]=DIRS[h.dir];
       for(let st=0;st<2;st++){const nx=h.x+dx,ny=h.y+dy;
         if(!inB(nx,ny)){h.dir=rot(h.dir,2);break;}
         convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}}
      break;
    }
    case 'retreat':{
      h.dir=ownTerritoryDir(h,owner);
      // avance vers son territoire ET pose un bouclier léger : repli défensif utile
      {const[dx,dy]=DIRS[h.dir];const nx=h.x+dx,ny=h.y+dy;
       if(inB(nx,ny)){convert(owner,nx,ny,heads,pending,h.dir);h.x=nx;h.y=ny;}}
      // renforce les cases autour (mini-bouclier) pour tenir une position
      for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
        const ax=h.x+ox,ay=h.y+oy;
        if(inB(ax,ay)&&grid[gi(ax,ay)]===owner)shieldGrid[gi(ax,ay)]=Math.max(shieldGrid[gi(ax,ay)],4);
      }
      break;
    }
    case 'corrode':{
      const foe=owner===1?2:1;const[dx,dy]=DIRS[h.dir];
      for(let s=1;s<=2;s++){const ax=h.x+dx*s,ay=h.y+dy*s;
        if(inB(ax,ay)&&grid[gi(ax,ay)]===foe)convert(owner,ax,ay,heads,pending,h.dir);}
      for(const pd of[rot(h.dir,1),rot(h.dir,-1)]){const[px,py]=DIRS[pd];
        const ax=h.x+px,ay=h.y+py;
        if(inB(ax,ay)&&grid[gi(ax,ay)]===foe)convert(owner,ax,ay,heads,pending,h.dir);}
      break;
    }
    case 'shield':{
      for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
        const ax=h.x+ox,ay=h.y+oy;
        if(inB(ax,ay)&&grid[gi(ax,ay)]===owner)shieldGrid[gi(ax,ay)]=8;
      }
      break;
    }
    case 'twin':{
      for(const side of[rot(h.dir,1),rot(h.dir,-1)]){
        const[sx,sy]=DIRS[side];const px=h.x+sx,py=h.y+sy;
        if(inB(px,py)&&heads.length+pending.length<MAX_HEADS){
          if(grid[gi(px,py)]!==owner){grid[gi(px,py)]=owner;battle.flashes.push({x:px,y:py,t:1,owner});}
          pending.push({x:px,y:py,dir:side,idx:0});
        }
      }
      break;
    }
    case 'burst':{
      const foe=owner===1?2:1;
      for(let ox=-2;ox<=2;ox++)for(let oy=-2;oy<=2;oy++){
        if(Math.abs(ox)+Math.abs(oy)>2)continue;
        const ax=h.x+ox,ay=h.y+oy;
        if(inB(ax,ay)&&grid[gi(ax,ay)]===foe)convert(owner,ax,ay,heads,pending,h.dir);
      }
      break;
    }
  }
}

function stepSide(owner,heads,pattern){
  if(!pattern||!pattern.length)return;
  const pending=[];
  for(let i=0;i<heads.length;i++){
    const h=heads[i];
    doAction(owner,h,pattern[h.idx%pattern.length],heads,pending);
    if(h.sprint>0){
      h.sprint--;
      h.idx=(h.idx+1)%pattern.length;
      doAction(owner,h,pattern[h.idx%pattern.length],heads,pending);
    }
    h.idx=(h.idx+1)%pattern.length;
  }
  for(const p of pending)heads.push(p);
  if(heads.length>MAX_HEADS)heads.length=MAX_HEADS;
  // Têtes bloquées (entourées de leur propre couleur) : réorientées, jamais tuées.
  for(let i=0;i<heads.length;i++){
    const h=heads[i];let stuck=true;
    for(const[dx,dy]of DIRS){
      const nx=h.x+dx,ny=h.y+dy;
      if(inB(nx,ny)&&grid[gi(nx,ny)]!==owner){stuck=false;break;}
    }
    if(stuck)h.dir=(Math.random()*4)|0;
  }
}

// Infection passive : chaque case possédée peut convertir un voisin.
// C'est ce qui garantit qu'une case colorée propage toujours le virus,
// même sans tête à proximité. Application simultanée pour éviter les cascades.
const infectBorn=[];
function infectStep(){
  infectBorn.length=0;
  for(let y=0;y<ROWS;y++){
    const row=y*COLS;
    for(let x=0;x<COLS;x++){
      const owner=grid[row+x];
      if(!owner||!valid[y][x])continue;
      for(let d=0;d<4;d++){
        const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
        if(!inB(nx,ny))continue;
        const nk=ny*COLS+nx;
        const t=grid[nk];
        if(t===owner)continue;
        if(t!==0&&shieldGrid[nk]>0)continue;
        let rate;
        if(t===0){rate=INFECT_RATE;}
        else{
          // voler une case adverse : bien plus facile si elle est FRAÎCHE (fragile)
          rate=freshGrid[nk]>0?INFECT_STEAL_FRESH:INFECT_STEAL;
        }
        if(Math.random()<rate)infectBorn.push(nk,owner);
      }
    }
  }
  for(let i=0;i<infectBorn.length;i+=2){
    const k=infectBorn[i],o=infectBorn[i+1];
    if(grid[k]!==o){
      grid[k]=o;
      freshGrid[k]=FRESH_TIME; // une case volée est elle aussi fraîche/fragile
      const bx=k%COLS,by=(k/COLS)|0;
      if(battle.flashes.length<600)battle.flashes.push({x:bx,y:by,t:.7,owner:o});
    }
  }
  for(let i=0;i<shieldGrid.length;i++)if(shieldGrid[i]>0)shieldGrid[i]--;
  for(let i=0;i<freshGrid.length;i++)if(freshGrid[i]>0)freshGrid[i]--;
}

function tickBattle(){
  if(!battle.running||battle.ended)return;
  battle.timer-=TICK/1000;
  stepSide(1,headsP,battle.pPattern);
  stepSide(2,headsE,battle.ePattern);
  infectStep();
  const c=census();
  battle.peakPlayer=Math.max(battle.peakPlayer,c.p);
  battle.peakEnemy=Math.max(battle.peakEnemy,c.e);
  const t=BATTLE_TIME-battle.timer;
  battle.history.push({t:t,p:c.p,e:c.e});
  if(battle.firstLeadLost===null&&c.e>c.p&&t>3)battle.firstLeadLost=t;
  if(battle.timer<=0){battle.timer=0;endBattle();return;}
  if(t>3&&(c.p===0||c.e===0)){battle.annihilation=true;endBattle();return;}
  if(c.p+c.e>=c.total&&(c.p===0||c.e===0)){battle.annihilation=true;endBattle();return;}
}

function endBattle(){
  if(battle.ended)return;
  battle.ended=true;battle.running=false;
  const c=census();
  const pct=Math.round(c.p/c.total*100);
  const av=D.virusList[D.selected]; // virus actif, pour créditer ses stats
  // Arena battles don't touch campaign progression; they record W/L instead.
  if(battle.arena){
    if(c.p>c.e){
      battle.winner='player';sfx.win();
      D.arenaWins=(D.arenaWins|0)+1;
      if(av)av.wins=(av.wins|0)+1;
      D.dna+=30;battle.rewardGiven=30;
      if(battle.arenaOpponent)arenaRecordWin(battle.arenaOpponent.id);
    }else if(c.e>c.p){
      battle.winner='enemy';sfx.lose();
      D.arenaLosses=(D.arenaLosses|0)+1;
      if(av)av.losses=(av.losses|0)+1;
      D.dna+=10;battle.rewardGiven=10;
    }else{battle.winner='draw';D.dna+=15;battle.rewardGiven=15;}
    scroll.y=0;scroll.max=0;scroll.vel=0;
    D.lastReport=buildBattleReport(c,battle.winner);
    save();return;
  }
  if(c.p>c.e){
    battle.winner='player';sfx.win();
    D.scores.wins++;D.scores.streak++;
    // victoire créditée au virus actif (+ meilleur niveau atteint)
    if(av){av.wins=(av.wins|0)+1;av.bestLevel=Math.max(av.bestLevel|0,battle.level);}
    D.scores.bestStreak=Math.max(D.scores.bestStreak,D.scores.streak);
    D.scores.best=Math.max(D.scores.best,pct);
    const en=enemyAt(battle.level-1);
    let reward;
    if(battle.level===D.progress){
      // premier passage : récompense complète (×1.5) et progression
      D.progress=Math.min(30,D.progress+1);
      reward=Math.round(en.reward*1.5);
    }else{
      // niveau déjà battu : gain symbolique pour éviter le farm de virus faibles
      reward=5;
    }
    D.dna+=reward;battle.rewardGiven=reward;
  }else if(c.e>c.p){
    battle.winner='enemy';sfx.lose();
    D.scores.streak=0;
    if(av)av.losses=(av.losses|0)+1;
    D.dna+=22;battle.rewardGiven=22;
  }else{
    battle.winner='draw';
    D.dna+=25;battle.rewardGiven=25;
  }
  scroll.y=0;scroll.max=0;scroll.vel=0;
  // Rapport généré à CHAQUE combat de campagne (victoire, défaite ou égalité).
  D.lastReport=buildBattleReport(c,battle.winner);
  D.lastDefeat=(battle.winner==='enemy')?D.lastReport:D.lastDefeat; // compat
  save();
}

/* Rapport de combat : la boucle d'apprentissage, victoire comme défaite. */
function buildBattleReport(c,winner){
  const hist=battle.history;
  const en=battle.arena?{name:(battle.arenaOpponent&&battle.arenaOpponent.name)||'Opponent',pattern:battle.ePattern||[]}:enemyAt(battle.level-1);
  const lines=[];
  const pct=Math.round(c.p/c.total*100),epct=Math.round(c.e/c.total*100);
  const won=winner==='player';

  lines.push(`Final territory: ${pct}% against ${epct}%.`);

  if(won){
    if(battle.firstLeadLost!==null)lines.push(`You were behind at ${battle.firstLeadLost.toFixed(0)}s, then turned it around.`);
    else lines.push('You led from start to finish.');
  }else{
    if(battle.firstLeadLost!==null)lines.push(`The enemy took the lead at ${battle.firstLeadLost.toFixed(0)}s.`);
    else lines.push('You never held the lead at any point.');
  }

  const mid=hist[Math.floor(hist.length/2)];
  if(mid){
    const rp=mid.p,re=mid.e;
    if(won){
      if(rp>re*1.35)lines.push('You expanded much faster \u2014 a strong, aggressive loop.');
      else lines.push('A close race won on the details of your loop.');
    }else{
      if(re>rp*1.35)lines.push('It grows much faster than you. You need more claims per loop.');
      else if(rp>re*1.1)lines.push('You grew faster but stalled. Your loop closes in on itself.');
      else lines.push('Growth rates were close. The detail of the loop decided it.');
    }
  }

  const ep=en.pattern||[];
  if(!won){
    if(ep.includes('dash'))lines.push('It uses Dash to charge across the dish. Match its speed with Dash or Surge.');
    else if(ep.includes('sprint'))lines.push('It Sprints to double its moves. You need more expansion per loop.');
    else if(ep.includes('boost'))lines.push('It uses Surge, colonising in straight lines. Cut across its path.');
    else if(ep.includes('diviser'))lines.push('It uses Split. Without your own head source you will be swarmed.');
    else lines.push('A dense expansion loop. Pack more Advance/Surge into yours.');
  }

  const pp=battle.pPattern||[];
  const turns=pp.filter(a=>a==='tournerG'||a==='tournerD').length;
  const moves=pp.filter(a=>['avancer','sauter','boost','dash'].includes(a)).length;
  if(!won&&pp.length&&turns>moves)lines.push('Your loop has more turns than moves, so you spin in place.');
  else if(!won&&moves&&turns===0)lines.push('Your loop never turns, so you run straight into the wall.');
  else if(won&&moves>=turns*2)lines.push('Good move-to-turn ratio keeps you expanding.');

  // Pic de territoire : as-tu mené puis tout perdu ? (mécanique territoire frais)
  const peakP=battle.peakPlayer||0;
  const peakPct=Math.round(peakP/c.total*100);
  if(!won&&peakPct>=55){
    lines.push('You peaked at '+peakPct+'% then lost ground \u2014 you spread too fast and your fresh territory got eaten back. Consolidate more.');
  }else if(won&&pct>=peakPct-3&&pct>60){
    lines.push('You held your gains steadily \u2014 solid, consolidated expansion.');
  }
  // Conseil consolidation si le joueur ne fait QUE de la vitesse pure
  const fastActions=pp.filter(a=>['dash','sauter','boost','sprint'].includes(a)).length;
  if(!won&&fastActions>=pp.length*0.7&&pp.length>=3){
    lines.push('Pure speed spreads thin. Mix in Advance to lock down what you take before the enemy grinds it back.');
  }
  // Combativité de la fin
  const late=hist[hist.length-1],early=hist[Math.floor(hist.length*0.25)];
  if(won&&early&&late&&early.e>early.p&&late.p>late.e){
    lines.push('A real comeback \u2014 you were losing early and clawed it back.');
  }

  return{level:battle.level,arena:!!battle.arena,winner:winner,won:won,
         enemy:en.name,enemyPattern:(en.pattern||[]).slice(),
         playerPattern:pp.slice(),lines:lines,hist:hist.slice(),pct:pct,epct:epct,
         peakPct:peakPct};
}

/* ---------------- RENDU : PRIMITIVES ---------------- */
let T=0;
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function text(s,x,y,size,color,align='left',weight='600',glow=0){
  ctx.font=`${weight} ${size}px 'Segoe UI',system-ui,sans-serif`;
  ctx.textAlign=align;ctx.textBaseline='middle';
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
  ctx.shadowBlur=0;
}
function panel(x,y,w,h,accent=C.panelBorder,fill=C.panel,r=12){
  rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=accent;ctx.lineWidth=1.5;ctx.stroke();
}

/* Boutons : registre reconstruit chaque frame */
let hitzones=[];
function button(x,y,w,h,label,cb,opt={}){
  const accent=opt.accent||C.cyan;
  const disabled=!!opt.disabled;
  const g=ctx.createLinearGradient(x,y,x,y+h);
  if(disabled){g.addColorStop(0,'rgba(30,42,64,.7)');g.addColorStop(1,'rgba(18,26,42,.7)');}
  else{g.addColorStop(0,'rgba(20,52,96,.95)');g.addColorStop(1,'rgba(10,28,58,.95)');}
  rr(x,y,w,h,10);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=disabled?C.lock:accent;ctx.lineWidth=1.6;
  if(!disabled){ctx.shadowColor=accent;ctx.shadowBlur=10;}
  ctx.stroke();ctx.shadowBlur=0;
  // liseré coin
  if(!disabled){
    ctx.strokeStyle=accent;ctx.lineWidth=2.4;ctx.beginPath();
    ctx.moveTo(x+4,y+h-3);ctx.lineTo(x+16,y+h-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+w-16,y+3);ctx.lineTo(x+w-4,y+3);ctx.stroke();
  }
  text(label,x+w/2,y+h/2+1,opt.size||16,disabled?C.textDim:C.text,'center','700',disabled?0:6);
  if(!disabled)hitzones.push({x,y,w,h,cb});
}
function iconButton(x,y,w,h,icon,label,cb,opt={}){
  const accent=opt.accent||C.cyan;
  const sel=opt.selected;
  rr(x,y,w,h,10);
  ctx.fillStyle=sel?'rgba(63,208,255,.18)':'rgba(12,28,54,.9)';ctx.fill();
  ctx.strokeStyle=opt.disabled?C.lock:accent;ctx.lineWidth=sel?2.2:1.4;ctx.stroke();
  text(icon,x+w/2,y+h*0.38,opt.iconSize||22,opt.disabled?C.textDim:(opt.iconColor||accent),'center','700',sel?8:0);
  if(label)text(label,x+w/2,y+h*0.76,9.5,C.textDim,'center','600');
  if(!opt.disabled)hitzones.push({x,y,w,h,cb});
}

/* ---------------- CIRCUIT IMPRIMÉ (fond dense) ---------------- */
// Généré une fois, puis rejoué à l'identique : traces orthogonales avec
// coins à 45°, pastilles de connexion et pavés de "puce".
let circuitPaths=null,circuitPads=null,circuitChips=null;
function buildCircuit(){
  const rnd=(()=>{let s=1337;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;})();
  circuitPaths=[];circuitPads=[];circuitChips=[];
  const edges=[
    {x:0,y:0,dx:1,dy:0},{x:W,y:0,dx:-1,dy:0},
    {x:0,y:H,dx:1,dy:0},{x:W,y:H,dx:-1,dy:0}
  ];
  for(let i=0;i<40;i++){
    const fromLeft=rnd()<.5;
    let x=fromLeft?0:W;
    let y=20+rnd()*(H-40);
    const dir=fromLeft?1:-1;
    const pts=[[x,y]];
    let len=0;
    const segs=3+((rnd()*4)|0);
    for(let sgi=0;sgi<segs;sgi++){
      const run=40+rnd()*130;
      x+=dir*run;len+=run;
      pts.push([x,y]);
      if(sgi<segs-1){
        const drop=(rnd()<.5?-1:1)*(30+rnd()*90);
        // coin à 45° caractéristique des circuits imprimés
        const d=Math.min(12,Math.abs(drop)/2);
        pts.push([x+dir*d,y+Math.sign(drop)*d]);
        y+=drop;
        pts.push([x+dir*d,y]);
        x+=dir*d;
      }
      if(x<-20||x>W+20||y<0||y>H)break;
    }
    circuitPaths.push(pts);
    const last=pts[pts.length-1];
    circuitPads.push([last[0],last[1],2+rnd()*2]);
  }
  // pavés de puce (rectangles pointillés en damier)
  for(let i=0;i<8;i++){
    circuitChips.push({
      x:rnd()<.5?8+rnd()*40:W-70-rnd()*40,
      y:60+rnd()*(H-160),
      w:40+rnd()*34,h:34+rnd()*40
    });
  }
}
function drawCircuit(){
  if(!circuitPaths)buildCircuit();
  ctx.save();
  // pavés de puce
  for(const c of circuitChips){
    ctx.fillStyle='rgba(63,208,255,.06)';
    for(let gx=0;gx<c.w;gx+=6)for(let gy=0;gy<c.h;gy+=6){
      if(((gx+gy)/6)%2===0)ctx.fillRect(c.x+gx,c.y+gy,3,3);
    }
  }
  // traces
  ctx.lineWidth=1.4;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='rgba(63,208,255,.17)';
  for(const pts of circuitPaths){
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();
  }
  // pastilles de connexion
  for(const[px,py,pr]of circuitPads){
    ctx.beginPath();ctx.arc(px,py,pr,0,7);
    ctx.fillStyle='rgba(63,208,255,.30)';ctx.fill();
    ctx.beginPath();ctx.arc(px,py,pr+2.2,0,7);
    ctx.strokeStyle='rgba(63,208,255,.16)';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- VIRUS LOGO (noyau à anneaux) ---------------- */
function drawLogoVirus(cx,cy,r,phase){
  ctx.save();ctx.translate(cx,cy);
  // halo
  const halo=ctx.createRadialGradient(0,0,r*.5,0,0,r*2.1);
  halo.addColorStop(0,'rgba(63,208,255,.30)');
  halo.addColorStop(.5,'rgba(63,208,255,.10)');
  halo.addColorStop(1,'rgba(63,208,255,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,r*2.1,0,7);ctx.fill();

  // pointes à bout arrondi (glycoprotéines)
  const spikes=20;
  ctx.save();ctx.rotate(phase*.16);
  for(let i=0;i<spikes;i++){
    const a=(i/spikes)*Math.PI*2;
    const x1=Math.cos(a)*r*.94,y1=Math.sin(a)*r*.94;
    const x2=Math.cos(a)*r*1.34,y2=Math.sin(a)*r*1.34;
    ctx.strokeStyle='rgba(150,225,255,.9)';
    ctx.lineWidth=r*.075;ctx.lineCap='round';
    ctx.shadowColor='#3fd0ff';ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    const bulb=ctx.createRadialGradient(x2-r*.03,y2-r*.03,r*.01,x2,y2,r*.115);
    bulb.addColorStop(0,'#eafaff');bulb.addColorStop(1,'#4fb8e8');
    ctx.beginPath();ctx.arc(x2,y2,r*.115,0,7);ctx.fillStyle=bulb;ctx.fill();
  }
  ctx.restore();ctx.shadowBlur=0;

  // capside
  const shell=ctx.createRadialGradient(-r*.34,-r*.38,r*.06,0,0,r);
  shell.addColorStop(0,'#7fe6ff');shell.addColorStop(.42,'#1f9fd4');
  shell.addColorStop(.78,'#0d5f8f');shell.addColorStop(1,'#062f4d');
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle=shell;ctx.fill();

  // anneaux concentriques internes (arcs partiels, façon HUD)
  ctx.save();
  ctx.beginPath();ctx.arc(0,0,r*.97,0,7);ctx.clip();
  ctx.rotate(-phase*.5);
  const rings=[[.72,.9,2.4],[.54,1.7,1.9],[.36,1.2,1.6],[.20,2.4,1.3]];
  rings.forEach(([rad,arc,lw],i)=>{
    ctx.beginPath();
    ctx.arc(0,0,r*rad,i*1.3,i*1.3+arc);
    ctx.strokeStyle=`rgba(190,245,255,${.75-i*.1})`;
    ctx.lineWidth=lw;ctx.lineCap='round';
    ctx.shadowColor='#8fe8ff';ctx.shadowBlur=6;ctx.stroke();
  });
  ctx.shadowBlur=0;
  // segments de données
  ctx.rotate(phase*.9);
  for(let i=0;i<7;i++){
    const a=(i/7)*Math.PI*2;
    const rr0=r*(.42+((i*37)%23)/60);
    ctx.beginPath();
    ctx.arc(0,0,rr0,a,a+.30);
    ctx.strokeStyle='rgba(120,255,235,.55)';ctx.lineWidth=2.4;ctx.stroke();
  }
  ctx.restore();

  // reflet + liseré
  const gloss=ctx.createLinearGradient(-r,-r,r*.3,r*.3);
  gloss.addColorStop(0,'rgba(255,255,255,.34)');
  gloss.addColorStop(.55,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle=gloss;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r,0,7);
  ctx.strokeStyle='rgba(180,240,255,.75)';ctx.lineWidth=r*.045;
  ctx.shadowColor='#3fd0ff';ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
  ctx.restore();
}

/* ---------------- ICÔNES VECTORIELLES ---------------- */
// Tracées à la main, taille normalisée autour de (cx,cy) sur ~s pixels.
function icoMap(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(-10,-7);ctx.lineTo(-3,-10);ctx.lineTo(4,-6);ctx.lineTo(11,-9);
  ctx.lineTo(11,7);ctx.lineTo(4,10);ctx.lineTo(-3,6);ctx.lineTo(-10,9);
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=.22;ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();ctx.moveTo(-3,-10);ctx.lineTo(-3,6);ctx.moveTo(4,-6);ctx.lineTo(4,10);
  ctx.lineWidth=1.2;ctx.stroke();
  // marqueur
  ctx.beginPath();ctx.arc(0.5,-2,2.6,0,7);ctx.fill();
  ctx.restore();
}
function icoTube(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.42);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(-4.5,-11);ctx.lineTo(-4.5,7);
  ctx.quadraticCurveTo(-4.5,11.5,0,11.5);
  ctx.quadraticCurveTo(4.5,11.5,4.5,7);
  ctx.lineTo(4.5,-11);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-7,-11);ctx.lineTo(7,-11);ctx.lineWidth=2.1;ctx.stroke();
  // liquide
  ctx.globalAlpha=.34;
  ctx.beginPath();
  ctx.moveTo(-4.5,1);ctx.lineTo(4.5,1);ctx.lineTo(4.5,7);
  ctx.quadraticCurveTo(4.5,10.4,0,10.4);
  ctx.quadraticCurveTo(-4.5,10.4,-4.5,7);
  ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  // bulles
  ctx.beginPath();ctx.arc(-1.4,4,1.25,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(2,6.6,.95,0,7);ctx.fill();
  ctx.restore();
}
function icoScope(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;
  ctx.lineJoin='round';ctx.lineCap='round';
  // socle
  ctx.beginPath();ctx.moveTo(-10,11);ctx.lineTo(10,11);ctx.lineWidth=2.2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-6.5,11);ctx.lineTo(-2,4);ctx.lineWidth=1.7;ctx.stroke();
  // platine
  ctx.beginPath();ctx.moveTo(-7,4);ctx.lineTo(3,4);ctx.stroke();
  // bras + tube
  ctx.beginPath();ctx.moveTo(1,4);
  ctx.quadraticCurveTo(9,1,6.5,-6);ctx.stroke();
  ctx.save();ctx.translate(3.6,-8.6);ctx.rotate(.42);
  ctx.beginPath();ctx.rect(-2.6,-4.4,5.2,9);ctx.stroke();
  ctx.globalAlpha=.25;ctx.fill();ctx.globalAlpha=1;
  ctx.restore();
  // oculaire
  ctx.beginPath();ctx.arc(-0.2,-11.4,1.9,0,7);ctx.fill();
  ctx.restore();
}
function icoTrophy(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(-6.5,-9);ctx.lineTo(6.5,-9);ctx.lineTo(6.5,-3);
  ctx.quadraticCurveTo(6.5,4,0,4.6);
  ctx.quadraticCurveTo(-6.5,4,-6.5,-3);
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=.22;ctx.fill();ctx.globalAlpha=1;
  // anses
  ctx.beginPath();ctx.moveTo(-6.5,-7.5);ctx.quadraticCurveTo(-11,-6.5,-8,-1.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6.5,-7.5);ctx.quadraticCurveTo(11,-6.5,8,-1.5);ctx.stroke();
  // pied
  ctx.beginPath();ctx.moveTo(0,4.6);ctx.lineTo(0,8);ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-5,10.5);ctx.lineTo(5,10.5);ctx.lineWidth=2.3;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-3,8);ctx.lineTo(3,8);ctx.lineWidth=1.8;ctx.stroke();
  ctx.restore();
}
function icoDna(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;ctx.lineCap='round';
  for(const dir of[1,-1]){
    ctx.beginPath();
    for(let i=0;i<=22;i++){
      const t=i/22,yy=-10+t*20;
      const xx=Math.sin(t*Math.PI*2)*5.4*dir;
      i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
    }
    ctx.stroke();
  }
  ctx.lineWidth=1.25;
  for(let i=1;i<=4;i++){
    const t=i/5,yy=-10+t*20;
    const xx=Math.sin(t*Math.PI*2)*5.4;
    ctx.beginPath();ctx.moveTo(-xx,yy);ctx.lineTo(xx,yy);ctx.stroke();
  }
  ctx.restore();
}

// Petit compteur ADN réutilisable : hélice violette + nombre.
function dnaLabel(x,y,amount,size,align){
  size=size||13;align=align||'left';
  const iconS=size*1.2;
  ctx.font=(size)+"px 'Segoe UI',system-ui,sans-serif";
  const numStr=''+(amount==null||(typeof amount==='number'&&isNaN(amount))?0:amount);
  const numW=ctx.measureText(numStr).width;
  let ix;
  if(align==='left'){ix=x+iconS*0.4;}
  else if(align==='right'){ix=x-numW-iconS*0.55;}
  else{ix=x-(numW+iconS*0.9)/2+iconS*0.4;}
  icoDna(ix,y,iconS,C.dna);
  text(numStr,ix+iconS*0.55,y,size,C.dna,'left','800',5);
}

function icoChevron(cx,cy,s,col){

  ctx.moveTo(0,-10.5);ctx.lineTo(8,-2);ctx.lineTo(3.4,-2);ctx.lineTo(3.4,4);
  ctx.lineTo(-3.4,4);ctx.lineTo(-3.4,-2);ctx.lineTo(-8,-2);ctx.closePath();
  ctx.globalAlpha=.30;ctx.fill();ctx.globalAlpha=1;
  ctx.lineWidth=1.7;ctx.stroke();

}
function icoCrown(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineJoin='round';ctx.lineWidth=1.7;
  ctx.beginPath();
  ctx.moveTo(-9.5,6);ctx.lineTo(-8,-7);ctx.lineTo(-3.4,-1.4);ctx.lineTo(0,-8.6);
  ctx.lineTo(3.4,-1.4);ctx.lineTo(8,-7);ctx.lineTo(9.5,6);ctx.closePath();
  ctx.globalAlpha=.24;ctx.fill();ctx.globalAlpha=1;ctx.stroke();

function icoFolder(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;ctx.lineJoin='round';
  // chemise
  ctx.beginPath();
  ctx.moveTo(-10,-7.5);ctx.lineTo(-2.5,-7.5);ctx.lineTo(-0.4,-4.6);
  ctx.lineTo(10,-4.6);ctx.lineTo(10,9);ctx.lineTo(-10,9);
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=.20;ctx.fill();ctx.globalAlpha=1;
  // feuille dépassant
  ctx.beginPath();
  ctx.moveTo(-6,-4.6);ctx.lineTo(-6,-9.6);ctx.lineTo(6,-9.6);ctx.lineTo(6,-4.6);

  // lignes d'étiquette
  ctx.lineWidth=1.25;
  ctx.beginPath();ctx.moveTo(-5.6,1.2);ctx.lineTo(2.2,1.2);ctx.stroke();

function icoArena(cx,cy,s,col){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s/24,s/24);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.7;
  ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.stroke();
  ctx.lineWidth=1.4;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    ctx.beginPath();ctx.moveTo(dx*9,dy*9);ctx.lineTo(dx*13,dy*13);ctx.stroke();
  }
  ctx.beginPath();ctx.arc(0,0,1.6,0,7);ctx.fill();
  ctx.restore();
}
const MENU_ICONS={map:icoMap,folder:icoFolder,arena:icoArena,tube:icoTube,scope:icoScope,trophy:icoTrophy,

/* ---------------- BOUTON À ICÔNE (icône | libellé) ---------------- */
function menuButton(x,y,w,h,iconKey,label,cb,opt={}){
  const accent=opt.dim?C.lock:(opt.accent||C.cyan);
  if(opt.dim)ctx.globalAlpha=0.4;
  // corps
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(18,52,96,.92)');
  g.addColorStop(.5,'rgba(11,34,66,.92)');
  g.addColorStop(1,'rgba(8,24,50,.92)');
  rr(x,y,w,h,9);ctx.fillStyle=g;ctx.fill();
  // double liseré
  ctx.strokeStyle=accent;ctx.lineWidth=1.8;
  ctx.shadowColor=accent;ctx.shadowBlur=13;ctx.stroke();ctx.shadowBlur=0;
  rr(x+3.5,y+3.5,w-7,h-7,6.5);
  ctx.strokeStyle='rgba(63,208,255,.28)';ctx.lineWidth=1;ctx.stroke();
  // icône
  const fn=MENU_ICONS[iconKey];
  const iconS=opt.iconSize||(h>52?30:26);
  if(fn){
    ctx.shadowColor=accent;ctx.shadowBlur=8;
    fn(x+38,y+h/2,iconS,'#dff4ff');
    ctx.shadowBlur=0;
  }
  // séparateur vertical
  ctx.beginPath();
  ctx.moveTo(x+62,y+12);ctx.lineTo(x+62,y+h-12);
  ctx.strokeStyle='rgba(63,208,255,.45)';ctx.lineWidth=1.3;ctx.stroke();
  // libellé
  text(label,x+62+(w-62)/2,y+h/2+1,opt.size||17,'#eaf6ff','center','800',9);
  hitzones.push({x,y,w,h,cb});
  ctx.globalAlpha=1;
}


/* ================= VIRUS APPEARANCE ================= */
// A strain's look is data, so it can be saved, randomised and drawn anywhere.
const SPIKE_SHAPES=['round','triangle','tentacle','club','crystal','hook','none'];
const CORE_STYLES=['rings','nucleus','spiral','hex','cells','void'];
const BODY_STYLES=['smooth','ridged','segmented','crystalline','porous'];

const PALETTE=[
  {id:'cyan',   name:'Cyan',    main:'#3fd0ff',glow:'#8fe8ff',deep:'#062f4d'},
  {id:'azure',  name:'Azure',   main:'#5b8cff',glow:'#a8c4ff',deep:'#0b1f52'},
  {id:'mint',   name:'Mint',    main:'#4dffa6',glow:'#a8ffd4',deep:'#053d29'},
  {id:'gold',   name:'Gold',    main:'#f5c542',glow:'#ffe9a3',deep:'#4a3407'},
  {id:'violet', name:'Violet',  main:'#c46bff',glow:'#e2b6ff',deep:'#33094d'},
  {id:'rose',   name:'Rose',    main:'#ff6b9d',glow:'#ffb8d0',deep:'#4d0a26'},
  {id:'amber',  name:'Amber',   main:'#ff8f4d',glow:'#ffc9a3',deep:'#4d2205'},
  {id:'crimson',name:'Crimson', main:'#ff4d4d',glow:'#ffa8a8',deep:'#4d0808'},
  {id:'lime',   name:'Lime',    main:'#b6ff4d',glow:'#dcffa8',deep:'#2c4d05'},
  {id:'ice',    name:'Ice',     main:'#c8f0ff',glow:'#ffffff',deep:'#1c4457'},
  {id:'teal',   name:'Teal',    main:'#2fd6c4',glow:'#9bf2e8',deep:'#04413b'},
  {id:'magenta',name:'Magenta', main:'#ff4dd6',glow:'#ffa8ee',deep:'#4d0840'}
];
function paletteById(id){return PALETTE.find(p=>p.id===id)||PALETTE[0];}

function defaultLook(i){
  return{
    palette:PALETTE[i%PALETTE.length].id,
    accent:PALETTE[(i+4)%PALETTE.length].id,
    spike:'round',spikeCount:14,
    core:'rings',body:'smooth'
  };
}
function randomLook(){
  const R=a=>a[(Math.random()*a.length)|0];
  return{
    palette:R(PALETTE).id,accent:R(PALETTE).id,
    spike:R(SPIKE_SHAPES),spikeCount:8+((Math.random()*14)|0),
    core:R(CORE_STYLES),body:R(BODY_STYLES)
  };
}
function normaliseLook(l,i){
  const d=defaultLook(i||0);
  if(!l||typeof l!=='object')return d;
  return{
    palette:PALETTE.some(p=>p.id===l.palette)?l.palette:d.palette,
    accent:PALETTE.some(p=>p.id===l.accent)?l.accent:d.accent,
    spike:SPIKE_SHAPES.includes(l.spike)?l.spike:d.spike,
    spikeCount:Math.max(6,Math.min(22,l.spikeCount|0||d.spikeCount)),
    core:CORE_STYLES.includes(l.core)?l.core:d.core,
    body:BODY_STYLES.includes(l.body)?l.body:d.body
  };
}

// Draws a strain from its look data. Used for the logo, lists, editor and battles.
function drawStrain(cx,cy,r,look,phase,opt={}){
  look=normaliseLook(look,0);
  const P=paletteById(look.palette),A=paletteById(look.accent);
  const detail=opt.detail!==false;
  // Le r demandé est le rayon TOTAL, pointes comprises. Les pointes atteignent
  // jusqu'à ~1.5x le rayon du corps ; on réduit donc le corps pour que
  // l'ensemble tienne dans r et ne déborde jamais des cadres.
  const SPIKE_REACH=1.55;
  const rOuter=r;
  if(look.spike!=='none')r=r/SPIKE_REACH;
  ctx.save();ctx.translate(cx,cy);

  if(opt.halo!==false){
    const halo=ctx.createRadialGradient(0,0,r*.5,0,0,r*2.05);
    halo.addColorStop(0,P.main+'4d');halo.addColorStop(.5,P.main+'1a');
    halo.addColorStop(1,P.main+'00');
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,r*2.05,0,7);ctx.fill();
  }

  // --- spikes ---
  if(look.spike!=='none'){
    ctx.save();ctx.rotate(phase*.16);
    const n=look.spikeCount;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2;
      const ca=Math.cos(a),sa=Math.sin(a);
      const x1=ca*r*.94,y1=sa*r*.94;
      const len=r*(look.spike==='tentacle'?1.46:1.32);
      const x2=ca*len,y2=sa*len;
      ctx.strokeStyle=P.glow;ctx.fillStyle=P.glow;
      ctx.lineWidth=r*.075;ctx.lineCap='round';
      if(detail){ctx.shadowColor=P.main;ctx.shadowBlur=7;}
      switch(look.spike){
        case 'round':
          ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
          ctx.beginPath();ctx.arc(x2,y2,r*.115,0,7);ctx.fill();
          break;
        case 'triangle':{
          ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
          const pa=a+Math.PI/2,px=Math.cos(pa)*r*.10,py=Math.sin(pa)*r*.10;
          ctx.beginPath();
          ctx.moveTo(ca*len*1.16,sa*len*1.16);
          ctx.lineTo(x2+px,y2+py);ctx.lineTo(x2-px,y2-py);
          ctx.closePath();ctx.fill();
          break;}
        case 'tentacle':{
          ctx.beginPath();ctx.moveTo(x1,y1);
          const wob=Math.sin(phase*2+i)*r*.16;
          const pa=a+Math.PI/2;
          ctx.quadraticCurveTo(
            ca*len*.62+Math.cos(pa)*wob, sa*len*.62+Math.sin(pa)*wob, x2,y2);
          ctx.lineWidth=r*.055;ctx.stroke();
          ctx.beginPath();ctx.arc(x2,y2,r*.07,0,7);ctx.fill();
          break;}
        case 'club':
          ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
          ctx.lineWidth=r*.05;ctx.stroke();
          ctx.save();ctx.translate(x2,y2);ctx.rotate(a);
          ctx.beginPath();ctx.ellipse(0,0,r*.15,r*.09,0,0,7);ctx.fill();
          ctx.restore();
          break;
        case 'crystal':{
          const pa=a+Math.PI/2,px=Math.cos(pa)*r*.075,py=Math.sin(pa)*r*.075;
          ctx.beginPath();
          ctx.moveTo(x1+px,y1+py);ctx.lineTo(ca*len*1.1,sa*len*1.1);
          ctx.lineTo(x1-px,y1-py);ctx.closePath();
          ctx.fill();
          break;}
        case 'hook':{
          ctx.beginPath();ctx.moveTo(x1,y1);
          const pa=a+Math.PI/2;
          ctx.quadraticCurveTo(x2,y2,x2+Math.cos(pa)*r*.20,y2+Math.sin(pa)*r*.20);
          ctx.lineWidth=r*.06;ctx.stroke();
          break;}
      }
      ctx.shadowBlur=0;
    }
    ctx.restore();
  }
  ctx.shadowBlur=0;

  // --- body ---
  const shell=ctx.createRadialGradient(-r*.34,-r*.38,r*.06,0,0,r);
  shell.addColorStop(0,P.glow);shell.addColorStop(.42,P.main);
  shell.addColorStop(.80,P.deep);shell.addColorStop(1,'#03121f');
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle=shell;ctx.fill();

  if(detail){
    ctx.save();ctx.beginPath();ctx.arc(0,0,r*.99,0,7);ctx.clip();
    switch(look.body){
      case 'ridged':
        ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=r*.05;
        for(let i=-4;i<=4;i++){
          ctx.beginPath();ctx.arc(0,r*i*.30,r*.95,0,Math.PI);ctx.stroke();
        }
        break;
      case 'segmented':
        ctx.strokeStyle='rgba(0,0,0,.30)';ctx.lineWidth=r*.045;
        for(let i=0;i<6;i++){
          const a=(i/6)*Math.PI;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
          ctx.lineTo(-Math.cos(a)*r,-Math.sin(a)*r);ctx.stroke();
        }
        break;
      case 'crystalline':
        ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=r*.035;
        for(let i=0;i<7;i++){
          const a=(i/7)*Math.PI*2+phase*.1;
          ctx.beginPath();ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.stroke();
        }
        break;
      case 'porous':
        ctx.fillStyle='rgba(0,0,0,.24)';
        for(let i=0;i<11;i++){
          const a=(i*2.399),rr0=r*.30+((i*29)%50)/100*r*.6;
          ctx.beginPath();
          ctx.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,r*(.05+((i*17)%9)/100),0,7);
          ctx.fill();
        }
        break;
    }
    ctx.restore();
  }

  // --- core ---
  if(detail&&look.core!=='void'){
    ctx.save();ctx.beginPath();ctx.arc(0,0,r*.97,0,7);ctx.clip();
    ctx.rotate(-phase*.5);
    switch(look.core){
      case 'rings':{
        const rings=[[.72,.9,2.4],[.54,1.7,1.9],[.36,1.2,1.6],[.20,2.4,1.3]];
        rings.forEach(([rad,arc,lw],i)=>{
          ctx.beginPath();ctx.arc(0,0,r*rad,i*1.3,i*1.3+arc);
          ctx.strokeStyle=A.glow+'c0';ctx.lineWidth=lw*(r/54);
          ctx.lineCap='round';ctx.shadowColor=A.main;ctx.shadowBlur=6;ctx.stroke();
        });
        ctx.shadowBlur=0;ctx.rotate(phase*.9);
        for(let i=0;i<7;i++){
          const a=(i/7)*Math.PI*2,rr0=r*(.42+((i*37)%23)/60);
          ctx.beginPath();ctx.arc(0,0,rr0,a,a+.30);
          ctx.strokeStyle=A.main+'8c';ctx.lineWidth=2.4*(r/54);ctx.stroke();
        }
        break;}
      case 'nucleus':{
        const ng=ctx.createRadialGradient(0,0,r*.05,0,0,r*.5);
        ng.addColorStop(0,A.glow);ng.addColorStop(1,A.main+'00');
        ctx.beginPath();ctx.arc(0,0,r*.5,0,7);ctx.fillStyle=ng;ctx.fill();
        ctx.fillStyle=A.glow+'99';
        for(let i=0;i<5;i++){
          const a=(i/5)*Math.PI*2+phase*.6;
          ctx.beginPath();ctx.arc(Math.cos(a)*r*.30,Math.sin(a)*r*.30,r*.075,0,7);ctx.fill();
        }
        break;}
      case 'spiral':{
        ctx.strokeStyle=A.glow+'cc';ctx.lineWidth=2.2*(r/54);ctx.lineCap='round';
        ctx.shadowColor=A.main;ctx.shadowBlur=6;
        for(const dir of[1,-1]){
          ctx.beginPath();
          for(let i=0;i<=44;i++){
            const t=i/44,ang=t*Math.PI*3*dir+phase*.5,rad=r*.10+t*r*.66;
            const xx=Math.cos(ang)*rad,yy=Math.sin(ang)*rad;
            i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
          }
          ctx.stroke();
        }
        ctx.shadowBlur=0;break;}
      case 'hex':{
        ctx.strokeStyle=A.glow+'aa';ctx.lineWidth=1.8*(r/54);
        for(const rad of[r*.28,r*.50,r*.72]){
          ctx.beginPath();
          for(let i=0;i<=6;i++){
            const a=(i/6)*Math.PI*2+phase*.3;
            const xx=Math.cos(a)*rad,yy=Math.sin(a)*rad;
            i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
          }
          ctx.stroke();
        }
        break;}
      case 'cells':{
        ctx.fillStyle=A.main+'70';ctx.strokeStyle=A.glow+'99';ctx.lineWidth=1.2*(r/54);
        for(let i=0;i<8;i++){
          const a=(i*2.399)+phase*.25,rad=r*.18+((i*31)%40)/100*r*.5;
          const xx=Math.cos(a)*rad,yy=Math.sin(a)*rad;
          ctx.beginPath();ctx.arc(xx,yy,r*(.09+((i*13)%7)/100),0,7);
          ctx.fill();ctx.stroke();
        }
        break;}
    }
    ctx.restore();
  }

  // gloss + rim
  const gloss=ctx.createLinearGradient(-r,-r,r*.3,r*.3);
  gloss.addColorStop(0,'rgba(255,255,255,.32)');
  gloss.addColorStop(.55,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle=gloss;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r,0,7);
  ctx.strokeStyle=P.glow+'bf';ctx.lineWidth=Math.max(1,r*.045);
  if(detail){ctx.shadowColor=P.main;ctx.shadowBlur=12;}
  ctx.stroke();ctx.shadowBlur=0;
  ctx.restore();
}

/* ================= ON-CANVAS KEYBOARD ================= */
// Browsers block prompt() on mobile and in sandboxed frames, so text entry
// is handled in-canvas and always works.
let keyboard=null;
const KB_ROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
const KB_NUMS='1234567890';
const KB_SYM_ROWS=['@#&_-+()','/*"\':;!?',',.=%$'];
function openKeyboard(title,initial,maxLen,onConfirm){
  keyboard={title,value:(initial||'').slice(0,maxLen),max:maxLen,onConfirm,symbols:false,lower:false,blink:0};
}
function drawKeyboard(dt){
  if(!keyboard)return;
  keyboard.blink+=dt;
  ctx.fillStyle='rgba(2,6,14,.94)';ctx.fillRect(0,0,W,H);
  const kx=10,kw=W-20;
  const panelY=150;
  panel(kx,panelY,kw,92,C.cyan,'rgba(6,18,38,.98)',12);
  text(keyboard.title,W/2,panelY+22,13,C.textDim,'center','700');
  rr(kx+14,panelY+38,kw-28,40,8);
  ctx.fillStyle='rgba(4,12,26,.95)';ctx.fill();
  ctx.strokeStyle=C.cyan;ctx.lineWidth=1.4;ctx.stroke();
  const shown=keyboard.value||'';
  text(shown,kx+26,panelY+59,17,'#eaf6ff','left','700');
  if((keyboard.blink%1)<0.55){
    ctx.font="700 17px 'Segoe UI',system-ui,sans-serif";
    const wdt=ctx.measureText(shown).width;
    ctx.fillStyle=C.cyan;ctx.fillRect(kx+27+wdt,panelY+48,2,22);
  }
  text(shown.length+'/'+keyboard.max,kx+kw-26,panelY+59,10,C.textDim,'right','600');
  const gap=4,kh=40;
  let ky=panelY+104;
  const drawKeyRow=(chars)=>{
    const n=chars.length;
    const kwid=(kw-(n-1)*gap)/n;
    for(let i=0;i<n;i++){
      const ch=chars[i];
      const bx=kx+i*(kwid+gap);
      rr(bx,ky,kwid,kh,6);
      ctx.fillStyle='rgba(16,42,78,.95)';ctx.fill();
      ctx.strokeStyle='rgba(63,208,255,.4)';ctx.lineWidth=1.1;ctx.stroke();
      const label=(/[A-Z]/.test(ch)&&keyboard.lower)?ch.toLowerCase():ch;
      text(label,bx+kwid/2,ky+kh/2,15,'#dff4ff','center','700');
      hitzones.push({x:bx,y:ky,w:kwid,h:kh,cb:()=>{
        if(keyboard.value.length<keyboard.max){keyboard.value+=label;sfx.place();}else sfx.err();
      }});
    }
    ky+=kh+gap;
  };
  drawKeyRow(KB_NUMS.split(''));
  if(keyboard.symbols){
    KB_SYM_ROWS.forEach(row=>drawKeyRow(row.split('')));
    // rangée vide pour aligner la hauteur avec le mode lettres (3 rangées)
  }else{
    KB_ROWS.forEach(row=>drawKeyRow(row.split('')));
  }
  const cw=(kw-3*gap);
  const caseW=cw*0.19,symW=cw*0.19,spaceW=cw*0.40,delW=cw*0.22;
  let cxp=kx;
  // Bascule Maj/min (uniquement en mode lettres)
  rr(cxp,ky,caseW,kh,6);
  ctx.fillStyle=keyboard.lower?'rgba(16,42,78,.95)':'rgba(63,208,255,.30)';ctx.fill();
  ctx.strokeStyle='rgba(63,208,255,.4)';ctx.lineWidth=1.1;ctx.stroke();
  text(keyboard.lower?'abc':'ABC',cxp+caseW/2,ky+kh/2,11,keyboard.lower?'#dff4ff':C.cyan,'center','800');
  hitzones.push({x:cxp,y:ky,w:caseW,h:kh,cb:()=>{keyboard.lower=!keyboard.lower;sfx.click();}});
  cxp+=caseW+gap;
  // Bascule lettres <-> symboles
  rr(cxp,ky,symW,kh,6);
  ctx.fillStyle=keyboard.symbols?'rgba(63,208,255,.30)':'rgba(16,42,78,.95)';ctx.fill();
  ctx.strokeStyle='rgba(63,208,255,.4)';ctx.lineWidth=1.1;ctx.stroke();
  text(keyboard.symbols?'ABC':'#+=',cxp+symW/2,ky+kh/2,12,keyboard.symbols?C.cyan:'#dff4ff','center','800');
  hitzones.push({x:cxp,y:ky,w:symW,h:kh,cb:()=>{keyboard.symbols=!keyboard.symbols;sfx.click();}});
  cxp+=symW+gap;
  rr(cxp,ky,spaceW,kh,6);ctx.fillStyle='rgba(16,42,78,.95)';ctx.fill();
  ctx.strokeStyle='rgba(63,208,255,.4)';ctx.lineWidth=1.1;ctx.stroke();
  text('SPACE',cxp+spaceW/2,ky+kh/2,11,'#dff4ff','center','700');
  hitzones.push({x:cxp,y:ky,w:spaceW,h:kh,cb:()=>{
    if(keyboard.value.length<keyboard.max&&keyboard.value.length>0&&keyboard.value.slice(-1)!==' '){keyboard.value+=' ';sfx.place();}
  }});
  cxp+=spaceW+gap;
  rr(cxp,ky,delW,kh,6);ctx.fillStyle='rgba(78,26,36,.95)';ctx.fill();
  ctx.strokeStyle='rgba(255,120,120,.5)';ctx.lineWidth=1.1;ctx.stroke();
  text('DEL',cxp+delW/2,ky+kh/2,12,'#ffd4d4','center','700');
  hitzones.push({x:cxp,y:ky,w:delW,h:kh,cb:()=>{keyboard.value=keyboard.value.slice(0,-1);sfx.del();}});
  ky+=kh+12;
  const half=(kw-gap)/2;
  button(kx,ky,half,46,'CANCEL',()=>{keyboard=null;},{accent:C.lock,size:14});
  const ok=keyboard.value.trim().length>0;
  button(kx+half+gap,ky,half,46,'CONFIRM',()=>{
    const v=keyboard.value.trim();
    if(!v){sfx.err();return;}
    const cb=keyboard.onConfirm;keyboard=null;cb(v);
  },{accent:ok?'#4dffa6':C.lock,disabled:!ok,size:14});
}

/* Virus décoratif */
function drawVirus(cx,cy,r,color,spikes=12,phase=0){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(phase*.25);
  ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,r*.09);
  ctx.shadowColor=color;ctx.shadowBlur=12;
  for(let i=0;i<spikes;i++){
    const a=(i/spikes)*Math.PI*2;
    const x1=Math.cos(a)*r,y1=Math.sin(a)*r;
    const x2=Math.cos(a)*r*1.42,y2=Math.sin(a)*r*1.42;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.beginPath();ctx.arc(x2,y2,r*.13,0,7);ctx.fillStyle=color;ctx.fill();
  }
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
  g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=r*.07;
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  // capsomères
  ctx.fillStyle='rgba(255,255,255,.18)';
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+phase*.4;
    ctx.beginPath();ctx.arc(Math.cos(a)*r*.5,Math.sin(a)*r*.5,r*.14,0,7);ctx.fill();
  }
  ctx.restore();
}

/* Châssis métallique autour de la boîte de Petri */
function drawChassis(){
  const R=arenaR;
  // anneau externe
  ctx.save();
  const g=ctx.createLinearGradient(arenaCX-R,arenaCY-R,arenaCX+R,arenaCY+R);
  g.addColorStop(0,'#1c3550');g.addColorStop(.5,'#0d1e34');g.addColorStop(1,'#16283f');
  ctx.beginPath();ctx.arc(arenaCX,arenaCY,R+22,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(63,208,255,.5)';ctx.lineWidth=2;ctx.stroke();
  // segments techniques
  ctx.strokeStyle='rgba(63,208,255,.35)';ctx.lineWidth=3;
  for(let i=0;i<8;i++){
    const a0=(i/8)*Math.PI*2+.12,a1=a0+.55;
    ctx.beginPath();ctx.arc(arenaCX,arenaCY,R+15,a0,a1);ctx.stroke();
  }
  // vis
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2+Math.PI/4;
    const vx=arenaCX+Math.cos(a)*(R+16),vy=arenaCY+Math.sin(a)*(R+16);
    ctx.beginPath();ctx.arc(vx,vy,4.5,0,7);ctx.fillStyle='#294863';ctx.fill();
    ctx.strokeStyle='rgba(150,200,240,.5)';ctx.lineWidth=1;ctx.stroke();
  }
  // anneau interne lumineux
  ctx.beginPath();ctx.arc(arenaCX,arenaCY,R+6,0,7);
  ctx.strokeStyle=C.cyan;ctx.lineWidth=2.5;ctx.shadowColor=C.cyan;ctx.shadowBlur=18;ctx.stroke();
  ctx.shadowBlur=0;
  ctx.restore();
}

/* Barre de territoire */
function territoryBar(x,y,w,h,pRatio,eRatio,pColor){
  rr(x,y,w,h,h/2);ctx.fillStyle='rgba(6,14,28,.9)';ctx.fill();
  ctx.save();rr(x,y,w,h,h/2);ctx.clip();
  const pw=w*pRatio;
  const gp=ctx.createLinearGradient(x,y,x+pw,y);
  gp.addColorStop(0,pColor);gp.addColorStop(1,'rgba(255,255,255,.85)');
  ctx.fillStyle=gp;ctx.fillRect(x,y,pw,h);
  const ew=w*eRatio;
  const ge=ctx.createLinearGradient(x+w-ew,y,x+w,y);
  ge.addColorStop(0,'rgba(255,255,255,.7)');ge.addColorStop(1,C.red);
  ctx.fillStyle=ge;ctx.fillRect(x+w-ew,y,ew,h);
  ctx.restore();
  rr(x,y,w,h,h/2);ctx.strokeStyle='rgba(63,208,255,.4)';ctx.lineWidth=1.2;ctx.stroke();
}

// Barre de territoire VERTICALE, couleurs pleines (ennemi en haut, joueur en bas).
// Anneau de territoire autour de la boîte : se remplit du BAS (joueur) et du
// HAUT (ennemi), les deux arcs se rejoignant selon le % de colonisation.
// Un léger gap sépare l'anneau du bord de la boîte.
function drawTerritoryRing(cx,cy,radius,pRatio,eRatio,pColor,eColor){
  eColor=eColor||C.red;
  const lw=9;
  const rr2=radius+14; // rayon de l'anneau (léger gap avec la boîte)
  // fond de l'anneau
  ctx.beginPath();ctx.arc(cx,cy,rr2,0,Math.PI*2);
  ctx.strokeStyle='rgba(10,20,40,.9)';ctx.lineWidth=lw+4;ctx.stroke();
  // Le joueur remplit depuis le bas (angle PI/2) vers le haut des deux côtés.
  // L'ennemi remplit depuis le haut (angle -PI/2) vers le bas des deux côtés.
  // Chaque camp occupe une fraction de la circonférence = son ratio.
  const bottom=Math.PI/2, top=-Math.PI/2;
  const pHalf=pRatio*Math.PI;   // demi-arc joueur de chaque côté
  const eHalf=eRatio*Math.PI;
  // joueur : deux arcs partant du bas
  ctx.lineCap='round';
  ctx.strokeStyle=pColor;ctx.lineWidth=lw;ctx.shadowColor=pColor;ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(cx,cy,rr2,bottom,bottom+pHalf);ctx.stroke();          // bas -> droite
  ctx.beginPath();ctx.arc(cx,cy,rr2,bottom-pHalf,bottom,false);ctx.stroke();     // gauche -> bas
  // ennemi : deux arcs partant du haut
  ctx.strokeStyle=eColor;ctx.shadowColor=eColor;
  ctx.beginPath();ctx.arc(cx,cy,rr2,top,top+eHalf);ctx.stroke();                 // haut -> droite
  ctx.beginPath();ctx.arc(cx,cy,rr2,top-eHalf,top,false);ctx.stroke();           // gauche -> haut
  ctx.shadowBlur=0;ctx.lineCap='butt';
}

function vTerritoryBar(x,y,w,h,pRatio,eRatio,pColor){
  rr(x,y,w,h,w/2);ctx.fillStyle='rgba(6,14,28,.9)';ctx.fill();
  ctx.save();rr(x,y,w,h,w/2);ctx.clip();
  // ennemi en haut (rouge plein)
  const eh=h*eRatio;
  ctx.fillStyle=C.red;ctx.fillRect(x,y,w,eh);
  // joueur en bas (couleur pleine)
  const ph=h*pRatio;
  ctx.fillStyle=pColor;ctx.fillRect(x,y+h-ph,w,ph);
  // ligne de front nette
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x,y+eh-1,w,2);
  ctx.restore();
  rr(x,y,w,h,w/2);ctx.strokeStyle='rgba(63,208,255,.4)';ctx.lineWidth=1.2;ctx.stroke();
}

/* Scroll générique */
let scroll={y:0,max:0,dragging:false,lastY:0,vel:0,moved:0};
function resetScroll(){scroll.y=0;scroll.max=0;scroll.vel=0;scroll.moved=0;}
function applyScrollPhysics(){
  if(!scroll.dragging){
    scroll.y+=scroll.vel;scroll.vel*=.9;
    if(Math.abs(scroll.vel)<.1)scroll.vel=0;
  }
  scroll.y=Math.max(0,Math.min(scroll.max,scroll.y));
}

/* Header commun */
function header(title,backTo){
  panel(0,0,W,64,'rgba(63,208,255,.25)','rgba(6,16,34,.95)',0);
  text(title,W/2,32,21,C.text,'center','800',10);
  if(backTo!==null){
    // Pendant l'onboarding, Back n'est cliquable que si c'est l'étape 'back_menu'.
    const onbBack=onbActive();
    const backIsTarget=onbTarget('back_menu');
    const backLocked=onbBack&&!backIsTarget;
    const bkW=68,bkX=12,bkY=15,bkH=34;
    if(backIsTarget)onbHighlight('back_menu',bkX,bkY,bkW,bkH,10);
    if(backLocked)ctx.globalAlpha=0.4;
    const g=ctx.createLinearGradient(bkX,bkY,bkX,bkY+bkH);
    g.addColorStop(0,'rgba(20,52,96,.95)');g.addColorStop(1,'rgba(10,28,58,.95)');

  drawBackground();

  if(!v){go(P.VIRUSES);return;}
  header(v.name.toUpperCase(),P.VIRUSES);

  const used=slotCost(v.actions);
  const over=used>slotBudget();

  // Zone scrollable (au-dessus des boutons fixes du bas)
  const top=70, btnZone=64, visH=H-top-btnZone;
  applyScrollPhysics();
  ctx.save();ctx.beginPath();ctx.rect(0,top,W,visH);ctx.clip();
  let y=top+4-scroll.y;

  // Jauge de slots
  panel(16,y,W-32,44,over?C.red:'rgba(63,208,255,.25)');
  text('GENOME BUDGET',26,y+14,10,C.textDim,'left','700');
  text(`${used} / ${slotBudget()}`,W-26,y+14,13,over?C.red:C.gold,'right','800',6);

  ctx.save();rr(26,y+26,bwid,8,4);ctx.clip();
  const gg=ctx.createLinearGradient(26,0,26+bwid,0);

  ctx.fillStyle=gg;ctx.fillRect(26,y+26,bwid*Math.min(1,used/slotBudget()),8);
  ctx.restore();
  y+=58;

  // Séquence
  text('SEQUENCE',20,y,11,C.textDim,'left','700');
  text('tap a slot to remove',W-20,y,10,C.textDim,'right','500');
  const cols=5,cs=54,gap=6;
  const gx=W/2-(cols*cs+(cols-1)*gap)/2;
  const gy=y+14;
  for(let i=0;i<MAX_SEQ;i++){
    const cx=gx+(i%cols)*(cs+gap),cy=gy+Math.floor(i/cols)*(cs+gap);
    const a=v.actions[i];
    rr(cx,cy,cs,cs,8);
    ctx.fillStyle=a?'rgba(20,50,92,.92)':'rgba(10,20,38,.55)';ctx.fill();
    ctx.strokeStyle=a?v.color:'rgba(63,208,255,.15)';ctx.lineWidth=a?1.6:1;
    ctx.setLineDash(a?[]:[3,3]);ctx.stroke();ctx.setLineDash([]);
    if(a){
      text(ACTIONS[a].icon,cx+cs/2,cy+cs/2-4,22,ACT_COLOR[a]||v.color,'center','700',6);
      text(String(ACTIONS[a].slot),cx+cs-9,cy+10,9,C.gold,'center','800');
      const ii=i;
      hitzones.push({x:cx,y:cy,w:cs,h:cs,cb:()=>{v.actions.splice(ii,1);save();sfx.del();}});
    }else{
      // numéro du slot vide, plus visible
      text(String(i+1),cx+cs/2,cy+cs/2,15,'rgba(120,160,210,.6)','center','800');
    }
  }
  y=gy+4*(cs+gap)+14;

  // Palette — cases carrées façon séquence, uniquement les actions débloquées
  text('AVAILABLE ACTIONS',20,y,11,C.textDim,'left','700');
  const unlockedActs=D.unlocked.filter(k=>ACTIONS[k]);
  const pcols=5,pw=54;
  const px0=W/2-(pcols*pw+(pcols-1)*gap)/2;
  const palTop=y+16;
  unlockedActs.forEach((key,i)=>{
    const a=ACTIONS[key];
    const cx=px0+(i%pcols)*(pw+gap),cy=palTop+Math.floor(i/pcols)*(pw+gap);
    const wouldOver=used+a.slot>slotBudget();
    const full=v.actions.length>=MAX_SEQ;
    const blocked=wouldOver||full;
    const ac=ACT_COLOR[key]||C.cyan;
    // case (même look que la séquence)
    rr(cx,cy,pw,pw,8);
    ctx.fillStyle=blocked?'rgba(10,20,38,.6)':'rgba(20,50,92,.92)';ctx.fill();
    ctx.strokeStyle=blocked?C.lock:ac;ctx.lineWidth=1.6;ctx.stroke();
    text(a.icon,cx+pw/2,cy+pw*0.40,22,blocked?C.textDim:ac,'center','700',6);
    text(a.name.slice(0,7),cx+pw/2,cy+pw-9,7.5,C.textDim,'center','600');
    // badge coût en slot
    text(String(a.slot),cx+pw-9,cy+10,9,C.gold,'center','800');
    hitzones.push({x:cx,y:cy,w:pw,h:pw,cb:()=>{
      if(full){notify('Sequence full (20)');sfx.err();return;}
      if(used+a.slot>slotBudget()){notify('Genome budget exceeded');sfx.err();return;}
      v.actions.push(key);save();sfx.place();
    }});
  });
  const palRows=Math.max(1,Math.ceil(unlockedActs.length/pcols));
  y=palTop+palRows*(pw+gap)+20;  // marge nette avant le guide

  // === GUIDE DES ACTIONS (rappel de ce que fait chaque génome, style Labo) ===
  text('WHAT EACH ACTION DOES',20,y,11,C.dna,'left','700',3);
  y+=18;
  D.unlocked.forEach((key)=>{
    const a=ACTIONS[key];if(!a)return;
    const ac=ACT_COLOR[key]||C.cyan;
    // hauteur adaptée à la description
    ctx.font="500 11px 'Segoe UI',system-ui,sans-serif";
    const words=a.desc.split(' ');const rows=[];let ln='';
    for(const wd of words){if(ctx.measureText(ln+wd).width>W-108){rows.push(ln);ln=wd+' ';}else ln+=wd+' ';}
    if(ln)rows.push(ln);
    const rh=Math.max(46,18+rows.length*14);
    panel(16,y,W-32,rh,'rgba(63,208,255,.18)','rgba(8,20,42,.85)',10);
    // pastille icône
    rr(26,y+9,34,34,8);ctx.fillStyle='rgba(16,40,74,.9)';ctx.fill();
    ctx.strokeStyle=ac;ctx.lineWidth=1.2;ctx.stroke();
    text(a.icon,43,y+26,17,ac,'center','700',4);
    // nom + coût
    text(a.name,72,y+18,13,C.text,'left','800');
    text(a.slot+' slot'+(a.slot>1?'s':''),W-24,y+18,10,C.gold,'right','700');
    // description
    rows.forEach((rw,i)=>text(rw,72,y+34+i*14,11,C.textDim,'left','500'));
    y+=rh+7;
  });
  y+=6;

  ctx.restore();
  scroll.max=Math.max(0,(y+scroll.y)-(H-btnZone)+10);

  // === Boutons fixes en bas ===
  const by=H-56;
  button(16,by,120,44,'APPEARANCE',()=>{go(P.APPEARANCE);});
  button(146,by,140,44,'CLEAR',()=>{v.actions=[];save();sfx.del();notify('Sequence cleared');},{accent:C.red});
  if(onbTarget('edit_deploy'))onbHighlight('edit_deploy',296,by,138,44,10);
  button(296,by,138,44,'DEPLOY',()=>{
    if(!v.actions.length){notify('Sequence is empty');sfx.err();return;}
    D.selected=editIndex;save();
    onbAdvance('edit_deploy');
    go(P.CAMPAIGN);
  },{accent:C.gold});
}

   so no two players need to be online at once.

// Élo simplifié : score dérivé des victoires/défaites d'arène.
function arenaScore(){
  return Math.max(0,1000+(D.arenaWins|0)*25-(D.arenaLosses|0)*10);
}

let arenaState={loading:false,error:null,roster:null,fetchedAt:0,mode:'ranked'};

function arenaHeaders(){
  return{'Content-Type':'application/json','apikey':ARENA_CONFIG.key,'Authorization':'Bearer '+ARENA_CONFIG.key};
}
function arenaConfigured(){return !!(ARENA_CONFIG.url&&ARENA_CONFIG.key);}

async function arenaFetchRoster(){
  if(!arenaConfigured()){arenaState.roster=ARENA_FALLBACK.slice();return;}
  arenaState.loading=true;arenaState.error=null;
  try{
    const u=ARENA_CONFIG.url+'/rest/v1/'+ARENA_CONFIG.table+'?select=*&order=wins.desc&limit=25';
    const r=await fetch(u,{headers:arenaHeaders()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();
    arenaState.roster=(rows&&rows.length?rows:ARENA_FALLBACK).map(normaliseArenaRow);
  }catch(e){
    arenaState.error='Offline \u2014 showing local roster';
    arenaState.roster=ARENA_FALLBACK.slice();
  }finally{
    arenaState.loading=false;arenaState.fetchedAt=Date.now();
  }
}
function normaliseArenaRow(r){
  return{
    id:r.id||('row_'+Math.random().toString(36).slice(2)),
    name:(r.name||'Unknown').slice(0,16),
    author:r.author||'anon',
    wins:r.wins|0,
    genome:Array.isArray(r.genome)?r.genome:(typeof r.genome==='string'?JSON.parse(r.genome):['avancer','avancer','tournerD','avancer']),
    look:normaliseLook(typeof r.look==='string'?JSON.parse(r.look):r.look,0)
  };
}

async function arenaPublish(strain){
  const payload={
    author_id:arenaPlayerId(),
    name:strain.name,
    author:strain.name,
    genome:JSON.stringify(strain.actions),
    look:JSON.stringify(strain.look),
    wins:0
  };
  if(!arenaConfigured()){notify('Arena not configured yet');return false;}
  try{
    const u=ARENA_CONFIG.url+'/rest/v1/'+ARENA_CONFIG.table;
    const r=await fetch(u,{method:'POST',headers:Object.assign(arenaHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(payload)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    notify('Strain published to Arena');return true;
  }catch(e){notify('Publish failed \u2014 try later');return false;}
}

async function arenaRecordWin(rowId){
  if(!arenaConfigured())return;
  try{
    // increment wins via RPC-less patch: read then write (best-effort)
    const u=ARENA_CONFIG.url+'/rest/v1/'+ARENA_CONFIG.table+'?id=eq.'+encodeURIComponent(rowId);
    const cur=await (await fetch(u+'&select=wins',{headers:arenaHeaders()})).json();
    const w=(cur&&cur[0]?cur[0].wins|0:0)+1;
    await fetch(u,{method:'PATCH',headers:arenaHeaders(),body:JSON.stringify({wins:w})});
  }catch(e){/* silent */}
}

const USE_INTERACTIVE_TUTORIAL=true;

// Each stage: what to show, which control is live, and when it completes.
// gate(): returns true once the required action has been done.
const ITUT=[

   cta:'BEGIN'},
  {id:'explain-loop',

  {id:'add-turn',

  {id:'add-fourth',

let itutStage=0;
let itutStrain=null; // built in-place before being committed to D.virusList

function itutTarget(){return ITUT[Math.min(itutStage,ITUT.length-1)];}

function ensureItutStrain(){
  if(!itutStrain){
    const look=defaultLook(0);
    itutStrain={name:'Strain Alpha',actions:[],look:look,color:paletteById(look.palette).main};

}

function drawTutorial(dt){

  ensureItutStrain();

  // --- Instruction card (bigger text, taller) ---
  panel(16,216,W-32,150,C.cyan,'rgba(6,18,38,.96)',14);
  text('STEP '+(itutStage+1)+' / '+ITUT.length,36,242,11,C.gold,'left','800');

  const paletteY=414;

  const keys=['avancer','tournerG','tournerD'];

  keys.forEach((key,i)=>{
    const bx=W/2-totalPW/2+i*(pw2+pg2),by=paletteY;

    ctx.fillStyle=focused?'rgba(63,208,255,.20)':'rgba(12,28,54,.9)';ctx.fill();

  // --- Bottom row : Back arrow + CTA/name, closer to the actions ---

  if(canBack)hitzones.push({x:24,y:btnY+4,w:52,h:46,cb:()=>{backItut();}});

    ctx.strokeStyle=C.cyan;ctx.lineWidth=2.2;
    ctx.shadowColor=C.cyan;ctx.shadowBlur=14+Math.sin(T*4)*5;ctx.stroke();ctx.shadowBlur=0;

    hitzones.push({x:mainX,y:btnY,w:mainW,h:54,cb:()=>{
      openKeyboard('Name your virus','Strain Alpha',16,val=>{
        itutStrain.name=val;save();advanceItut();
      });
    }});
  }
}

function backItut(){
  if(itutStage<=0)return;
  // if the previous step added an action, remove it so the sequence stays in sync
  const prev=ITUT[itutStage-1];
  if(prev&&prev.focus&&prev.focus.indexOf('palette-')===0&&itutStrain.actions.length>0){
    itutStrain.actions.pop();
  }
  itutStage--;save();sfx.click();
}

function advanceItut(){
  itutStage++;
  if(itutStage>=ITUT.length)itutStage=ITUT.length-1;
  save();sfx.click();
}
function commitItut(){
  // finalise the built strain
  if(itutStrain.actions.length<4){
    itutStrain.actions=['avancer','avancer','tournerD','avancer'];
  }
  D.virusList=[itutStrain];D.selected=0;editIndex=0;
  D.tutorial=99;itutStrain=null;itutStage=0;
  D.onboardLab=true; // afficher l'indice "va au Labo" une fois, au menu
  save();sfx.unlock();notify('Strain Alpha created');
  go(P.MAIN);
}

function drawTutorialDish(cx,cy,phase){
  const r=64;
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r+10,0,7);
  ctx.fillStyle='rgba(14,34,60,.9)';ctx.fill();
  ctx.strokeStyle=C.cyan;ctx.lineWidth=2.4;
  ctx.shadowColor=C.cyan;ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();
  ctx.fillStyle='#071626';ctx.fillRect(cx-r,cy-r,r*2,r*2);
  // animated fill from both sides
  const t=(Math.sin(phase*.8)*.5+.5)*.35+.30;
  ctx.fillStyle=C.cyan+'cc';
  ctx.fillRect(cx-r,cy+r-(r*2*t),r*2,r*2*t);
  ctx.fillStyle=C.red+'cc';
  ctx.fillRect(cx-r,cy-r,r*2,r*2*(1-t)*0.72);
  // grid texture
  ctx.strokeStyle='rgba(0,0,0,.20)';ctx.lineWidth=1;
  for(let g=-r;g<r;g+=5){
    ctx.beginPath();ctx.moveTo(cx-r,cy+g);ctx.lineTo(cx+r,cy+g);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+g,cy-r);ctx.lineTo(cx+g,cy+r);ctx.stroke();
  }
  ctx.restore();
  text(Math.round(t*100)+'%',cx-r-6,cy+r+22,12,C.cyan,'right','800');
  text(Math.round((1-t)*72)+'%',cx+r+6,cy+r+22,12,C.red,'left','800');
}

/* ---------------- LABORATOIRE ---------------- */
function drawLab(dt){
  drawBackground();header('LAB',P.MAIN);
  const top=72,visH=H-top-8;
  applyScrollPhysics();
  const now=Date.now();

  ctx.save();ctx.beginPath();ctx.rect(0,top,W,visH);ctx.clip();
  let y=top+8-scroll.y;
  const rowH=88;

  // === SECTION CAPACITÉ DE GÉNOME ===
  if(y+24>top-4&&y<H+4){
    text('GENOME CAPACITY',24,y+8,12,C.dna,'left','800',4);
    text(slotBudget()+' slots',W-24,y+8,11,C.textDim,'right','700');
    ctx.strokeStyle='rgba(196,139,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(24,y+18);ctx.lineTo(W-24,y+18);ctx.stroke();
  }
  y+=30;
  // ne montrer que le PROCHAIN palier non débloqué (progression séquentielle)
  let nextCap=null;
  for(const u of CAPACITY_UPGRADES){if(!D.unlocked.includes(u.id)){nextCap=u;break;}}
  CAPACITY_UPGRADES.forEach((u,ui)=>{
    const owned=D.unlocked.includes(u.id);
    const end=D.research[u.id];
    const researching=!!end&&end>now;
    const done=!!end&&end<=now;
    if(done&&!owned){D.unlocked.push(u.id);delete D.research[u.id];save();sfx.unlock();notify('Genome capacity +'+u.bonus);}
    // afficher : les paliers possédés + uniquement le prochain disponible
    const isNext=(nextCap&&nextCap.id===u.id);
    if(!owned&&!isNext&&!researching){return;}
    if(y+rowH>top-4&&y<H+4){
      const accent=owned?'#4dffa6':(researching?C.gold:C.dna);
      panel(16,y,W-32,rowH-8,owned?'rgba(77,255,166,.4)':'rgba(196,139,255,.3)','rgba(14,8,30,.92)',10);
      rr(28,y+12,50,50,10);ctx.fillStyle='rgba(30,16,54,.9)';ctx.fill();
      ctx.strokeStyle=accent;ctx.lineWidth=1.4;ctx.stroke();
      icoDna(53,y+37,26,accent);
      text('+'+u.bonus+' SLOTS',90,y+24,15,C.text,'left','800');
      text('Expand your genome budget to '+(SLOT_BUDGET_BASE+CAPACITY_UPGRADES.slice(0,ui+1).reduce((a,x)=>a+x.bonus,0))+' slots.',90,y+46,10,C.textDim,'left','500');
      if(owned){
        text('OWNED',W-56,y+40,11,'#4dffa6','center','800',6);
      }else if(researching){
        const left=Math.ceil((end-now)/1000);const m=Math.floor(left/60),ss=left%60;
        text(m+':'+String(ss).padStart(2,'0'),W-56,y+30,14,C.gold,'center','800',6);
        rr(W-90,y+44,68,22,6);ctx.fillStyle='rgba(60,50,10,.9)';ctx.fill();
        ctx.strokeStyle=C.gold;ctx.lineWidth=1;ctx.stroke();
        text('SKIP',W-56,y+55,8.5,C.gold,'center','800');
        hitzones.push({x:W-90,y:y+44,w:68,h:22,cb:()=>{
          openDialog('Skip research','Watch a short ad to finish this instantly?','WATCH AD',()=>{D.research[u.id]=Date.now()-1;save();sfx.unlock();});
        }});
      }else{
        const afford=D.dna>=u.cost;
        // pendant l'onboarding, seul le tout premier palier (cap0) est achetable
        const onbBlocked=onbActive()&&u.id!=='cap0';
        const isOnbTarget=onbTarget('lab_cap')&&u.id==='cap0';
        if(isOnbTarget)onbHighlight('lab_cap',W-96,y+24,78,38,8);
        if(onbBlocked)ctx.globalAlpha=0.4;
        rr(W-94,y+26,74,34,8);
        ctx.fillStyle=afford&&!onbBlocked?'rgba(40,20,72,.95)':'rgba(30,36,50,.8)';ctx.fill();
        ctx.strokeStyle=(afford&&!onbBlocked)?C.dna:C.lock;ctx.lineWidth=1.3;ctx.stroke();
        if(afford)dnaLabel(W-56,y+37,u.cost,12,'center');else text('\u2b22 '+u.cost,W-56,y+37,12,C.textDim,'center','800');
        text('RESEARCH',W-56,y+51,8,(afford&&!onbBlocked)?C.text:C.textDim,'center','700');
        ctx.globalAlpha=1;
        if(afford&&!onbBlocked)hitzones.push({x:W-94,y:y+26,w:74,h:34,cb:()=>{
          if(D.dna<u.cost){sfx.err();return;}
          D.dna-=u.cost;
          // pendant l'onboarding (ou time 0), débloquage instantané
          if(u.time<=0||onbActive()){
            D.unlocked.push(u.id);save();sfx.unlock();notify('Genome capacity +'+u.bonus);
            onbAdvance('lab_cap');
          }else{
            D.research[u.id]=Date.now()+u.time*1000;save();sfx.click();notify('Research started');
          }
        }});
      }
      y+=rowH;
    }else{y+=rowH;}
  });
  y+=8;

  LAB_TIERS.forEach((tier)=>{
    const unlockedInTier=tier.keys.filter(k=>D.unlocked.includes(k)).length;
    if(y+24>top-4&&y<H+4){
      text(tier.name,24,y+8,12,C.gold,'left','800',4);
      text(unlockedInTier+'/'+tier.keys.length,W-24,y+8,11,C.textDim,'right','700');
      ctx.strokeStyle='rgba(245,197,66,.25)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(24,y+18);ctx.lineTo(W-24,y+18);ctx.stroke();
    }
    y+=30;

    tier.keys.forEach(key=>{
      const a=ACTIONS[key];if(!a){return;}
      const owned=D.unlocked.includes(key);
      const end=D.research[key];
      const researching=!!end&&end>now;
      const done=!!end&&end<=now;
      if(done&&!owned){
        D.unlocked.push(key);delete D.research[key];save();sfx.unlock();notify(a.name+' unlocked');
      }
      if(y+rowH>top-4&&y<H+4){
        const accent=owned?'#4dffa6':(researching?C.gold:C.cyan);
        panel(16,y,W-32,rowH-8,owned?'rgba(77,255,166,.4)':'rgba(63,208,255,.22)','rgba(8,20,42,.92)',10);
        rr(28,y+12,50,50,10);ctx.fillStyle='rgba(16,38,70,.9)';ctx.fill();
        ctx.strokeStyle=accent;ctx.lineWidth=1.4;ctx.stroke();
        text(a.icon,53,y+37,24,ACT_COLOR[key]||accent,'center','700',8);
        text(a.name,90,y+22,15,C.text,'left','800');
        text(a.slot+' slot'+(a.slot>1?'s':''),90,y+40,10,C.gold,'left','700');
        ctx.font="500 10px 'Segoe UI',system-ui,sans-serif";
        const words=a.desc.split(' ');let line='',ly=y+56;
        for(const wd of words){
          if(ctx.measureText(line+wd).width>205){text(line,90,ly,10,C.textDim,'left','500');line=wd+' ';ly+=12;}
          else line+=wd+' ';
        }
        if(line)text(line,90,ly,10,C.textDim,'left','500');

        if(owned){
          text('UNLOCKED',W-56,y+40,11,'#4dffa6','center','800',6);
        }else if(researching){
          const left=Math.ceil((end-now)/1000);
          const m=Math.floor(left/60),ss=left%60;
          text(m+':'+String(ss).padStart(2,'0'),W-56,y+30,14,C.gold,'center','800',6);
          rr(W-90,y+44,68,22,6);ctx.fillStyle='rgba(60,50,10,.9)';ctx.fill();
          ctx.strokeStyle=C.gold;ctx.lineWidth=1;ctx.stroke();
          text('SKIP',W-56,y+55,8.5,C.gold,'center','800');
          hitzones.push({x:W-90,y:y+44,w:68,h:22,cb:()=>{
            openDialog('Skip research','Watch a short ad to finish this research instantly?','WATCH AD',()=>{
              D.research[key]=Date.now()-1;save();sfx.unlock();
            });
          }});
        }else{
          const afford=D.dna>=a.cost;
          // pendant l'onboarding, aucun achat d'action n'est autorisé
          const onbBlk=onbActive();
          const canBuy=afford&&!onbBlk;
          if(onbBlk)ctx.globalAlpha=0.4;
          rr(W-94,y+26,74,34,8);
          ctx.fillStyle=canBuy?'rgba(20,52,96,.95)':'rgba(30,36,50,.8)';ctx.fill();
          ctx.strokeStyle=canBuy?C.cyan:C.lock;ctx.lineWidth=1.3;ctx.stroke();
          if(afford)dnaLabel(W-56,y+37,a.cost,12,'center');else text('\u2b22 '+a.cost,W-56,y+37,12,C.textDim,'center','800');
          text('RESEARCH',W-56,y+51,8,canBuy?C.text:C.textDim,'center','700');
          ctx.globalAlpha=1;
          if(canBuy)hitzones.push({x:W-94,y:y+26,w:74,h:34,cb:()=>{
            if(D.dna<a.cost){sfx.err();return;}
            D.dna-=a.cost;D.research[key]=Date.now()+a.time*1000;save();sfx.click();
            notify('Research started');
          }});
        }
      }
      y+=rowH;
    });
    y+=8;
  });

  ctx.restore();
  scroll.max=Math.max(0,(y+scroll.y)-H+20);
}

/* ---------------- CAMPAGNE ---------------- */
function drawCampaign(dt){
  drawBackground();header('CAMPAIGN',P.MAIN);
  const top=70,visH=H-top-8;
  const nodeGap=88,pad=40;
  scroll.max=Math.max(0,30*nodeGap+pad*2-visH);
  if(campaignNeedsCenter){
    const targetY=pad+(29-(D.progress-1))*nodeGap;
    scroll.y=Math.max(0,Math.min(scroll.max,targetY-visH/2));
    campaignNeedsCenter=false;
  }
  applyScrollPhysics();

  ctx.save();ctx.beginPath();ctx.rect(0,top,W,visH);ctx.clip();

  // tracé serpentin
  ctx.strokeStyle='rgba(63,208,255,.18)';ctx.lineWidth=4;
  ctx.beginPath();
  for(let i=0;i<30;i++){
    const y=top+pad+(29-i)*nodeGap-scroll.y;
    const x=W/2+Math.sin(i*0.9)*76;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();

  for(let i=29;i>=0;i--){
    const lv=i+1;
    const y=top+pad+(29-i)*nodeGap-scroll.y;
    if(y<top-60||y>H+60)continue;
    const x=W/2+Math.sin(i*0.9)*76;
    const unlocked=lv<=D.progress;
    const isCurrent=lv===D.progress;
    const en=enemyAt(i);

    if(isCurrent){
      const pulse=1+Math.sin(T*3)*0.08;
      ctx.beginPath();ctx.arc(x,y,32*pulse,0,7);
      ctx.strokeStyle='rgba(245,197,66,.5)';ctx.lineWidth=2;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(x,y,26,0,7);
    const g=ctx.createRadialGradient(x-8,y-8,4,x,y,26);
    if(unlocked){g.addColorStop(0,'#2a6ea8');g.addColorStop(1,'#0d2748');}
    else{g.addColorStop(0,'#1a2436');g.addColorStop(1,'#0b1220');}
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=unlocked?(isCurrent?C.gold:C.cyan):C.lock;
    ctx.lineWidth=isCurrent?2.6:1.8;
    if(unlocked){ctx.shadowColor=isCurrent?C.gold:C.cyan;ctx.shadowBlur=12;}
    ctx.stroke();ctx.shadowBlur=0;

    if(unlocked){
      text(String(lv),x,y,17,C.text,'center','800',4);
      text(en.name,x+(x<W/2?40:-40),y,12,C.textDim,x<W/2?'left':'right','700');
      // surbrillance onboarding sur le niveau 1
      if(lv===1&&onbTarget('camp_lvl1'))onbHighlight('camp_lvl1',x-32,y-32,64,64,32);
      hitzones.push({x:x-30,y:y-30,w:60,h:60,cb:()=>{
        if(onbActive()&&!(lv===1&&onbTarget('camp_lvl1'))){sfx.err();return;}

    }
  }
  ctx.restore();

  // gradient de bord
  const gt=ctx.createLinearGradient(0,top,0,top+40);
  gt.addColorStop(0,'rgba(6,16,34,.95)');gt.addColorStop(1,'rgba(6,16,34,0)');
  ctx.fillStyle=gt;ctx.fillRect(0,top,W,40);
}
