<!DOCTYPE html>
<!--
  RAGE HOCKEY v3 — Ragequit Arcade
  Desktop/tablette : terrain 1080×600, paddles gauche/droite, souris.
  Mobile portrait   : terrain 600×1080, paddles haut/bas, doigt.
  Moteur de jeu identique à v2 (physique, IA, XP, défis, postMessage).
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Rage Hockey — Ragequit Arcade</title>
<style>
:root{
  --cyan:#00D9FF;--mag:#FF00FF;--gold:#FFD23F;
  --bg:#0A0E27;--panel:rgba(15,21,53,.95);
  --text:#f0f4ff;--muted:#6b7db3;
  --r-pill:999px;--r-card:14px;--r-btn:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;background:var(--bg);overflow:hidden;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
#stage{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:center;}
#game{display:block;width:100%!important;height:100%!important;}

/* ================================================================
   ÉCRANS OVERLAY
   ================================================================ */
.screen{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(7,10,28,.93);backdrop-filter:blur(8px);
  text-align:center;padding:16px 20px;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.screen.on{opacity:1;pointer-events:auto;}

/* ================================================================
   LOGO
   ================================================================ */
.logo{
  font-size:clamp(26px,5vw,50px);font-weight:900;
  letter-spacing:.02em;line-height:.9;text-transform:uppercase;
  margin-bottom:2px;
}
.logo .c{color:var(--cyan);text-shadow:0 0 28px rgba(0,217,255,.55);}
.logo .m{color:var(--mag);text-shadow:0 0 28px rgba(255,0,255,.55);}
.logo-sub{
  font-size:9px;letter-spacing:.34em;color:var(--muted);
  text-transform:uppercase;margin-bottom:18px;
}

/* ================================================================
   GRILLE MENU — 2 cols desktop, 1 col mobile
   ================================================================ */
.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:100%;
  max-width:640px;
}
@media(max-width:520px){.menu-grid{grid-template-columns:1fr;}}

/* Carte */
.mc{
  background:rgba(15,21,53,.85);
  border:1.5px solid rgba(0,217,255,.12);
  border-radius:var(--r-card);
  padding:14px 16px;
  display:flex;flex-direction:column;gap:9px;
}
.mc--full{grid-column:1/-1;}

/* Label de section */
.slabel{
  font-size:8.5px;letter-spacing:.28em;color:var(--muted);
  text-transform:uppercase;margin-bottom:2px;
}

/* ================================================================
   SEGMENTS PILL
   ================================================================ */
.seg{
  display:flex;
  background:rgba(0,0,0,.3);
  border-radius:var(--r-pill);
  padding:3px;
  border:1.5px solid rgba(107,125,179,.15);
}
.seg-btn{
  flex:1;padding:8px 4px;border-radius:var(--r-pill);
  background:transparent;border:none;cursor:pointer;
  font-family:inherit;font-size:10px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);transition:all .18s;white-space:nowrap;
}
.seg-btn:hover{color:var(--text);}
.seg-btn.on{background:rgba(0,217,255,.18);color:var(--cyan);}
.seg-btn.on-rage{background:rgba(255,68,68,.18)!important;color:#FF4444!important;}
.seg-btn.rage-hover:hover{color:#FF4444;}

/* ================================================================
   SKINS
   ================================================================ */
.skin-grid{display:flex;gap:8px;flex-wrap:wrap;}
.skin-btn{
  width:34px;height:34px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:all .15s;position:relative;flex-shrink:0;
}
.skin-btn.on{border-color:#fff;transform:scale(1.18);}
.skin-btn.locked{opacity:.35;cursor:not-allowed;}
.skin-lock{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:900;
  color:#fff;background:rgba(7,11,30,.7);border-radius:50%;
}

/* ================================================================
   ARÈNES
   ================================================================ */
.arena-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.arena-btn{
  padding:9px 4px;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.05);
  border:1.5px solid rgba(107,125,179,.2);
  color:var(--muted);font-family:inherit;font-size:10px;
  font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  transition:all .18s;text-align:center;
}
.arena-btn.on,.arena-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,217,255,.09);}
.arena-icon{
  display:block;
  width:28px;height:20px;
  margin:0 auto 4px;
  position:relative;
}
/* Classic : rectangle simple avec deux barres verticales (cages) */
.arena-icon--normal{
  border:2px solid currentColor;
  border-radius:3px;
}
.arena-icon--normal::before,.arena-icon--normal::after{
  content:'';position:absolute;top:4px;bottom:4px;width:2px;background:currentColor;opacity:.7;
}
.arena-icon--normal::before{left:4px;}
.arena-icon--normal::after{right:4px;}

/* Bumper : idem + cercle central */
.arena-icon--bumper{
  border:2px solid currentColor;border-radius:3px;
}
.arena-icon--bumper::before{
  content:'';position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;
  border:2px solid currentColor;opacity:.9;
}

/* Narrow : rectangle plus étroit */
.arena-icon--narrow{
  width:18px;margin:0 auto 4px;
  border:2px solid currentColor;border-radius:3px;
}

/* ================================================================
   BOUTONS
   ================================================================ */
.launch-row{display:flex;gap:10px;}
.btn{
  flex:1;padding:13px 12px;
  font-family:inherit;font-weight:800;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--bg);background:var(--cyan);border:none;
  border-radius:var(--r-pill);cursor:pointer;
  transition:transform .12s,box-shadow .12s,opacity .12s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,217,255,.4);}
.btn:active{transform:translateY(0);}
.btn--2p{background:var(--mag);color:#fff;}
.btn--2p:hover{box-shadow:0 8px 22px rgba(255,0,255,.4);}
.btn--ghost{
  background:transparent;color:var(--muted);
  border:1.5px solid rgba(107,125,179,.3);
}
.btn--ghost:hover{color:var(--text);}
.btn--ad{
  background:transparent;color:var(--gold);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn--ad:hover{box-shadow:0 8px 22px rgba(255,210,63,.3);}
.btn[disabled]{opacity:.35;pointer-events:none;}

/* ================================================================
   XP
   ================================================================ */
.xp-wrap{width:100%;}
.xp-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.xp-lv{font-size:10px;font-weight:900;color:var(--cyan);letter-spacing:.05em;}
.xp-num{font-size:9px;color:var(--muted);}
.xp-bar{height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,#00D9FF,#5BE0FF);border-radius:5px;transition:width .4s;}

/* ================================================================
   HINT
   ================================================================ */
.hint{font-size:10px;letter-spacing:.05em;color:var(--muted);line-height:1.7;}

/* ================================================================
   DAILY CHALLENGES LINK
   ================================================================ */
.link-btn{
  background:none;border:none;cursor:pointer;
  color:var(--cyan);font-family:inherit;font-size:10px;
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  border-bottom:1px dashed rgba(0,217,255,.4);padding:2px 0;
  align-self:flex-start;
}
.link-btn:hover{color:#fff;}

/* ================================================================
   ÉCRANS SECONDAIRES
   ================================================================ */
.big{
  font-size:clamp(28px,6vw,52px);font-weight:900;
  text-transform:uppercase;letter-spacing:.02em;
}
.score-final{margin-top:6px;font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,210,63,.5);}
.face{font-size:52px;line-height:1;margin-bottom:8px;}
.best-row{margin-top:8px;font-size:11px;letter-spacing:.12em;color:var(--muted);}
.screen-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:16px;}
/* ================================================================
   SÉLECTEUR BOOST (après pub)
   ================================================================ */
#boostSection{
  width:100%;
  background:rgba(15,21,53,.8);
  border:1.5px solid rgba(255,210,63,.2);
  border-radius:var(--r-card);
  padding:12px;
  display:flex;flex-direction:column;gap:8px;
}
.boost-header{
  font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);
  text-align:center;margin-bottom:2px;cursor:default;
}
.boost-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.boost-choice{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 6px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.05);
  border:1.5px solid rgba(107,125,179,.2);
  transition:all .18s;
}
.boost-choice:hover,.boost-choice.selected{
  border-color:var(--gold);
  background:rgba(255,210,63,.1);
}
.boost-choice-icon{font-size:20px;line-height:1;}
.boost-choice-name{
  font-size:9px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text);
}
.boost-choice-desc{font-size:8px;color:var(--muted);text-align:center;line-height:1.3;}
.boost-watch-btn{
  width:100%;padding:10px;
  background:transparent;color:var(--gold);
  border:2px solid var(--gold);
  border-radius:var(--r-pill);
  font-family:inherit;font-size:11px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  transition:all .18s;
}
.boost-watch-btn:hover{background:rgba(255,210,63,.12);}

/* ================================================================
   HUD
   ================================================================ */
#hudBtns{position:absolute;top:10px;right:10px;z-index:6;display:flex;gap:8px;}
.hud-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(15,21,53,.85);border:1.5px solid rgba(0,217,255,.28);
  color:var(--cyan);cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.hud-btn:hover{background:var(--cyan);color:var(--bg);}

/* ================================================================
   AD OVERLAY
   ================================================================ */
#adOverlay{
  position:absolute;inset:0;z-index:30;background:#05070f;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
#adOverlay.on{display:flex;}
.ad-tag{font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:18px;}
.ad-box{
  width:min(80%,360px);aspect-ratio:16/9;border-radius:12px;
  background:linear-gradient(135deg,#141a3d,#1a2250);
  border:1px solid rgba(0,217,255,.2);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;letter-spacing:.1em;
}
.ad-count{margin-top:20px;font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;}

/* ================================================================
   DÉFIS
   ================================================================ */
.chal-sub{font-size:10px;color:var(--muted);letter-spacing:.06em;margin:6px 0 14px;}
.chal-list{display:flex;flex-direction:column;gap:8px;width:300px;max-width:82vw;margin-bottom:16px;}
.chal-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid rgba(107,125,179,.22);text-align:left;
}
.chal-item.done{border-color:rgba(0,217,255,.5);background:rgba(0,217,255,.08);}
.chal-check{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;
  border:2px solid rgba(107,125,179,.4);color:transparent;
}
.chal-item.done .chal-check{border-color:var(--cyan);background:var(--cyan);color:var(--bg);}
.chal-text{flex:1;font-size:10px;color:#cdd6f4;line-height:1.4;}
.chal-item.done .chal-text{color:#fff;}
.chal-xp{font-size:9px;font-weight:900;color:#FFD23F;letter-spacing:.05em;white-space:nowrap;}
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>

<div id="hudBtns">
  <button class="hud-btn" id="btnSound" title="Sound">🔊</button>
  <button class="hud-btn" id="btnPause" title="Pause">⏸</button>
</div>

<!-- ============================================================
     ÉCRAN TITRE
     ============================================================ -->
<div id="screenStart" class="screen on">
  <div class="logo"><span class="c">RAGE</span> <span class="m">HOCKEY</span></div>
  <div class="logo-sub">Ragequit Arcade</div>

  <div class="menu-grid">

    <!-- Col gauche : mode + difficulté + lancement -->
    <div class="mc">
      <div class="slabel">Game mode</div>
      <div class="seg" id="typeRow">
        <button class="seg-btn on" data-type="classic">Classic</button>
        <button class="seg-btn" data-type="survival">Survival</button>
      </div>

      <div class="slabel">Difficulty</div>
      <div class="seg" id="diffRow">
        <button class="seg-btn" data-diff="chill">Chill</button>
        <button class="seg-btn on" data-diff="normal">Normal</button>
        <button class="seg-btn rage-hover" data-diff="rage">Rage</button>
      </div>

      <div class="hint" id="modeHint">
        <b style="color:var(--cyan)">1P:</b> mouse / finger &nbsp;·&nbsp;
        <b style="color:var(--mag)">2P:</b> right side or IJKL
      </div>
    </div>

    <!-- Col droite : skin + arène -->
    <div class="mc">
      <div class="slabel">Paddle color</div>
      <div class="skin-grid" id="skinRow"></div>

      <div class="slabel">Arena</div>
      <div class="arena-grid">
        <button class="arena-btn on" data-table="normal"><span class="arena-icon arena-icon--normal"></span>Classic</button>
        <button class="arena-btn" data-table="bumper"><span class="arena-icon arena-icon--bumper"></span>Bumper</button>
        <button class="arena-btn" data-table="narrow"><span class="arena-icon arena-icon--narrow"></span>Narrow</button>
      </div>
    </div>

    <!-- Ligne pleine : XP + lancement + défis -->
    <div class="mc mc--full" style="gap:11px;">
      <div class="xp-wrap" id="xpWrap"></div>
      <div class="launch-row">
        <button class="btn" id="btn1P">1 Player</button>
        <button class="btn btn--2p" id="btn2P">2 Players</button>
      </div>
      <button class="link-btn" id="btnChallenges">Daily challenges</button>
    </div>

  </div>
</div>

<!-- Défis -->
<div id="screenChallenges" class="screen">
  <div class="big" style="color:var(--cyan);font-size:22px">Daily Challenges</div>
  <div class="chal-sub">Resets every day. Complete them for bonus XP.</div>
  <div class="chal-list" id="chalList"></div>
  <button class="btn btn--ghost" id="btnChalBack" style="max-width:200px">Back</button>
</div>

<!-- Pause -->
<div id="screenPause" class="screen">
  <div class="big" style="color:var(--cyan)">Paused</div>
  <div class="screen-actions">
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn btn--ghost" id="btnQuit">Restart</button>
    <button class="btn btn--ghost" id="btnMenuPause">Menu</button>
  </div>
</div>

<!-- Game over -->
<div id="screenOver" class="screen">
  <div class="face" id="overFace">🏆</div>
  <div class="big" id="overTitle">You win</div>
  <div class="score-final" id="overScore">7 - 3</div>
  <div class="best-row" id="overBest"></div>
  <div class="screen-actions">
    <button class="btn" id="btnAgain">Play again</button>

    <!-- Sélecteur boost : 1) choisir le pouvoir 2) regarder la pub -->
    <div id="boostSection">
      <div class="boost-header">Choose your boost — then watch an ad (30s)</div>
      <div class="boost-choices" id="boostChoices">
        <button class="boost-choice" data-boost="power">
          <span class="boost-choice-icon">⚡</span>
          <span class="boost-choice-name">Power Hit</span>
          <span class="boost-choice-desc">Hit harder &amp; faster</span>
        </button>
        <button class="boost-choice" data-boost="small_goal">
          <span class="boost-choice-icon">🥅</span>
          <span class="boost-choice-name">Tiny Goal</span>
          <span class="boost-choice-desc">Your goal shrinks 40%</span>
        </button>
        <button class="boost-choice" data-boost="big">
          <span class="boost-choice-icon">◆</span>
          <span class="boost-choice-name">Big Paddle</span>
          <span class="boost-choice-desc">1.5× paddle size</span>
        </button>
      </div>
      <button class="boost-watch-btn" id="btnWatchAd">▶ Watch ad &amp; activate</button>
    </div>

    <button class="btn btn--ghost" id="btnMenu">Menu</button>
  </div>
</div>

<!-- Pub -->
<div id="adOverlay">
  <div class="ad-tag">Advertisement</div>
  <div class="ad-box">Your ad here (AdSense)</div>
  <div class="ad-count" id="adCount">Reward in 5s...</div>
</div>

</div><!-- #stage -->
<script>
"use strict";
// ====================================================================
// RAGE HOCKEY v3 — Ragequit Arcade
// Moteur de jeu identique à v2. Seul ajout : mode portrait mobile natif.
// ====================================================================

// ---- Orientation ----
// Portrait : dimensions calculées depuis la fenêtre réelle pour que les cages soient visibles.
// Paysage  : canvas 1080×600 (16:9), paddles gauche/droite.
let PORTRAIT = false;
let LW = 1080, LH = 600;

// Marge de sécurité en portrait : laisser ~15% de chaque côté vertical
// pour que les cages restent visibles dans Safari/Chrome mobile.

function updateOrientation(){
  PORTRAIT = (window.innerWidth < 768 && window.innerHeight > window.innerWidth);
  if(PORTRAIT){
    // Largeur logique = 600 (fixe)
    // Hauteur logique = calée sur le ratio réel de l'écran, mais plafonnée à 900
    // pour que les cages restent dans le viewport avec les barres du navigateur
    const ratio = window.innerHeight / window.innerWidth;
    LW = 600;
    LH = Math.min(Math.round(LW * ratio), 900);
  } else {
    LW = 1080; LH = 600;
  }
}

// ---- Canvas ----
const cv  = document.getElementById("game");
const ctx = cv.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize(){
  updateOrientation();
  const st = document.getElementById("stage");
  const cw = st.clientWidth, ch = st.clientHeight;
  cv.style.width  = cw + "px";
  cv.style.height = ch + "px";
  cv.width  = Math.floor(cw * dpr);
  cv.height = Math.floor(ch * dpr);
  const sx = cv.width / LW, sy = cv.height / LH;
  const s  = Math.min(sx, sy);
  const ox = (cv.width  - s * LW) / 2;
  const oy = (cv.height - s * LH) / 2;
  ctx.setTransform(s, 0, 0, s, ox, oy);
  applyTable();
  if(state !== ST.PLAY) resetPos();
}
window.addEventListener("resize", resize);

// ---- Terrain (recalculé à chaque resize/orientation) ----
const PAD   = 30;   // marge paysage
const PAD_L = 16;   // marge latérale portrait (gauche/droite)
// PAD_V portrait = 2.2% de LH, calculé dynamiquement dans calcField
// Sur iPhone Safari (LH≈820) → ~18px → cages clairement dans le viewport
let FX, FY, FW, FH, CX, CY, CORNER;
const PR = 15, PADR = 27, WIN = 7;

function calcField(){
  const PAD_V = PORTRAIT ? Math.max(14, Math.round(LH * 0.022)) : PAD;
  FX = PORTRAIT ? PAD_L : PAD;
  FY = PORTRAIT ? PAD_V : PAD;
  FW = LW - FX * 2;
  FH = LH - FY * 2;
  CX = LW / 2; CY = LH / 2;
  CORNER = 50;
}

// ---- Tables ----
const TABLES = {
  normal: { label:"Classic", goalW:180, heightMod:1.0,  bumpers:[] },
  bumper: { label:"Bumper",  goalW:180, heightMod:1.0,  bumpers:[{x:0,y:0,r:22,vx:1.4,boostTimer:0}] },
  narrow: { label:"Narrow",  goalW:140, heightMod:0.62, bumpers:[] },
};
let tableKey = "normal";
let tableCfg = TABLES.normal;
let tFW, tFH, tFX, tFY_active;  // dimensions effectives (narrow peut réduire)
let tG1, tG2;                    // bornes du but joueur
let eG1, eG2;                    // bornes du but IA (peut être rétréci par boost)

function applyTable(){
  calcField();
  tableCfg = TABLES[tableKey];
  if(PORTRAIT){
    // En portrait : narrow réduit la largeur (axe X)
    tFW = Math.round(FW * tableCfg.heightMod);
    tFH = FH;
    tFX = FX + Math.round((FW - tFW) / 2);
    tFY_active = FY;
    // Buts sur le mur du haut (IA) et bas (joueur) : centrés en X
    // Cage IA = mur haut (taille normale)
    eG1 = CX - tableCfg.goalW / 2; eG2 = CX + tableCfg.goalW / 2;
    // Cage joueur = mur bas (rétrécit si smallGoalTimer — avantage défensif joueur)
    const pgw = smallGoalTimer > 0 ? tableCfg.goalW * 0.6 : tableCfg.goalW;
    tG1 = CX - pgw / 2; tG2 = CX + pgw / 2;
    if(tableCfg.bumpers.length > 0){
      tableCfg.bumpers[0].x = CX;
      tableCfg.bumpers[0].y = CY;
      // Initialiser vx seulement au premier appel (pas réinitialiser pendant la partie)
      if(!tableCfg.bumpers[0]._initialized){
        tableCfg.bumpers[0].vx = 1.4;
        tableCfg.bumpers[0].boostTimer = 180;
        tableCfg.bumpers[0]._initialized = true;
      }
    }
  } else {
    // Paysage : narrow réduit la hauteur (axe Y)
    tFW = FW;

function dailyChallenges(){
  const d=new Date();

  let s=seed; const picks=[]; const pool=[...ALL_CHALLENGES];
  for(let i=0;i<3&&pool.length;i++){
    s=(s*9301+49297)%233280;
    picks.push(pool.splice(Math.floor(s/233280*pool.length),1)[0]);
  }
  return picks;
}

const Sound=(function(){
  let actx=null, on=false;
  function ensure(){ if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); return actx; }
  function tone(freq,dur,type,vol){ if(!on)return; const c=ensure(),t=c.currentTime; const o=c.createOscillator(),g=c.createGain(); o.type=type||"square"; o.frequency.value=freq; g.gain.setValueAtTime(vol||0.16,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur); }
  const btn=document.getElementById("btnSound");
  function updateBtn(){ btn.innerHTML=on?"🔊":"🔇"; }
  return{
    toggle(){ on=!on; if(on)ensure(); updateBtn(); },
    enable(){ on=true; ensure(); updateBtn(); },
    hit(s){ tone(380+s*12,0.055,"square"); },
    wall(){ tone(220,0.045,"triangle",0.1); },
    goal(){ tone(130,0.28,"sawtooth",0.22); },
    win(){ [392,494,659].forEach((f,i)=>setTimeout(()=>tone(f,0.22,"sawtooth"),i*150)); },
  };
})();

function startBoost(type){

  // Il faut donc fixer boostType APRÈS l'appel à newGame(), sinon le choix
  // du joueur est écrasé et c'est toujours Power Hit qui s'active.
  newGame(gameMode);

  boostActive = true;
  boostTimer  = BOOST_DUR;
  // Appliquer l'effet spécial selon le boost choisi

function goal(who){
  if(state!==ST.PLAY) return;
  state=ST.GOAL; goalSlomo=40; Sound.goal(); addShake(10);
  if(gameType===GAMETYPE.SURVIVAL){
    if(who==="p"){ scoreP++; survivalTime+=60*3; if(aiLevel>0)aiLevel--; burst(puck.x,puck.y,"#FFD23F",28); setTimeout(()=>{ goalSlomo=0; resetPos(); resetPuck("e"); state=ST.PLAY; },900); }
    else          { setTimeout(()=>{ goalSlomo=0; over(); },1100); }
    return;
  }
  if(who==="p"){ scoreP++; currentStreak++; if(currentStreak>bestStreak){ bestStreak=currentStreak; localStorage.setItem("rh_streak",bestStreak); } }
  else         { scoreE++; aiLevel++; currentStreak=0; }
  burst(puck.x,puck.y,"#FFD23F",28);
  setTimeout(()=>{ goalSlomo=0; if(scoreP>=WIN||scoreE>=WIN) over(); else { resetPos(); resetPuck(who==="p"?"e":"p"); state=ST.PLAY; } },1200);
}

function updateEnemyPVE(){
  if(enemyFrozen>0){ enemy.vx=0; enemy.vy=0; return; }
  const spd=aiSpeed()*(boostActive&&boostType==="power"?0.8:1);
  if(PORTRAIT){
    // IA en haut — logique complète symétrique au paysage
    // Axe de jeu : Y (palet monte vers IA, descend vers joueur)
    const minX=tFX+PADR, maxX=tFX+tFW-PADR;
    const minY=FY+PADR,   maxY=CY-12;
    const homeY = FY + Math.round((CY-FY)*0.35); // position de repli défensive
    const CORNER_DEPTH = Math.round(LH * 0.12);   // zone de coin proportionnelle

    if(Math.random()<diffCfg.mistake&&aiMistake===0){ aiMistake=42; aiErrorY=(Math.random()-0.5)*30; }
    if(aiMistake>0) aiMistake--;
    const errX = aiMistake>0 ? aiErrorY : 0;  // erreur sur l'axe X (horizontal)

    // Détection coin : palet proche du mur IA ET d'un bord latéral
    const puckInCorner =
      puck.y < FY + CORNER_DEPTH &&
      (puck.x < tFX + CORNER_DEPTH || puck.x > tFX + tFW - CORNER_DEPTH);
    const distToPuck = hyp(enemy.x - puck.x, enemy.y - puck.y);
    const aiCrushingCorner = puckInCorner && distToPuck < PADR + PR + 20;

    let tx, ty;
    if(puckInCorner){
      if(aiCrushingCorner){
        // Retraite : l'IA recule vers le centre de son terrain
        const cornerX = puck.x < CX ? tFX + CORNER_DEPTH + 40 : tFX + tFW - CORNER_DEPTH - 40;
        tx = cornerX; ty = homeY + 30;
      } else {
        // Attend à distance du coin pour intercepter le rebond
        tx = clamp(puck.x, minX, maxX);
        ty = FY + CORNER_DEPTH + 20;
      }
    } else if(puck.y < CY){
      // Palet dans la moitié IA — elle attaque
      if(puck.vy < 0){
        // Palet qui monte vers elle : prédiction avec erreur humaine
        const frames = clamp((enemy.y - puck.y) / Math.max(0.5, Math.abs(puck.vy)), 1, 55);
        tx = clamp(puck.x + puck.vx * frames * aiReact() + errX, minX, maxX);
        ty = clamp(puck.y + puck.vy * frames * aiReact(), minY, maxY);
      } else {
        // Palet dans sa moitié mais qui redescend : elle suit latéralement + sort à sa rencontre
        const chase = aiReact();
        tx = clamp(puck.x * chase + CX * (1-chase) + errX, minX, maxX);
        // Elle descend légèrement vers le palet pour aller le chercher
        ty = clamp(puck.y - 20, minY, maxY);
      }
    } else {
      // Palet dans la moitié joueur (bas) : retour défensif
      // Elle se place en X alignée sur le palet, mais reste haute
      tx = clamp(puck.x * 0.55 + CX * 0.45, minX, maxX);
      ty = homeY;
    }

    const px=enemy.x, py=enemy.y;
    const dx=tx-enemy.x, dy=ty-enemy.y, d=hyp(dx,dy);
    if(d>0.1){ const st=Math.min(d,spd); enemy.x+=dx/d*st; enemy.y+=dy/d*st; }
    enemy.x=clamp(enemy.x,minX,maxX); enemy.y=clamp(enemy.y,minY,maxY);
    enemy.vx=enemy.x-px; enemy.vy=enemy.y-py;
  } else {
    // Paysage : logique originale complète avec gestion des coins
    const minX=CX+12, maxX=LW-FX-PADR;
    const minY=tFY_active+PADR, maxY=tFY_active+tFH-PADR;
    const homeX=LW-FX-150;
    if(Math.random()<diffCfg.mistake&&aiMistake===0&&puck.vx>0){ aiMistake=42; aiErrorY=(Math.random()-0.5)*26*2; }
    if(aiMistake>0) aiMistake--;
    const err=aiMistake>0?aiErrorY:0;
    const CORNER_DEPTH=110;
    const puckInCorner=puck.x>LW-FX-CORNER_DEPTH&&(puck.y<FY+CORNER_DEPTH||puck.y>FY+FH-CORNER_DEPTH);
    const distToPuck=hyp(enemy.x-puck.x,enemy.y-puck.y);
    const aiCrushingCorner=puckInCorner&&distToPuck<PADR+PR+20;
    let tx, ty;
    if(puckInCorner){
      if(aiCrushingCorner){ const cY=puck.y<CY?FY+CORNER_DEPTH+40:FY+FH-CORNER_DEPTH-40; tx=homeX-30; ty=cY; }
      else { tx=LW-FX-CORNER_DEPTH-20; ty=puck.y<CY?FY+CORNER_DEPTH+20:FY+FH-CORNER_DEPTH-20; }
    } else if(puck.x>CX&&puck.vx>0){
      const frames=clamp((enemy.x-puck.x)/Math.max(0.5,puck.vx),1,55);
      tx=clamp(puck.x+puck.vx*frames*aiReact(),minX,maxX);
      ty=clamp(puck.y+puck.vy*frames*aiReact()+err,minY,maxY);
    } else if(puck.x>CX){ tx=clamp(puck.x-10,minX,maxX-30); ty=clamp(puck.y+err,minY,maxY);
    } else { tx=homeX; ty=clamp(puck.y*.45+CY*.55,minY,maxY); }
    const px=enemy.x, py=enemy.y;
    const dx=tx-enemy.x, dy=ty-enemy.y, d=hyp(dx,dy);
    if(d>0.1){ const st=Math.min(d,spd); enemy.x+=dx/d*st; enemy.y+=dy/d*st; }
    enemy.x=clamp(enemy.x,minX,maxX); enemy.y=clamp(enemy.y,minY,maxY);
    enemy.vx=enemy.x-px; enemy.vy=enemy.y-py;
  }
}

function updateEnemyPVP(){ const px=enemy.x,py=enemy.y; updateP2keyboard(); enemy.x=p2x; enemy.y=p2y; enemy.vx=enemy.x-px; enemy.vy=enemy.y-py; }

function collidePaddle(pad,isP1){
  const dx=puck.x-pad.x, dy=puck.y-pad.y, d=hyp(dx,dy);
  const mn=puck.r+pad.r;
  if(d>=mn||d<0.01) return;
  const nx=dx/d, ny=dy/d;
  puck.x=pad.x+nx*mn; puck.y=pad.y+ny*mn;
  const boost=(isP1&&boostActive&&boostType==="power")?2.5:1.8;
  const mvx=pad.vx*boost, mvy=pad.vy*boost;
  const rvx=puck.vx-mvx, rvy=puck.vy-mvy;
  const dot=rvx*nx+rvy*ny; if(dot>=0) return;
  const rest=1.38, impulse=-(1+rest)*dot;
  puck.vx+=impulse*nx; puck.vy+=impulse*ny;
  const sp=hyp(puck.vx,puck.vy);
  const cap=isP1?(boostActive&&boostType==="power"?28:22):20;
  if(sp>cap){ puck.vx=puck.vx/sp*cap; puck.vy=puck.vy/sp*cap; }
  Sound.hit(sp);
  const col=isP1?SKINS[skinIdx].col:"#FF00FF";
  burst(puck.x,puck.y,col,Math.floor(sp*1.2)); if(sp>15)addShake(3);
  lastHitSpeed=sp; puckFlash=Math.min(1,0.4+sp/24);
  pad.squash=Math.min(1,0.35+sp/26); pad.squashNx=nx; pad.squashNy=ny;
  if(sp>18)addShake(2);
}

function updatePuck(){
  trail.push({x:puck.x,y:puck.y}); if(trail.length>18)trail.shift();
  const sp=hyp(puck.vx,puck.vy); if(sp<1.2)stuckTimer++;else stuckTimer=0;
  if(stuckTimer>STUCK2){ const toCx=CX-puck.x,toCy=CY-puck.y,d=hyp(toCx,toCy)||1; puck.vx+=toCx/d*4.5; puck.vy+=toCy/d*4.5; stuckTimer=0; burst(puck.x,puck.y,"#FFD23F",16); }
  puck.x+=puck.vx; puck.y+=puck.vy; puck.vx*=0.995; puck.vy*=0.995;

  if(PORTRAIT){
    // ---- Murs gauche et droite : rebond ----
    if(puck.x-puck.r < tFX){
      puck.x=tFX+puck.r; puck.vx=Math.abs(puck.vx)*0.86; Sound.wall();
    }
    if(puck.x+puck.r > tFX+tFW){
      puck.x=tFX+tFW-puck.r; puck.vx=-Math.abs(puck.vx)*0.86; Sound.wall();
    }
    // ---- Mur du haut : but joueur (IA) ----
    if(puck.y-puck.r < FY){
      if(puck.x>eG1 && puck.x<eG2){ goal("p"); return; }   // joueur marque
      puck.y=FY+puck.r; puck.vy=Math.abs(puck.vy)*0.86; Sound.wall();
    }
    // ---- Mur du bas : but IA (joueur encaisse) ----
    if(puck.y+puck.r > FY+FH){
      if(puck.x>tG1 && puck.x<tG2){ goal("e"); return; }   // IA marque
      puck.y=FY+FH-puck.r; puck.vy=-Math.abs(puck.vy)*0.86; Sound.wall();
    }
    // ---- Bumpers (portrait) ----
    tableCfg.bumpers.forEach(b=>{
      const bdx=puck.x-b.x, bdy=puck.y-b.y, bd=hyp(bdx,bdy), minD=puck.r+b.r;
      if(bd<minD&&bd>0.01){ const bnx=bdx/bd,bny=bdy/bd; puck.x=b.x+bnx*minD; puck.y=b.y+bny*minD; const dot=puck.vx*bnx+puck.vy*bny; if(dot<0){puck.vx-=2*dot*bnx*1.05;puck.vy-=2*dot*bny*1.05;} burst(puck.x,puck.y,"#FF00FF",12); addShake(2); Sound.wall(); }
    });
  } else {
    // ---- Paysage : logique d'origine ----
    const fy=tFY_active, fh=tFH;
    if(puck.y-puck.r < fy){ puck.y=fy+puck.r; puck.vy=Math.abs(puck.vy)*0.86; Sound.wall(); }
    if(puck.y+puck.r > fy+fh){ puck.y=fy+fh-puck.r; puck.vy=-Math.abs(puck.vy)*0.86; Sound.wall(); }
    if(puck.x-puck.r < FX){ if(puck.y>tG1&&puck.y<tG2){goal("e");return;} puck.x=FX+puck.r; puck.vx=Math.abs(puck.vx)*0.86; Sound.wall(); }
    if(puck.x+puck.r > FX+FW){ if(puck.y>eG1&&puck.y<eG2){goal("p");return;} puck.x=FX+FW-puck.r; puck.vx=-Math.abs(puck.vx)*0.86; Sound.wall(); }
    // Bumpers
    tableCfg.bumpers.forEach(b=>{
      const bdx=puck.x-b.x,bdy=puck.y-b.y,bd=hyp(bdx,bdy),minD=puck.r+b.r;
      if(bd<minD&&bd>0.01){ const bnx=bdx/bd,bny=bdy/bd; puck.x=b.x+bnx*minD; puck.y=b.y+bny*minD; const dot=puck.vx*bnx+puck.vy*bny; if(dot<0){puck.vx-=2*dot*bnx*1.05;puck.vy-=2*dot*bny*1.05;} burst(puck.x,puck.y,"#FF00FF",12); addShake(2); Sound.wall(); }
    });
    // Biseaux
    const SQ2=Math.SQRT2;
    const corners=[[FX,fy,1/SQ2,1/SQ2],[FX+FW,fy,-1/SQ2,1/SQ2],[FX,fy+fh,1/SQ2,-1/SQ2],[FX+FW,fy+fh,-1/SQ2,-1/SQ2]];
    corners.forEach(([cx,cy,nx,ny])=>{
      const dx=puck.x-cx,dy=puck.y-cy,proj=dx*nx+dy*ny;
      if(proj<CORNER&&proj>0){
        const icX=nx>0?puck.x<FX+CORNER+puck.r:puck.x>FX+FW-CORNER-puck.r;
        const icY=ny>0?puck.y<fy+CORNER+puck.r:puck.y>fy+fh-CORNER-puck.r;
        if(icX&&icY){ const dot=puck.vx*nx+puck.vy*ny; if(dot<0){ puck.vx-=2*dot*nx*0.86; puck.vy-=2*dot*ny*0.86; const overlap=CORNER-proj+puck.r; puck.x+=nx*overlap*0.5; puck.y+=ny*overlap*0.5; Sound.wall(); } }
      }
    });
  }
  collidePaddle(player,true);
  collidePaddle(enemy,false);
}

function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }

function drawField(){
  ctx.fillStyle="#070b1e"; ctx.fillRect(0,0,LW,LH);
  const fy = PORTRAIT ? tFY_active : tFY_active;
  const fh = PORTRAIT ? tFH : tFH;
  const fx = PORTRAIT ? tFX : tFX;
  const fw = PORTRAIT ? tFW : tFW;

  // Terrain avec coins biseautés
  ctx.beginPath();
  ctx.moveTo(fx+CORNER,fy);         ctx.lineTo(fx+fw-CORNER,fy);
  ctx.lineTo(fx+fw,fy+CORNER);      ctx.lineTo(fx+fw,fy+fh-CORNER);
  ctx.lineTo(fx+fw-CORNER,fy+fh);   ctx.lineTo(fx+CORNER,fy+fh);
  ctx.lineTo(fx,fy+fh-CORNER);      ctx.lineTo(fx,fy+CORNER);
  ctx.closePath();
  ctx.fillStyle="rgba(0,217,255,.04)"; ctx.fill();
  ctx.strokeStyle="rgba(0,217,255,.28)"; ctx.lineWidth=2.5; ctx.stroke();

  // Ligne médiane
  ctx.strokeStyle="rgba(0,217,255,.13)"; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  if(PORTRAIT){
    ctx.beginPath(); ctx.moveTo(fx+CORNER*.5,CY); ctx.lineTo(fx+fw-CORNER*.5,CY); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(CX,fy+CORNER*.5); ctx.lineTo(CX,fy+fh-CORNER*.5); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Cercle central
  ctx.beginPath(); ctx.arc(CX,CY,64,0,Math.PI*2);
  ctx.strokeStyle="rgba(0,217,255,.14)"; ctx.stroke();

  // Biseaux (paysage uniquement)
  if(!PORTRAIT){
    ctx.strokeStyle="rgba(0,217,255,.18)"; ctx.lineWidth=1.5;
    [[fx,fy+CORNER,fx+CORNER,fy],[fx+fw-CORNER,fy,fx+fw,fy+CORNER],[fx+fw,fy+fh-CORNER,fx+fw-CORNER,fy+fh],[fx+CORNER,fy+fh,fx,fy+fh-CORNER]].forEach(([x1,y1,x2,y2])=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); });
  }

  // Bumpers
  tableCfg.bumpers.forEach(b=>{
    ctx.save(); ctx.shadowColor="#FF00FF"; ctx.shadowBlur=10;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,"rgba(255,0,255,.55)"); g.addColorStop(1,"rgba(255,0,255,.08)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#FF00FF"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
    ctx.strokeStyle="rgba(255,0,255,.35)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.55,0,Math.PI*2); ctx.stroke(); ctx.restore();
  });

  // Buts — shadowBlur minimal pour éviter halos hors terrain
  ctx.lineWidth=5;
  if(PORTRAIT){
    // But IA (haut) : utilise eG1/eG2 qui peut être rétréci
    ctx.strokeStyle="#FF00FF"; ctx.shadowColor="#FF00FF"; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(eG1,FY); ctx.lineTo(eG2,FY); ctx.stroke();
    ctx.strokeStyle="#00D9FF"; ctx.shadowColor="#00D9FF"; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(tG1,FY+FH); ctx.lineTo(tG2,FY+FH); ctx.stroke();
  } else {
    ctx.strokeStyle="#00D9FF"; ctx.shadowColor="#00D9FF"; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(FX,tG1); ctx.lineTo(FX,tG2); ctx.stroke();
    ctx.strokeStyle="#FF00FF"; ctx.shadowColor="#FF00FF"; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(FX+FW,eG1); ctx.lineTo(FX+FW,eG2); ctx.stroke();
  }
  ctx.shadowBlur=0;
}

function drawPuck(){
  const sp=hyp(puck.vx,puck.vy);
  const trailBoost=Math.min(1.6,0.7+sp/22);
  for(let i=0;i<trail.length;i++){ const t=trail[i],p=i/trail.length; ctx.globalAlpha=p*0.42*trailBoost; ctx.fillStyle="#00D9FF"; ctx.beginPath(); ctx.arc(t.x,t.y,puck.r*p*.95,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  if(puckFlash>0){ const fr=puck.r*(1.6+puckFlash*2.4); const g=ctx.createRadialGradient(puck.x,puck.y,puck.r*.5,puck.x,puck.y,fr); g.addColorStop(0,`rgba(255,255,255,${puckFlash*.9})`); g.addColorStop(.4,`rgba(0,217,255,${puckFlash*.5})`); g.addColorStop(1,"rgba(0,217,255,0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(puck.x,puck.y,fr,0,Math.PI*2); ctx.fill(); }
  ctx.shadowColor="#00D9FF"; ctx.shadowBlur=14+sp*0.8+puckFlash*16;
  ctx.fillStyle="#eaf8ff"; ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle="#00D9FF"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r-1,0,Math.PI*2); ctx.stroke();
  if(puckFlash>0){ ctx.fillStyle=`rgba(255,255,255,${puckFlash})`; ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r*.5,0,Math.PI*2); ctx.fill(); }
}

function drawPaddle(p, col, glow, skin){
  ctx.save();
  ctx.translate(p.x, p.y);
  if(p.squash>0){
    const ang=Math.atan2(p.squashNy,p.squashNx);
    ctx.rotate(ang); ctx.scale(1-p.squash*.32,1+p.squash*.20); ctx.rotate(-ang);
  }
  // Glow réduit pour ne pas déborder hors terrain
  ctx.shadowColor=glow; ctx.shadowBlur=12;

  if(skin && skin.bicolor){
    // ---- Skin bicolore : anneau extérieur col2, disque intérieur col1 ----
    // Disque extérieur plein : couleur 2 (anneau visible entre r et r*0.62)
    ctx.fillStyle=skin.col2;
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Disque intérieur : couleur 1
    ctx.fillStyle=skin.col;
    ctx.beginPath(); ctx.arc(0,0,p.r*0.62,0,Math.PI*2); ctx.fill();
    // Centre sombre (trou)
    ctx.fillStyle="rgba(10,14,39,.88)";
    ctx.beginPath(); ctx.arc(0,0,p.r*0.32,0,Math.PI*2); ctx.fill();
    // Point central col2 (petite touche de contraste)
    ctx.fillStyle=skin.col2;
    ctx.beginPath(); ctx.arc(0,0,p.r*0.14,0,Math.PI*2); ctx.fill();
  } else {
    // ---- Skin uni classique ----
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="rgba(10,14,39,.88)";
    ctx.beginPath(); ctx.arc(0,0,p.r*.62,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(0,0,p.r*.28,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawParts(){ for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }

// Met à jour la position des bumpers mobiles (mode Bumper)
function updateBumpers(){
  tableCfg.bumpers.forEach(b=>{
    if(!('vx' in b)) return;  // bumper sans mouvement (futur usage)
    // Déplacement horizontal sur la ligne médiane
    b.x += b.vx;
    // Rebond sur les bords du terrain (avec marge = rayon du bumper)
    const minBX = tFX + b.r + 20;
    const maxBX = tFX + tFW - b.r - 20;
    if(b.x <= minBX){ b.x = minBX; b.vx = Math.abs(b.vx); }
    if(b.x >= maxBX){ b.x = maxBX; b.vx = -Math.abs(b.vx); }
    // Petits boosts aléatoires de vitesse (2-3s)
    b.boostTimer--;
    if(b.boostTimer <= 0){
      const boost = 1.0 + Math.random() * 1.2;  // +0 à +120% de vitesse
      const dur   = Math.floor(120 + Math.random() * 60); // 2 à 3s à 60fps
      b.vx = Math.sign(b.vx) * 1.4 * boost;
      b.boostTimer = dur;
    }
  });
}

function updatePowerups(){
  if(gameMode===MODE.PVP) return;
  if(powerup){ powerup.life--; if(powerup.life<=0){powerup=null;powerupTimer=POWER_INTERVAL;return;} const d=hyp(puck.x-powerup.x,puck.y-powerup.y); if(d<puck.r+18){collectPowerup(powerup.type);powerup=null;powerupTimer=POWER_INTERVAL;} }
  else { powerupTimer--; if(powerupTimer<=0)spawnPowerup(); }
}
function collectPowerup(type){
  burst(puck.x,puck.y,"#FFD23F",26); addShake(4); Sound.win();
  if(type===PWR.FREEZE) enemyFrozen=60*2.2;
  else if(type===PWR.BIG){ pBig=60*8; player.r=PADR*1.5; }
  else if(type===PWR.FAST){ const sp=hyp(puck.vx,puck.vy)||6; const tx=FX+FW-puck.x,ty=CY-puck.y,td=hyp(tx,ty)||1; puck.vx=tx/td*Math.max(sp,16); puck.vy=ty/td*Math.max(sp,16); }
}
function drawPowerup(){
  if(!powerup) return;
  if(powerup.life<90&&Math.floor(tick/6)%2===0) return;
  const cols=["#5BE0FF","#FFD23F","#FF4D6D"],icons=["❄","◆","»"],col=cols[powerup.type];
  const pulse=1+Math.sin(tick*.12)*.12;
  ctx.save(); ctx.translate(powerup.x,powerup.y); ctx.scale(pulse,pulse);
  ctx.shadowColor=col; ctx.shadowBlur=22; ctx.fillStyle=col; rr(-19,-19,38,38,11); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle="rgba(7,11,30,.82)"; rr(-15,-15,30,30,8); ctx.fill();
  ctx.fillStyle=col; ctx.font="900 20px 'Trebuchet MS',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(icons[powerup.type],0,1);
  ctx.restore(); ctx.textBaseline="alphabetic";
}

// ====================================================================
// BOUCLE
// ====================================================================
function frame(){
  tick++;
  const ts=goalSlomo>0?0.45:1; if(goalSlomo>0)goalSlomo--;
  if(state===ST.PLAY){
    updatePlayer();
    if(gameMode===MODE.PVE) updateEnemyPVE(); else updateEnemyPVP();
    if(ts<1){ puck.vx*=ts; puck.vy*=ts; updatePuck(); if(state===ST.PLAY){puck.vx/=ts;puck.vy/=ts;} } else updatePuck();
    if(boostActive){ boostTimer--; if(boostTimer<=0)boostActive=false; }
    if(gameType===GAMETYPE.SURVIVAL){ survivalTime++; if(survivalTime%480===0)aiLevel++; }
    updateBumpers();
    updatePowerups();
    if(pBig>0){pBig--;if(pBig===0)player.r=PADR;}
    if(enemyFrozen>0)enemyFrozen--;
    if(smallGoalTimer>0){ smallGoalTimer--; applyTable(); }  // recalcule eG1/eG2 chaque frame
  }
  if(puckFlash>0)  puckFlash=Math.max(0,puckFlash-.06);
  if(player.squash>0) player.squash=Math.max(0,player.squash-.10);
  if(enemy.squash>0)  enemy.squash=Math.max(0,enemy.squash-.10);
  updateParts();
  let sx=0,sy=0; if(shake>0.3){ sx=(Math.random()-.5)*shake; sy=(Math.random()-.5)*shake; shake*=0.82; }else shake=0;
  ctx.save(); ctx.translate(sx,sy);
  // Clip sur l'ensemble du terrain pour bloquer tout débordement (halos, shadows)
  ctx.beginPath();
  ctx.rect(0, 0, LW, LH);
  ctx.clip();
  drawField(); drawParts(); drawPowerup(); drawPuck();
  const sk=SKINS[skinIdx];
  if(state !== ST.TITLE){
    drawPaddle(enemy,"#FF00FF","rgba(255,0,255,.6)", null);
    drawPaddle(player, sk.col, sk.glow, sk.bicolor ? sk : null);
  }
  drawHUD(); drawGoalFlash();
  ctx.restore();
  requestAnimationFrame(frame);
}

// ====================================================================
// UI
// ====================================================================
function show(id){ hideAll(); document.getElementById(id).classList.add("on"); }
function hideAll(){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); }

function updateXPDisplay(){
  const wrap=document.getElementById("xpWrap"); if(!wrap)return;
  const lv=playerLevel(), cur=playerXP-xpForLevel(lv), need=xpForLevel(lv+1)-xpForLevel(lv);
  const pct=Math.min(100,Math.round(cur/need*100));
  wrap.innerHTML='<div class="xp-top"><span class="xp-lv">Level '+lv+'</span><span class="xp-num">'+cur+' / '+need+' XP</span></div><div class="xp-bar"><div class="xp-fill" style="width:'+pct+'%"></div></div>';
}

function buildChallengeUI(){
  const list=document.getElementById("chalList"); if(!list)return; list.innerHTML="";
  const st=getChallengeState();
  dailyChallenges().forEach(ch=>{
    const done=!!st.done[ch.id]; const item=document.createElement("div"); item.className="chal-item"+(done?" done":"");
    item.innerHTML='<span class="chal-check">✓</span><span class="chal-text">'+ch.text+'</span><span class="chal-xp">+'+ch.xp+' XP</span>';
    list.appendChild(item);
  });
}

function updateModeHint(){
  const h=document.getElementById("modeHint"); if(!h)return;
  if(gameType===GAMETYPE.SURVIVAL){ h.innerHTML='<b style="color:var(--cyan)">Survival:</b> one goal conceded ends the run. The AI keeps getting faster.'; }
  else { h.innerHTML='<b style="color:var(--cyan)">1P:</b> mouse / finger &nbsp;·&nbsp;<b style="color:var(--mag)">2P:</b> right side or IJKL'; }
}

// Sélecteurs menu
document.querySelectorAll(".arena-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{ tableKey=btn.dataset.table; document.querySelectorAll(".arena-btn").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); });
});
document.querySelectorAll("#typeRow .seg-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    gameType=btn.dataset.type==="survival"?GAMETYPE.SURVIVAL:GAMETYPE.CLASSIC;
    document.querySelectorAll("#typeRow .seg-btn").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
    document.getElementById("btn2P").disabled=gameType===GAMETYPE.SURVIVAL;
    updateModeHint();
  });
});
document.querySelectorAll("#diffRow .seg-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    diffKey=btn.dataset.diff; diffCfg=DIFF[diffKey];
    document.querySelectorAll("#diffRow .seg-btn").forEach(b=>{ b.classList.remove("on","on-rage"); });
    btn.classList.add(diffKey==="rage"?"on-rage":"on");
  });
});

document.getElementById("btnChallenges").addEventListener("click",()=>{ buildChallengeUI(); show("screenChallenges"); });
document.getElementById("btnChalBack").addEventListener("click",()=>{ show("screenStart"); updateXPDisplay(); });
document.getElementById("btn1P").addEventListener("click",()=>newGame(MODE.PVE));
document.getElementById("btn2P").addEventListener("click",()=>newGame(MODE.PVP));
document.getElementById("btnAgain").addEventListener("click",e=>{ e.stopPropagation(); newGame(gameMode); });
// Sélecteur boost — sélection d'abord, pub ensuite
// Sélection du pouvoir — ne lance PAS encore la pub
let pendingBoost = "power";
document.querySelectorAll(".boost-choice").forEach(btn=>{
  btn.addEventListener("click",()=>{
    pendingBoost = btn.dataset.boost;
    document.querySelectorAll(".boost-choice").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    // Activer le bouton Watch Ad (il était grisé si aucun pouvoir sélectionné)
    document.getElementById("btnWatchAd").disabled = false;
  });
});
// Sélection visuelle par défaut
document.querySelector('.boost-choice[data-boost="power"]').classList.add("selected");
// Bouton Watch Ad — lance la pub avec le pouvoir déjà sélectionné
document.getElementById("btnWatchAd").addEventListener("click", e=>{
  e.stopPropagation();
  const boost = pendingBoost;  // capture locale
  AdManager.showRewarded(()=>startBoost(boost));
});
document.getElementById("btnMenu").addEventListener("click",e=>{ e.stopPropagation(); state=ST.TITLE; show("screenStart"); buildSkinUI(); updateXPDisplay(); updateModeHint(); });
document.getElementById("btnResume").addEventListener("click",e=>{ e.stopPropagation(); if(state===ST.PAUSE){state=ST.PLAY;hideAll();} });
document.getElementById("btnQuit").addEventListener("click",e=>{ e.stopPropagation(); newGame(gameMode); });
document.getElementById("btnMenuPause").addEventListener("click",e=>{ e.stopPropagation(); state=ST.TITLE; show("screenStart"); buildSkinUI(); updateXPDisplay(); updateModeHint(); });
document.getElementById("btnPause").addEventListener("click",()=>{ if(state===ST.PLAY){state=ST.PAUSE;show("screenPause");}else if(state===ST.PAUSE){state=ST.PLAY;hideAll();} });
document.getElementById("btnSound").addEventListener("click",()=>Sound.toggle());

// ---- Init ----
updateOrientation(); calcField(); applyTable();
const ph=getPlayerHome(), eh=getEnemyHome();
p1x=ph.x; p1y=ph.y; p2x=eh.x; p2y=eh.y;
player.x=ph.x; player.y=ph.y; player.px=ph.x; player.py=ph.y;
enemy.x=eh.x; enemy.y=eh.y;
resize(); buildSkinUI(); updateXPDisplay(); updateModeHint();
frame();
</script>
</body>
</html>
