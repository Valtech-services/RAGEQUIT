      // Trappe d'acces : carre avec charniere
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(-8,-8,16,16);
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth=1; ctx.strokeRect(-8,-8,16,16);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(-8,-8,16,3);
    } else { // pipe
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.restore();
  }

  // Trace de balle persistante sur un batiment : petit eclat sombre avec 2-3
  // fissures rayonnantes, statique une fois cree (pas de duree de vie, sauf
  // le plafond global qui purge les plus anciens). Donne au decor une trace
  // visible des combats sans avoir a rendre toute la geometrie destructible.
  function drawBuildingImpacts() {
    for (const im of world.buildingImpacts) {
      const p = worldToScreen(im.x, im.y);
      if (p.x < -20 || p.x > view.w+20 || p.y < -20 || p.y > view.h+20) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(im.angle);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath(); ctx.arc(0, 0, im.size*0.55, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 0.8;
      const cracks = 2 + Math.floor(im.seed*2);
      for (let k=0;k<cracks;k++) {
        const a = (k/cracks)*Math.PI*2 + im.seed*3;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*im.size*1.8, Math.sin(a)*im.size*1.8);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Silhouette/elements majeurs de toit : ajoute UN element caracteristique
  // en fonction de roofKind. Tout est dessine en vue strictement aerienne
  // (formes plates + ombre courte), sans jamais "monter" visuellement sur
  // l'ecran comme le ferait une vraie elevation vue de profil.
  function drawBuildingRoof(b, left, top) {
    const cx = left + b.w/2, cy = top + b.h/2;
    switch (b.roofKind) {
      case 'tank': {
        // Chateau d'eau vu du dessus : cercle avec 4 pieds visibles autour
        const px = left + b.w*(0.3+b.roofSeed*0.4), py = top + b.h*(0.3+b.roofSeed*0.3);
        const r = Math.min(b.w,b.h)*0.15;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(px+3,py+3,r*1.05,r*0.9,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2a2620';
        for (let a=0;a<4;a++){ const ang=a*Math.PI/2+0.4; ctx.beginPath(); ctx.arc(px+Math.cos(ang)*r*0.8, py+Math.sin(ang)*r*0.8, 2, 0, Math.PI*2); ctx.fill(); }
        const grad = ctx.createRadialGradient(px-r*0.3,py-r*0.3,1,px,py,r);
        grad.addColorStop(0,'#5a544a'); grad.addColorStop(1,'#3a362e');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
        break;
      }
      case 'aircon': {
        // Blocs de climatisation vus du dessus : rectangles + grille + ombre courte
        const n = 2 + Math.floor(b.roofSeed*2);
        for (let i=0;i<n;i++) {
          const bw = 16, bh = 14;
          const bx = left + 14 + i*(bw+10) + b.roofSeed*10;
          const by = top + b.h*0.25;
          if (bx+bw > left+b.w-8) break;
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(bx+2, by+2, bw, bh);
          ctx.fillStyle = '#2e2e2e';
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth=1;
          for (let g=1;g<3;g++){ ctx.beginPath(); ctx.moveTo(bx+2,by+g*bh/3); ctx.lineTo(bx+bw-2,by+g*bh/3); ctx.stroke(); }
        }
        break;
      }
      case 'antenna': {
        // Antenne vue strictement du dessus : un point central (mat, vu en
        // coupe) avec des cables/haubans rayonnant au sol et une ombre
        // portee courte, PAS un trait qui remonte sur l'ecran (incoherent
        // en vue aerienne pure).
        const ax = left + b.w*(0.25+b.roofSeed*0.5), ay = top + b.h*(0.25+b.roofSeed*0.5);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(ax+4,ay+4,10,7,0.4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(150,30,30,0.5)'; ctx.lineWidth=1;
        for (let k=0;k<3;k++){ const ang=(k/3)*Math.PI*2+b.roofSeed*6; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+Math.cos(ang)*16, ay+Math.sin(ang)*16); ctx.stroke(); }
        ctx.fillStyle = '#444';
        ctx.beginPath(); ctx.arc(ax,ay,4,0,Math.PI*2); ctx.fill();
        const blink = Math.sin(game.elapsed*3 + b.flickerSeed) > 0;
        if (blink) { ctx.fillStyle='#ff2222'; ctx.shadowBlur=6; ctx.shadowColor='#ff2222'; ctx.beginPath(); ctx.arc(ax,ay,2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
        break;
      }
      case 'ledge': {
        // Rebord en escalier : un second niveau de toit en retrait, plus clair
        // (recoit plus de lumiere directe qu'un simple rebord)
        const inset = 12;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(left+inset+3, top+inset+4, b.w-inset*2, b.h-inset*2);
        ctx.fillStyle = lightenHex(b.facade||'#23262b', 6);
        ctx.fillRect(left+inset, top+inset, b.w-inset*2, b.h-inset*2);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth=1.5;
        ctx.strokeRect(left+inset, top+inset, b.w-inset*2, b.h-inset*2);
        break;
      }
      case 'solar': {
        // Panneaux solaires : grille de rectangles bleu-nuit avec reflet, tres
        // lisible en vue aerienne (c'est deja une surface plate par nature).
        const cols = Math.max(1,Math.floor((b.w-20)/18));
        const rows = Math.max(1,Math.floor((b.h-20)/14));
        const px0 = left + (b.w - cols*18)/2, py0 = top + (b.h - rows*14)/2;
        for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
          const px = px0+c*18, py = py0+r*14;
          ctx.fillStyle = '#101a2e';
          ctx.fillRect(px, py, 15, 11);
          ctx.strokeStyle = 'rgba(120,160,255,0.35)'; ctx.lineWidth=1;
          ctx.strokeRect(px, py, 15, 11);
          ctx.fillStyle = 'rgba(150,190,255,0.15)';
          ctx.fillRect(px, py, 15, 4);
        }
        break;
      }
      case 'helipad': {
        // Hélistation : cercle avec H peint, rare (voir roofKindWeights)
        const r = Math.min(b.w,b.h)*0.32;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(cx+4,cy+4,r*1.05,r*0.92,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1c1c1c';
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,210,59,0.7)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cx,cy,r-2,0,Math.PI*2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,210,59,0.85)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(cx-r*0.35,cy-r*0.4); ctx.lineTo(cx-r*0.35,cy+r*0.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx+r*0.35,cy-r*0.4); ctx.lineTo(cx+r*0.35,cy+r*0.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-r*0.35,cy); ctx.lineTo(cx+r*0.35,cy); ctx.stroke();
        break;
      }
      default: break; // 'flat' : rien de plus que la texture deja dessinee
    }
  }

  // Petits utilitaires couleur pour les degrades de facade (evite de stocker
  // plusieurs teintes par batiment ; on derive eclaircie/assombrie a la volee).
  function darkenHex(hex, amt) { return shiftHex(hex, -amt); }
  function lightenHex(hex, amt) { return shiftHex(hex, amt); }
  function shiftHex(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n>>16 & 255) + amt, g = (n>>8 & 255) + amt, b = (n & 255) + amt;
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return `rgb(${r},${g},${b})`;
  }

  // Hex -> rgba(r,g,b,a) avec alpha variable : utilise pour le sang colore
  // par type de zombie (les flaques ont besoin d'un alpha qui decroit avec
  // leur duree de vie, donc un simple rgb() fixe ne suffit pas).
  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    const r = n>>16 & 255, g = n>>8 & 255, b = n & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // NEW: Draw vehicles
  function drawVehicles() {
    for (const v of world.vehicles) {
      const p = worldToScreen(v.x, v.y);
      if (p.x < -100 || p.x > view.w + 100 || p.y < -100 || p.y > view.h + 100) continue;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(v.rotation);

      if (v.hp <= 0) {
        // Destroyed: burnt wreckage
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
        ctx.fillStyle = '#331100';
        ctx.fillRect(-v.w/2 + 3, -v.h/2 + 3, v.w - 6, v.h - 6);
        ctx.globalAlpha = 1;
      } else {
        // Flash when hit
        const baseColor = v.flash > 0 ? '#ffffff' : v.color;
        ctx.fillStyle = baseColor;
        ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);

        // Car details
        ctx.fillStyle = '#000000';
        ctx.fillRect(-v.w/2 + 3, -v.h/2 + 3, v.w - 6, v.h * 0.3); // windshield
        ctx.fillRect(-v.w/2 + 3, v.h/2 - v.h * 0.3 - 3, v.w - 6, v.h * 0.3); // back window

        // Wheels
        ctx.fillStyle = '#111';
        ctx.fillRect(-v.w/2 - 2, -v.h/2 + 5, 4, 10);
        ctx.fillRect(v.w/2 - 2, -v.h/2 + 5, 4, 10);
        ctx.fillRect(-v.w/2 - 2, v.h/2 - 15, 4, 10);
        ctx.fillRect(v.w/2 - 2, v.h/2 - 15, 4, 10);

        // Headlights
        ctx.fillStyle = '#ffcc66';
        ctx.globalAlpha = 0.6;
        ctx.fillRect(-v.w/2 + 3, -v.h/2 - 2, 5, 3);
        ctx.fillRect(v.w/2 - 8, -v.h/2 - 2, 5, 3);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  }

  // NEW: Draw destructibles
  function drawDestructibles() {
    for (const d of world.destructibles) {
      if (d.hp <= 0) continue;
      const p = worldToScreen(d.x, d.y);
      if (p.x < -50 || p.x > view.w + 50 || p.y < -50 || p.y > view.h + 50) continue;

      ctx.save();
      ctx.translate(p.x, p.y);

      const baseColor = d.flash > 0 ? '#ffffff' : d.color;
      ctx.fillStyle = baseColor;

      if (d.kind === 'barrel') {
        ctx.beginPath();
        ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Hazard stripe
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(-d.radius + 2, -2, d.radius * 2 - 4, 4);
      } else if (d.kind === 'crate') {
        ctx.fillRect(-d.radius, -d.radius, d.radius * 2, d.radius * 2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(-d.radius, -d.radius, d.radius * 2, d.radius * 2);
        // Cross
        ctx.strokeStyle = '#332211';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-d.radius, -d.radius); ctx.lineTo(d.radius, d.radius);
        ctx.moveTo(d.radius, -d.radius); ctx.lineTo(-d.radius, d.radius);
        ctx.stroke();
      } else {
        // Trash can
        ctx.beginPath();
        ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#223322';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Arbres de parc : couronne en degrade + tronc, avec une ombre au sol
  // coherente avec le reste de la DA (batiments, personnages).
  function drawTrees() {
    for (const t of world.trees) {
      const p = worldToScreen(t.x, t.y);
      if (p.x < -60 || p.x > view.w+60 || p.y < -60 || p.y > view.h+60) continue;

      // Ombre au sol
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(p.x+3, p.y+t.r*0.7, t.r*0.9, t.r*0.35, 0, 0, Math.PI*2);
      ctx.fill();

      // Tronc
      ctx.fillStyle = '#2a1f16';
      ctx.fillRect(p.x-t.r*0.12, p.y-t.r*0.1, t.r*0.24, t.r*0.8);

      // Couronne : degrade sombre-vert (coherent avec l'ambiance nocturne
      // desaturee plutot qu'un vert vif qui jurerait avec le reste du decor)
      const grad = ctx.createRadialGradient(p.x-t.r*0.3, p.y-t.r*0.9, t.r*0.1, p.x, p.y-t.r*0.6, t.r);
      grad.addColorStop(0, '#3a4a32');
      grad.addColorStop(1, '#1c2418');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y-t.r*0.6, t.r, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // Bancs publics : simples mais reconnaissables (assise + dossier + pieds).
  function drawBenches() {
    for (const b of world.benches) {
      const p = worldToScreen(b.x, b.y);
      if (p.x < -40 || p.x > view.w+40 || p.y < -40 || p.y > view.h+40) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(b.rotation);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-16, 10, 32, 5);
      ctx.fillStyle = '#4a3826';
      ctx.fillRect(-16, -3, 32, 6); // assise
      ctx.fillRect(-16, -14, 32, 4); // dossier
      ctx.fillStyle = '#2a2018';
      ctx.fillRect(-15, 3, 3, 8); ctx.fillRect(12, 3, 3, 8); // pieds
      ctx.restore();
    }
  }

  function drawShellCasings(){for(const c of world.shellCasings){const p=worldToScreen(c.x,c.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(c.rotation);ctx.fillStyle=`rgba(255,200,0,${c.life/3})`;ctx.fillRect(-3,-1,6,2);ctx.restore();}}
  function drawExplosions(){for(const e of world.explosions){const p=worldToScreen(e.x,e.y),a=e.life/e.maxLife;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,e.radius);g.addColorStop(0,`rgba(255,255,200,${a})`);g.addColorStop(0.5,`rgba(255,100,0,${a*0.6})`);g.addColorStop(1,'rgba(255,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,e.radius,0,Math.PI*2);ctx.fill();}}
  function drawMoveTrails(){
    const trail = getCurrentTrail();
    for(const t of world.moveTrails){
      const p=worldToScreen(t.x,t.y),a=t.life/t.maxLife;
      let color = 'rgba(255,100,100,' + (a*0.3) + ')';
      if (trail.color === 'rainbow') {
        const hue = (game.elapsed * 100 + t.life * 200) % 360;
        color = `hsla(${hue}, 100%, 50%, ${a*0.5})`;
      } else if (trail.color) {
        const hex = trail.color;
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        color = `rgba(${r},${g},${b},${a*0.5})`;
      }
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(p.x,p.y,t.radius*a,0,Math.PI*2);ctx.fill();
    }
  }
  function drawShots(){for(const s of world.shots){if(s.trail.length>1){ctx.strokeStyle=s.color+'99';ctx.lineWidth=s.size*0.8;ctx.beginPath();const f=worldToScreen(s.trail[0].x,s.trail[0].y);ctx.moveTo(f.x,f.y);for(let i=1;i<s.trail.length;i++){const t=worldToScreen(s.trail[i].x,s.trail[i].y);ctx.lineTo(t.x,t.y);}ctx.stroke();}const p=worldToScreen(s.x,s.y);ctx.shadowBlur=14;ctx.shadowColor=s.color;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(p.x,p.y,s.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}
  function drawDashTrails(){for(const t of world.dashTrails){const p=worldToScreen(t.x,t.y),a=t.life/t.maxLife;ctx.fillStyle=`rgba(255,255,255,${a*0.5})`;ctx.beginPath();ctx.arc(p.x,p.y,hero.radius*a,0,Math.PI*2);ctx.fill();}}

  // UPDATED: Hero with smooth rotation, recoil, damage flash, death animation
  // Hero : avant, un simple cercle uni + un rectangle noir pour l'arme. On
  // ajoute une ombre au sol, une silhouette a deux tons (corps + tete
  // distincts) et une arme avec crosse/canon/poignee pour lire une vraie
  // forme de personnage plutot qu'un pion abstrait.
  function drawHero() {
    const skin = getCurrentSkin();

    // Death animation
    if (game.heroDying) {
      const t = 1 - (game.heroDeathTimer / 1.5);
      const p = worldToScreen(game.heroDeathPos.x, game.heroDeathPos.y);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(game.heroDeathAngle + t * Math.PI);
      ctx.scale(1 - t * 0.5, 1 - t * 0.5);
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = '#ff0000';
      ctx.beginPath(); ctx.arc(0, 0, hero.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(5, -5, 30, 10);
      ctx.restore();
      return;
    }

    if(hero.iframes>0&&Math.floor(hero.iframes*15)%2===0) return;

    const p=worldToScreen(hero.x, hero.y + hero.bobOffset);

    // Ombre au sol, fixe (ne tourne pas avec le personnage) : donne un point
    // d'ancrage au sol au lieu d'un pion qui semble flotter.
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(2, hero.radius*0.55, hero.radius*0.95, hero.radius*0.45, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(p.x,p.y);
    // Use visualAngle for smooth rotation
    ctx.rotate(hero.visualAngle);

    // Sprite image si disponible pour l'arme actuelle (voir SPRITE_PATHS en
    // tete de fichier) : dessine et on sort avant le rendu vectoriel de
    // repli. Le multiplicateur d'affichage (3.6) est volontairement plus
    // grand que le rayon de collision reel (hero.radius, utilise partout
    // ailleurs pour les tests de collision/hitbox) : le personnage parait
    // plus grand/lisible a l'ecran sans que la zone de collision ne change.
    const heroSpriteKey = currentPlayerSpriteKey();
    if (sprites[heroSpriteKey]) {
      const sd = hero.radius * 3.6;
      // Rotation de 180 degres appliquee UNIQUEMENT sur le sprite, dans un
      // sous-repere (save/restore) : ne touche ni hero.visualAngle, ni l'arme
      // vectorielle, ni l'orientation des tirs (hero.aim).
      ctx.save();
      ctx.rotate(0);
      ctx.drawImage(sprites[heroSpriteKey], -sd/2, -sd/2, sd, sd);
      ctx.restore();
      ctx.restore();
      return;
    }

    // Damage flash: tint red
    let bodyColor = skin.color;
    if (hero.damageFlash > 0) {
      const f = hero.damageFlash;
      bodyColor = blendColors(skin.color, '#ff0000', f);
    }
    const lightBase = lightenHex(skin.color, 25);
    let highlight = lightBase, shadow = bodyColor;
    if (hero.damageFlash > 0) {
      highlight = blendColors(skin.color, '#ff0000', hero.damageFlash * 0.6 + 0.2);
      shadow = bodyColor;
    }
    // Teintes derivees toujours a partir de skin.color (hex garanti), jamais
    // de bodyColor/shadow qui peuvent etre du rgb(...) issu de blendColors -
    // darkenHex/lightenHex ne savent parser que de l'hex.

    // Silhouette vue du dessus : jambes (derriere, cote oppose a la marche),
    // torse/epaules (ovale plus large que long, "0" = direction de face),
    // bras tendus vers l'avant, tete (cercle plus petit, decale en avant).
    // Pas de jambes (vue du dessus stricte, comme pour les zombies) : le
    // detail supplementaire du heros vient de l'arme animee (recul, flash)
    // plutot que d'un membre de plus.
    const r = hero.radius;

    // Bras : tendus vers l'avant, tenant l'arme entre eux (la ligne
    // superieure/inferieure du bras encadre le corps de l'arme dessine plus bas).
    ctx.strokeStyle = shadow;
    ctx.lineWidth = r*0.34;
    ctx.beginPath(); ctx.moveTo(-r*0.1, -r*0.5); ctx.lineTo(r*0.75, -r*0.22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*0.1, r*0.5); ctx.lineTo(r*0.75, r*0.22); ctx.stroke();

    // Corps : un seul ovale simple (les deux masses d'epaules distinctes
    // essayees precedemment se fondaient en un blob a 16-40px de rayon,
    // meme constat que pour les zombies) ; la lisibilite humanoide vient des
    // bras/jambes et de la tete nettement detachee ci-dessous.
    ctx.shadowBlur=18;
    ctx.shadowColor=bodyColor;
    const bodyGrad = ctx.createRadialGradient(-r*0.25,-r*0.15,r*0.1, 0,0,r*0.85);
    bodyGrad.addColorStop(0, highlight);
    bodyGrad.addColorStop(1, shadow);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, r*0.72, r*0.88, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, r*0.72, r*0.88, 0, 0, Math.PI*2); ctx.stroke();

    // Tete : nettement plus foncee et detachee du corps (meme logique que
    // pour les zombies : contraste net plutot que subtilite anatomique qui
    // se perd a cette echelle), avec la visiere sombre gardee par-dessus.
    const headX = r*0.58;
    ctx.fillStyle = darkenHex(skin.color, 30);
    ctx.beginPath(); ctx.arc(headX, 0, r*0.44, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(headX, 0, r*0.44, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(headX, 0, r*0.42, -Math.PI*0.7, -Math.PI*0.05);
    ctx.arc(headX, 0, r*0.24, -Math.PI*0.05, -Math.PI*0.7, true);
    ctx.closePath(); ctx.fill();

    // Arme : crosse, corps, canon distincts, la silhouette variant selon
    // l'arme equipee (avant : toujours la meme forme, seule la couleur
    // d'accent changeait) pour que le changement d'arme se voie vraiment.
    const wpn = WEAPONS[game.currentWeapon];
    const recoilOffset = hero.recoil * 6;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(r*0.2 - recoilOffset, -6, 12, 12); // crosse/poignee
    ctx.fillStyle = '#111';
    if (game.currentWeapon === 1) {
      // Shotgun : corps plus court et plus large
      ctx.fillRect(r*0.2+10 - recoilOffset, -5, 16, 10);
      ctx.fillStyle = '#050505';
      ctx.fillRect(r*0.2+24 - recoilOffset, -3.5, 10, 7);
    } else if (game.currentWeapon === 2) {
      // Minigun : double canon empile
      ctx.fillRect(r*0.2+10 - recoilOffset, -5, 20, 10);
      ctx.fillStyle = '#050505';
      ctx.fillRect(r*0.2+28 - recoilOffset, -4, 14, 3);
      ctx.fillRect(r*0.2+28 - recoilOffset, 1, 14, 3);
    } else if (game.currentWeapon === 3) {
      // Bazooka : tube large sur l'epaule, visuellement bien plus massif
      ctx.fillRect(r*0.2+8 - recoilOffset, -8, 34, 16);
      ctx.fillStyle = '#050505';
      ctx.fillRect(r*0.2+40 - recoilOffset, -7, 8, 14);
      ctx.fillStyle = '#333';
      ctx.fillRect(r*0.2+14 - recoilOffset, -8, 6, 3); // viseur
    } else {
      // Pistolet (defaut)
      ctx.fillRect(r*0.2+10 - recoilOffset, -4, 22, 8);
      ctx.fillStyle = '#050505';
      ctx.fillRect(r*0.2+28 - recoilOffset, -2.5, 14, 5);
    }
    ctx.fillStyle=wpn.bulletColor;
    ctx.fillRect(r*0.2+10 - recoilOffset, game.currentWeapon===3?-3:(game.currentWeapon===1||game.currentWeapon===2?-0.5:-1.5), 10, 2); // accent couleur arme active

    // Muzzle flash when recoil is high
    if (hero.recoil > 0.5) {
      ctx.fillStyle = '#ffff88';
      ctx.globalAlpha = hero.recoil;
      ctx.beginPath();
      const muzzleX = game.currentWeapon===3 ? r*0.2+48-recoilOffset : r*0.2+44-recoilOffset;
      ctx.arc(muzzleX, 0, (game.currentWeapon===3?12:8) * hero.recoil, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // NEW: Color blending helper
  function blendColors(c1, c2, t) {
    const r1 = parseInt(c1.slice(1,3), 16), g1 = parseInt(c1.slice(3,5), 16), b1 = parseInt(c1.slice(5,7), 16);
    const r2 = parseInt(c2.slice(1,3), 16), g2 = parseInt(c2.slice(3,5), 16), b2 = parseInt(c2.slice(5,7), 16);
    const r = Math.round(r1 + (r2 - r1) * t);
    const g = Math.round(g1 + (g2 - g1) * t);
    const b = Math.round(b1 + (b2 - b1) * t);
    return `rgb(${r},${g},${b})`;
  }

  // Ennemis : avant, un cercle uni + 2 points noirs pour tous les types.
  // On ajoute une ombre au sol, un corps en degrade (volume), un bord sombre
  // qui detache la silhouette du fond, et des traits distinctifs plus marques
  // par variante (crete/pics pour brute-titan, plaques pour splitter, etc.)
  // pour que chaque type se reconnaisse d'un coup d'oeil, pas juste par sa couleur.
  // Ennemis vus du dessus : tete, torse/epaules, bras tendus vers la cible
  // (posture "zombie qui charge"), jambes suggerees derriere, ombre au sol,
  // et desormais une barre de vie au-dessus de chaque ennemi (sauf a pleine
  // vie, pour ne pas surcharger l'ecran en debut de combat). Avant : un
  // cercle uni + 2 points noirs pour tous les types, sans indicateur de vie.
  function drawEnemies() {
    for(const e of world.enemies) {
      if(!e.visible) continue;
      let juggleOffset = 0, juggleScale = 1;
      if(e.juggle > 0) {
        juggleOffset = -Math.sin(e.juggle * Math.PI / 0.6) * 20;
        juggleScale = 0.8 + Math.sin(e.juggle * Math.PI / 0.6) * 0.2;
      }
      let staggerOffsetX = 0;
      if(e.stagger > 0) staggerOffsetX = Math.sin(e.stagger * 30) * e.stagger * 12;

      const p = worldToScreen(e.x + staggerOffsetX, e.y + juggleOffset);
      if(p.x<-100||p.x>view.w+100||p.y<-100||p.y>view.h+100) continue;

      // Ombre au sol (position fixe, independante du juggle) : ancre
      // l'ennemi au sol meme quand il est projete en l'air.
      const groundP = worldToScreen(e.x + staggerOffsetX, e.y);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(groundP.x, groundP.y + e.radius*0.5, e.radius*0.85, e.radius*0.35, 0, 0, Math.PI*2);
      ctx.fill();

      // Direction de marche : les ennemis foncent toujours droit vers le
      // heros (voir updateEnemies), donc l'angle se recalcule ici sans etat
      // supplementaire a stocker sur l'objet.
      const walkAngle = Math.atan2(hero.y-e.y, hero.x-e.x);

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(juggleScale, juggleScale);
      ctx.rotate(walkAngle);

      if(e.juggle > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, -juggleOffset + 5, e.radius*0.8, e.radius*0.3, 0, 0, Math.PI*2);
        ctx.fill();
      }

      // Sprite image si disponible pour ce type d'ennemi (voir SPRITE_PATHS
      // en tete de fichier, cle "enemy_<kind>") : dessine et on sort avant
      // le rendu vectoriel de repli plus bas. La barre de vie (dessinee
      // apres ctx.restore(), plus bas dans la fonction) reste affichee
      // normalement au-dessus, sprite ou pas.
      const enemySpriteKey = 'enemy_' + e.kind;
      if (sprites[enemySpriteKey]) {
        // Multiplicateur d'affichage (3.6) plus grand que e.radius (le rayon
        // de collision reel, inchange) : l'ennemi parait plus grand/lisible
        // a l'ecran sans agrandir sa zone de collision.
        const ed = e.radius * 3.6;
        // Convention des sprites zombies (voir prompt de generation) : les
        // bras tendus pointent vers le BAS de l'image source, alors que
        // ctx.rotate(walkAngle) suppose une convention "avant = vers la
        // droite" (angle 0). Rotation supplementaire de -90 degres (et non
        // +90 comme precedemment - l'ecart entre les deux vaut exactement
        // 180 degres, ce qui donnait des zombies tournant le dos au joueur)
        // afin que l'avant reel du sprite (le bas de l'image) s'aligne avec
        // walkAngle. Le rendu vectoriel de repli plus bas n'a pas besoin de
        // cet ajustement, il est deja dessine "avant = droite" nativement.
        ctx.rotate(-Math.PI/2);
ctx.drawImage(sprites[enemySpriteKey], -ed/2, -ed/2, ed, ed);
        ctx.restore();
        drawEnemyHealthBar(e, p);
        continue;
      }

      const bc=ENEMY[e.kind].color;
      const r = e.radius;
      const darkBc = darkenHex(bc, 25);

      // Bras tendus vers l'avant, plus longs/epais qu'avant pour rester
      // lisibles a petite echelle : c'est le trait le plus important pour
      // lire "silhouette humanoide qui charge" au premier coup d'oeil.
      if (!e.isBoss) {
        ctx.strokeStyle = darkBc;
        ctx.lineWidth = r*0.24;
        ctx.beginPath(); ctx.moveTo(0,-r*0.5); ctx.lineTo(r*1.1,-r*0.62); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, r*0.5); ctx.lineTo(r*1.1, r*0.62); ctx.stroke();
      }

	ctx.shadowBlur = e.isBoss ? 30 : 10;
	ctx.shadowColor = bc;

      // Corps : un seul ovale simple (contrairement a la version precedente
      // avec deux masses d'epaules distinctes, qui ne se distinguaient plus
      // a 18-40px de rayon et se lisaient comme un simple blob). La
      // silhouette humanoide vient desormais des bras/jambes tres visibles
      // + de la tete nettement detachee ci-dessous, pas de la forme du corps.
const grad = ctx.createRadialGradient(-r*0.25,-r*0.15,r*0.1, 0,0,r*0.9);
grad.addColorStop(0, lightenHex(bc, 30));
grad.addColorStop(1, bc);
ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(0, 0, r*0.72, r*0.9, 0, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = e.isBoss?3:1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, r*0.72, r*0.9, 0, 0, Math.PI*2); ctx.stroke();

      // Tete : nettement plus foncee et bien detachee du corps (contour net,
      // decalage franc vers l'avant), sans yeux ni visage. C'est l'element
      // qui doit le plus se voir pour lire "tete + corps" au lieu d'un blob :
      // avant, le contraste tete/corps etait trop faible pour se distinguer
      // a l'echelle reelle de rendu.
      const headX = r*0.62;
ctx.fillStyle = darkenHex(bc, 35);
      ctx.beginPath(); ctx.arc(headX, 0, r*0.4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(headX, 0, r*0.4, 0, Math.PI*2); ctx.stroke();
      // Reflet doux (lumiere nord-ouest, coherente avec le reste du decor),
      // jamais un oeil : une seule tache asymetrique et discrete.
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.ellipse(headX-r*0.1, -r*0.12, r*0.16, r*0.1, -0.4, 0, Math.PI*2); ctx.fill();

      // Traits distinctifs par variante (silhouette, pas seulement couleur)
      if (e.kind === 'brute' || e.kind === 'titan') {
        // Crete de pics sur le dessus : lecture immediate "gros costaud"
        const spikes = e.kind==='titan' ? 6 : 4;
        ctx.fillStyle = darkenHex(bc, 20);
        for (let i=0;i<spikes;i++) {
          const a = -Math.PI*0.8 + (i/(spikes-1))*Math.PI*0.6;
          const bx = Math.cos(a)*e.radius*0.9, by = Math.sin(a)*e.radius*0.9;
          const tx = Math.cos(a)*e.radius*1.25, ty = Math.sin(a)*e.radius*1.25;
          ctx.beginPath();
          ctx.moveTo(bx-3, by); ctx.lineTo(tx, ty); ctx.lineTo(bx+3, by);
          ctx.closePath(); ctx.fill();
        }
      } else if (e.kind === 'runner') {
        // Trainee de vitesse : deux traits derriere, lecture "rapide/agile"
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-e.radius*1.3,-e.radius*0.3); ctx.lineTo(-e.radius*0.9,-e.radius*0.3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-e.radius*1.5,e.radius*0.2); ctx.lineTo(-e.radius*1.0,e.radius*0.2); ctx.stroke();
      } else if (e.kind === 'spitter') {
        // Pustules/sacs de venin sur le dos (cote oppose a la cible) :
        // lecture immediate "cracheur a distance", distinct des corps a
        // corps. Pulsent legerement pour suggerer une pression qui monte
        // avant le prochain tir.
        const pulse = 0.85 + Math.sin(game.elapsed*4)*0.15;
        ctx.fillStyle = 'rgba(100,255,140,0.55)';
        for (let i=0;i<3;i++) {
          const a = Math.PI + (i-1)*0.5;
          ctx.beginPath();
          ctx.arc(Math.cos(a)*e.radius*0.6, Math.sin(a)*e.radius*0.6, e.radius*0.22*pulse, 0, Math.PI*2);
          ctx.fill();
        }
      }

      if(e.explosive){
        // Halo pulsant + point d'exclamation, plus lisible que le texte seul.
        // Le texte est contre-tourne (-walkAngle) pour rester toujours droit
        // a l'ecran malgre la rotation de la silhouette vers sa cible.
        const pulse = 0.5+Math.sin(game.elapsed*8)*0.5;
        ctx.strokeStyle = `rgba(255,255,0,${0.3+pulse*0.4})`;
        ctx.lineWidth = 2;
        ctx.beginPath();ctx.arc(0,0,e.radius+3+pulse*2,0,Math.PI*2);ctx.stroke();
        ctx.save();
        ctx.rotate(-walkAngle);
        ctx.fillStyle="#ffff00";ctx.font=`900 ${e.radius}px Arial`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("!",0,2);
        ctx.restore();
      }
      else if(e.splitter){
        // Plaques segmentees (suggere "va se diviser") au lieu d'un simple anneau
        ctx.strokeStyle="#ff00ff";ctx.lineWidth=2;
        for (let i=0;i<3;i++) {
          const a0 = (i/3)*Math.PI*2, a1 = a0 + Math.PI*2/3 - 0.3;
          ctx.beginPath(); ctx.arc(0,0,e.radius*0.62,a0,a1); ctx.stroke();
        }
      }
      else if(e.teleporter){ctx.strokeStyle="#00ffff";ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,e.radius+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
      else if(e.isBoss){
        ctx.fillStyle="#ffff00";
        ctx.beginPath();ctx.moveTo(-e.radius*0.6,-e.radius-5);ctx.lineTo(-e.radius*0.3,-e.radius-15);ctx.lineTo(0,-e.radius-5);ctx.lineTo(e.radius*0.3,-e.radius-15);ctx.lineTo(e.radius*0.6,-e.radius-5);ctx.closePath();ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,0.5)";ctx.lineWidth=1;ctx.stroke();
      }

      ctx.restore();

      drawEnemyHealthBar(e, p);
    }
  }

  // Barre de vie au-dessus de l'ennemi : seulement s'il a deja encaisse des
  // degats (hp < maxHp), pour ne pas saturer l'ecran de barres pleines des
  // le debut de chaque combat. Les boss ont deja leur propre grande barre
  // (#bossBar) donc ils n'en affichent pas une seconde ici. Extraite en
  // fonction pour etre appelee identiquement par les deux chemins de rendu
  // d'ennemi (sprite et vectoriel).
  function drawEnemyHealthBar(e, p) {
    if (e.isBoss || !(e.maxHp > 0) || e.hp >= e.maxHp) return;
    const r = e.radius;
    const ratio = Math.max(0, e.hp / e.maxHp);
    const barW = Math.max(24, r*1.7), barH = 4;
    const by = p.y - r - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(p.x-barW/2-1, by-1, barW+2, barH+2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(p.x-barW/2, by, barW, barH);
    const hpColor = ratio > 0.5 ? '#4ade80' : (ratio > 0.25 ? '#fbbf24' : '#ef4444');
    ctx.fillStyle = hpColor;
    ctx.fillRect(p.x-barW/2, by, barW*ratio, barH);
  }

  function drawOrbitParticles(){if(!world.orbitParticles.length)return;const h=worldToScreen(hero.x,hero.y);for(const p of world.orbitParticles){const x=h.x+Math.cos(p.angle)*p.distance,y=h.y+Math.sin(p.angle)*p.distance;ctx.fillStyle="#ffff00";ctx.shadowBlur=10;ctx.shadowColor="#ffff00";ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;}
  function drawParticles(){for(const p of world.particles){const s=worldToScreen(p.x,p.y);ctx.globalAlpha=Math.max(0,p.life/50);ctx.shadowBlur=14;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(s.x,s.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;}
  function drawFloatingTexts(){for(const t of world.floatingTexts){const p=worldToScreen(t.x,t.y),a=t.life/t.maxLife,bs=1+t.bounce*0.5;ctx.save();ctx.translate(p.x,p.y);ctx.scale(bs,bs);ctx.globalAlpha=a;ctx.fillStyle=t.color;ctx.font=`900 ${t.size}px Arial`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowBlur=10;ctx.shadowColor=t.color;ctx.fillText(t.text,0,0);ctx.restore();}ctx.globalAlpha=1;ctx.shadowBlur=0;}
  function drawChargeIndicator(){if(game.chargeLevel<=0)return;const p=worldToScreen(hero.x,hero.y);ctx.strokeStyle=`rgba(255,255,0,${0.5+game.chargeLevel*0.5})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,hero.radius+15,-Math.PI/2,-Math.PI/2+game.chargeLevel*Math.PI*2);ctx.stroke();if(game.chargeLevel>=1){ctx.strokeStyle="#ff0000";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,hero.radius+20,0,Math.PI*2);ctx.stroke();}}

  // NEW: Rain rendering
  function drawRain() {
    if (game.wave < 4) return;
    const intensity = Math.min(1, (game.wave - 3) / 10);
    ctx.strokeStyle = `rgba(150, 180, 220, ${0.3 * intensity})`;
    ctx.lineWidth = 1;
    for (const drop of world.rain) {
      const p = worldToScreen(drop.x, drop.y);
      if (p.x < -50 || p.x > view.w + 50 || p.y < -50 || p.y > view.h + 50) continue;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 2, p.y + drop.length);
      ctx.stroke();
    }
  }

  // NEW: Lightning strike rendering
  function drawLightningStrike() {
    if (game.lightningFlash <= 0 || !game.lightningStrikePos) return;
    const p = worldToScreen(game.lightningStrikePos.x, game.lightningStrikePos.y);

    // Lightning bolt
    ctx.strokeStyle = `rgba(255, 255, 255, ${game.lightningFlash})`;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ffffff';
    ctx.beginPath();
    let x = p.x, y = p.y - 500;
    ctx.moveTo(x, y);
    for (let i = 0; i < 8; i++) {
      x += (Math.random() - 0.5) * 40;
      y += 60;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Ground flash
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 150);
    gradient.addColorStop(0, `rgba(255, 255, 255, ${game.lightningFlash * 0.5})`);
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 150, 0, Math.PI * 2);
    ctx.fill();
  }

  // NEW: Dynamic fog
  function drawFog() {
    if (game.fogDensity <= 0.05) return;
    const gradient = ctx.createRadialGradient(view.w/2, view.h/2, Math.min(view.w, view.h) * 0.2, view.w/2, view.h/2, Math.max(view.w, view.h) * 0.6);
    gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
    gradient.addColorStop(1, `rgba(30, 30, 40, ${game.fogDensity})`);
    ctx.fillStyle = gradient;
    ctx.fillRect(-view.w, -view.h, view.w * 3, view.h * 3);
  }

  // Vignettage permanent et discret des bords de l'ecran (independant du
  // brouillard, qui lui n'apparait qu'a partir de certaines vagues) : assombrit
  // legerement les coins pour guider l'oeil vers le centre d'action autour
  // du heros, plutot qu'un cadrage plat sans aucune hierarchie visuelle.
  function drawVignette() {
    const g = ctx.createRadialGradient(view.w/2, view.h/2, Math.min(view.w,view.h)*0.35, view.w/2, view.h/2, Math.max(view.w,view.h)*0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.w, view.h);
  }

  function drawScreenEffects(){
    if(game.flashRed>0){ctx.fillStyle=`rgba(255,0,0,${game.flashRed*0.5})`;ctx.fillRect(-view.w,-view.h,view.w*3,view.h*3);}
    if(game.flashWhite>0){ctx.fillStyle=`rgba(255,255,255,${game.flashWhite*2})`;ctx.fillRect(-view.w,-view.h,view.w*3,view.h*3);}
    // NEW: Lightning flash overlay
    if(game.lightningFlash>0){ctx.fillStyle=`rgba(255,255,255,${game.lightningFlash*0.3})`;ctx.fillRect(-view.w,-view.h,view.w*3,view.h*3);}
    if(game.saturation>1){ctx.globalCompositeOperation='overlay';ctx.fillStyle=`rgba(255,100,0,${(game.saturation-1)*0.3})`;ctx.fillRect(-view.w,-view.h,view.w*3,view.h*3);ctx.globalCompositeOperation='source-over';}
  }
  function drawComboBorderGlow(){if(game.combo<3)return;const i=Math.min(1,(game.combo-3)/7);const g=ctx.createRadialGradient(view.w/2,view.h/2,Math.min(view.w,view.h)*0.3,view.w/2,view.h/2,Math.max(view.w,view.h)*0.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(255,0,0,${i*0.4})`);ctx.fillStyle=g;ctx.fillRect(-view.w,-view.h,view.w*3,view.h*3);}

  function syncHud() {
    ui.score.textContent=Math.floor(game.score); ui.points.textContent=game.points;
    ui.wave.textContent=game.wave;
    ui.waveProgressFill.style.width = `${Math.min(100,(game.waveKills/game.waveKillTarget)*100)}%`;
    ui.waveProgressText.textContent = `${game.waveKills}/${game.waveKillTarget}`;
    ui.health.textContent=`${Math.max(0,Math.floor(hero.health))}/${hero.maxHealth}`;
    ui.healthBarFill.style.width=`${Math.max(0,(hero.health/hero.maxHealth)*100)}%`;
    ui.healthBar.classList.toggle('low', hero.health<hero.maxHealth*0.3);
    ui.combo.textContent=game.combo;
    ui.hudComboRow.classList.toggle('active', game.combo>1);

    const xpNeeded = xpForLevel(progression.level);
    const xpPercent = (progression.xp / xpNeeded) * 100;
    ui.xpBarFill.style.width = `${xpPercent}%`;
    ui.xpText.textContent = `LVL ${progression.level}`;
  }

  function endGame() {
    game.active=false; cancelAnimationFrame(game.raf);
    stopAmbience();
    const fs=Math.floor(game.score), st=Math.floor((Date.now()-game.startTime)/1000);
    const isNew=fs>getHighScore(); if(isNew) setHighScore(fs);

    progression.bestSurvivalTime = Math.max(progression.bestSurvivalTime, st);
    progression.bestKillsInRun = Math.max(progression.bestKillsInRun, game.totalKills);
    checkUnlocks();
    if (saveProgressionTimer) { clearTimeout(saveProgressionTimer); saveProgressionTimer = null; }
    saveProgressionNow(); // flush immediat en fin de partie, pas de debounce ici

    // envoi du score au leaderboard du site
    try { window.parent && window.parent.postMessage({
      type: 'DEAD_ZONE_SCORE', game: 'dead-zone', mode: 'classic',
      score: fs, scoreLabel: fs.toLocaleString('en-US') + ' pts · wave ' + game.wave
    }, '*'); } catch(e) {}

    showGameOverScreen(fs, st, isNew);
  }
  
  function showGameOverScreen(fs, st, isNew) {
    ui.overlay.classList.add('active');
    const m=Math.floor(st/60), s=st%60;
    let h=`<div class="panel"><h1>YOU'RE DEAD</h1>`;
    h+=isNew?`<div class="highScore new">${icon('crown')} NEW HIGH SCORE! ${icon('crown')}</div>`:`<div class="highScore">High Score: ${getHighScore()}</div>`;
    h+=`<div class="statsGrid">`;
    h+=`<div class="statCard"><div class="label">Final Score</div><div class="value">${fs}</div></div>`;
    h+=`<div class="statCard"><div class="label">Survival Time</div><div class="value">${m}:${s.toString().padStart(2,'0')}</div></div>`;
    h+=`<div class="statCard"><div class="label">Total Kills</div><div class="value">${game.totalKills}</div></div>`;
    h+=`<div class="statCard"><div class="label">Max Combo</div><div class="value">${game.maxCombo}x</div></div>`;
    h+=`<div class="statCard"><div class="label">Wave Reached</div><div class="value">${game.wave}</div></div>`;
    h+=`<div class="statCard"><div class="label">Objects Destroyed</div><div class="value">${game.objectsDestroyedThisRun}</div></div>`;
    // bouton pub revive : proposé une seule fois par partie
    const reviveBtn = (!game.reviveUsed) ? `<button id="reviveBtn" style="background:linear-gradient(90deg,#a3e635,#65a30d);color:#14210a">▶ WATCH AD · REVIVE</button>` : '';
    h+=`</div>${reviveBtn}<button id="restartBtn">PLAY AGAIN</button></div>`;
    ui.overlay.innerHTML=h;
    document.querySelector('#restartBtn').addEventListener('click',()=>{resetUpgrades();start();});
    const rb = document.querySelector('#reviveBtn');
    if(rb) rb.addEventListener('click', startReviveAd);
  }

  // Pub simulée de 5s, puis reprise là où le joueur est mort.
  function startReviveAd(){
    const ov = ui.overlay;
    let n = 5;
    ov.innerHTML = `<div class="panel"><h1>AD</h1><p>Reward in <span id="adCount">${n}</span>s…</p></div>`;
    const iv = setInterval(()=>{
      n--;
      const c = document.querySelector('#adCount'); if(c) c.textContent = n;
      if(n<=0){
        clearInterval(iv);
        // suivi analytics : pub récompensée vue en entier
        try { window.parent && window.parent.postMessage({ type:'RH_TRACK', event:'ad_rewarded_complete', game_id:'dead-zone', props:{context:'revive'} }, '*'); } catch(e){}
        reviveHero();
      }
    }, 1000);
  }

  // Reprend la partie : ressuscite le héros sur place, nettoie l'écran.
  function reviveHero(){
    game.reviveUsed = true;
    game.active = true;
	game.reviveUsed = false;
    game.paused = false;
    ui.overlay.classList.remove('active');
    ui.overlay.innerHTML = '';
    // ressuscite le héros à pleine vie, là où il est mort
    hero.health = hero.maxHealth;
    game.heroDying = false;
    game.heroDeathTimer = 0;
    // vide les ennemis pour donner un répit
    game.enemies = [];
    game.lastTime = performance.now();
    cancelAnimationFrame(game.raf);
    game.raf = requestAnimationFrame(frame);
  }

  function applyUpgrade(k){switch(k){case'maxHealth':hero.maxHealth+=20;hero.health=hero.maxHealth;break;case'damage':hero.damage+=0.5;break;case'speed':hero.speed+=0.5;break;case'fireRate':hero.fireDelay=Math.max(5,hero.fireDelay-2);break;case'tripleShot':hero.triple=true;break;}}
  function resetUpgrades(){for(const u of Object.values(upgrades))u.level=0;hero.maxHealth=130;hero.health=130;hero.damage=1;hero.speed=3.45;hero.fireDelay=18;hero.triple=false;}

  // ========== PROGRESSION MENU ==========
  function showProgressionMenu() {
    ui.overlay.classList.add('active');
    renderProgressionTab('skills');
  }

  function renderProgressionTab(tab) {
    let h = `<div class="panel">`;

    h += `<div class="levelInfo">
      <div class="levelNumber">LVL ${progression.level}</div>

    </div>`;

    h += `<div class="tabs">
      <div class="tab ${tab==='skills'?'active':''}" data-tab="skills">${icon('tree')} Skills</div>

      <div class="tab ${tab==='quests'?'active':''}" data-tab="quests">${icon('scroll')} Quests</div>

        renderProgressionTab('themes');

  function renderSkillsTab() {
    // Icones par branche (comme la maquette : epees pour Damage, eclair pour
    // Speed, croix medicale pour Health) affichees a cote du nom de branche.
    const branchIcons = { damage: icon('swords'), speed: icon('bolt'), health: icon('cross') };
    let h = `<h2>Skill Tree</h2><div class="skillTree">`;
    for (const branch of ['damage', 'speed', 'health']) {
      const branchName = branch.charAt(0).toUpperCase() + branch.slice(1);
      h += `<div class="skillBranch ${branch}"><h3>${branchIcons[branch]} ${branchName}</h3>`;
      for (let i = 0; i < SKILLS[branch].length; i++) {
        const skill = SKILLS[branch][i];
        const level = getSkillLevel(skill.id);
        const maxed = level >= skill.max;
        const unlocked = isSkillUnlocked(branch, i);
        const canUpgrade = unlocked && progression.skillPoints > 0 && !maxed;
        const cls = maxed ? 'maxed' : (!unlocked ? 'locked' : (canUpgrade ? '' : 'locked'));
        h += `<div class="skillNode ${cls}" data-skill="${skill.id}">
          ${i > 0 ? '<div class="skillLink"></div>' : ''}
          <div class="skillName">${skill.name}</div>
          <div class="skillDesc">${skill.desc}</div>
          <div class="skillLevel">${!unlocked ? icon('lock') + ' Locked' : `${level} / ${skill.max}${maxed ? ' ' + icon('check') + ' MAX' : ''}`}</div>
        </div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
    return h;
  }

  function renderSkinsTab() {
    let h = `<h2>Character Skins</h2><div class="skinGrid">`;
    for (const skin of SKINS) {
      const unlocked = progression.unlockedSkins.includes(skin.id);

      const cls = unlocked ? (selected ? 'selected' : 'unlocked') : 'locked';
      h += `<div class="skinCard ${cls}" data-skin="${skin.id}">
        <div class="skinPreview" style="background: ${skin.color};"></div>
        <div class="skinName">${skin.name}</div>
        <div class="skinReq">${unlocked ? (selected ? icon('check') + ' Equipped' : 'Click to equip') : skin.req}</div>
      </div>`;
    }
    h += `</div>`;

    h += `<h2>Trail Effects</h2><div class="skinGrid">`;
    for (const trail of TRAIL_EFFECTS) {
      const unlocked = trail.check(progression);
      const selected = progression.selectedTrail === trail.id;

    h += `</div>`;

  }

  // Pause : fige la simulation (voir la garde game.paused dans frame()) et
  // affiche un overlay avec Reprendre / Recommencer / Menu principal. Ne
  // touche pas a game.active (la partie reste "active", juste suspendue),
  // pour que Reprendre revienne exactement ou la partie en etait.
  function togglePause() {
    if (!game.active || game.heroDying) return; // pas de pause sur le menu ou pendant l'animation de mort
    if (game.paused) resumeGame(); else showPauseMenu();
  }

  function showPauseMenu() {
    game.paused = true;
    ui.overlay.classList.add('active');
    ui.overlay.innerHTML = `<div class="panel">
      <h1>PAUSED</h1>
      <div>
        <button id="resumeBtn">RESUME</button>
        <button id="pauseRestartBtn" class="secondary">RESTART</button>
        <button id="pauseMenuBtn" class="secondary">MAIN MENU</button>
      </div>
    </div>`;
    document.querySelector('#resumeBtn').addEventListener('click', resumeGame);
    document.querySelector('#pauseRestartBtn').addEventListener('click', () => { resetUpgrades(); start(); });
    document.querySelector('#pauseMenuBtn').addEventListener('click', () => { game.active=false; game.paused=false; cancelAnimationFrame(game.raf); stopAmbience(); showMainMenu(); });
  }

  function resumeGame() {
    game.paused = false;
    ui.overlay.classList.remove('active');
    game.lastTime = performance.now(); // evite un grand saut de dt a la reprise
    // Pas besoin de relancer requestAnimationFrame ici : la boucle frame()
    // continue de tourner pendant la pause (elle se contente de sauter
    // simulate() tant que game.paused est vrai), donc retirer le flag suffit.
  }

  function showMainMenu() {
    ui.overlay.classList.add('active');
    ui.overlay.innerHTML = `<div class="panel">
      <h1>DEAD ZONE</h1>
      <p>Survive endless hordes in a dead city.<br>Pick up weapons from fallen enemies and dominate!</p>
      <div class="levelInfo" style="margin: 16px 0;">
        <div style="font-size: 20px; color: #00ffff;">Level ${progression.level}</div>
        <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">${progression.xp}/${xpForLevel(progression.level)} XP • ${progression.skillPoints} skill points</div>
      </div>
      <div>
        <button id="startBtn">START</button>
        <button id="progressionBtn" class="secondary">PROGRESSION</button>
      </div>
    </div>`;
    document.querySelector('#startBtn').addEventListener('click', start);
    document.querySelector('#progressionBtn').addEventListener('click', showProgressionMenu);
  }

  // ========== INPUTS ==========
  addEventListener("resize",resize);
  // Flush immediat de la progression si le joueur quitte/rafraichit pendant
  // la fenetre de debounce de saveProgression (evite de perdre jusqu'a 2s de progres).
  addEventListener("beforeunload", () => {
    if (saveProgressionTimer) saveProgressionNow();
  });
  addEventListener("keydown",e=>{input.keys.add(e.key);if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key==='1')switchWeapon(0);if(e.key==='2')switchWeapon(1);if(e.key==='3')switchWeapon(2);if(e.key==='4')switchWeapon(3);if(e.key==='Escape')togglePause();});
  document.querySelector('#pauseBtn').addEventListener('click', togglePause);
  document.querySelector('#soundBtn').addEventListener('click', toggleSound);
  updateSoundBtn(); // reflete l'etat restaure depuis localStorage des le chargement
  addEventListener("keyup",e=>{input.keys.delete(e.key);if(e.key===' '){game.chargeLevel=0;input.pointer.chargeTime=0;}});
  canvas.addEventListener("mousemove",e=>{if(e.target.closest('#overlay')||e.target.closest('#hud'))return;input.pointer.x=e.clientX;input.pointer.y=e.clientY;});
  canvas.addEventListener("mousedown",e=>{if(e.target.closest('#overlay')||e.target.closest('#hud'))return;input.pointer.held=true;input.pointer.chargeTime=0;});
  addEventListener("mouseup",()=>{input.pointer.held=false;game.chargeLevel=0;input.pointer.chargeTime=0;});
  // Sur mobile, le tir est automatique (voir updateHero/findNearestEnemy) :
  // le joueur ne gere plus que le deplacement, donc n'importe quel doigt
  // pose sur l'ecran controle le joystick de mouvement (plus de zone dediee
  // a la visee a droite). Sur desktop, comportement inchange (souris).
  canvas.addEventListener("touchstart",e=>{if(e.target.closest('#overlay')||e.target.closest('#hud'))return;e.preventDefault();if(audioCtx.state==='suspended')audioCtx.resume();for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(isMobile){if(!input.joystick.active){input.joystick.active=true;input.joystick.id=t.identifier;input.joystick.startX=t.clientX;input.joystick.startY=t.clientY;}}else if(t.clientX<view.w/2){input.joystick.active=true;input.joystick.id=t.identifier;input.joystick.startX=t.clientX;input.joystick.startY=t.clientY;}else{input.aimTouch.active=true;input.aimTouch.id=t.identifier;input.pointer.x=t.clientX;input.pointer.y=t.clientY;input.pointer.held=true;input.pointer.chargeTime=0;}}},{passive:false});
  canvas.addEventListener("touchmove",e=>{if(e.target.closest('#overlay')||e.target.closest('#hud'))return;e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(input.joystick.active&&t.identifier===input.joystick.id){let dx=t.clientX-input.joystick.startX,dy=t.clientY-input.joystick.startY;const d=Math.hypot(dx,dy),m=50;if(d>m){dx=(dx/d)*m;dy=(dy/d)*m;}input.joystick.dx=dx/m;input.joystick.dy=dy/m;}else if(input.aimTouch.active&&t.identifier===input.aimTouch.id){input.pointer.x=t.clientX;input.pointer.y=t.clientY;}}},{passive:false});
  const hte=e=>{for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(input.joystick.active&&t.identifier===input.joystick.id){input.joystick.active=false;input.joystick.dx=0;input.joystick.dy=0;}if(input.aimTouch.active&&t.identifier===input.aimTouch.id){input.aimTouch.active=false;input.pointer.held=false;game.chargeLevel=0;input.pointer.chargeTime=0;}}};
  canvas.addEventListener("touchend",hte,{passive:false});
  canvas.addEventListener("touchcancel",hte,{passive:false});

  // Slots d'armes tactiles (mobile uniquement) : sur desktop le changement
  // d'arme reste au clavier (1-5), donc on ne branche cet ecouteur que si
  // isMobile pour ne rien changer au comportement desktop existant.
  if (isMobile) {
    document.querySelector('#actionBar').classList.add('tappable');
    ui.weaponSlots.forEach((slot, i) => {
      slot.addEventListener('touchstart', ev => { ev.preventDefault(); ev.stopPropagation(); switchWeapon(i); }, {passive:false});
    });

    // Bouton de tir circulaire : affiché seulement sur mobile (le CSS le
    // cache par défaut avec display:none). Maintenir le doigt dessus
    // déclenche le tir (input.pointer.held = true), le relâcher l'arrête.
    const fireBtn = document.querySelector('#fireBtn');
    fireBtn.style.display = 'flex';

    const pressFire = (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      input.pointer.held = true;
      input.pointer.chargeTime = 0;
      fireBtn.classList.add('pressed');
    };
    const releaseFire = (ev) => {
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      input.pointer.held = false;
      game.chargeLevel = 0;
      input.pointer.chargeTime = 0;
      fireBtn.classList.remove('pressed');
    };

    fireBtn.addEventListener('touchstart', pressFire, {passive:false});
    fireBtn.addEventListener('touchend', releaseFire, {passive:false});
    fireBtn.addEventListener('touchcancel', releaseFire, {passive:false});
    // Fallback souris (dev / tablette avec souris)
    fireBtn.addEventListener('mousedown', pressFire);
    fireBtn.addEventListener('mouseup', releaseFire);
    fireBtn.addEventListener('mouseleave', releaseFire);
  }

  // ========== INIT ==========
  loadProgression();
  resize(); makeCity(); generateEnvironment();
  showMainMenu();
  render();
})();
  </script>
  </div>   <!-- <-- fermeture de #game-root, juste avant </body> -->
</body>
</html>
