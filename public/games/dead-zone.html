<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dead Zone</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Icones SVG inline remplacant les emoji dans toute l'UI : dimensionnees
       en em pour suivre la taille de police du texte qui les entoure, comme
       le faisait un emoji, avec un leger decalage vertical pour un bon
       alignement optique sur la ligne de base. */
    .ico {
      display: inline-block; width: 1em; height: 1em;
      vertical-align: -0.15em; flex-shrink: 0;
    }
    .ico.ico-lg { width: 1.3em; height: 1.3em; vertical-align: -0.25em; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #000; color: white;
      font-family: system-ui, Arial, sans-serif;
      touch-action: none;
      overscroll-behavior: none; /* empeche le rebond/pull-to-refresh du navigateur
        mobile : un swipe rapide vers le bas (ex. viser vers le bas) pouvait
        etre interprete comme un geste de rafraichissement de page, ce qui
        redemarrait le jeu depuis le point de vue du joueur. */
    }
	  #game-root {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;       /* fallback */
  height: 100dvh;      /* navigateurs modernes : tient compte des barres */
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;        /* remplit #game-root, plus besoin de 100dvh ici */
  cursor: crosshair;
  touch-action: none;
  overscroll-behavior: none;
}
    canvas {
  display: block;
  width: 100%;
  height: 100vh;      /* fallback vieux navigateurs */
  height: 100dvh;     /* navigateurs modernes : tient compte des barres */
  cursor: crosshair;
  touch-action: none;
  overscroll-behavior: none;
}
    /* ===== HUD PRINCIPAL (haut gauche) =====
       Refonte : hierarchie claire (titre discret / stats en ligne / barres
       separees et legendees par icone) au lieu de lignes de texte empilees
       toutes au meme poids visuel. */
    #hud {
      position: absolute; top: 16px; left: 16px; z-index: 5;
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 16px; border-radius: 14px;
      width: 220px;
      background: linear-gradient(180deg, rgba(14,14,16,0.92), rgba(8,8,9,0.92));
      border: 1px solid rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,60,60,0.35);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .hudTitle {
      font-size: 11px; font-weight: 800; letter-spacing: 3px;
      color: rgba(255,90,90,0.85); text-transform: uppercase;
    }
    .hudStatsRow {
      display: flex; justify-content: space-between; gap: 6px;
    }
    .hudStat { display: flex; flex-direction: column; gap: 1px; }
    .hudStatLabel {
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      color: rgba(255,255,255,0.4); text-transform: uppercase;
    }
    .hudStatValue {
      font-size: 17px; font-weight: 800; color: #f2f2f2; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hudWaveRow { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
    #waveProgressBar {
      flex: 1; height: 5px; background: rgba(255,255,255,0.06);
      border-radius: 3px; overflow: hidden;
    }
    #waveProgressFill {
      height: 100%; width: 0%; border-radius: 3px;
      background: linear-gradient(90deg, #ff8a3b, #ffd23b);
      transition: width 0.25s;
    }
    .hudWaveRow .hudBarText { font-size: 9px; }
    .hudBarRow { display: flex; align-items: center; gap: 7px; }
    .hudBarIcon { font-size: 12px; width: 12px; text-align: center; flex-shrink: 0; }
    .hudBarIcon.hp { color: #ff4d4d; }
    .hudBarIcon.xp { color: #4dd8ff; }
    .hudBarText {
      font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.55);
      min-width: 20px; text-align: right; flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    #healthBar {
      flex: 1; height: 9px; background: rgba(255,255,255,0.06);
      border-radius: 5px; overflow: hidden; position: relative;
    }
    #healthBarFill {
      height: 100%; width: 100%; border-radius: 5px;
      background: linear-gradient(90deg, #ff3b3b, #ff8a3b);
      transition: width 0.2s;
    }
    #healthBar.low #healthBarFill { animation: healthPulse 0.5s infinite; }
    @keyframes healthPulse {
      0%, 100% { background: linear-gradient(90deg, #ff3b3b, #ff8a3b); }
      50% { background: linear-gradient(90deg, #ff8a3b, #ffd23b); box-shadow: 0 0 12px rgba(255,210,59,0.7); }
    }
    #xpBar {
      flex: 1; height: 6px; background: rgba(255,255,255,0.06);
      border-radius: 4px; overflow: hidden; position: relative;
    }
    #xpBarFill {
      height: 100%; width: 0%; border-radius: 4px;
      background: linear-gradient(90deg, #35c3ff, #35ffb0);
      transition: width 0.3s;
    }
    .hudComboRow {
      display: flex; align-items: baseline; gap: 5px;
      opacity: 0.35; transition: opacity 0.2s;
    }
    .hudComboRow.active { opacity: 1; }
    .hudComboRow .hudStatLabel { margin-right: 2px; }
    .hudComboRow .hudStatValue { font-size: 15px; color: #ff8a3b; }
    .hudComboX { font-size: 11px; font-weight: 700; color: rgba(255,138,59,0.7); }

    #miniMap {
      position: fixed; top: 16px; right: 16px; z-index: 5;
      width: 128px; height: 128px;
      background: rgba(8,8,9,0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%; pointer-events: none; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
#topRightControls {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 6;
  display: flex;
  gap: 8px;
}

#pauseBtn, #soundBtn {
  position: static;   /* plus d'absolute */
  width: 32px;
  height: 32px;
  border-radius: 50%;
  padding: 0;
  margin: 0;
  background: rgba(14,14,16,0.92);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: auto;
  backdrop-filter: blur(10px);
}
#pauseBtn:hover, #soundBtn:hover { background: rgba(255,255,255,0.12); }
#pauseBtn svg, #soundBtn svg { width: 15px; height: 15px; color: #f2f2f2; }
#soundBtn.muted svg { color: rgba(255,255,255,0.4); }

    /* ===== BARRE D'ACTION (bas, unifiee) =====
       Avant : deux grilles independantes (armes a gauche / pouvoirs a droite)
       qui se chevauchaient sur petit ecran. Desormais une seule barre centree,
       toujours a l'echelle de l'ecran, avec un separateur visuel entre les
       2 groupes plutot que deux blocs distincts qui peuvent se recouvrir. */
    #actionBar {
      position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 16px;
      background: rgba(8,8,9,0.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }
    /* Sur mobile, l'arme active se change au doigt (pas de clavier) : la
       barre laisse donc passer les touches jusqu'aux slots individuels. */
    #actionBar.tappable { pointer-events: auto; }
    #actionBar.tappable .weaponSlot { pointer-events: auto; cursor: pointer; }
    #weaponDisplay {
      display: flex; gap: 6px;
    }
    .weaponSlot {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; transition: all 0.15s; position: relative; overflow: hidden;
    }
    .weaponSlot.active {
      border-color: #ff4d4d; background: rgba(255,77,77,0.16);
      box-shadow: 0 0 16px rgba(255,77,77,0.35);
    }
    /* Arme pas encore ramassee via un drop, ou a sec de munitions : grisee
       et non selectionnable (voir switchWeapon). */
    .weaponSlot.locked { opacity: 0.35; filter: grayscale(0.6); }
    /* Anneau de munitions : conic-gradient jaune qui se vide en tournant au
       fur et a mesure des tirs (mis a jour via --ammo-pct en JS, 100% =
       plein, 0% = vide). Absent/invisible pour le pistolet (munitions
       illimitees, pas de --ammo-pct defini -> reste transparent).
       Technique : un disque en conic-gradient, perce au centre par un
       radial-gradient transparent pour ne garder qu'un anneau. Epaissi
       (inset 0, rayon interieur du masque reduit a 74%) par rapport a la
       version precedente qui etait trop fine pour se voir clairement.
       ring-color est ajustee par arme (voir JS) pour rester lisible sur
       fond sombre et distincte du contour actif rouge. */
    .weaponSlot .ammoRing {
      position: absolute; inset: 0px; border-radius: 50%;
      --ammo-pct: 0%;
      background:
        radial-gradient(circle, transparent 74%, transparent 75%, var(--ring-color, #ffd23b) 75%, var(--ring-color, #ffd23b) 100%),
        conic-gradient(var(--ring-color, #ffd23b) var(--ammo-pct), rgba(255,255,255,0.1) var(--ammo-pct));
      -webkit-mask: radial-gradient(circle, transparent 74%, transparent 75%, #000 75%, #000 100%);
      mask: radial-gradient(circle, transparent 74%, transparent 75%, #000 75%, #000 100%);
      pointer-events: none;
      filter: drop-shadow(0 0 3px var(--ring-color, #ffd23b));
    }
    /* Badge du nombre de munitions, au-dessus du rond (pas colle dessus). */
    .weaponSlot .ammoCount {
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      font-size: 11px; font-weight: 900; color: #ffd23b;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9); white-space: nowrap;
      background: rgba(0,0,0,0.7); padding: 1px 6px; border-radius: 6px;
      border: 1px solid rgba(255,210,59,0.4);
      pointer-events: none;
    }
    .weaponSlot .key {
      font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 700;
      position: relative; z-index: 1;
    }
    .weaponSlot.active .key { color: #ff8a8a; }
    .weaponSlot .name {
      font-size: 7px; font-weight: 700; letter-spacing: 0.4px;
      position: relative; z-index: 1;
      color: rgba(255,255,255,0.5); margin-top: 1px;
    }
    .weaponSlot .weaponIcon { font-size: 17px; line-height: 1; position: relative; z-index: 1; }
    #bossBar {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 600px; max-width: 80vw; height: 30px;
      background: rgba(0, 0, 0, 0.8); border: 2px solid #ff0000;
      border-radius: 15px; overflow: hidden; z-index: 6; pointer-events: none; display: none;
    }
    #bossBar.active { display: block; }
    #bossBarFill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff0000, #ff6600);
      transition: width 0.2s; box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
    }
    #bossName {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-weight: 900; font-size: 14px; letter-spacing: 3px; text-shadow: 0 0 10px rgba(0,0,0,1);
    }
    /* Feedback de kill (combo/double-triple kill) integre DANS le panneau
       HUD (au lieu de flotter au centre de l'ecran independamment, ce qui
       debordait du cadre du HUD sur petit ecran mobile - voir capture du
       bug). Une seule ligne, largeur contrainte a celle du panneau parent,
       qui affiche le dernier evenement puis disparait. */
    .hudKillFeed {
      min-height: 16px; text-align: center; pointer-events: none;
      font-size: 13px; font-weight: 900; opacity: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .hudKillFeed.active { opacity: 1; animation: hudKillPulse 0.3s ease-out; }
    .hudKillFeed.combo { color: #ff8a3b; text-shadow: 0 0 8px rgba(255,138,59,0.6); }
    .hudKillFeed.multikill { color: #ffd23b; text-shadow: 0 0 8px rgba(255,210,59,0.7); }
    @keyframes hudKillPulse {
      0% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    /* Barre de combo integree DANS le panneau HUD (plus un element flottant
       independant centre sur tout l'ecran) : largeur exactement celle du
       panneau parent, meme comportement desktop et mobile puisqu'elle suit
       maintenant le flux normal de #hud plutot que des coordonnees fixed
       calculees a part. */
    #comboBar {
      width: 100%; height: 8px; margin-top: 2px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 60, 60, 0.35); border-radius: 5px;
      overflow: hidden; pointer-events: none;
    }
    #comboBarFill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ff0000, #ff6600, #ffff00);
      transition: width 0.1s ease-out; box-shadow: 0 0 8px rgba(255, 255, 0, 0.6);
    }
    #notifications {
      position: absolute; top: 120px; right: 20px; z-index: 7;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none; max-width: 300px;
    }
    .notification {
      padding: 12px 20px; border-radius: 12px;
      background: rgba(0, 0, 0, 0.8); border: 2px solid rgba(255, 255, 0, 0.5);
      font-weight: 900; font-size: 14px;
      box-shadow: 0 0 20px rgba(255, 255, 0, 0.3);
      animation: notifSlide 0.3s ease-out;
    }
    .notification.success { border-color: #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); }
    .notification.warning { border-color: #ff6600; box-shadow: 0 0 20px rgba(255, 102, 0, 0.3); }
    .notification.levelup { border-color: #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); animation: notifSlide 0.3s ease-out, levelupGlow 1s infinite; }
    @keyframes levelupGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); }
      50% { box-shadow: 0 0 40px rgba(0, 255, 255, 0.8); }
    }
    @keyframes notifSlide {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    #progressIndicator {
      position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%);
      z-index: 5; pointer-events: none; padding: 8px 16px; border-radius: 20px;
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 12px; font-weight: 700; opacity: 0; transition: opacity 0.3s;
    }
    #progressIndicator.active { opacity: 1; }
    #overlay {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(255,40,40,0.12), transparent 55%),
                  radial-gradient(circle at 15% 85%, rgba(60,20,20,0.25), transparent 45%),
                  linear-gradient(180deg, #060607, #0a0a0c 60%, #050506);
      opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }
    #overlay.active { opacity: 1; pointer-events: auto; }
    .panel {
      max-width: 900px; width: 95%; padding: 40px; border-radius: 24px;
      background: linear-gradient(180deg, rgba(20,16,16,0.96), rgba(8,7,7,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,70,70,0.4);
      box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 80px rgba(255,30,30,0.08), inset 0 1px 0 rgba(255,255,255,0.04);
      max-height: 90vh; overflow-y: auto;
      transform: scale(0.94); transition: transform 0.3s;
    }
    #overlay.active .panel { transform: scale(1); }
    h1 {
      margin: 0 0 6px; font-size: clamp(46px, 9vw, 84px); letter-spacing: 8px;
      font-weight: 900;
      /* Relief grave/embosse (comme dans la maquette) : degrade clair->rouge
         sur le texte lui-meme, plus une pile d'ombres portees qui simulent
         une epaisseur de metal (couches sombres empilees vers le bas-droite)
         et un halo rouge diffus autour, au lieu d'un simple aplat degrade
         sans profondeur. */
      background: linear-gradient(180deg, #ffffff 0%, #ffb3b3 40%, #ff3b3b 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow:
        0 1px 0 rgba(120,0,0,0.9),
        0 2px 0 rgba(100,0,0,0.85),
        0 3px 0 rgba(80,0,0,0.8),
        0 4px 6px rgba(0,0,0,0.6),
        0 0 40px rgba(255, 30, 30, 0.45);
    }
    .titleUnderline {
      width: 90px; height: 3px; margin: 0 auto 18px;
      background: linear-gradient(90deg, transparent, #ff3b3b, transparent);
      border-radius: 2px;
    }
    h2 { color: #ff3333; margin: 20px 0 10px; }
    p { margin: 14px auto; line-height: 1.5; opacity: 0.9; }
    .controls { color: #ff3333; font-weight: 900; font-size: 1.05em; }
    .key {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      background: rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.4);
      font-family: monospace; margin: 0 2px; color: #ff6666;
    }
    button {
      border: 1px solid rgba(255,255,255,0.15); cursor: pointer; margin: 8px; padding: 15px 32px;
      border-radius: 999px;
      /* Rouge profond avec un liseret clair net (comme la maquette), au lieu
         d'un degrade rouge->blanc qui poussait le texte a etre en noir. */
      background: linear-gradient(180deg, #ff4d4d, #b30000);
      color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      box-shadow: 0 0 30px rgba(255, 30, 30, 0.5), inset 0 1px 0 rgba(255,255,255,0.25); transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 44px rgba(255, 30, 30, 0.7), inset 0 1px 0 rgba(255,255,255,0.3); }
    button:active { transform: translateY(1px) scale(0.98); }
    button.secondary {
      background: linear-gradient(180deg, #3a3a3d, #1c1c1e);
      border-color: rgba(255,255,255,0.1);
      color: #fff; box-shadow: 0 0 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    button.secondary:hover { box-shadow: 0 0 30px rgba(150, 150, 150, 0.35), inset 0 1px 0 rgba(255,255,255,0.15); }
    .upgradeGrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px; margin: 20px 0;
    }
    .upgradeCard {
      padding: 16px; border-radius: 16px;
      background: rgba(255, 0, 0, 0.1); border: 2px solid rgba(255, 0, 0, 0.3);
      cursor: pointer; transition: all 0.2s; text-align: left; pointer-events: auto;
    }
    .upgradeCard:hover {
      background: rgba(255, 0, 0, 0.2); border-color: rgba(255, 0, 0, 0.6);
      transform: translateY(-2px);
    }
    .upgradeCard.disabled { opacity: 0.4; cursor: not-allowed; }
    .upgradeCard h3 { margin: 0 0 8px; color: #ff3333; font-size: 18px; }
    .upgradeCard p { margin: 4px 0; font-size: 13px; opacity: 0.8; }
    .upgradeCard .cost { color: #ffffff; font-weight: 900; font-size: 16px; margin-top: 8px; }
    .upgradeCard .level { color: #ff6666; font-size: 12px; }
    #pointsDisplay {
      font-size: 24px; color: #ffffff; font-weight: 900;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); margin: 10px 0;
    }
    .statsGrid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0;
    }
    .statCard {
      padding: 16px; border-radius: 12px;
      background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); text-align: center;
    }
    .statCard .label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
    .statCard .value { font-size: 24px; font-weight: 900; color: #ff3333; }
    .highScore {
      margin: 20px 0; padding: 16px; border-radius: 12px;
      background: rgba(255, 255, 0, 0.1); border: 2px solid rgba(255, 255, 0, 0.3); font-weight: 900;
    }
    .highScore.new { animation: highScoreGlow 1s infinite; }
    @keyframes highScoreGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 0, 0.3); }
      50% { box-shadow: 0 0 40px rgba(255, 255, 0, 0.6); }
    }
    .tabs {
      display: flex; gap: 8px; margin: 20px 0; justify-content: center; flex-wrap: wrap;
    }
    .tab {
      padding: 10px 20px; border-radius: 12px; cursor: pointer;
      background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1);
      font-weight: 900; transition: all 0.2s; pointer-events: auto;
    }
    .tab.active {
      background: rgba(0, 255, 255, 0.15); border-color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .tab:hover { background: rgba(255, 255, 255, 0.1); }
    .skillTree {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0;
    }
    .skillBranch {
      padding: 16px; border-radius: 16px;
      background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.08);
    }
    .skillBranch.damage { border-color: rgba(255,60,60,0.35); }
    .skillBranch.speed { border-color: rgba(0,220,255,0.35); }
    .skillBranch.health { border-color: rgba(60,220,100,0.35); }
    .skillBranch h3 { margin: 0 0 12px; font-size: 18px; text-align: center; }
    .skillBranch.damage h3 { color: #ff4d4d; }
    .skillBranch.speed h3 { color: #4ddfff; }
    .skillBranch.health h3 { color: #4dff8a; }
    .skillNode {
      padding: 12px; margin: 8px 0; border-radius: 10px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer; transition: all 0.2s; pointer-events: auto;
      position: relative;
    }
    /* Connecteur visuel entre un palier et le precedent (i>0) : rend visible
       la progression en chaine au sein d'une branche, pas juste 3 cases
       independantes. */
    .skillNode .skillLink {
      position: absolute; top: -8px; left: 50%; width: 2px; height: 8px;
      background: rgba(255,255,255,0.25); transform: translateX(-50%);
    }
    .skillNode.locked .skillLink { background: rgba(255,255,255,0.1); }
    .skillNode:hover:not(.maxed):not(.locked) {
      background: rgba(255, 255, 255, 0.1); transform: translateX(4px);
    }
    .skillNode.unlocked {
      border-color: #00ffff; background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    /* MAX : bordure/fond dores francs (comme la maquette), au lieu du
       jaune-vert terne d'avant. */
    .skillNode.maxed {
      border-color: #ffd23b; background: linear-gradient(160deg, rgba(255,210,59,0.16), rgba(120,90,0,0.1));
      box-shadow: 0 0 14px rgba(255,210,59,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
      cursor: default;
    }
    .skillNode.maxed .skillLevel { color: #ffd23b; font-weight: 800; }
    .skillNode.locked { opacity: 0.45; cursor: not-allowed; }
    .skillNode.locked .skillLevel { color: rgba(255,210,59,0.7); }
    .skillNode .skillName { font-weight: 900; font-size: 14px; margin-bottom: 4px; }
    .skillNode .skillDesc { font-size: 11px; opacity: 0.7; }
    .skillNode .skillLevel { font-size: 11px; color: #00ffff; margin-top: 4px; }
    .achievementGrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px; margin: 20px 0;
    }
    .achievementCard {
      padding: 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.1);
      text-align: left; transition: all 0.2s;
    }
    .achievementCard.unlocked {
      border-color: #ffff00; background: rgba(255, 255, 0, 0.08);
      box-shadow: 0 0 15px rgba(255, 255, 0, 0.2);
    }
    .achievementCard .achIcon { font-size: 28px; margin-bottom: 6px; color: #888; }
    .achievementCard.unlocked .achIcon { color: #ffd23b; }
    .achievementCard .achName { font-weight: 900; font-size: 14px; margin-bottom: 4px; }
    .achievementCard .achDesc { font-size: 11px; opacity: 0.7; }
    .achievementCard.locked .achIcon { filter: grayscale(1); opacity: 0.4; }
    .skinGrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin: 20px 0;
    }
    .skinCard {
      padding: 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.1);
      text-align: center; cursor: pointer; transition: all 0.2s; pointer-events: auto;
    }
    .skinCard.unlocked:hover {
      background: rgba(255, 255, 255, 0.08); transform: translateY(-2px);
    }
    .skinCard.selected {
      border-color: #00ffff; background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .skinCard.locked { opacity: 0.4; cursor: not-allowed; }

      width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 8px;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .skinName { font-weight: 900; font-size: 12px; }
    .skinReq { font-size: 10px; opacity: 0.6; margin-top: 4px; }
    .questList {
      display: flex; flex-direction: column; gap: 10px; margin: 20px 0;
    }
    .questCard {
      padding: 14px; border-radius: 12px;

    .levelInfo {
      padding: 20px; border-radius: 16px;
      /* Glassmorphism cyan (comme la maquette) : degrade sombre-cyan avec un
         reflet diagonal en haut plutot qu'un aplat uni. */
      background: linear-gradient(160deg, rgba(0,220,255,0.14), rgba(0,60,80,0.22));
      border: 2px solid rgba(0, 220, 255, 0.55);
      box-shadow: 0 0 30px rgba(0,220,255,0.15), inset 0 1px 0 rgba(255,255,255,0.12);
      margin: 16px 0; text-align: center; position: relative; overflow: hidden;

    .levelInfo .levelNumber {
      font-size: 48px; font-weight: 900; color: #5ff0ff;

      font-size: 16px; color: #ffd23b; margin-top: 8px; font-weight: 700;
    }
#fireBtn {
      position: absolute;
      right: 24px;
      bottom: 140px;
      z-index: 6;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,80,80,0.55), rgba(120,10,10,0.75));
      border: 2px solid rgba(255,90,90,0.85);
      box-shadow: 0 0 24px rgba(255,40,40,0.45), inset 0 2px 6px rgba(255,255,255,0.15);

      justify-content: center;

    #fireBtn svg {
      width: 34px; height: 34px;

    #fireBtn.pressed {
      transform: scale(0.92);
      box-shadow: 0 0 36px rgba(255,80,80,0.9), inset 0 2px 6px rgba(255,255,255,0.25);

    /* ===== RESPONSIVE (mobile/tablette portrait) ===== */
    @media (max-width: 700px) {
      #hud {
        top: 8px; left: 8px; padding: 9px 11px; border-radius: 12px;

      .hudStatLabel { font-size: 8px; }
      .hudStatValue { font-size: 14px; }
      #healthBar, #xpBar, #waveProgressBar { height: 7px; }
      .hudBarText { font-size: 9px; }

      #miniMap { top: 8px; right: 8px; width: 84px; height: 84px; }
#topRightControls { top: 8px; right: 8px; }
#pauseBtn, #soundBtn { width: 28px; height: 28px; }
      #bossBar { width: 90vw; height: 22px; top: 8px; }
      #bossName { font-size: 10px; letter-spacing: 1px; }

      #notifications { top: 90px; right: 8px; max-width: 60vw; }
      .notification { padding: 8px 12px; font-size: 11px; }

      /* Barre d'action : desormais seulement les armes (pouvoirs retires),
         donc les slots peuvent etre plus grands qu'avant tout en tenant
         confortablement meme sur un petit ecran (375px de large). */
      #actionBar { bottom: 96px; gap: 6px; padding: 8px; border-radius: 14px; }

      .weaponSlot {

      .weaponSlot .name { font-size: 7px; }

      h1 { letter-spacing: 3px; }
      .panel { padding: 20px; border-radius: 18px; }
      .statsGrid, .achievementGrid, .skinGrid { grid-template-columns: repeat(2, 1fr); }
      .skillTree { grid-template-columns: 1fr; }
	  #fireBtn { right: 140px; bottom: 88px; width: 76px; height: 76px; }
      #fireBtn svg { width: 30px; height: 30px; }
    }

    /* petits téléphones en paysage : le HUD haut prend trop de hauteur sinon */
    @media (max-height: 420px) and (orientation: landscape) {
      #hud { transform: scale(0.8); transform-origin: top left; }
      #bossBar { top: 4px; height: 18px; }
      #actionBar { transform: scale(0.85); transform-origin: bottom center; }
    }
  </style>
</head>

(() => {
  "use strict";
	function setVH() {
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', () => setTimeout(setVH, 200));

  const ctx = canvas.getContext("2d");

  // Detection mobile/tactile : utilisee pour activer la visee+tir automatique
  // (le joueur ne gere plus que deplacement et pouvoirs sur mobile), jamais
  // sur desktop ou la souris reste le mode de visee attendu. On combine
  // presence de points de contact ET absence de pointeur fin (mouse) plutot
  // que la seule largeur d'ecran, pour ne pas se tromper sur une tablette
  // large ou un PC a ecran tactile avec souris branchee.
  const isMobile = (navigator.maxTouchPoints > 0 || 'ontouchstart' in window)
    && !window.matchMedia('(pointer: fine)').matches;

  // ===== SPRITES (images vue-du-dessus, fond transparent, 1:1) =====

  // deadzone.html. Chaque cle correspond exactement a une arme (WEAPONS)
  // ou un type d'ennemi (ENEMY) deja utilises dans le code : deposer un
  // fichier au bon chemin l'active automatiquement, sans autre changement.
  // Tant qu'un fichier n'existe pas (ou n'a pas fini de charger), le rendu
  // vectoriel existant (drawHero/drawEnemies) reste utilise a sa place - le
  // jeu ne casse jamais si un sprite manque.
  const SPRITE_PATHS = {
    player_pistol: 'dead-zone/player_pistol.png',
    player_shotgun: 'dead-zone/player_shotgun.png',
    player_minigun: 'dead-zone/player_minigun.png',
    player_bazooka: 'dead-zone/player_bazooka.png',
    enemy_normal: 'dead-zone/enemy_normal.png',
    enemy_runner: 'dead-zone/enemy_runner.png',
    enemy_brute: 'dead-zone/enemy_brute.png',
    enemy_titan: 'dead-zone/enemy_titan.png',
    enemy_exploder: 'dead-zone/enemy_exploder.png',

  // absent de l'objet (jamais null/undefined explicite, pour garder le test
  // `sprites[key]` simple partout ou on l'utilise).
  const sprites = {};
  for (const key in SPRITE_PATHS) {
    const img = new Image();
    img.onload = () => { sprites[key] = img; };
    img.onerror = () => { /* fichier absent : on reste sur le rendu vectoriel */ };
    img.src = SPRITE_PATHS[key];
  }
  // Nom de sprite courant du heros, derive de l'arme equipee (voir

  // sprites.player_xxx.
  function currentPlayerSpriteKey() {
    const names = ['player_pistol','player_shotgun','player_minigun','player_bazooka'];
    return names[game.currentWeapon] || 'player_pistol';
  }

    shield: '<path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z" fill="currentColor" stroke="none"/>',

    crown: '<path d="M3 8l4 3 5-6 5 6 4-3-2 10H5z" fill="currentColor" stroke="none"/>',

    star: '<path d="M12 2l2.9 6.6 7.1.6-5.4 4.8L18.2 21 12 17.3 5.8 21l1.6-7-5.4-4.8 7.1-.6z" fill="currentColor" stroke="none"/>',

    bomb: '<circle cx="11" cy="14" r="7" fill="currentColor" stroke="none"/><path d="M15 8l2-3M15 5l2 1 1-2"/>',
    party: '<path d="M4 20l4-13 9 9z" fill="currentColor" stroke="none"/><path d="M15 4l1.5 1.5M18 3l1 2M20 6l2 1" stroke-linecap="round"/>',

  // icon(name, extraClass?) -> markup <svg> pret a inserer dans une chaine
  // de template HTML (notifications, cartes, onglets...). viewBox fixe en
  // 0..24, stroke hérité pour les traits, remplissage explicite pour les
  // formes pleines (voir ICON_SVG).
  function icon(name, extraClass) {
    const body = ICON_SVG[name];
    if (!body) return '';
    const cls = 'ico' + (extraClass ? ' ' + extraClass : '');
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

  // toggleSound) sans avoir a suivre individuellement chaque source active.

  function loadProgression() {
    try {
      const saved = localStorage.getItem('deadzone_progression');
      if (saved) progression = { ...progression, ...JSON.parse(saved) };
    } catch (e) {}

  function saveProgressionNow() {
    try { localStorage.setItem('deadzone_progression', JSON.stringify(progression)); } catch (e) {}
  }

  // Ecriture localStorage debouncee : appelee a chaque kill dans le code existant,
  // mais on ne persiste reellement qu'au plus une fois toutes les 2s (+ un flush
  // final via saveProgressionNow a la fin de partie) pour eviter les micro-freezes
  // pendant les combos/multi-kills.
  let saveProgressionTimer = null;
  function saveProgression() {
    if (saveProgressionTimer) return;
    saveProgressionTimer = setTimeout(() => {
      saveProgressionTimer = null;
      saveProgressionNow();
    }, 2000);
  }

  function xpForLevel(level) { return level * 100; }

  function addXP(amount) {
    progression.xp += amount;
    while (progression.xp >= xpForLevel(progression.level)) {
      progression.xp -= xpForLevel(progression.level);
      progression.level++;
      progression.skillPoints++;
      showNotification(`${icon('party')} LEVEL UP! Now level ${progression.level}`, 'levelup', 4);
      playSound('levelup');
      checkUnlocks();
    }
    saveProgression();
  }

  function checkUnlocks() {
    for (const skin of SKINS) {
      if (!progression.unlockedSkins.includes(skin.id) && skin.check(progression)) {
        progression.unlockedSkins.push(skin.id);
        showNotification(`${icon('palette')} Skin unlocked: ${skin.name}`, 'success', 3);
      }
    }
    for (const ach of ACHIEVEMENTS) {
      if (!progression.achievements.includes(ach.id) && ach.check(progression)) {
        progression.achievements.push(ach.id);
        showNotification(`${icon('crown')} Achievement: ${ach.name}`, 'success', 4);
        playSound('achievement');
      }
    }
    saveProgression();
  }

  function checkDailyQuests() {
    const today = new Date().toDateString();
    if (progression.questDate !== today) {
      progression.quests = [];
      const shuffled = [...QUEST_TEMPLATES].sort(() => Math.random() - 0.5);
      for (let i = 0; i < 3; i++) {
        const template = shuffled[i];
        const target = template.targets[Math.floor(Math.random() * template.targets.length)];
        progression.quests.push({
          type: template.type, title: template.title,
          desc: template.desc.replace('{target}', target),
          target: target, progress: 0,
          reward: template.reward, rewardAmount: template.rewardAmount,
          completed: false, claimed: false
        });
      }
      progression.questDate = today;
      saveProgression();
    }
  }

  function updateQuestProgress(type, amount = 1) {
    for (const quest of progression.quests) {
      if (quest.type === type && !quest.completed) {
        quest.progress = Math.min(quest.target, quest.progress + amount);
        if (quest.progress >= quest.target) {
          quest.completed = true;
          showNotification(`${icon('check')} Quest complete: ${quest.title}`, 'success', 3);
        }
      }
    }
    saveProgression();
  }

  function claimQuestReward(index) {
    const quest = progression.quests[index];
    if (quest.completed && !quest.claimed) {
      quest.claimed = true;
      addXP(quest.rewardAmount);
      showNotification(`+${quest.rewardAmount} XP claimed!`, 'levelup', 3);
      saveProgression();
    }
  }

  function getSkillEffect(branch, index) {
    const skill = SKILLS[branch][index];
    const level = progression.skills[skill.id] || 0;
    return skill.effect(level);
  }

  function getSkillLevel(skillId) { return progression.skills[skillId] || 0; }

  // Chaque branche (damage/speed/health) est desormais un vrai palier
  // progressif : la competence a l'index i necessite que celle a l'index i-1
  // soit au niveau max avant de pouvoir y investir un point. Avant, les 3
  // competences d'une branche etaient toutes debloquees d'emblee des qu'on
  // avait des points, sans notion de progression en arbre.
  function isSkillUnlocked(branch, index) {
    if (index === 0) return true;
    const prev = SKILLS[branch][index-1];
    return getSkillLevel(prev.id) >= prev.max;
  }

  function upgradeSkill(skillId) {
    let skill = null, branch = null, idx = -1;
    for (const b in SKILLS) {
      const i = SKILLS[b].findIndex(s => s.id === skillId);
      if (i !== -1) { skill = SKILLS[b][i]; branch = b; idx = i; break; }
    }
    if (!skill) return;
    if (!isSkillUnlocked(branch, idx)) return;
    const currentLevel = progression.skills[skillId] || 0;
    if (currentLevel >= skill.max || progression.skillPoints <= 0) return;
    progression.skills[skillId] = currentLevel + 1;
    progression.skillPoints--;
    saveProgression();
    playSound('pickup');
  }

  function selectTheme(themeId) {

  function getCurrentSkin() { return SKINS.find(s => s.id === progression.selectedSkin) || SKINS[0]; }
  function getCurrentTrail() { return TRAIL_EFFECTS.find(t => t.id === progression.selectedTrail) || TRAIL_EFFECTS[0]; }
  function getCurrentTheme() { return MAP_THEMES.find(t => t.id === progression.selectedTheme) || MAP_THEMES[0]; }

  // ========== AUDIO SYSTEM ==========
  function playSound(type, pitch = 1, extra = {}) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'shotgun') {
      // Detonation de fusil a pompe : un "punch" grave tres bref (le souffle
      // de la charge qui part) + du bruit filtre passe-bas avec une frequence
      // de coupure qui chute rapidement (plus caracteristique/sale qu'un
      // simple bruit blanc a coupure fixe), et une traine plus longue que
      // l'ancien son pour simuler l'echo/la reverberation de la detonation.
      const dur = 0.35;
      const n = audioCtx.createBufferSource();
      const b = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.09));
      n.buffer = b;
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(2200, now);
      f.frequency.exponentialRampToValueAtTime(280, now+dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.42, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      n.connect(f); f.connect(g); g.connect(masterGain);
      n.start(now);
      // Composante grave (le "coup" ressenti dans la poitrine) : un
      // oscillateur qui chute tres vite, superpose au bruit filtre.
      const po = audioCtx.createOscillator(), pg = audioCtx.createGain();
      po.type = 'sine';
      po.frequency.setValueAtTime(150, now);
      po.frequency.exponentialRampToValueAtTime(45, now+0.12);
      pg.gain.setValueAtTime(0.5, now);
      pg.gain.exponentialRampToValueAtTime(0.001, now+0.12);
      po.connect(pg); pg.connect(masterGain);
      po.start(now); po.stop(now+0.12);
      if(navigator.vibrate) navigator.vibrate(60);
    } else if (type === 'shoot') {
      // Pistolet : detonation sèche et courte (bruit filtre + punch grave
      // bref), meme technique que le shotgun mais plus petite/nerveuse -
      // remplace l'ancien oscillateur square qui sonnait comme un bip de
      // synthe plutot qu'un coup de feu.
      const dur = 0.1;
      const n = audioCtx.createBufferSource();
      const b = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.025));
      n.buffer = b;
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(3500*pitch, now);
      f.frequency.exponentialRampToValueAtTime(500*pitch, now+dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.28, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      n.connect(f); f.connect(g); g.connect(masterGain);
      n.start(now);
      const po = audioCtx.createOscillator(), pg = audioCtx.createGain();
      po.type = 'sine';
      po.frequency.setValueAtTime(180*pitch, now);
      po.frequency.exponentialRampToValueAtTime(60*pitch, now+0.05);
      pg.gain.setValueAtTime(0.3, now);
      pg.gain.exponentialRampToValueAtTime(0.001, now+0.05);
      po.connect(pg); pg.connect(masterGain);
      po.start(now); po.stop(now+0.05);
      if(navigator.vibrate) navigator.vibrate(20);
    } else if (type === 'sniper') {
      // Sniper : detonation puissante avec un filtre qui reste plus ouvert
      // (son plus clair/perçant qu'un pistolet) et une traine nettement plus
      // longue, coherente avec une arme longue portee - avant, un simple
      // sawtooth qui glissait, sans aucune texture de detonation.
      const dur = 0.45;
      const n = audioCtx.createBufferSource();
      const b = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.13));
      n.buffer = b;
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(5200*pitch, now);
      f.frequency.exponentialRampToValueAtTime(600*pitch, now+dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.4, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      n.connect(f); f.connect(g); g.connect(masterGain);
      n.start(now);
      const po = audioCtx.createOscillator(), pg = audioCtx.createGain();
      po.type = 'sine';
      po.frequency.setValueAtTime(130*pitch, now);
      po.frequency.exponentialRampToValueAtTime(35*pitch, now+0.18);
      pg.gain.setValueAtTime(0.55, now);
      pg.gain.exponentialRampToValueAtTime(0.001, now+0.18);
      po.connect(pg); pg.connect(masterGain);
      po.start(now); po.stop(now+0.18);
      if(navigator.vibrate) navigator.vibrate(45);
    } else if (type === 'minigun') {
      // Minigun : tres court et sec pour tenir la cadence rapide sans se
      // chevaucher desagreablement, mais garde le meme bruit filtre qu'un
      // vrai coup plutot qu'un bip carre repete.
      const dur = 0.045;
      const n = audioCtx.createBufferSource();
      const b = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.012));
      n.buffer = b;
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(2800*pitch, now);
      f.frequency.exponentialRampToValueAtTime(700*pitch, now+dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      n.connect(f); f.connect(g); g.connect(masterGain);
      n.start(now);
    } else if (type === 'hit') {
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(masterGain);
      o.type='sawtooth'; o.frequency.setValueAtTime(250*pitch,now); o.frequency.exponentialRampToValueAtTime(80*pitch,now+0.1);
      g.gain.setValueAtTime(0.12,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.1); o.start(now); o.stop(now+0.1);
    } else if (type === 'splat') {
      const n=audioCtx.createBufferSource(),b=audioCtx.createBuffer(1,audioCtx.sampleRate*0.15,audioCtx.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.05));

  // ===== AMBIANCE SONORE CREEPY/HORROR EN BOUCLE =====
  // Un drone grave continu (deux oscillateurs legerement desaccordes pour un
  // battement inquietant, filtre qui derive lentement), plus des craquements/
  // grincements aleatoires occasionnels declenches a intervalle irregulier.
  // Tout passe par masterGain, donc coupe automatiquement avec le bouton son.
  let ambience = null;
  function startAmbience() {
    if (ambience) return; // deja demarree
    const now = audioCtx.currentTime;
    const bus = audioCtx.createGain();
    bus.gain.value = 0;
    bus.gain.linearRampToValueAtTime(0.14, now + 3); // montee lente, pas un demarrage brutal
    bus.connect(masterGain);

    // Drone grave : deux oscillateurs proches en frequence (battement lent,
    // caracteristique du son "sourd" d'horreur), passes dans un filtre dont
    // la coupure derive tres lentement pour eviter un son fixe et statique.
    const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
    o1.type = 'sine'; o2.type = 'sine';
    o1.frequency.value = 42; o2.frequency.value = 44.5;
    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type = 'lowpass'; droneFilter.frequency.value = 220;
    o1.connect(droneFilter); o2.connect(droneFilter); droneFilter.connect(bus);
    o1.start(now); o2.start(now);

    // Derive lente et aleatoire de la frequence de coupure, pour que le
    // drone respire au lieu de rester parfaitement statique.
    function driftFilter() {
      if (!ambience) return;
      const target = 150 + Math.random()*220;
      droneFilter.frequency.linearRampToValueAtTime(target, audioCtx.currentTime + 6 + Math.random()*4);
      ambience.driftTimer = setTimeout(driftFilter, 6000 + Math.random()*4000);
    }

    // Craquements/grincements aleatoires : bruit filtre bref, tres espaces
    // dans le temps, pour ponctuer le silence sans devenir previsible.
    function scheduleCreeek() {
      if (!ambience) return;
      const delay = 8000 + Math.random()*14000;
      ambience.creakTimer = setTimeout(() => {
        const t = audioCtx.currentTime;
        const dur = 0.4 + Math.random()*0.5;
        const n = audioCtx.createBufferSource();
        const b = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
        const d = b.getChannelData(0);
        for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.15));
        n.buffer = b;
        const f = audioCtx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 300 + Math.random()*500; f.Q.value = 3;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.05 + Math.random()*0.04, t+dur*0.3);
        g.gain.exponentialRampToValueAtTime(0.001, t+dur);
        n.connect(f); f.connect(g); g.connect(masterGain);
        n.start(t);
        scheduleCreeek();
      }, delay);
    }

    ambience = { bus, o1, o2, driftFilter, driftTimer:null, creakTimer:null };
    driftFilter();
    scheduleCreeek();
  }

  function stopAmbience() {
    if (!ambience) return;
    const now = audioCtx.currentTime;
    ambience.bus.gain.linearRampToValueAtTime(0, now + 1);

    setTimeout(() => { o1.stop(); o2.stop(); o1.disconnect(); o2.disconnect(); bus.disconnect(); }, 1100);
    ambience = null;
  }

    const scale=0.05, cx=75, cy=75;
    miniMapCtx.fillStyle='rgba(255,0,0,0.3)';
    for(const b of world.buildings) {
      const dx=(b.x-hero.x)*scale, dy=(b.y-hero.y)*scale;
      if(Math.abs(dx)<75&&Math.abs(dy)<75) miniMapCtx.fillRect(cx+dx-2,cy+dy-2,4,4);
    }
    for(const e of world.enemies) {
      if(!e.visible) continue;
      const dx=(e.x-hero.x)*scale, dy=(e.y-hero.y)*scale;
      if(Math.abs(dx)<75&&Math.abs(dy)<75) {
        miniMapCtx.fillStyle=e.isBoss?'#ffff00':'#ff0000';
        miniMapCtx.beginPath(); miniMapCtx.arc(cx+dx,cy+dy,e.isBoss?4:2,0,Math.PI*2); miniMapCtx.fill();
      }
    }
    miniMapCtx.fillStyle='#00ff00'; miniMapCtx.beginPath(); miniMapCtx.arc(cx,cy,3,0,Math.PI*2); miniMapCtx.fill();
    miniMapCtx.strokeStyle='rgba(255,0,0,0.5)'; miniMapCtx.lineWidth=2;
    miniMapCtx.beginPath(); miniMapCtx.arc(75,75,73,0,Math.PI*2); miniMapCtx.stroke();
  }

  function drawDirectionIndicators() {
    for(const e of world.enemies) {
      if(!e.visible) continue;
      const sp = worldToScreen(e.x, e.y);
      if(sp.x<0||sp.x>view.w||sp.y<0||sp.y>view.h) {
        const angle = Math.atan2(sp.y-view.h/2, sp.x-view.w/2);
        const dist = Math.min(view.w,view.h)/2-60;
        const ix = view.w/2+Math.cos(angle)*dist;
        const iy = view.h/2+Math.sin(angle)*dist;
        ctx.save(); ctx.translate(ix,iy); ctx.rotate(angle);
        ctx.fillStyle=e.isBoss?'#ffff00':'#ff0000'; ctx.globalAlpha=0.7;
        ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-5,-5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }

  function resize() {
    view.w=innerWidth; view.h=innerHeight;
    view.dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.floor(view.w*view.dpr);
    canvas.height=Math.floor(view.h*view.dpr);
    canvas.style.width=view.w+"px"; canvas.style.height=view.h+"px";
    ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  }

  function resetState() {
    for(const k in world) if (Array.isArray(world[k])) world[k].length=0;
    world.loadedChunks.clear(); // Map, pas un tableau : vidage explicite necessaire
    Object.assign(game, {
      active:true, paused:false, score:0, points:0, wave:1, elapsed:0, elapsedSec:0,
      spawnClock:0, trauma:0, combo:0, comboTimer:0, maxCombo:0,
      hitStop:0, flashRed:0, flashWhite:0,
      multiKillTimer:0, multiKillCount:0, saturation:1.0,
      currentWeapon:0, chargeLevel:0, boss:null, lastBossWave:0,
      totalKills:0, startTime:Date.now(), lastProgressUpdate:0,
      killsThisRunNoDamage: 0, tookDamageThisRun: false,
      killsByWeaponThisRun: { pistol:0, shotgun:0, minigun:0, bazooka:0 },
      regenAccumulator: 0,
      waveKills:0, waveKillTarget:waveTargetFor(1), waveSpawned:0, waveTransition:0,
      lightningTimer: 10 + Math.random() * 20, lightningFlash: 0, lightningStrikePos: null,
      fogDensity: 0.1,
      heroDying: false, heroDeathTimer: 0, heroDeathPos: null, heroDeathAngle: 0,
      objectsDestroyedThisRun: 0,
      unlockedWeapons: new Set([0]), ammo: [Infinity, 0, 0, 0], ammoMax: [Infinity, 0, 0, 0],
      destroyedBuildings: new Set()
    });
    // Base remontee de 100 a 130 : avec le bug d'i-frames corrige (voir updateEnemies),
    // 100 PV etait trop punitif des les premieres vagues pour un joueur sans competences.
    const baseMaxHealth = 130 + upgrades.maxHealth.level * 20;
    const skillHpBonus = getSkillEffect('health', 0);
    hero.maxHealth = baseMaxHealth + skillHpBonus;
    hero.health = hero.maxHealth;

    Object.assign(hero, {
      x:0, y:0, aim:0, visualAngle: 0, cooldown:0,
      damage:1 + upgrades.damage.level * 0.5,
      fireDelay: Math.max(5, 18 - upgrades.fireRate.level * 2),
      speed: 3.45 + upgrades.speed.level * 0.5,
      triple: upgrades.tripleShot.level > 0,
      iframes:0, vx:0, vy:0, bobPhase:0, bobOffset:0,
      isMoving:false, currentSpeed:0,
      recoil: 0, damageFlash: 0, gunRecoilPhase: 0
    });
    Object.assign(camera, { x:0, y:0, zoom:1, targetZoom:1, rotation:0, targetRotation:0 });
    makeCity();
    generateEnvironment();
    ui.overlay.classList.remove('active');
    // Vide aussi le contenu (pas seulement la classe .active) : sinon les
    // boutons du dernier menu affiche (START/PROGRESSION, PLAY AGAIN...)
    // restent dans le DOM avec leurs ecouteurs de clic attaches. Comme les
    // boutons ont individuellement pointer-events:auto (necessaire pour
    // qu'ils soient cliquables quand l'overlay EST actif), ce reglage
    // outrepasse le pointer-events:none herite du parent #overlay masque -
    // un clic au centre de l'ecran pendant la partie pouvait donc atteindre
    // un bouton invisible et rouvrir le menu, ce qui ressemblait a un
    // redemarrage impromptu du jeu.
    ui.overlay.innerHTML = '';
    ui.bossBar.classList.remove('active');
    updateWeaponUI(); syncHud();
  }

  // ===== GENERATION PROCEDURALE INFINIE (systeme de chunks) =====
  // Avant : makeCity() posait une grille finie 11x11 de batiments une seule
  // fois au debut de partie -> le joueur finissait par atteindre le bord du
  // monde. Desormais la ville est decoupee en chunks carres generes a la
  // volee autour du joueur (et dechargent quand il s'eloigne), avec un bruit
  // a basse frequence qui determine le "type de quartier" (dense / avenue /
  // parc) pour que des zones coherentes emergent plutot qu'un bruit uniforme.

  const CHUNK_SIZE = 720; // cote d'un chunk en unites monde
  const CHUNK_LOAD_RADIUS = 1; // chunks charges autour du joueur (rayon en chunks) :
    // grille 3x3 = ~2160px de cote, largement au-dela de la zone visible a
    // l'ecran (zoom entre 0.88 et 1.15) tout en gardant un nombre de
    // batiments raisonnable (~90 max vs ~250 avec un rayon de 2).
  const CHUNK_UNLOAD_RADIUS = 3; // dechargement au-dela de ce rayon

  // Petit generateur pseudo-aleatoire a seed (mulberry32) : contrairement a
  // Math.random(), il est deterministe pour une seed donnee, donc revisiter
  // un chunk redonne exactement le meme contenu au lieu de le regenerer
  // differemment a chaque passage.
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function chunkSeed(cx, cy) {
    // Combine les deux coordonnees en un entier 32 bits stable
    return (cx * 374761393 + cy * 668265263) ^ 0x9e3779b9;
  }
  // Bruit de "type de quartier" a tres basse frequence (independant du seed
  // de contenu du chunk) : des chunks voisins ont de bonnes chances de
  // partager le meme type, ce qui cree des zones coherentes (un parc qui
  // s'etend sur plusieurs chunks plutot qu'un chunk-parc isole au milieu
  // d'immeubles).
  function districtType(cx, cy) {
    const zx = Math.floor(cx/3), zy = Math.floor(cy/3);
    const r = mulberry32(chunkSeed(zx*97+13, zy*97+13))();
    if (r < 0.14) return 'park';
    if (r < 0.24) return 'avenue';
    return 'dense';
  }

  const facadePalette = ['#23262b', '#262a24', '#20242c', '#282523', '#22252a'];
  const roofKinds = ['flat', 'tank', 'aircon', 'antenna', 'ledge', 'solar', 'helipad'];
  // Tirage pondere : helipad et solar sont des elements marquants, donc plus
  // rares que le reste pour rester des "trouvailles" plutot que la norme.
  const roofKindWeights = { flat:22, tank:16, aircon:18, antenna:16, ledge:16, solar:10, helipad:2 };
  function pickRoofKind(rng) {
    const total = Object.values(roofKindWeights).reduce((a,b)=>a+b,0);
    let r = rng()*total;
    for (const k of roofKinds) { r -= roofKindWeights[k]; if (r<=0) return k; }
    return 'flat';
  }

  // forcedW/forcedH permettent d'imposer des dimensions precises (utilise par
  // placeBuildingRow pour aligner des batiments adjacents sans trous ni
  // chevauchement) ; sans eux, la taille reste aleatoire comme avant.
  function makeBuildingAt(x, y, rng, forcedW, forcedH) {
    const w = forcedW || (80+rng()*70);
    const h = forcedH || (80+rng()*70);
    // Texture de toit (materiau) : fait varier le rendu de la surface elle-meme,
    // independamment des elements poses dessus (roofKind). Vu du dessus, le
    // toit EST tout ce qu'on voit du batiment : il doit donc avoir une vraie
    // variete de surface plutot qu'un aplat uniforme.
    const roofMaterials = ['tar', 'gravel', 'concrete'];
    const building = {
      x, y, w, h,
      // Points de vie : un batiment percute par un ennemi bloque plus de 5s
      // (voir updateEnemies/destructibleTimer) finit par s'effondrer. hp
      // proportionnel a la surface pour que les gros immeubles resistent
      // un peu plus longtemps que les petits.
      hp: 30, maxHp: 30,
      facade: facadePalette[Math.floor(rng()*facadePalette.length)],
      roofKind: pickRoofKind(rng),
      roofMaterial: roofMaterials[Math.floor(rng()*roofMaterials.length)],
      roofSeed: rng(),
      flickerSeed: rng() * 1000,
      // Details epars sur le toit (bouches d'aeration, trappes) generes une
      // fois et fixes, pas des fenetres : coherents avec une vue aerienne.
      roofProps: []
    };
    // Repartit 2 a 5 petits elements fonctionnels sur la surface du toit
    // (events, trappe d'acces, eventuellement un second bloc de clim isole).
    const propCount = 2 + Math.floor(rng()*4);
    const propKinds = ['vent','vent','hatch','pipe'];
    for (let i=0;i<propCount;i++) {
      building.roofProps.push({
        kind: propKinds[Math.floor(rng()*propKinds.length)],
        rx: (rng()-0.5) * (w-24),
        ry: (rng()-0.5) * (h-24),
        rot: rng()*Math.PI*2,
        seed: rng()
      });
    }
    return building;
  }

  // Remplit un ilot rectangulaire (blockX,blockY = coin superieur-gauche,
  // blockW x blockH) avec une rangee de batiments COLLES les uns aux autres
  // le long du bord superieur, comme un vrai pate de maisons americain vu du
  // dessus (facades alignees et adjacentes), plutot que des batiments
  // eparpilles independamment avec un jitter aleatoire. Une petite marge de
  // trottoir separe l'ilot de la rue qui l'entoure.
  // Trois agencements d'ilot possibles, tires au hasard par placeBlock : une
  // seule forme repetee partout rendait la ville monotone malgre les
  // batiments colles. "row" = rangee(s) doubles comme avant, "single" = un
  // seul gros batiment isole (tour, usine, entrepot), "courtyard" =
  // batiments en perimetre avec un espace vide au centre (cour/parking).

  function placeBuildingRowLayout(chunk, blockX, blockY, blockW, blockH, rng, overlapsExclusion) {
    const sidewalk = 8;
    const rowX0 = blockX + sidewalk, rowY0 = blockY + sidewalk;
    const rowW = blockW - sidewalk*2, rowH = blockH - sidewalk*2;
    if (rowW < 60 || rowH < 60) return;
    const depth = Math.min(rowH, 70 + rng()*50);
    let x = rowX0;
    while (x < rowX0 + rowW - 30) {
      const w = Math.min(60 + rng()*60, rowX0 + rowW - x);
      if (w < 40) break;
      const h = depth * (0.85 + rng()*0.3);
      const bx = x + w/2, by = rowY0 + h/2;
      if (!overlapsExclusion(bx, by, w, h)) chunk.buildings.push(makeBuildingAt(bx, by, rng, w, h));
      x += w;
    }
    if (rowH > depth + 40) {
      let x2 = rowX0;
      const y2 = rowY0 + rowH - depth;
      while (x2 < rowX0 + rowW - 30) {
        const w = Math.min(60 + rng()*60, rowX0 + rowW - x2);
        if (w < 40) break;
        const h = depth * (0.85 + rng()*0.3);
        const bx = x2 + w/2, by = y2 + depth - h/2;
        if (!overlapsExclusion(bx, by, w, h)) chunk.buildings.push(makeBuildingAt(bx, by, rng, w, h));
        x2 += w;
      }
    }
  }

  // Un seul gros batiment occupant la majeure partie de l'ilot (usine, tour,
  // entrepot) : casse la monotonie des rangees en introduisant de temps en
  // temps une silhouette isolee bien plus grande que ses voisins.
  function placeSingleBuildingLayout(chunk, blockX, blockY, blockW, blockH, rng, overlapsExclusion) {
    const margin = 10;
    const w = blockW - margin*2, h = blockH - margin*2;
    if (w < 60 || h < 60) return;
    const bx = blockX + blockW/2, by = blockY + blockH/2;
    if (!overlapsExclusion(bx, by, w, h)) chunk.buildings.push(makeBuildingAt(bx, by, rng, w, h));
  }

  // Batiments disposes en perimetre de l'ilot avec un espace vide au centre
  // (cour interieure, parking, jardin) : une troisieme silhouette de bloc
  // bien distincte des deux autres.
  function placeCourtyardLayout(chunk, blockX, blockY, blockW, blockH, rng, overlapsExclusion) {
    const sidewalk = 8;
    const x0 = blockX + sidewalk, y0 = blockY + sidewalk;
    const w0 = blockW - sidewalk*2, h0 = blockH - sidewalk*2;
    if (w0 < 100 || h0 < 100) return;
    const ringDepth = 45 + rng()*20;
    // Bord haut et bas
    for (const edgeY of [y0 + ringDepth/2, y0 + h0 - ringDepth/2]) {
      let x = x0;
      while (x < x0 + w0 - 30) {
        const w = Math.min(50 + rng()*40, x0 + w0 - x);
        if (w < 35) break;
        const bx = x + w/2;
        if (!overlapsExclusion(bx, edgeY, w, ringDepth)) chunk.buildings.push(makeBuildingAt(bx, edgeY, rng, w, ringDepth*(0.8+rng()*0.3)));
        x += w;
      }
    }
    // Bord gauche et droit (entre les deux bords deja poses, pour ne pas
    // dupliquer les coins)
    const innerY0 = y0 + ringDepth, innerH = h0 - ringDepth*2;
    if (innerH > 40) {
      for (const edgeX of [x0 + ringDepth/2, x0 + w0 - ringDepth/2]) {
        let y = innerY0;
        while (y < innerY0 + innerH - 30) {
          const hh = Math.min(50 + rng()*40, innerY0 + innerH - y);
          if (hh < 35) break;
          const by = y + hh/2;
          if (!overlapsExclusion(edgeX, by, ringDepth*(0.8+rng()*0.3), hh)) chunk.buildings.push(makeBuildingAt(edgeX, by, rng, ringDepth*(0.8+rng()*0.3), hh));
          y += hh;
        }
      }
    }
  }

  // Passages pietons places a partir de la position REELLE des batiments du
  // chunk (appelee apres que tous les blocs soient generes) : pour chaque
  // paire de batiments proches separes par une rue et suffisamment alignes
  // (memes bornes verticales ou horizontales), pose un passage piéton entre
  // leurs deux facades qui se font face. Respecte : max 2 passages par
  // batiment, jamais de chevauchement entre deux passages.
  function placeCrosswalksForBuildings(chunk, rng, streetWidth) {
    const buildings = chunk.buildings;
    const crossingCount = new Map(); // batiment -> nombre de passages deja poses
    function countOf(b) { return crossingCount.get(b) || 0; }
    function overlapsExisting(cw) {
      return chunk.crosswalks.some(o => Math.abs(o.x-cw.x) < (o.w+cw.w)/2 && Math.abs(o.y-cw.y) < (o.h+cw.h)/2);
    }
    for (let i=0; i<buildings.length; i++) {
      const a = buildings[i];
      if (countOf(a) >= 2) continue;
      for (let j=i+1; j<buildings.length; j++) {
        const b = buildings[j];
        if (countOf(a) >= 2) break;
        if (countOf(b) >= 2) continue;
        // Paire alignee horizontalement (meme bande en y, separee en x par
        // une rue) : facades gauche/droite qui se font face.
        const vGap = Math.abs(a.x - b.x) - (a.w/2 + b.w/2);
        const vOverlapY = Math.min(a.y+a.h/2, b.y+b.h/2) - Math.max(a.y-a.h/2, b.y-b.h/2);
        if (vGap > streetWidth*0.6 && vGap < streetWidth*1.6 && vOverlapY > 30) {
          const midX = (a.x < b.x) ? (a.x + a.w/2 + b.x - b.w/2)/2 : (b.x + b.w/2 + a.x - a.w/2)/2;
          const midY = (Math.max(a.y-a.h/2,b.y-b.h/2) + Math.min(a.y+a.h/2,b.y+b.h/2))/2;
          const cw = { x: midX, y: midY, w: 14, h: Math.min(30, vOverlapY*0.7), vertical:true };
          if (!overlapsExisting(cw) && rng() < 0.5) {
            chunk.crosswalks.push(cw);
            crossingCount.set(a, countOf(a)+1); crossingCount.set(b, countOf(b)+1);
            continue;
          }
        }
        // Paire alignee verticalement (meme bande en x, separee en y par une
        // rue) : facades haut/bas qui se font face.
        const hGap = Math.abs(a.y - b.y) - (a.h/2 + b.h/2);
        const hOverlapX = Math.min(a.x+a.w/2, b.x+b.w/2) - Math.max(a.x-a.w/2, b.x-b.w/2);
        if (hGap > streetWidth*0.6 && hGap < streetWidth*1.6 && hOverlapX > 30) {
          const midY = (a.y < b.y) ? (a.y + a.h/2 + b.y - b.h/2)/2 : (b.y + b.h/2 + a.y - a.h/2)/2;
          const midX = (Math.max(a.x-a.w/2,b.x-b.w/2) + Math.min(a.x+a.w/2,b.x+b.w/2))/2;
          const cw = { x: midX, y: midY, w: Math.min(30, hOverlapX*0.7), h: 14, vertical:false };
          if (!overlapsExisting(cw) && rng() < 0.5) {
            chunk.crosswalks.push(cw);
            crossingCount.set(a, countOf(a)+1); crossingCount.set(b, countOf(b)+1);
          }
        }
      }
    }
  }

  // Choisit un agencement pour un ilot donne et l'applique : remplace l'ancien
  // placeBuildingRow (une seule forme possible) par un tirage entre 3
  // silhouettes de bloc differentes, pour une ville qui varie vraiment.
  function placeBlock(chunk, blockX, blockY, blockW, blockH, rng, excludeX, excludeY, excludeR) {
    const hasExclusion = typeof excludeR === 'number';
    function overlapsExclusion(bx, by, bw, bh) {
      if (!hasExclusion) return false;
      const cx = Math.max(bx-bw/2, Math.min(excludeX, bx+bw/2));
      const cy = Math.max(by-bh/2, Math.min(excludeY, by+bh/2));
      return Math.hypot(excludeX-cx, excludeY-cy) < excludeR;
    }
    const roll = rng();
    if (roll < 0.55) placeBuildingRowLayout(chunk, blockX, blockY, blockW, blockH, rng, overlapsExclusion);
    else if (roll < 0.8) placeCourtyardLayout(chunk, blockX, blockY, blockW, blockH, rng, overlapsExclusion);
    else placeSingleBuildingLayout(chunk, blockX, blockY, blockW, blockH, rng, overlapsExclusion);
  }

  // Genere le contenu d'un seul chunk (batiments, arbres de parc, bancs,
  // lampadaires, vehicules, destructibles, fissures, flaques...) selon le
  // type de quartier, et le stocke pour pouvoir le retirer proprement plus
  // tard sans toucher aux chunks voisins.
  function generateChunk(cx, cy) {
    const rng = mulberry32(chunkSeed(cx, cy));
    const type = districtType(cx, cy);
    const originX = cx*CHUNK_SIZE, originY = cy*CHUNK_SIZE;
    const chunk = {
      cx, cy, type, buildings:[], trees:[], benches:[],
      streetLights:[], vehicles:[], destructibles:[], groundCracks:[], puddles:[],
      roadMarkings:[], trafficLights:[], crosswalks:[]
    };

    if (type === 'dense') {
      // Grille de rues a l'americaine : le chunk est decoupe en blocs
      // rectangulaires separes par des rues degagees a intervalle regulier
      // (comme un vrai plan de ville), et chaque bloc est rempli par une
      // RANGEE de batiments colles les uns aux autres le long de son bord
      // (facades adjacentes, pas de jitter aleatoire qui les eparpille) -
      // avant, les batiments etaient simplement poses sur une grille avec
      // un decalage aleatoire, sans notion de rue ni d'ilot, ce qui donnait
      // un aspect brouillon plutot qu'un vrai quartier.
      const streetWidth = 70;
      const blockSize = 220; // bloc + rue inclue dans cette periode
      const blockInner = blockSize - streetWidth; // partie batie du bloc
      const cells = Math.ceil(CHUNK_SIZE/blockSize);
      // Zone degagee garantie autour de l'origine du monde (0,0), qui est
      // toujours le point de spawn du heros : aucun batiment n'est place
      // dans ce rayon, pour que la partie ne puisse jamais commencer
      // enfermee dans (ou collee contre) un immeuble.
      const nearOrigin = Math.abs(originX) < CHUNK_SIZE*2 && Math.abs(originY) < CHUNK_SIZE*2;
      for (let gx=0; gx<cells; gx++) {
        for (let gy=0; gy<cells; gy++) {
          const blockX = originX + gx*blockSize;
          const blockY = originY + gy*blockSize;
          if (rng() > 0.85) continue; // certains ilots restent vides (parking, terrain vague)
          if (nearOrigin) placeBlock(chunk, blockX, blockY, blockInner, blockInner, rng, 0, 0, 160);
          else placeBlock(chunk, blockX, blockY, blockInner, blockInner, rng);
        }
      }
      // Passages pietons generes en premier (a partir des batiments reels du
      // chunk, voir placeCrosswalksForBuildings) : le marquage de ligne
      // centrale ci-dessous les evite ensuite pour ne jamais se chevaucher.
      placeCrosswalksForBuildings(chunk, rng, streetWidth);

      // Marquage au sol des rues : ligne centrale discontinue le long de
      // chaque bande de rue (verticale et horizontale), pour que la grille
      // se lise vraiment comme un plan de rues plutot qu'un vide informe
      // entre les ilots. Chaque segment est saute s'il chevaucherait un
      // passage pieton deja pose, pour garder une coherence entre les deux
      // marquages plutot que de les laisser se superposer au hasard.
      function overlapsCrosswalk(x, y, w, h) {
        return chunk.crosswalks.some(cw => Math.abs(cw.x-x) < (cw.w+w)/2+2 && Math.abs(cw.y-y) < (cw.h+h)/2+2);
      }
      for (let gx=0; gx<=cells; gx++) {
        const roadCenterX = originX + gx*blockSize - streetWidth/2;
        for (let t=0; t<CHUNK_SIZE; t+=40) {
          const my = originY+t;
          if (overlapsCrosswalk(roadCenterX, my, 3, 16)) continue;
          chunk.roadMarkings.push({ x: roadCenterX, y: my, w: 3, h: 16, vertical:true });
        }
      }
      for (let gy=0; gy<=cells; gy++) {
        const roadCenterY = originY + gy*blockSize - streetWidth/2;
        for (let t=0; t<CHUNK_SIZE; t+=40) {
          const mx = originX+t;
          if (overlapsCrosswalk(mx, roadCenterY, 16, 3)) continue;
          chunk.roadMarkings.push({ x: mx, y: roadCenterY, w: 16, h: 3, vertical:false });
        }
      }
      // Feux tricolores : un par intersection ayant au moins un batiment a
      // proximite immediate (pour ne pas en poser au milieu d'un terrain
      // vague sans aucun batiment autour).
      for (let gx=0; gx<=cells; gx++) {
        for (let gy=0; gy<=cells; gy++) {
          const ix = originX + gx*blockSize - streetWidth/2;
          const iy = originY + gy*blockSize - streetWidth/2;
          if (rng() > 0.6) continue; // pas toutes les intersections n'ont un feu
          const nearBuilding = chunk.buildings.some(b => Math.hypot(b.x-ix, b.y-iy) < blockSize);
          if (!nearBuilding) continue;
          const corner = Math.floor(rng()*4);
          const cOff = streetWidth/2 + 6;
          const cx = ix + (corner%2===0?-cOff:cOff);
          const cy = iy + (corner<2?-cOff:cOff);
          chunk.trafficLights.push({ x: cx, y: cy, phase: rng()*Math.PI*2, cycle: 4+rng()*2 });
        }
      }
    } else if (type === 'avenue') {
      // Grande allee : une large bande degagee au centre du chunk, bordee de
      // batiments plus espaces de chaque cote (au lieu d'une grille dense).
      const laneWidth = 220;
      const spacing = 200;
      const cells = Math.floor(CHUNK_SIZE/spacing);
      for (let gx=0; gx<cells; gx++) for (let gy=0; gy<cells; gy++) {
        const bx = originX + gx*spacing + spacing/2 + (rng()-0.5)*20;
        const by = originY + gy*spacing + spacing/2 + (rng()-0.5)*20;
        // Saute la bande centrale (verticale) pour laisser l'allee degagee
        const localX = bx - (originX + CHUNK_SIZE/2);
        if (Math.abs(localX) < laneWidth/2) continue;
        if (rng() > 0.75) continue;
        chunk.buildings.push(makeBuildingAt(bx, by, rng));
      }
      // Rangee d'arbres le long de l'allee, plus quelques bancs : casse la
      // monotonie du bitume sur cette large bande degagee.
      for (let i=0;i<6;i++) {
        const ly = originY + (i/5)*CHUNK_SIZE;
        chunk.trees.push({x:originX+CHUNK_SIZE/2-laneWidth/2-16, y:ly, r:12+rng()*6, seed:rng()});
        chunk.trees.push({x:originX+CHUNK_SIZE/2+laneWidth/2+16, y:ly, r:12+rng()*6, seed:rng()});
      }
      if (rng()<0.6) chunk.benches.push({x:originX+CHUNK_SIZE/2+(rng()-0.5)*laneWidth*0.6, y:originY+CHUNK_SIZE*0.5, rotation:Math.PI/2});
    } else if (type === 'park') {
      // Parc : quasi aucun batiment, des arbres disperses + quelques bancs.
      if (rng() < 0.08) chunk.buildings.push(makeBuildingAt(originX+rng()*CHUNK_SIZE, originY+rng()*CHUNK_SIZE, rng));
      const treeCount = 22 + Math.floor(rng()*14);
      for (let i=0;i<treeCount;i++) {
        chunk.trees.push({
          x: originX + rng()*CHUNK_SIZE, y: originY + rng()*CHUNK_SIZE,
          r: 14 + rng()*10, seed: rng()
        });
      }
      const benchCount = 2 + Math.floor(rng()*3);
      for (let i=0;i<benchCount;i++) {
        chunk.benches.push({
          x: originX + rng()*CHUNK_SIZE, y: originY + rng()*CHUNK_SIZE,
          rotation: rng()*Math.PI
        });
      }
    }

    // ---- Details communs a tous les types (densite adaptee par type) ----
    const urbanFactor = type==='park' ? 0.15 : (type==='avenue' ? 0.6 : 1);

    // Fissures d'asphalte
    const crackCount = Math.round(48 * urbanFactor);
    for (let i=0;i<crackCount;i++) {
      const x = originX + rng()*CHUNK_SIZE, y = originY + rng()*CHUNK_SIZE;
      chunk.groundCracks.push({ x, y, angle: rng()*Math.PI*2, len: 14+rng()*30, bend: (rng()-0.5)*0.6 });
    }
    // Flaques
    const puddleCount = Math.round(6 * urbanFactor);
    for (let i=0;i<puddleCount;i++) {
      chunk.puddles.push({
        x: originX + rng()*CHUNK_SIZE, y: originY + rng()*CHUNK_SIZE,
        rx: 20+rng()*30, ry: 10+rng()*16, rotation: rng()*Math.PI
      });
    }
    // Lampadaires (moins denses en parc, l'eclairage y est plus rare)
    const lightCount = Math.round(3 * urbanFactor) + 1;
    for (let i=0;i<lightCount;i++) {
      chunk.streetLights.push({
        x: originX + rng()*CHUNK_SIZE, y: originY + rng()*CHUNK_SIZE,
        radius: 60+rng()*40, flicker: rng()*Math.PI*2, flickerSpeed: 0.5+rng()*2.5,
        color: rng()<0.65 ? '#ffaa44' : (rng()<0.85?'#aaccff':'#ff6644'),
        // Destructibles : hp>0, s'eteignent et cessent d'eclairer une fois cassees.
        hp: 4, maxHp: 4, broken: false, flash: 0
      });
    }
    // Vehicules abandonnes (rares en parc)
    const vehicleCount = Math.round(5 * urbanFactor);
    for (let i=0;i<vehicleCount;i++) {
      const x = originX + rng()*CHUNK_SIZE, y = originY + rng()*CHUNK_SIZE;
      if (collidesBuildingsList(chunk.buildings, x, y, 30)) continue;
      chunk.vehicles.push({
        x, y, w: 30+rng()*20, h: 50+rng()*30, rotation: rng()*Math.PI*2,
        color: ['#442222','#223344','#333333','#443322','#224433'][Math.floor(rng()*5)],
        hp: 3, maxHp: 3, flash: 0
      });
    }
    // Destructibles (poubelles, caisses, barils)
    const destructibleCount = Math.round(8 * urbanFactor);
    for (let i=0;i<destructibleCount;i++) {
      const x = originX + rng()*CHUNK_SIZE, y = originY + rng()*CHUNK_SIZE;
      if (collidesBuildingsList(chunk.buildings, x, y, 15)) continue;
      const roll = rng();
      let kind, radius, color, hp;
      if (roll < 0.4) { kind='barrel'; radius=10; color='#884422'; hp=2; }
      else if (roll < 0.7) { kind='crate'; radius=12; color='#664422'; hp=2; }
      else { kind='trash'; radius=8; color='#445544'; hp=1; }
      chunk.destructibles.push({ x, y, radius, kind, color, hp, maxHp:hp, flash:0 });
    }

    return chunk;
  }

  // Test de collision batiment restreint a une liste donnee (utilise pendant
  // la generation d'un chunk, avant que ses batiments soient ajoutes a
  // world.buildings, donc collidesBuilding() global ne les verrait pas encore).
  function collidesBuildingsList(buildings, x, y, r) {
    return buildings.some(b=>x+r>b.x-b.w/2&&x-r<b.x+b.w/2&&y+r>b.y-b.h/2&&y-r<b.y+b.h/2);
  }

  // cx/cy -> "cx,cy" pour indexer les chunks charges
  function chunkKey(cx, cy) { return cx+','+cy; }

  function worldToChunk(x, y) { return { cx: Math.floor(x/CHUNK_SIZE), cy: Math.floor(y/CHUNK_SIZE) }; }

  // Ajoute au monde tous les objets d'un chunk fraichement genere, et route
  // chaque type de decor vers le bon tableau world.* existant.
  function loadChunk(cx, cy) {
    const key = chunkKey(cx, cy);
    if (world.loadedChunks.has(key)) return;
    const chunk = generateChunk(cx, cy);
    world.loadedChunks.set(key, chunk);
    for (const b of chunk.buildings) {
      // Ne pas re-ajouter un batiment deja detruit par un ennemi lors d'un
      // passage precedent (generateChunk redonnerait exactement le meme
      // batiment a la meme position, seed oblige).
      if (game.destroyedBuildings.has(b.x+','+b.y)) continue;
      b.chunkKey = key; world.buildings.push(b);
    }
    for (const t of chunk.trees) { t.chunkKey = key; world.trees.push(t); }
    for (const bn of chunk.benches) { bn.chunkKey = key; world.benches.push(bn); }
    for (const l of chunk.streetLights) { l.chunkKey = key; world.streetLights.push(l); }
    for (const v of chunk.vehicles) { v.chunkKey = key; world.vehicles.push(v); }
    for (const d of chunk.destructibles) { d.chunkKey = key; world.destructibles.push(d); }
    for (const c of chunk.groundCracks) { c.chunkKey = key; world.groundCracks.push(c); }
    for (const p of chunk.puddles) { p.chunkKey = key; world.puddles.push(p); }
    for (const rm of chunk.roadMarkings) { rm.chunkKey = key; world.roadMarkings.push(rm); }
    for (const tl of chunk.trafficLights) { tl.chunkKey = key; world.trafficLights.push(tl); }
    for (const cw of chunk.crosswalks) { cw.chunkKey = key; world.crosswalks.push(cw); }
  }

  // Retire du monde tous les objets appartenant a ce chunk (filtre par
  // chunkKey plutot que de recalculer des positions, plus fiable).
  function unloadChunk(key) {
    world.loadedChunks.delete(key);
    world.buildings = world.buildings.filter(b => b.chunkKey !== key);
    world.trees = world.trees.filter(t => t.chunkKey !== key);
    world.benches = world.benches.filter(bn => bn.chunkKey !== key);
    world.streetLights = world.streetLights.filter(l => l.chunkKey !== key);
    world.vehicles = world.vehicles.filter(v => v.chunkKey !== key);
    world.destructibles = world.destructibles.filter(d => d.chunkKey !== key);
    world.groundCracks = world.groundCracks.filter(c => c.chunkKey !== key);
    world.puddles = world.puddles.filter(p => p.chunkKey !== key);
    world.roadMarkings = world.roadMarkings.filter(rm => rm.chunkKey !== key);
    world.trafficLights = world.trafficLights.filter(tl => tl.chunkKey !== key);
    world.crosswalks = world.crosswalks.filter(cw => cw.chunkKey !== key);
  }

  // Appelee en continu (a intervalle, pas chaque frame) pour charger les
  // chunks proches du heros et decharger les trop lointains.
  function updateChunks() {
    const { cx: hcx, cy: hcy } = worldToChunk(hero.x, hero.y);
    for (let dx=-CHUNK_LOAD_RADIUS; dx<=CHUNK_LOAD_RADIUS; dx++) {
      for (let dy=-CHUNK_LOAD_RADIUS; dy<=CHUNK_LOAD_RADIUS; dy++) {
        loadChunk(hcx+dx, hcy+dy);
      }
    }
    for (const key of Array.from(world.loadedChunks.keys())) {
      const chunk = world.loadedChunks.get(key);
      if (Math.abs(chunk.cx-hcx) > CHUNK_UNLOAD_RADIUS || Math.abs(chunk.cy-hcy) > CHUNK_UNLOAD_RADIUS) {
        unloadChunk(key);
      }
    }
  }

  // Throttle : verifier/charger des chunks a chaque frame serait inutile
  // (un joueur met plusieurs secondes a traverser un chunk) et couteux avec
  // beaucoup de batiments par chunk. On ne verifie que toutes les 0.5s de
  // temps reel, ce qui reste largement assez reactif.
  let chunkStreamTimer = 0;
  function updateChunkStreaming(sec) {
    chunkStreamTimer -= sec;
    if (chunkStreamTimer > 0) return;
    chunkStreamTimer = 0.5;
    updateChunks();
  }

  // Conserve pour compatibilite (appelee au demarrage d'une partie) : pose
  // les chunks initiaux autour de l'origine avant le premier rendu.
  function makeCity() {
    updateChunks();
  }

  // NEW: Generate environment details
  // La generation des batiments, fissures, flaques, lampadaires, vehicules et
  // destructibles est desormais geree par le systeme de chunks (voir
  // generateChunk/updateChunks) qui les cree/detruit au fur et a mesure que
  // le joueur se deplace, pour un monde infini. Cette fonction ne s'occupe
  // plus que de la pluie, qui reste un effet relatif a la camera (voir
  // updateRain) et n'a pas besoin d'etre decoupee en chunks.
  function generateEnvironment() {
    world.rain = [];
    for (let i = 0; i < 150; i++) {
      world.rain.push({
        x: Math.random() * view.w * 2 - view.w/2,
        y: Math.random() * view.h * 2 - view.h/2,
        speed: 15 + Math.random() * 10,
        length: 10 + Math.random() * 15
      });
    }
  }

  function rand(a,b){return a+Math.random()*(b-a);}
  function pressed(...n){return n.some(k=>input.keys.has(k));}
  function screenToWorld(x,y){return{x:(x-view.w/2)/camera.zoom+camera.x,y:(y-view.h/2)/camera.zoom+camera.y};}
  function worldToScreen(x,y){return{x:(x-camera.x)*camera.zoom+view.w/2,y:(y-camera.y)*camera.zoom+view.h/2};}

  // ===== Grille spatiale (hash) pour eviter les tests O(n^2) entre ennemis =====
  // Regroupe les ennemis par cellule de CELL px ; on ne teste ensuite la separation
  // qu'entre ennemis de cellules voisines (3x3), au lieu de tous contre tous.
