  const spatialGrid = { cellSize: 60, map: new Map() };

  function gridKey(cx, cy) { return cx + ',' + cy; }

  function rebuildEnemyGrid() {
    spatialGrid.map.clear();
    const cs = spatialGrid.cellSize;
    for (const e of world.enemies) {
      if (!e.visible) continue;
      const cx = Math.floor(e.x / cs), cy = Math.floor(e.y / cs);
      const key = gridKey(cx, cy);
      let bucket = spatialGrid.map.get(key);
      if (!bucket) { bucket = []; spatialGrid.map.set(key, bucket); }
      bucket.push(e);
    }
  }

  // Appelle fn(other) pour chaque ennemi visible dans les 9 cellules autour de e (lui-meme exclu)
  function forEachNearbyEnemy(e, fn) {
    const cs = spatialGrid.cellSize;
    const cx = Math.floor(e.x / cs), cy = Math.floor(e.y / cs);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const bucket = spatialGrid.map.get(gridKey(cx + dx, cy + dy));
        if (!bucket) continue;
        for (const o of bucket) if (o !== e) fn(o);
      }
    }
  }

  function collidesBuilding(x,y,r) {
    return world.buildings.some(b=>x+r>b.x-b.w/2&&x-r<b.x+b.w/2&&y+r>b.y-b.h/2&&y-r<b.y+b.h/2);
  }

  // Variante qui retourne le batiment concerne (ou null) plutot qu'un
  // simple booleen : necessaire pour cibler les degats d'un ennemi bloque
  // contre un batiment precis (voir updateEnemies).
  function findCollidingBuilding(x,y,r) {
    return world.buildings.find(b=>x+r>b.x-b.w/2&&x-r<b.x+b.w/2&&y+r>b.y-b.h/2&&y-r<b.y+b.h/2) || null;
  }

  // Inflige des degats a un batiment (ennemi bloque contre lui plus de 5s,
  // voir updateEnemies) ; a 0 hp, le batiment s'effondre : retire de
  // world.buildings (libere la collision et l'espace au sol), memorise dans
  // game.destroyedBuildings pour ne pas reapparaitre si le chunk est
  // recharge plus tard, et declenche un effondrement visuel/sonore.
  function damageBuilding(b, damage) {
    if (b.hp <= 0) return;
    b.hp -= damage;
    b.flash = 0.15;
    if (b.hp <= 0) {
      const idx = world.buildings.indexOf(b);
      if (idx !== -1) world.buildings.splice(idx, 1);
      game.destroyedBuildings.add(b.x+','+b.y);
      // Impacts de balle deja existants sur ce batiment : les detacher
      // n'est pas necessaire (ils sont indexes par position, pas par
      // batiment), ils resteront simplement au sol sur les gravats.
      burst(b.x, b.y, '#3a362e', 40);
      burst(b.x, b.y, '#8a8072', 25);
      createBuildingRubble(b);
      playSound('explosion');
      game.trauma = Math.max(game.trauma, 22);
      game.flashWhite = 0.25;
      game.objectsDestroyedThisRun++;
      progression.objectsDestroyed++;
      updateQuestProgress('destroy', 1);
      checkUnlocks();
      saveProgression();
    }
  }

  // Gravats laisses au sol a l'emplacement d'un batiment effondre : un tas
  // de decombres statique (pas de collision, purement visuel) qui remplace
  // la silhouette du batiment, pour que sa destruction reste visible
  // durablement plutot que de laisser un vide franc et propre.
  function createBuildingRubble(b) {
    world.buildingRubble.push({
      x: b.x, y: b.y, w: b.w, h: b.h, seed: Math.random()
    });
  }

  // NEW: Check collision with vehicles and destructibles
  function collidesObstacle(x, y, r) {
    for (const v of world.vehicles) {
      if (v.hp <= 0) continue;
      // Simple circle vs rectangle with rotation
      const dx = x - v.x, dy = y - v.y;
      const cos = Math.cos(-v.rotation), sin = Math.sin(-v.rotation);
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;
      if (Math.abs(lx) < v.w/2 + r && Math.abs(ly) < v.h/2 + r) return true;
    }
    for (const d of world.destructibles) {
      if (d.hp <= 0) continue;
      if (Math.hypot(x - d.x, y - d.y) < d.radius + r) return true;
    }
    return false;
  }

  function moveCircle(body,dx,dy) {
    if(!collidesBuilding(body.x+dx,body.y,body.radius) && !collidesObstacle(body.x+dx, body.y, body.radius)) body.x+=dx;
    if(!collidesBuilding(body.x,body.y+dy,body.radius) && !collidesObstacle(body.x, body.y+dy, body.radius)) body.y+=dy;
  }

  // NEW: Damage destructible/vehicle
  // Impact de balle persistant sur un batiment : petit trou/eclat qui reste
  // visible en permanence (contrairement au burst de particules qui
  // disparait en une fraction de seconde), pour que le decor porte les
  // traces des combats. Plafonne pour eviter une accumulation infinie.
  function createBuildingImpact(x, y, angle) {
    if (world.buildingImpacts.length > 200) world.buildingImpacts.shift();
    world.buildingImpacts.push({
      x, y, angle: angle + rand(-0.3,0.3),
      size: rand(2.5, 5), seed: Math.random()
    });
  }

  function damageObstacle(x, y, damage) {
    for (let i = world.vehicles.length - 1; i >= 0; i--) {
      const v = world.vehicles[i];
      if (v.hp <= 0) continue;
      const dx = x - v.x, dy = y - v.y;
      const cos = Math.cos(-v.rotation), sin = Math.sin(-v.rotation);
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;
      if (Math.abs(lx) < v.w/2 + 5 && Math.abs(ly) < v.h/2 + 5) {
        v.hp -= damage;
        v.flash = 0.2;
        burst(x, y, '#ffaa44', 5);
        if (v.hp <= 0) {
          burst(v.x, v.y, '#ff6600', 25);
          burst(v.x, v.y, '#333333', 15);
          playSound('explosion');
          game.trauma = Math.max(game.trauma, 10);
          game.objectsDestroyedThisRun++;
          progression.objectsDestroyed++;
          updateQuestProgress('destroy', 1);
          checkUnlocks();
          saveProgression();
        }
        return true;
      }
    }
    for (let i = world.destructibles.length - 1; i >= 0; i--) {
      const d = world.destructibles[i];
      if (d.hp <= 0) continue;
      if (Math.hypot(x - d.x, y - d.y) < d.radius + 5) {
        d.hp -= damage;
        d.flash = 0.2;
        burst(x, y, d.color, 4);
        if (d.hp <= 0) {
          burst(d.x, d.y, d.color, 15);
          playSound('destroy');
          game.objectsDestroyedThisRun++;
          progression.objectsDestroyed++;
          updateQuestProgress('destroy', 1);
          checkUnlocks();
          saveProgression();
          // Some destructibles give small bonus
          if (d.kind === 'barrel' && Math.random() < 0.3) {
            game.points += 5;
            world.floatingTexts.push({
              x: d.x, y: d.y, text: '+5', life: 1, maxLife: 1,
              color: '#ffff00', size: 16, bounce: 1, vy: -2
            });
          }
        }
        return true;
      }
    }
    // Lampadaires : petit poteau au centre du halo lumineux (rayon de
    // collision fixe et court, independant du rayon d'eclairage lui-meme).
    for (let i = world.streetLights.length - 1; i >= 0; i--) {
      const l = world.streetLights[i];
      if (l.broken) continue;
      if (Math.hypot(x - l.x, y - l.y) < 10) {
        l.hp -= damage;
        l.flash = 0.2;
        burst(x, y, '#ffdd88', 4);
        if (l.hp <= 0) {
          l.broken = true;
          burst(l.x, l.y, '#ffdd88', 20);
          burst(l.x, l.y, '#888888', 10);
          playSound('destroy');
          game.trauma = Math.max(game.trauma, 6);
          game.objectsDestroyedThisRun++;
          progression.objectsDestroyed++;
          updateQuestProgress('destroy', 1);
          checkUnlocks();
          saveProgression();
        }
        return true;
      }
    }
    return false;
  }

  function start() {
    if(audioCtx.state==='suspended') audioCtx.resume();
    cancelAnimationFrame(game.raf);
    resetState();
    game.lastTime=performance.now();
    game.raf=requestAnimationFrame(frame);
    startAmbience();
  }

  function frame(now) {
    if(!game.active) return;
    let dt=Math.min((now-game.lastTime)/16.6667,2.2);
    game.lastTime=now;
    // Pause : on continue de planifier requestAnimationFrame (pour reprendre
    // instantanement sans a-coup) mais on saute totalement simulate() -
    // la scene reste figee, seul l'overlay de pause est visible par-dessus.
    if(game.paused) { game.raf=requestAnimationFrame(frame); return; }
    if(game.hitStop>0) { game.hitStop-=dt; render(); game.raf=requestAnimationFrame(frame); return; }
    // dt/realDt restent en "frames a 60fps" (utilises pour mouvements/physique/rendu,
    // calibres empiriquement dans ces unites). realSec est le vrai delta-temps en
    // secondes, a utiliser pour tout timer de gameplay ecrit comme une duree reelle
    // (i-frames, combo timer, etc.) : avant ce correctif ces timers etaient
    // decrementes par dt/realDt (~1 par frame) au lieu de secondes, donc une
    // "invincibilite de 0.5s" ne durait en realite qu'environ 8ms.
    const realSec = realDtToSeconds(dt);
    simulate(dt, dt, realSec, realSec);
    render();
    game.raf=requestAnimationFrame(frame);
  }
  function realDtToSeconds(dt) { return dt / 60; }

  function simulate(dt, realDt, sec, realSec) {
    game.elapsed+=dt; game.elapsedSec+=sec; game.spawnClock+=dt;

    // Regen
    const regenRate = getSkillEffect('health', 1);
    if (regenRate > 0 && hero.health < hero.maxHealth) {
      game.regenAccumulator += regenRate * realSec;
      if (game.regenAccumulator >= 1) {
        const heal = Math.floor(game.regenAccumulator);
        hero.health = Math.min(hero.maxHealth, hero.health + heal);
        game.regenAccumulator -= heal;
      }
    }

    // Hero death animation
    if (game.heroDying) {
      game.heroDeathTimer -= realSec;
      if (game.heroDeathTimer <= 0) {
        endGame();
        return;
      }
    }

    if(game.comboTimer>0) { game.comboTimer-=sec; if(game.comboTimer<=0){game.combo=0;world.orbitParticles.length=0;} }
    if(game.multiKillTimer>0) { game.multiKillTimer-=sec; if(game.multiKillTimer<=0) game.multiKillCount=0; }
    game.saturation=1+Math.min(0.5,game.combo*0.05);

    // NEW: Hero animations
    if (hero.recoil > 0) hero.recoil -= dt * 15;
    if (hero.recoil < 0) hero.recoil = 0;
    if (hero.damageFlash > 0) hero.damageFlash -= dt * 3;
    if (hero.damageFlash < 0) hero.damageFlash = 0;

    // Orientation du sprite :
    // - Si le joueur tire (ou maintient le bouton), le sprite regarde vers
    //   la cible (hero.aim), pour que le canon soit aligne avec le tir.
    // - Sinon, le sprite regarde dans la direction de deplacement, pour
    //   qu'on ait l'impression qu'il marche "vers l'avant" et pas en
    //   crabe vers la souris.
    let targetAngle;
    if (input.pointer.held || game.heroDying) {
      targetAngle = hero.aim;
    } else if (hero.currentSpeed > 0.3) {
      targetAngle = Math.atan2(hero.vy, hero.vx);
    } else {
      targetAngle = hero.visualAngle; // immobile : on ne tourne pas
    }
    let angleDiff = targetAngle - hero.visualAngle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    hero.visualAngle += angleDiff * Math.min(1, dt * 12);

    // NEW: Weather
    updateWeather(sec, realSec);
    updateRain(dt);

    updateHero(dt,realDt,realSec);
    updateCamera(dt);
    updateChunkStreaming(sec);
    updateSpawning();
    updateEnemies(dt, realSec);
    updateShots(dt);
    updateEnemyShots(dt);
    updateParticles(dt);
    updateBloodTrails(dt); updateBloodSplats(realSec); updateShellCasings(dt);
    updatePickups(realSec);
    updateGibs(dt, realSec);
    updateFloatingTexts(dt); updateOrbitParticles(dt); updateDashTrails(dt);
    updateExplosions(dt); updateMoveTrails(dt); updateObstacles(dt);
    updateComboBar(); updateBossBar();

    game.score+=dt;
    // Progression des vagues par objectif de kills (voir onWaveKillProgress/
    // advanceWave), plus le compte-a-rebours de pause entre deux vagues.
    if (game.waveTransition > 0) {
      game.waveTransition -= realSec;
      if (game.waveTransition <= 0) { game.waveTransition = 0; advanceWave(); }
    }
    // Decroissance plus rapide (0.84 -> 0.72) : le trauma doit revenir a un
    // niveau bas entre deux impacts, meme en rafale de kills, pour eviter
    // l'effet de tremblement permanent signale.
    game.trauma*=Math.pow(0.72,dt);
    if(hero.iframes>0) hero.iframes-=realSec;
    if(game.flashRed>0) game.flashRed-=dt;
    if(game.flashWhite>0) game.flashWhite-=dt;

    // Fog increases with waves
    game.fogDensity = Math.min(0.5, 0.1 + game.wave * 0.02);

    if(game.wave%5===0&&game.wave!==game.lastBossWave&&!game.boss) { spawnBoss(); game.lastBossWave=game.wave; }
    if(game.elapsedSec-game.lastProgressUpdate>2) {
      game.lastProgressUpdate=game.elapsedSec;
      const next=Math.ceil(game.totalKills/50)*50, rem=next-game.totalKills;
      if(rem>0&&rem<=50){ui.progressIndicator.textContent=`${rem} kills to next milestone`;ui.progressIndicator.classList.add('active');}
      else ui.progressIndicator.classList.remove('active');
    }
    syncHud();
  }

  // NEW: Weather system
  // Note: appelee avec (sec, realSec) depuis simulate — les noms de parametres dt/realDt
  // ici designent donc des secondes reelles, pas des unites-frame (lightningTimer,
  // rainSoundTimer sont des durees en secondes).
  function updateWeather(dt, realDt) {
    // Lightning
    game.lightningTimer -= realDt;
    if (game.lightningTimer <= 0 && game.wave >= 3) {
      // Trigger lightning
      game.lightningFlash = 0.8;
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 400;
      game.lightningStrikePos = {
        x: hero.x + Math.cos(angle) * dist,
        y: hero.y + Math.sin(angle) * dist
      };
      playSound('lightning');
      game.trauma = Math.max(game.trauma, 8);
      progression.lightningsSurvived++;
      checkUnlocks();
      saveProgression();
      game.lightningTimer = 15 + Math.random() * 30;
    }
    if (game.lightningFlash > 0) {
      game.lightningFlash -= dt * 2;
      if (game.lightningFlash < 0) game.lightningFlash = 0;
    }
  }

  function updateRain(dt) {
    for (const drop of world.rain) {
      drop.x += 3 * dt; // Slight wind
      drop.y += drop.speed * dt * 60;
      // Reset when off screen
      if (drop.y > camera.y + view.h) {
        drop.y = camera.y - view.h/2 - Math.random() * 100;
        drop.x = camera.x + (Math.random() - 0.5) * view.w * 1.5;
      }
      if (drop.x > camera.x + view.w) {
        drop.x = camera.x - view.w/2;
      }
    }
    // Rain sound occasionally
    game.rainSoundTimer -= dt;
    if (game.rainSoundTimer <= 0 && game.wave >= 4) {
      playSound('rain');
      game.rainSoundTimer = 0.3 + Math.random() * 0.5;
    }
  }

  function updateHero(dt, realDt, realSec) {
    let ax=0, ay=0;
    if(!game.heroDying) {
      if(input.joystick.active) { ax=input.joystick.dx; ay=input.joystick.dy; }
      else {
        if(pressed("ArrowUp","w","W")) ay-=1;
        if(pressed("ArrowDown","s","S")) ay+=1;
        if(pressed("ArrowLeft","a","A")) ax-=1;
        if(pressed("ArrowRight","d","D")) ax+=1;
      }
    }

    const mag = Math.hypot(ax,ay)||1;
    const tx = (ax/mag)*hero.speed;
    const ty = (ay/mag)*hero.speed;

    if(ax!==0||ay!==0) {
      const accel = 0.25;
      hero.vx += (tx - hero.vx) * accel;
      hero.vy += (ty - hero.vy) * accel;
      hero.lastMoveDir = {x:ax/mag, y:ay/mag};
      hero.isMoving = true;
    } else {
      const friction = 0.82;
      hero.vx *= friction;
      hero.vy *= friction;
      if(Math.abs(hero.vx)<0.05) hero.vx=0;
      if(Math.abs(hero.vy)<0.05) hero.vy=0;
      hero.isMoving = (hero.vx!==0||hero.vy!==0);
    }

    hero.currentSpeed = Math.hypot(hero.vx, hero.vy);
    if (!game.heroDying) moveCircle(hero, hero.vx*dt, hero.vy*dt);

    // Effet de "bob" (oscillation verticale sinusoidale du sprite pendant
    // le deplacement) retire : il donnait l'impression que le personnage
    // tremble en continu des qu'il bouge, plutot qu'une vraie animation de
    // marche lisible.
    hero.bobOffset = 0;

    if(hero.currentSpeed > 2.0) {
      world.moveTrails.push({
        x: hero.x - hero.vx*2, y: hero.y - hero.vy*2,
        life: 0.4, maxLife: 0.4, radius: hero.radius * 0.7
      });
    }

    const target = screenToWorld(input.pointer.x, input.pointer.y);
    hero.aim = Math.atan2(target.y-hero.y, target.x-hero.x);
    if(hero.cooldown>0) hero.cooldown-=dt;

    // Tir automatique (mobile uniquement) : le joueur ne gere que deplacement
    // + pouvoirs, la visee et le declenchement se font sur l'ennemi le plus
    // proche a portee. Sur desktop la visee/tir restent manuels (souris).
    // Visée assistée sur mobile uniquement pendant qu'on maintient le bouton
    // de tir : plus de tir automatique, c'est le joueur qui décide quand tirer
    // (le bouton circulaire #fireBtn met input.pointer.held à true).
    if (isMobile && input.pointer.held) {
      const target2 = findNearestEnemy(WEAPONS[game.currentWeapon].autoRange || 420);
      if (target2) {
        hero.aim = Math.atan2(target2.y-hero.y, target2.x-hero.x);
      }
    }

    if(input.pointer.held && WEAPONS[game.currentWeapon].chargeable) {
      // chargeTime doit s'accumuler en vraies secondes (le seuil /1.5 plus bas
      // suppose "1.5 seconde pour charger a fond") : meme bug d'unite que les
      // i-frames, sinon la charge se remplissait quasi instantanement.
      input.pointer.chargeTime+=realSec;
      game.chargeLevel=Math.min(1,input.pointer.chargeTime/1.5);
      if(Math.floor(input.pointer.chargeTime*20)%4===0) playSound('charge',1,{charge:game.chargeLevel});
    }
    const wantsToFire = input.pointer.held || pressed(" ", "fire");
    if(wantsToFire&&hero.cooldown<=0 && !game.heroDying) fireWeapon();
  }

  // Cherche l'ennemi visible le plus proche du heros, dans un rayon donne.
  // Utilisee uniquement par le tir automatique mobile.
  function findNearestEnemy(maxRange) {
    let best = null, bestDist = maxRange;
    for (const e of world.enemies) {
      if (!e.visible) continue;
      const d = Math.hypot(e.x-hero.x, e.y-hero.y);
      if (d < bestDist) { bestDist = d; best = e; }
    }
    return best;
  }

  function updateCamera(dt) {
    const smoothing = 1-Math.pow(0.88,dt);
    camera.x += (hero.x-camera.x)*smoothing;
    camera.y += (hero.y-camera.y)*smoothing;

    let targetZoom = 1.0;
    if(hero.health < hero.maxHealth*0.3) targetZoom = 1.15;
    else if(game.combo >= 10) targetZoom = 0.88;
    else if(game.combo >= 5) targetZoom = 0.94;
    camera.targetZoom = targetZoom;
    camera.zoom += (camera.targetZoom - camera.zoom) * 0.05;

    camera.targetRotation = -hero.vx * 0.008;
    camera.rotation += (camera.targetRotation - camera.rotation) * 0.06;
  }

  // Nombre d'ennemis a tuer pour valider une vague : progression douce mais
  // croissante (15 a la vague 1, +4 par vague suivante environ), plafonnee
  // pour que les vagues tardives restent jouables en duree.
  function waveTargetFor(wave) {
    return Math.min(60, 15 + (wave-1)*4);
  }

  function updateSpawning() {
    if (game.waveTransition > 0) return; // pause entre deux vagues : pas de spawn
    if (game.waveSpawned >= game.waveKillTarget) return; // quota de cette vague deja tout spawne
    const interval=Math.max(8,50-game.wave*3);
    if(game.spawnClock>=interval) {
      game.spawnClock-=interval;
      createEnemy();
      game.waveSpawned++;
    }
  }

  // Appelee depuis killEnemy quand un ennemi de la vague en cours meurt.
  // Quand le quota est atteint, declenche une courte pause puis la vague
  // suivante (spawn plus dense, plus d'ennemis a tuer).
  function onWaveKillProgress() {
    game.waveKills++;
    if (game.waveKills >= game.waveKillTarget && game.waveTransition <= 0) {
      game.waveTransition = 3; // secondes de pause avant la vague suivante
      showNotification(`${icon('check')} WAVE ${game.wave} CLEARED!`, 'success', 3);
    }
  }

  function advanceWave() {
    game.wave++;
    game.waveKills = 0;
    game.waveSpawned = 0;
    game.waveKillTarget = waveTargetFor(game.wave);
    showNotification(`${icon('warning')} WAVE ${game.wave} — ${game.waveKillTarget} kills`, 'warning', 3);
  }

  function createEnemy() {
    // Interdiction de spawn dans un batiment : re-tire la position (jusqu'a
    // 8 essais) si le point choisi tombe a l'interieur d'un batiment. Avant,
    // la position etait choisie au hasard sans aucune verification, un
    // ennemi pouvait donc apparaitre coince a l'interieur d'un immeuble.
    let x, y, tries = 0;
    do {
      const angle=Math.random()*Math.PI*2, dist=500+Math.random()*100;
      x=hero.x+Math.cos(angle)*dist; y=hero.y+Math.sin(angle)*dist;
      tries++;
    } while (collidesBuilding(x, y, 20) && tries < 8);
    // Tous les types de zombies sont disponibles a partir de la vague 3 (au
    // lieu d'etre debloques progressivement jusqu'a la vague 6) : chaque
    // probabilite grimpe des la vague 1 pour runner/brute (deja le cas),
    // et demarre a la vague 3 pour tous les types speciaux restants.
    const rc=Math.min(0.25,game.wave*0.025), bc=Math.min(0.15,game.wave*0.02);
    const tc=game.wave>=3?Math.min(0.1,(game.wave-2)*0.02):0;
    const ec=game.wave>=3?Math.min(0.15,(game.wave-2)*0.02):0;
    const sc=game.wave>=3?Math.min(0.1,(game.wave-2)*0.02):0;
    const tlc=game.wave>=3?Math.min(0.12,(game.wave-2)*0.02):0;
    const spc=game.wave>=3?Math.min(0.12,(game.wave-2)*0.02):0;
    let kind="normal"; const roll=Math.random(); let c=0;
    c+=tlc; if(roll<c) kind="teleporter";
    if(kind==="normal"){c+=spc;if(roll<c) kind="spitter";}
    if(kind==="normal"){c+=sc;if(roll<c) kind="splitter";}
    if(kind==="normal"){c+=ec;if(roll<c) kind="exploder";}
    if(kind==="normal"){c+=tc;if(roll<c) kind="titan";}
    if(kind==="normal"){c+=bc;if(roll<c) kind="brute";}
    if(kind==="normal"){c+=rc;if(roll<c) kind="runner";}
    const t=ENEMY[kind];
    world.enemies.push({
      x,y,radius:t.radius, speed:t.speed+game.wave*0.15,
      hp:t.hp+game.wave*0.5, maxHp:t.hp+game.wave*0.5,
      kind, flash:0,
      explosive:t.explosive||false, splitter:t.splitter||false,
      teleporter:t.teleporter||false, teleportTimer:t.teleporter?2+Math.random()*2:0,
      ranged:t.ranged||false, shotTimer:t.ranged?rand(0.5,t.shotCooldown):0,
      visible:true, isBoss:t.isBoss||false,
      juggle:0, juggleVy:0, stagger:0, staggerDir:0,
      animSeed: Math.random()*100 // desynchronise l'anim de marche entre ennemis
    });
  }

  function spawnBoss() {
    // Meme protection anti-spawn-dans-un-batiment que createEnemy, avec un
    // rayon de test plus large (le boss est bien plus gros).
    let bx, by, tries = 0;
    do {
      const angle=Math.random()*Math.PI*2, dist=600;
      bx=hero.x+Math.cos(angle)*dist; by=hero.y+Math.sin(angle)*dist;
      tries++;
    } while (collidesBuilding(bx, by, 60) && tries < 8);
    const t=ENEMY.boss;
    const boss={
      x:bx, y:by,
      radius:t.radius, speed:t.speed+game.wave*0.05,
      hp:t.hp+game.wave*10, maxHp:t.hp+game.wave*10,
      kind:'boss', flash:0, isBoss:true, visible:true,
      juggle:0, juggleVy:0, stagger:0, staggerDir:0,
      animSeed: Math.random()*100
    };
    world.enemies.push(boss); game.boss=boss;
    ui.bossBar.classList.add('active');
    ui.bossName.textContent=`BOSS - WAVE ${game.wave}`;
    playSound('boss'); game.trauma=Math.max(game.trauma,30); game.flashRed=0.5;
    showNotification(`${icon('warning')} BOSS INCOMING!`,'warning',3);
  }

  function updateEnemies(dt, realSec) {
    rebuildEnemyGrid();
    for(let i=world.enemies.length-1;i>=0;i--) {
      const e=world.enemies[i];
      if(e.teleporter) {
        e.teleportTimer-=realSec;
        if(e.teleportTimer<=0) {
          const a=Math.random()*Math.PI*2, d=100+Math.random()*150;
          const nx=hero.x+Math.cos(a)*d, ny=hero.y+Math.sin(a)*d;
          if(!collidesBuilding(nx,ny,e.radius)){burst(e.x,e.y,"#00ffff",15);e.x=nx;e.y=ny;burst(e.x,e.y,"#00ffff",15);}
          e.teleportTimer=2+Math.random()*2;
        }
        e.visible=Math.floor(e.teleportTimer*5)%2===0||e.teleportTimer>1.5;
      }
      if(!e.visible) continue;

      if(e.juggle>0) { e.juggle-=realSec; e.juggleVy+=20*dt; }
      if(e.stagger>0) e.stagger-=realSec;

      const angle=Math.atan2(hero.y-e.y,hero.x-e.x);
      const distToHero = Math.hypot(hero.x-e.x, hero.y-e.y);
      let moveAngle = angle;
      let step = e.speed*dt;
      if (e.ranged) {
        // Lanceur : maintient une distance de tir au lieu de foncer au
        // contact - recule si trop proche, avance si trop loin, et reste
        // globalement immobile dans la fourchette ideale (evite un
        // aller-retour permanent).
        const range = ENEMY[e.kind].preferredRange;
        if (distToHero < range*0.7) { moveAngle = angle + Math.PI; }
        else if (distToHero < range*1.3) { step = 0; }
        e.shotTimer -= realSec;
        if (e.shotTimer <= 0 && distToHero < range*2) {
          fireEnemyShot(e, angle);
          e.shotTimer = ENEMY[e.kind].shotCooldown;
        }
      }
      const dx=Math.cos(moveAngle)*step, dy=Math.sin(moveAngle)*step;
      const blockedX = step>0 && collidesBuilding(e.x+dx,e.y,e.radius);
      const blockedY = step>0 && collidesBuilding(e.x,e.y+dy,e.radius);
      if(!blockedX) e.x+=dx;
      if(!blockedY) e.y+=dy;
      if(collidesBuilding(e.x,e.y,e.radius)){e.x-=dx*0.5;e.y-=dy*0.5;}

      // Ennemi bloque par un batiment (pas un lanceur immobile par choix,
      // step>0 uniquement) : accumule un timer, et au-dela de 5 secondes de
      // blocage continu, tape dans le batiment jusqu'a le detruire plutot
      // que de rester coince indefiniment contre lui.
      if ((blockedX || blockedY) && step > 0) {
        e.blockedTimer = (e.blockedTimer||0) + realSec;
        if (e.blockedTimer > 5) {
          const target = findCollidingBuilding(e.x+dx, e.y+dy, e.radius) || findCollidingBuilding(e.x+dx, e.y, e.radius) || findCollidingBuilding(e.x, e.y+dy, e.radius);
          if (target) damageBuilding(target, ENEMY[e.kind].damage * realSec * 2);
        }
      } else {
        e.blockedTimer = 0;
      }

      forEachNearbyEnemy(e, o => {
        const sx=e.x-o.x, sy=e.y-o.y, d=Math.hypot(sx,sy), md=e.radius+o.radius+4;
        if(d<md&&d>0){const p=(md-d)/d*0.5;e.x+=sx*p;e.y+=sy*p;}
      });

      if(e.flash>0) {
        e.flash-=dt;
        if(Math.random()<0.3) world.bloodTrails.push({x:e.x+rand(-e.radius/2,e.radius/2),y:e.y+rand(-e.radius/2,e.radius/2),life:2,color:ENEMY[e.kind].bloodColor||'#8b0000'});
      }

      if(Math.hypot(hero.x-e.x,hero.y-e.y)<hero.radius+e.radius) {
        // !game.heroDying : une fois l'animation de mort demarree, on ignore
        // tout nouveau coup. Avant, un ennemi encore au contact pendant les
        // 1.5s d'animation pouvait retoucher le heros (deja a 0 PV) et
        // rappeler startDeathAnimation(), ce qui remettait heroDeathTimer a
        // 1.5 a chaque fois - l'ecran de fin ne se declenchait alors jamais
        // tant que le joueur restait encercle par des zombies.
        if(hero.iframes<=0 && !game.heroDying) {
          const dmgReduction = getSkillEffect('health', 2);
          const dmg = ENEMY[e.kind].damage * dmgReduction;
          hero.health-=dmg;
          // 0.8s d'invincibilite reelle apres un coup (avant ce correctif, hero.iframes
          // etait decremente par une valeur ~1/frame au lieu de secondes, donc les 0.5
          // "secondes" ecrites ici ne duraient en realite qu'environ 8ms : quasi aucune
          // protection, d'ou les morts en 2 touches face a plusieurs ennemis).
          hero.iframes=0.8;
          hero.damageFlash = 1.0; // NEW: Red flash
          game.tookDamageThisRun = true;
          game.killsThisRunNoDamage = 0;
          game.trauma=Math.max(game.trauma,15); game.flashRed=0.3;
          playSound('damage');
          // Sang ejecte a l'oppose de l'ennemi qui frappe (donne l'impression
          // d'etre repousse par le coup) en plus de la flaque au sol.
          const hitFromAngle = Math.atan2(hero.y-e.y, hero.x-e.x);
          spurtBlood(hero.x, hero.y, hitFromAngle, 1.4);
          createBloodSplat(hero.x,hero.y,2,hitFromAngle);
          if(hero.health<=0) {
            // NEW: Start death animation instead of instant end
            startDeathAnimation();
          }
        }
      }
    }
  }

  // NEW: Death animation
  function startDeathAnimation() {
    game.heroDying = true;
    game.heroDeathTimer = 1.5;
    game.heroDeathPos = { x: hero.x, y: hero.y };
    game.heroDeathAngle = hero.aim;
    game.trauma = Math.max(game.trauma, 25);
    burst(hero.x, hero.y, '#ff0000', 30);
    createBloodSplat(hero.x, hero.y, 3, game.heroDeathAngle);
  }

  function fireWeapon() {
    const w=WEAPONS[game.currentWeapon];
    // Consommation de munitions (le pistolet a ammo=Infinity, jamais decompte).
    // Si l'arme actuelle tombe a sec pendant le tir, on retombe automatiquement
    // sur le pistolet plutot que de laisser le joueur cliquer dans le vide.
    if (game.currentWeapon !== 0) {
      if (game.ammo[game.currentWeapon] <= 0) { switchWeapon(0); return fireWeapon(); }
      game.ammo[game.currentWeapon]--;
    }
    // Cadence de tir : cumul de Quick Reload (spd2) et Gunslinger (spd3),
    // les deux branchees ici plutot qu'une seule, pour que les deux paliers
    // de cette branche aient un effet reellement mesurable en jeu.
    const fireDelayMult = getSkillEffect('speed', 1) * getSkillEffect('speed', 2);
    hero.cooldown = w.fireDelay * fireDelayMult;
    let cm=1;
    if(w.chargeable&&game.chargeLevel>0.3) cm=1+game.chargeLevel*2;
    playSound(w.sound,1+game.combo*0.05);

    const bonusPierce = getSkillEffect('damage', 2);
    const count=hero.triple?w.count*3:w.count;
    for(let i=0;i<count;i++) {
      const off=count===1?0:(i-(count-1)/2)*w.spread;
      const a=hero.aim+off;
      world.shots.push({
        x:hero.x+Math.cos(a)*24, y:hero.y+Math.sin(a)*24,
        vx:Math.cos(a)*w.bulletSpeed*(w.chargeable?cm:1),
        vy:Math.sin(a)*w.bulletSpeed*(w.chargeable?cm:1),
        life:62, damage:hero.damage*w.damage*cm,
        trail:[], color:w.bulletColor, size:w.bulletSize*(w.chargeable?cm:1),
        pierce:w.pierce + bonusPierce, piercedEnemies:[],
        isShotgun: game.currentWeapon===1,
        weaponIndex: game.currentWeapon,
        explosive: w.explosive||false, blastRadius: w.blastRadius||0, blastDamage: w.blastDamage||0
      });
    }
    burst(hero.x+Math.cos(hero.aim)*25,hero.y+Math.sin(hero.aim)*25,w.bulletColor,8);
    const sa=hero.aim+Math.PI/2+rand(-0.3,0.3);
    world.shellCasings.push({x:hero.x+Math.cos(hero.aim)*10,y:hero.y+Math.sin(hero.aim)*10,vx:Math.cos(sa)*rand(2,4),vy:Math.sin(sa)*rand(2,4),rotation:0,rotSpeed:rand(-0.3,0.3),life:3});
    game.chargeLevel=0; input.pointer.chargeTime=0;
    updateWeaponUI();

    // NEW: Recoil
    hero.recoil = 1.0;
    hero.gunRecoilPhase = 1.0;
  }

  // ===== PROJECTILES ENNEMIS (lanceur / spitter) =====
  function fireEnemyShot(e, angle) {
    const t = ENEMY[e.kind];
    playSound('hit', 0.8); // reutilise un son existant, discret, pour le "crachat"
    world.enemyShots.push({
      x: e.x + Math.cos(angle)*e.radius, y: e.y + Math.sin(angle)*e.radius,
      vx: Math.cos(angle)*t.shotSpeed, vy: Math.sin(angle)*t.shotSpeed,
      damage: t.shotDamage, life: 90, trail: []
    });
    burst(e.x, e.y, t.color, 6);
  }

  function updateEnemyShots(dt) {
    for (let i=world.enemyShots.length-1;i>=0;i--) {
      const s = world.enemyShots[i];
      s.trail.push({x:s.x,y:s.y}); if (s.trail.length>6) s.trail.shift();
      s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
      if (s.life<=0 || collidesBuilding(s.x,s.y,3)) { world.enemyShots.splice(i,1); continue; }
      if (Math.hypot(s.x-hero.x, s.y-hero.y) < hero.radius+5) {
        if (hero.iframes<=0 && !game.heroDying) {
          const dmgReduction = getSkillEffect('health', 2);
          hero.health -= s.damage * dmgReduction;
          hero.iframes = 0.8;
          hero.damageFlash = 1.0;
          game.tookDamageThisRun = true;
          game.killsThisRunNoDamage = 0;
          game.trauma = Math.max(game.trauma, 12); game.flashRed = 0.3;
          playSound('damage');
          const hitAngle = Math.atan2(s.vy, s.vx);
          spurtBlood(hero.x, hero.y, hitAngle, 1.2);
          createBloodSplat(hero.x, hero.y, 1.6, hitAngle);
          if (hero.health<=0) startDeathAnimation();
        }
        world.enemyShots.splice(i,1); continue;
      }
    }
  }

  function drawEnemyShots() {
    for (const s of world.enemyShots) {
      const p = worldToScreen(s.x, s.y);
      if (p.x<-30||p.x>view.w+30||p.y<-30||p.y>view.h+30) continue;
      for (let k=0;k<s.trail.length;k++) {
        const tp = worldToScreen(s.trail[k].x, s.trail[k].y);
        ctx.globalAlpha = (k/s.trail.length)*0.4;
        ctx.fillStyle = '#33cc55';
        ctx.beginPath(); ctx.arc(tp.x, tp.y, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 10; ctx.shadowColor = '#33cc55';
      ctx.fillStyle = '#66ff88';
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function updateShots(dt) {
    for(let i=world.shots.length-1;i>=0;i--) {
      const s=world.shots[i];
      s.trail.push({x:s.x,y:s.y}); if(s.trail.length>8) s.trail.shift();
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
      if(s.life<=0||collidesBuilding(s.x,s.y,3)) {
        if(collidesBuilding(s.x,s.y,3)) {
          burst(s.x,s.y,"#ffaa00",6);
          createBuildingImpact(s.x, s.y, Math.atan2(s.vy,s.vx));
          if (s.explosive) createExplosion(s.x, s.y, s.blastRadius, s.blastDamage);
        }
        world.shots.splice(i,1); continue;
      }

      // NEW: Check obstacle collision
      if (damageObstacle(s.x, s.y, s.damage)) {
        if (s.explosive) createExplosion(s.x, s.y, s.blastRadius, s.blastDamage);
        world.shots.splice(i, 1);
        continue;
      }

      let consumed=false;
      // Boucle a l'envers sur world.enemies : un kill ici peut declencher une
      // explosion en cascade (killEnemy -> createExplosion) qui splice ce
      // meme tableau pendant qu'on l'itere. On revalide j a chaque tour
      // (j peut deborder si le tableau a retreci suite a la cascade) et on
      // relit l'ennemi a l'index courant seulement s'il existe toujours.
      for(let j=world.enemies.length-1;j>=0;j--) {
        if (j >= world.enemies.length) continue;
        const e=world.enemies[j];
        if(!e||e.dead||!e.visible||s.piercedEnemies.includes(j)) continue;
        if(Math.hypot(s.x-e.x,s.y-e.y)>=e.radius) continue;

        const prevHp=e.hp;
        const critChance = getSkillEffect('damage', 1);
        let dmg = s.damage;
        let isCrit = false;
        if (Math.random() < critChance) { dmg *= 2; isCrit = true; }
        e.hp-=dmg; e.flash=8;
        playSound('hit',1+game.combo*0.1);
        // Sang ejecte dans la direction du tir (au point d'impact), plus la
        // flaque qui reste au sol : avant, seule la flaque statique existait,
        // ce qui donnait l'impression que le sang "apparaissait" sur le
        // monstre plutot que d'etre projete par le coup.
        const hitAngle=Math.atan2(s.vy,s.vx);
        const bloodColor = ENEMY[e.kind].bloodColor || '#8b0000';
        spurtBlood(s.x, s.y, hitAngle, 1.2, bloodColor);
        createBloodSplat(e.x,e.y,1.5,hitAngle,bloodColor); playSound('splat');
        burst(s.x,s.y,bloodColor,8);

        if (isCrit) {
          world.floatingTexts.push({
            x: e.x, y: e.y - 20, text: 'CRIT!', life: 0.8, maxLife: 0.8,
            color: '#ffff00', size: 24, bounce: 1, vy: -2
          });
        }


        const kb = 5/(e.radius/10);
        e.x+=Math.cos(hitAngle)*kb;
        e.y+=Math.sin(hitAngle)*kb;

        if(s.isShotgun && e.radius < 20 && !e.isBoss) {
          e.juggle = 0.6; e.juggleVy = -8;
        }
        if(e.radius >= 25) {
          e.stagger = 0.4; e.staggerDir = hitAngle + (Math.random()-0.5)*0.5;
        }

        // Hit-stop : un vrai freeze (gere dans killEnemy) seulement sur un kill,
        // sinon une micro-pause a peine perceptible pour garder le tir fluide
        // meme en rafale/minigun.
        if(e.hp<=0) { killEnemy(e,j,prevHp,s.damage,s.weaponIndex,hitAngle); }
        else { game.hitStop = 0.6; }
        // Le bazooka explose au premier contact (pas de perforation) et
        // inflige des degats de zone en plus du coup direct deja applique.
        if (s.explosive) { createExplosion(s.x, s.y, s.blastRadius, s.blastDamage); consumed=true; break; }
        if(s.pierce>0){s.pierce--;s.piercedEnemies.push(j);}
        else{consumed=true;break;}
      }
      if(consumed) world.shots.splice(i,1);
    }
  }

  // Le parametre "index" n'est plus utilise (killEnemy retrouve desormais sa
  // position reelle via indexOf, voir plus bas) ; conserve dans la signature
  // uniquement pour ne pas casser les appels existants.
  function killEnemy(e,_unusedIndex,prevHp,lastDamage,weaponIndex,killAngle) {
    // Garde anti-recursion : un ennemi explosif declenchait createExplosion(),
    // qui re-scanne world.enemies et se re-trouvait lui-meme (d=0 < radius,
    // hp deja <=0) puisqu'il n'etait retire du tableau qu'a la toute fin de
    // cette meme fonction -> killEnemy se rappelait sur lui-meme indefiniment
    // jusqu'au RangeError de pile. e.dead + retrait immediat du tableau
    // empechent tout chemin (actuel ou futur) de re-tuer le meme ennemi.
    if (e.dead) return;
    e.dead = true;
    // Retrait par reference (indexOf) plutot que par l'index recu en
    // parametre : quand un kill en cascade (chaine d'explosifs) splice le
    // tableau au milieu d'une boucle englobante, l'index d'origine ne
    // correspond plus forcement au bon element au moment ou ce killEnemy
    // s'execute. indexOf est plus lent (O(n)) mais toujours correct, et le
    // nombre d'ennemis reste trop faible pour que ca coute quoi que ce soit.
    const realIndex = world.enemies.indexOf(e);
    if (realIndex !== -1) world.enemies.splice(realIndex,1);

    game.combo++; game.comboTimer=3; game.maxCombo=Math.max(game.maxCombo,game.combo); game.totalKills++;
    // Progression de vague par quota de kills (les boss ne comptent pas dans
    // ce quota : ils sont un evenement a part, geres par game.wave%5===0).
    if (!e.isBoss) onWaveKillProgress();
    game.killsThisRunNoDamage++;

    const weaponNames = ['pistol', 'shotgun', 'minigun', 'bazooka'];
    const wName = weaponNames[weaponIndex] || 'pistol';
    game.killsByWeaponThisRun[wName]++;

    const cm=1+(game.combo-1)*0.2;
    const pts=Math.floor(ENEMY[e.kind].value*cm);
    game.points+=pts; game.score+=10;

    const xpGain = e.isBoss ? 100 : (e.kind === 'titan' ? 25 : (e.kind === 'brute' ? 15 : 10));
    addXP(xpGain);

    updateQuestProgress('kills', 1);
    if (wName === 'shotgun') updateQuestProgress('weapon_kills', 1);
    if (e.isBoss) updateQuestProgress('boss', 1);
    if (!game.tookDamageThisRun) updateQuestProgress('no_damage', 1);

    game.hitStop=e.isBoss?10:3;
    game.flashWhite=e.isBoss?0.4:0.15;
    // Trauma (camera shake) reduit sur un kill normal : avant, 12 minimum
    // par kill avec une decroissance lente donnait un tremblement quasi
    // permanent des que plusieurs ennemis mouraient rapprochees (combo dense),
    // ce qui se lisait comme "le personnage tremble en continu" alors que
    // c'est en realite toute la vue camera qui vibrait autour de lui.
    game.trauma=Math.max(game.trauma,e.isBoss?40:(e.kind==="titan"?18:6));
    const hs=prevHp<=lastDamage;
    playSound('kill',1+game.combo*0.15,{headshot:hs});
    game.multiKillCount++; game.multiKillTimer=0.5;
    // Priorite : un multi-kill (DOUBLE/TRIPLE...) est l'evenement le plus
    // marquant, donc s'il se produit la meme frame qu'un simple palier de
    // combo, il prend l'affichage plutot que les deux ne s'ecrasent l'un
    // l'autre dans la meme ligne du HUD.
    if(game.multiKillCount>=2) showMultiKill(game.multiKillCount);
    else if(game.combo>1) {
      playSound('combo',1+game.combo*0.1);
      showHudKillFeed(`x${game.combo} COMBO!`, 'combo');
    }
    const deathBloodColor = ENEMY[e.kind].bloodColor || '#8b0000';
    burst(e.x,e.y,deathBloodColor,e.isBoss?80:(e.kind==="titan"?40:20));
    // Jet de sang du coup fatal : oriente dans l'axe du tir (killAngle) avec
    // un leger etalement autour, plutot qu'aleatoire dans toutes les
    // directions - on doit pouvoir lire "il a ete tue en tirant depuis la".
    const deathSprays = e.isBoss?4:(e.kind==="titan"?3:2);
    const baseAngle = (typeof killAngle === 'number') ? killAngle : Math.random()*Math.PI*2;
    for (let i=0;i<deathSprays;i++) spurtBlood(e.x, e.y, baseAngle + rand(-0.7,0.7), e.isBoss?2:(e.kind==="titan"?1.6:1.2), deathBloodColor);
    // Echelles reduites (5/3/2 -> 3/2/1.3) : les tailles precedentes,
    // combinees a des kills rapproches en combo, produisaient une masse de
    // sang qui recouvrait une bonne partie de l'ecran (voir capture du bug).
    createBloodSplat(e.x,e.y,e.isBoss?3:(e.kind==="titan"?2:1.3), baseAngle, deathBloodColor);
    // Debris/membres au sol : contrairement au sang (qui s'estompe en 10s),
    // ces morceaux restent visibles plus longtemps pour un gore qui persiste
    // vraiment dans le decor, pas juste une flaque qui s'efface vite.
    createGibs(e.x, e.y, ENEMY[e.kind].color, e.isBoss?6:(e.kind==="titan"?4:2), baseAngle);
    world.floatingTexts.push({x:e.x,y:e.y,text:hs?`HEADSHOT! +${pts}`:`+${pts}`,life:1.5,maxLife:1.5,color:hs?"#ffff00":ENEMY[e.kind].color,size:hs?28:(20+game.combo*2),bounce:1,vy:-2});
    maybeDropPickup(e.x, e.y);
    if(e.explosive) createExplosion(e.x,e.y,100,30);
    if(e.splitter) {
      for(let k=0;k<2;k++) {
        const a=Math.random()*Math.PI*2;
        world.enemies.push({x:e.x+Math.cos(a)*30,y:e.y+Math.sin(a)*30,radius:12,speed:2+game.wave*0.15,hp:2+game.wave*0.3,maxHp:2+game.wave*0.3,kind:'runner',flash:0,visible:true,juggle:0,juggleVy:0,stagger:0,staggerDir:0,animSeed:Math.random()*100});
      }
      burst(e.x,e.y,"#ff00ff",20);
    }
    if(e.isBoss){
      game.boss=null;ui.bossBar.classList.remove('active');game.points+=500;playSound('explosion');
      showNotification(`${icon('crown')} BOSS DEFEATED!`,'success',4);
      progression.bossesKilled++;
    }

    progression.totalKills++;
    progression.bestKillsInRun = Math.max(progression.bestKillsInRun, game.totalKills);
    progression.bestCombo = Math.max(progression.bestCombo, game.maxCombo);
    progression.bestWave = Math.max(progression.bestWave, game.wave);
    progression.killsByWeapon[wName] = (progression.killsByWeapon[wName] || 0) + 1;
    if (!game.tookDamageThisRun) {
      progression.bestKillsNoDamage = Math.max(progression.bestKillsNoDamage, game.killsThisRunNoDamage);
    }
    checkUnlocks();
    saveProgression();
  }

  // ===== DROPS D'ARMES / MUNITIONS =====
  // A chaque kill : petite chance de drop. Priorite aux armes pas encore
  // debloquees (pour que le joueur les decouvre au fil de la partie), sinon
  // chance de drop de munitions pour une arme lourde deja debloquee. Le
  // pistolet n'est jamais concerne (munitions illimitees).
  const DROP_WEAPON_CHANCE = 0.035;
  const DROP_AMMO_CHANCE = 0.09;
  // Drop de vie : independant des drops d'armes/munitions, ne se declenche
  // que si le heros n'est pas deja a pleine vie (evite de gaspiller un drop
  // inutile), avec une chance un peu plus faible que les munitions pour ne
  // pas rendre la survie trop facile.
  const DROP_HEALTH_CHANCE = 0.06;
  const HEALTH_PICKUP_AMOUNT = 20;
  function maybeDropPickup(x, y) {
    // Toutes les armes "lourdes" (index 1+, hors pistolet) sont candidates au
    // drop : calcule dynamiquement depuis WEAPONS.length plutot qu'une liste
    // fixe [1,2,3], pour que le bazooka (index 4) participe aussi.
    const heavyWeaponIndices = WEAPONS.map((_,i)=>i).slice(1);
    const lockedWeapons = heavyWeaponIndices.filter(i => !game.unlockedWeapons.has(i));
    if (lockedWeapons.length > 0 && Math.random() < DROP_WEAPON_CHANCE) {
      const wi = lockedWeapons[Math.floor(Math.random()*lockedWeapons.length)];
      spawnPickup(x, y, 'weapon', wi);
      return;
    }
    // Vie : verifiee avant les munitions pour ne pas etre noyee par elles
    // (plus de types d'armes lourdes = plus de chances de tomber dans la
    // branche munitions en premier si on inversait l'ordre).
    if (hero.health < hero.maxHealth && Math.random() < DROP_HEALTH_CHANCE) {
      spawnPickup(x, y, 'health', -1);
      return;
    }
    const unlockedWeapons = heavyWeaponIndices.filter(i => game.unlockedWeapons.has(i));
    if (unlockedWeapons.length > 0 && Math.random() < DROP_AMMO_CHANCE) {
      const wi = unlockedWeapons[Math.floor(Math.random()*unlockedWeapons.length)];
      spawnPickup(x, y, 'ammo', wi);
    }
  }

  function spawnPickup(x, y, kind, weaponIndex) {
    world.pickups.push({
      x, y, kind, weaponIndex,
      life: 20, maxLife: 20, // disparait au bout de 20s si pas ramasse
      bobPhase: Math.random()*Math.PI*2
    });
  }

  function updatePickups(realSec) {
    for (let i=world.pickups.length-1;i>=0;i--) {
      const p = world.pickups[i];
      p.life -= realSec;
      if (p.life <= 0) { world.pickups.splice(i,1); continue; }
      if (Math.hypot(hero.x-p.x, hero.y-p.y) < hero.radius + 16) {
        collectPickup(p);
        world.pickups.splice(i,1);
      }
    }
  }

  function collectPickup(p) {
    const w = WEAPONS[p.weaponIndex];
    if (p.kind === 'weapon') {
      game.unlockedWeapons.add(p.weaponIndex);
      game.ammo[p.weaponIndex] = Math.max(game.ammo[p.weaponIndex], w.ammoPerPickup);
      showNotification(`${icon('pistol')} ${w.name} UNLOCKED!`, 'success', 3);
      switchWeapon(p.weaponIndex);
    } else if (p.kind === 'health') {
      const healed = Math.min(HEALTH_PICKUP_AMOUNT, hero.maxHealth - hero.health);
      hero.health = Math.min(hero.maxHealth, hero.health + HEALTH_PICKUP_AMOUNT);
      showNotification(`${icon('shield')} +${Math.round(healed)} HP`, 'success', 2);
    } else {
      game.ammo[p.weaponIndex] += w.ammoPerPickup;
      showNotification(`+${w.ammoPerPickup} ${w.name} ammo`, 'success', 2);
    }
    // Le "plein" de la jauge de munitions suit le stock le plus haut jamais
    // atteint pour cette arme (peut grossir avec des drops cumules), pour
    // que l'anneau reste toujours "plein" juste apres un ramassage et se
    // vide ensuite au fil des tirs.
    if (p.kind === 'weapon' || p.kind === 'ammo') {
      game.ammoMax[p.weaponIndex] = Math.max(game.ammoMax[p.weaponIndex]||0, game.ammo[p.weaponIndex]);
    }
    playSound('pickup');
    updateWeaponUI();
  }

  function drawPickups() {
    for (const p of world.pickups) {
      const s = worldToScreen(p.x, p.y);
      if (s.x<-40||s.x>view.w+40||s.y<-40||s.y>view.h+40) continue;
      const bob = Math.sin(game.elapsed*4 + p.bobPhase) * 3;
      const fade = p.life < 3 ? (Math.sin(game.elapsed*10)>0?1:0.3) : 1; // clignote juste avant de disparaitre
      // Couleur/forme par type : arme (dore), munitions (couleur de l'arme
      // concernee), vie (rouge-rose, croix medicale plutot que pastille/etoile).
      const w = p.kind === 'weapon' || p.kind === 'ammo' ? WEAPONS[p.weaponIndex] : null;
      const ringColor = p.kind==='weapon' ? '#ffd23b' : (p.kind==='health' ? '#ff5577' : w.bulletColor);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(s.x, s.y + bob);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 14-bob, 14, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 14;
      ctx.shadowColor = ringColor;
      ctx.fillStyle = p.kind==='weapon' ? 'rgba(40,35,10,0.9)' : (p.kind==='health' ? 'rgba(40,10,15,0.9)' : 'rgba(20,20,25,0.9)');
      ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      // Symbole dessine en formes canvas natives (etoile pour une arme,
      // croix pour la vie, simple pastille pour des munitions) plutot qu'un
      // glyphe de police.
      ctx.fillStyle = '#fff';
      if (p.kind === 'weapon') {
        ctx.beginPath();
        for (let k=0;k<5;k++) {
          const a1 = -Math.PI/2 + k*(Math.PI*2/5);
          const a2 = a1 + Math.PI/5;
          const px1 = Math.cos(a1)*6, py1 = Math.sin(a1)*6;
          const px2 = Math.cos(a2)*2.5, py2 = Math.sin(a2)*2.5;
          if (k===0) ctx.moveTo(px1,py1); else ctx.lineTo(px1,py1);
          ctx.lineTo(px2,py2);
        }
        ctx.closePath(); ctx.fill();
      } else if (p.kind === 'health') {
        ctx.fillRect(-1.6, -6, 3.2, 12);
        ctx.fillRect(-6, -1.6, 12, 3.2);
      } else {
        ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function createExplosion(x,y,radius,damage) {
    playSound('explosion'); game.trauma=Math.max(game.trauma,20); game.flashWhite=0.3;
    world.explosions.push({x,y,radius:0,maxRadius:radius,life:0.5,maxLife:0.5});
    burst(x,y,"#ff6600",40); burst(x,y,"#ffff00",20);
    // Itere sur une copie (snapshot) plutot que world.enemies directement :
    // un ennemi explosif touche ici peut mourir et declencher sa propre
    // createExplosion() en cascade, qui splice world.enemies pendant qu'on
    // est encore en train d'en parcourir les index -> decalage et elements
    // sautes/retraites. Le snapshot fige la liste a traiter ; e.dead filtre
    // les ennemis deja tues entre-temps par une explosion en chaine.
    for (const e of world.enemies.slice()) {
      if (e.dead) continue;
      const d=Math.hypot(e.x-x,e.y-y);
      if(d<radius){const ph=e.hp;e.hp-=damage*(1-d/radius);e.flash=10;if(e.hp<=0)killEnemy(e,-1,ph,damage,game.currentWeapon);}
    }
    // NEW: Damage obstacles in explosion
    for (const v of world.vehicles) {
      if (v.hp <= 0) continue;
      const d = Math.hypot(v.x - x, v.y - y);
      if (d < radius) damageObstacle(v.x, v.y, damage * (1 - d/radius));
    }
    for (const dd of world.destructibles) {
      if (dd.hp <= 0) continue;
      const d = Math.hypot(dd.x - x, dd.y - y);
      if (d < radius) damageObstacle(dd.x, dd.y, damage * (1 - d/radius));
    }
    const hd=Math.hypot(hero.x-x,hero.y-y);
    if(hd<radius && !game.heroDying){hero.health-=damage*0.5*(1-hd/radius);hero.damageFlash=1.0;game.flashRed=0.3;if(hero.health<=0)startDeathAnimation();}
  }

  // Affiche un message bref dans la ligne dediee du HUD (combo ou multi-kill),
  // integree au panneau plutot que flottante au centre de l'ecran.
  function showHudKillFeed(text, cls) {
    ui.hudKillFeed.textContent = text;
    ui.hudKillFeed.className = 'hudKillFeed ' + cls;
    void ui.hudKillFeed.offsetWidth;
    ui.hudKillFeed.classList.add('active');
    clearTimeout(showHudKillFeed._timer);
    showHudKillFeed._timer = setTimeout(() => ui.hudKillFeed.classList.remove('active'), 900);
  }

  function showMultiKill(c) {
    let t=c===2?"DOUBLE KILL!":c===3?"TRIPLE KILL!":c>=5?"UNSTOPPABLE!":"RAMPAGE!";
    showHudKillFeed(t, 'multikill');
    playSound('multikill');
  }

  function switchWeapon(i){
    if(i<0||i>=WEAPONS.length)return;
    // Impossible de selectionner une arme pas encore debloquee (drop jamais
    // recupere) ou a sec de munitions : le pistolet reste toujours dispo.
    if(i!==0 && (!game.unlockedWeapons.has(i) || game.ammo[i]<=0)) return;
    game.currentWeapon=i;game.chargeLevel=0;input.pointer.chargeTime=0;updateWeaponUI();
  }
  function updateWeaponUI(){
    ui.weaponSlots.forEach((s,i)=>{
      s.classList.toggle('active',i===game.currentWeapon);
      const locked = i!==0 && (!game.unlockedWeapons.has(i) || game.ammo[i]<=0);
      s.classList.toggle('locked', locked);
      const ammoEl = s.querySelector('.ammoCount');
      const ringEl = s.querySelector('.ammoRing');
      const hasAmmoUI = i!==0 && game.unlockedWeapons.has(i);
      if (ammoEl) ammoEl.textContent = hasAmmoUI ? game.ammo[i] : '';
      if (ringEl) {
        // Anneau jaune qui se vide en tournant au fil des tirs : rempli
        // selon le ratio munitions actuelles / plus haut stock atteint pour
        // cette arme (game.ammoMax), donc plein juste apres un ramassage.
        const pct = hasAmmoUI && game.ammoMax[i]>0 ? Math.max(0,Math.min(100,(game.ammo[i]/game.ammoMax[i])*100)) : 0;
        ringEl.style.setProperty('--ammo-pct', pct+'%');
        ringEl.style.opacity = hasAmmoUI ? '1' : '0';
      }
    });
  }

  function updateBossBar(){if(game.boss)ui.bossBarFill.style.width=`${Math.max(0,game.boss.hp/game.boss.maxHp)*100}%`;}
  function updateComboBar(){ui.comboBarFill.style.width=`${(game.comboTimer/3)*100}%`;}

  // Flaque de sang persistante au sol : reste visible 10 secondes (vraie
  // duree en secondes desormais, voir l'appel realSec dans simulate — avant,
  // cette fonction etait decrementee par une valeur ~1/frame, donc "15"
  // secondes ecrites ici ne duraient en realite qu'environ 0.25s, la flaque
  // disparaissait quasi instantanement) avant de s'estomper progressivement.
  // Corps principal (polygone irregulier) + gouttelettes satellites eparses
  // autour, pour un rendu plus organique/eclabousse qu'une simple tache
  // unique geometrique.
  // Flaque de sang persistante au sol : 4 patterns visuels distincts tires
  // au hasard (avant : une seule forme, toujours la meme etoile reguliere),
  // tous orientes selon l'angle du tir qui a tue l'ennemi (angle non fourni
  // = orientation aleatoire, pour les cas sans tir clair comme les degats de
  // contact). Reste visible 10 secondes avant de s'estomper (voir
  // updateBloodSplats, appelee avec un vrai delta-temps en secondes).
  // Debris/membres eparpilles au sol au moment d'un kill : contrairement aux
  // particules de burst() (qui s'evanouissent en une fraction de seconde),
  // ces morceaux ont une vraie duree de vie longue (30s) et restent poses au
  // sol avec une forme et une rotation figees, pour un gore qui persiste
  // vraiment dans le decor plutot qu'un simple flash de particules.
  function createGibs(x, y, color, count, angle) {
    if (world.gibs.length > 60) world.gibs.splice(0, world.gibs.length-60+count);
    for (let i=0;i<count;i++) {
      const a = angle + rand(-1.2,1.2);
      const dist = rand(8,28);
      world.gibs.push({
        x: x+Math.cos(a)*dist*0.3, y: y+Math.sin(a)*dist*0.3,
        vx: Math.cos(a)*rand(1,3), vy: Math.sin(a)*rand(1,3),
        rotation: Math.random()*Math.PI*2, rotSpeed: rand(-0.1,0.1),
        size: rand(3,6), color, settled: false,
        life: 30, maxLife: 30
      });
    }
  }
  function updateGibs(dt, realSec) {
    for (let i=world.gibs.length-1;i>=0;i--) {
      const g = world.gibs[i];
      if (!g.settled) {
        g.x += g.vx*dt; g.y += g.vy*dt;
        g.vx *= 0.85; g.vy *= 0.85;
        g.rotation += g.rotSpeed*dt;
        if (Math.hypot(g.vx,g.vy) < 0.1) g.settled = true;
      }
      g.life -= realSec;
      if (g.life <= 0) world.gibs.splice(i,1);
    }
  }
  function drawGibs() {
    for (const g of world.gibs) {
      const p = worldToScreen(g.x, g.y);
      if (p.x<-30||p.x>view.w+30||p.y<-30||p.y>view.h+30) continue;
      const fade = Math.min(1, g.life/3); // fondu doux dans les 3 dernieres secondes
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(g.rotation);
      ctx.fillStyle = darkenHex(g.color, 15);
      ctx.beginPath();
      ctx.ellipse(0, 0, g.size, g.size*0.65, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(g.size*0.2, g.size*0.15, g.size*0.4, g.size*0.25, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function createBloodSplat(x,y,scale=1,angle,color='#8b0000'){
    // Plafond reduit (150 -> 80) : avec plusieurs kills rapproches (combo),
    // l'ancien plafond laissait s'accumuler une masse ecrasante de flaques
    // superposees au meme endroit (voir capture du bug), au point de saturer
    // l'ecran de rouge et de rendre l'action illisible.
    if(world.bloodSplats.length>80) world.bloodSplats.shift();
    const a0 = (typeof angle === 'number') ? angle : Math.random()*Math.PI*2;
    const pattern = Math.floor(Math.random()*4);
    const s={x,y,scale,angle:a0,pattern,points:[],droplets:[],life:10,maxLife:10,color};

    if (pattern === 0) {
      // Jet allonge dans l'axe du tir : ellipse etiree vers l'avant, la plus
      // caracteristique d'un impact de projectile.
      const n=10;
      for(let i=0;i<n;i++){
        const t=(i/n)*Math.PI*2;
        const stretch = 1 + Math.cos(t)*1.3; // etire vers l'avant (angle 0 du pattern local)
        const r = scale*(0.5+Math.random()*0.3)*stretch;
        s.points.push({x:Math.cos(t)*r*15, y:Math.sin(t)*r*9});
      }
    } else if (pattern === 1) {
      // Etoile eclatee (pattern d'origine) : pointes irregulieres autour d'un centre.
      const n=8+Math.floor(Math.random()*6);
      for(let i=0;i<n;i++){const t=(i/n)*Math.PI*2,r=scale*(0.6+Math.random()*0.4);s.points.push({x:Math.cos(t)*r*15,y:Math.sin(t)*r*15});}
    } else if (pattern === 2) {
      // Flaque organique arrondie : moins de pointes, contour plus lisse,
      // legerement decentree vers l'avant du tir.
      const n=7;
      for(let i=0;i<n;i++){
        const t=(i/n)*Math.PI*2;
        const r = scale*(0.75+Math.random()*0.25);
        s.points.push({x:Math.cos(t)*r*13 + Math.cos(0)*scale*6, y:Math.sin(t)*r*13});
      }
    } else {
      // Eventail large dans la direction du tir : un cone qui s'evase vers
      // l'avant, plus etroit vers l'arriere (point d'origine du coup).
      const n=9;
      for(let i=0;i<n;i++){
        const t=(i/n)*Math.PI*2;
        const forwardBias = 0.5 + (Math.cos(t)+1)*0.6; // plus large devant
        const r = scale*(0.5+Math.random()*0.35)*forwardBias;
        s.points.push({x:Math.cos(t)*r*15, y:Math.sin(t)*r*13});
      }
    }

    // Gouttelettes satellites : moins nombreuses qu'avant et concentrees
    // devant le point d'impact (dans le sens du tir) plutot que reparties a
    // 360 degres, pour eviter l'effet de masse compacte qui ecrasait tout a
    // l'ecran des que plusieurs kills se produisaient au meme endroit.
    const dropCount = 2 + Math.floor(scale*2);
    for (let i=0;i<dropCount;i++) {
      const spread = rand(-0.9,0.9);
      const dist = scale*(14 + Math.random()*22);
      s.droplets.push({ x: Math.cos(spread)*dist, y: Math.sin(spread)*dist*0.6, r: scale*(1.5+Math.random()*3) });
    }
    world.bloodSplats.push(s);
  }

  // Jet de sang ejecte avec velocite, dans la direction de l'impact (angle du
  // tir) plutot qu'une simple tache statique posee sur place. createBloodSplat
  // reste utilisee pour la flaque au sol qui persiste ; celle-ci ajoute les
  // particules qui "giclent" au moment du coup, en reutilisant world.particles
  // (meme systeme que burst(), donc aucun cout de rendu supplementaire).
  function spurtBlood(x, y, angle, scale=1, color='#8b0000') {
    const n = 5 + Math.floor(scale*4);
    for (let i=0;i<n;i++) {
      // Cone etroit dans la direction de l'impact plutot qu'un cercle complet :
      // lit clairement comme "ejecte par le coup", pas comme une explosion isotrope.
      const a = angle + rand(-0.5, 0.5);
      const sp = rand(2, 6) * scale;
      world.particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: rand(15,35), size: rand(1.5, 3.5)*scale, color
      });
    }
  }

  function updateBloodTrails(dt){for(let i=world.bloodTrails.length-1;i>=0;i--){world.bloodTrails[i].life-=dt;if(world.bloodTrails[i].life<=0)world.bloodTrails.splice(i,1);}}
  function updateBloodSplats(dt){for(let i=world.bloodSplats.length-1;i>=0;i--){world.bloodSplats[i].life-=dt;if(world.bloodSplats[i].life<=0)world.bloodSplats.splice(i,1);}}
  function updateShellCasings(dt){for(let i=world.shellCasings.length-1;i>=0;i--){const c=world.shellCasings[i];c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=0.95;c.vy*=0.95;c.rotation+=c.rotSpeed*dt;c.life-=dt;if(c.life<=0)world.shellCasings.splice(i,1);}}
  function updateFloatingTexts(dt){for(let i=world.floatingTexts.length-1;i>=0;i--){const t=world.floatingTexts[i];t.y+=t.vy*dt;t.vy-=0.1*dt;t.life-=dt;if(t.bounce>0){t.bounce-=dt*3;if(t.bounce<0)t.bounce=0;}if(t.life<=0)world.floatingTexts.splice(i,1);}}
  // Particules orbitales ("confettis") autour du heros a partir de combo 5 :
  // coupees au-dela de combo 25 (au lieu de continuer a grossir sans fin
  // avec le combo), pour eviter que l'effet ne sature l'ecran et ne geen
  // la lisibilite en combo tres eleve.
  // Particules orbitales du combo retirees a la demande (effet juge trop
  // charge visuellement a combo eleve) : la fonction est gardee vide plutot
  // que supprimee pour ne pas casser les appels existants dans simulate()/
  // render(), mais ne pousse plus jamais rien dans world.orbitParticles.
  function updateOrbitParticles(dt){ world.orbitParticles.length=0; }
  function updateDashTrails(dt){for(let i=world.dashTrails.length-1;i>=0;i--){world.dashTrails[i].life-=dt;if(world.dashTrails[i].life<=0)world.dashTrails.splice(i,1);}}
  function updateExplosions(dt){for(let i=world.explosions.length-1;i>=0;i--){const e=world.explosions[i];e.life-=dt;e.radius=e.maxRadius*(1-e.life/e.maxLife);if(e.life<=0)world.explosions.splice(i,1);}}
  function updateMoveTrails(dt){for(let i=world.moveTrails.length-1;i>=0;i--){world.moveTrails[i].life-=dt;if(world.moveTrails[i].life<=0)world.moveTrails.splice(i,1);}}

  // NEW: Update obstacle flash
  function updateObstacles(dt) {
    for (const v of world.vehicles) {
      if (v.flash > 0) v.flash -= dt;
    }
    for (const d of world.destructibles) {
      if (d.flash > 0) d.flash -= dt;
    }
  }

  function burst(x,y,color,count){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=rand(1,5);world.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(20,50),size:rand(1,5),color});}}
  function updateParticles(dt){for(const p of world.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.95,dt);p.vy*=Math.pow(0.95,dt);p.life-=dt;}world.particles=world.particles.filter(p=>p.life>0);}

  function render() {
    ctx.save();
    const theme = getCurrentTheme();
    ctx.fillStyle = theme.bg; ctx.fillRect(0,0,view.w,view.h);

    ctx.translate(view.w/2, view.h/2);
    ctx.rotate(camera.rotation);
    ctx.scale(camera.zoom, camera.zoom);
    if(game.trauma>2) ctx.translate(rand(-game.trauma/3,game.trauma/3),rand(-game.trauma/3,game.trauma/3));
    ctx.translate(-view.w/2, -view.h/2);

    drawGround(theme);
    drawGroundCracks();
    // drawRoadMarkings/drawCrosswalks/drawTrafficLights retires a la demande
    // (marquage au sol et feux juges "degueulasses" visuellement) : les
    // donnees restent generees par chunk (au cas ou on veuille les
    // reactiver plus tard) mais ne sont plus dessinees du tout.
    drawPuddles();
    drawStreetLightGlow(); // NEW: Light pools on ground
    drawBloodSplats(false); drawBloodTrails();
    drawGibs();
    drawBenches(); // parc : au sol, sous les arbres/batiments
    drawBuildingRubble();
    drawBuildings();
    drawBuildingImpacts(); // par-dessus les batiments : marques de balles persistantes
    drawTrees(); // dessines apres les batiments : peuvent depasser devant si un peu plus bas a l'ecran
    drawVehicles(); // NEW
    drawDestructibles(); // NEW
    // Flaques de sang proches d'un vehicule/destructible : dessinees
    // par-dessus ces obstacles, pour que le sang reste visible meme quand un
    // kill s'est produit contre une voiture ou un element de decor plutot
    // que d'etre cache dessous.
    drawBloodSplats(true);
    drawShellCasings(); drawExplosions(); drawMoveTrails(); drawShots(); drawEnemyShots();
    drawPickups();
    drawEnemies(); drawDashTrails();
    drawHero();
    drawOrbitParticles();
    drawParticles(); drawFloatingTexts(); drawChargeIndicator();
    drawDirectionIndicators();
    drawRain(); // NEW
    drawLightningStrike(); // NEW
    drawFog(); // NEW
    drawScreenEffects(); drawComboBorderGlow();

    ctx.restore();
    drawVignette(); // en coordonnees ecran fixes (apres restore), pour ne pas tourner/zoomer avec la camera
  }

  function drawGround(theme) {
    // Base asphalte : un aplat legerement plus clair que le fond de la scene,
    // avec un tres leger vignettage radial pour donner du volume au sol plutot
    // qu'un noir plat uniforme.
    const cx = view.w/2, cy = view.h/2;
    const vign = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(view.w, view.h)*0.7);
    vign.addColorStop(0, theme.groundNear || '#0d0d0f');
    vign.addColorStop(1, theme.bg);
    ctx.fillStyle = vign;
    ctx.fillRect(0, 0, view.w, view.h);

    // Texture d'usure organique a la place de l'ancienne grille reguliere
    // (qui donnait un effet "damier" repetitif tres visible). Des patchs de
    // teinte legerement plus clairs/sombres, positionnes de facon
    // deterministe sur une grille grossiere en coordonnees MONDE (donc
    // stables quand la camera bouge) mais avec une taille et un decalage
    // varies par cellule pour casser toute regularite geometrique.
    const cell = 96;
    const camLeft = camera.x - view.w/2/camera.zoom, camTop = camera.y - view.h/2/camera.zoom;
    const camRight = camera.x + view.w/2/camera.zoom, camBottom = camera.y + view.h/2/camera.zoom;
    const gx0 = Math.floor(camLeft/cell)-1, gx1 = Math.ceil(camRight/cell)+1;
    const gy0 = Math.floor(camTop/cell)-1, gy1 = Math.ceil(camBottom/cell)+1;
    for (let gx=gx0; gx<=gx1; gx++) {
      for (let gy=gy0; gy<=gy1; gy++) {
        const cellRng = mulberry32(chunkSeed(gx*7+1, gy*7+1))();
        if (cellRng < 0.55) continue; // la plupart des cellules restent unies
        const wx = gx*cell + cell/2 + (cellRng-0.5)*40;
        const wy = gy*cell + cell/2 + ((cellRng*13)%1-0.5)*40;
        const p = worldToScreen(wx, wy);
        if (p.x < -60 || p.x > view.w+60 || p.y < -60 || p.y > view.h+60) continue;
        const size = (30 + cellRng*50) * camera.zoom;
        const lighter = cellRng > 0.78;
        ctx.fillStyle = lighter ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.07)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, size, size*(0.6+cellRng*0.3), cellRng*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  // Fissures d'asphalte : simples traits casses, statiques (generees une fois
  // dans generateEnvironment), cout de rendu quasi nul et gros gain de texture
  // par rapport a un sol totalement plat.
  function drawGroundCracks() {
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.5;
    for (const c of world.groundCracks) {
      const p = worldToScreen(c.x, c.y);
      if (p.x < -20 || p.x > view.w+20 || p.y < -20 || p.y > view.h+20) continue;
      const mx = p.x + Math.cos(c.angle) * c.len * 0.5;
      const my = p.y + Math.sin(c.angle) * c.len * 0.5;
      const ex = p.x + Math.cos(c.angle + c.bend) * c.len;
      const ey = p.y + Math.sin(c.angle + c.bend) * c.len;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(mx, my, ex, ey);
      ctx.stroke();
    }
  }

  // Marquage au sol des rues (tirets de ligne centrale, usee/decoloree
  // comme le reste du decor delabre) : donne aux voies entre les blocs de
  // batiments une vraie identite de rue plutot qu'un simple vide.
  function drawRoadMarkings() {
    ctx.fillStyle = 'rgba(200,190,150,0.22)';
    for (const rm of world.roadMarkings) {
      const p = worldToScreen(rm.x, rm.y);
      if (p.x < -20 || p.x > view.w+20 || p.y < -20 || p.y > view.h+20) continue;
      ctx.fillRect(p.x - rm.w/2, p.y - rm.h/2, rm.w, rm.h);
    }
  }

  // Passages pietons : rangee de bandes blanches paralleles, perpendiculaires
  // a la chaussee, usees comme le reste du marquage au sol.
  function drawCrosswalks() {
    ctx.fillStyle = 'rgba(200,195,175,0.28)';
    for (const cw of world.crosswalks) {
      const p = worldToScreen(cw.x, cw.y);
      if (p.x < -40 || p.x > view.w+40 || p.y < -40 || p.y > view.h+40) continue;
      const stripes = 5;
      if (cw.vertical) {
        const stripeH = cw.h / (stripes*2-1);
        for (let i=0;i<stripes;i++) {
          ctx.fillRect(p.x - cw.w/2, p.y - cw.h/2 + i*stripeH*2, cw.w, stripeH);
        }
      } else {
        const stripeW = cw.w / (stripes*2-1);
        for (let i=0;i<stripes;i++) {
          ctx.fillRect(p.x - cw.w/2 + i*stripeW*2, p.y - cw.h/2, stripeW, cw.h);
        }
      }
    }
  }

  // Feux tricolores : petit poteau avec un voyant qui alterne rouge/vert
  // selon un cycle propre a chaque feu (phase+cycle generes par chunk), pour
  // que les carrefours de la grille de rues aient un vrai mobilier urbain.
  function drawTrafficLights() {
    for (const tl of world.trafficLights) {
      const p = worldToScreen(tl.x, tl.y);
      if (p.x < -30 || p.x > view.w+30 || p.y < -30 || p.y > view.h+30) continue;
      const t = (game.elapsedSec + tl.phase) % tl.cycle;
      const isRed = t < tl.cycle*0.55;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 8;
      ctx.shadowColor = isRed ? '#ff3333' : '#33ff55';
      ctx.fillStyle = isRed ? '#ff3333' : '#33ff55';
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // Flaques : reflet fixe tres sombre + liseret pour lire le bord, sans
  // reflexion dynamique (trop couteux pour le gain ici) mais suffisant pour
  // vendre "asphalte mouille" avec 34 formes statiques.
  function drawPuddles() {
    for (const w of world.puddles) {
      const p = worldToScreen(w.x, w.y);
      if (p.x < -60 || p.x > view.w+60 || p.y < -60 || p.y > view.h+60) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(w.rotation);
      ctx.scale(1, w.ry / w.rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w.rx);
      g.addColorStop(0, 'rgba(15,20,28,0.75)');
      g.addColorStop(0.7, 'rgba(10,14,20,0.55)');
      g.addColorStop(1, 'rgba(10,14,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, w.rx, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,140,160,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  }

  // NEW: Street light glow pools
  function drawStreetLightGlow() {
    for (const light of world.streetLights) {
      const p = worldToScreen(light.x, light.y);
      if (p.x < -200 || p.x > view.w + 200 || p.y < -200 || p.y > view.h + 200) continue;
      // Lampadaire casse : plus de halo, juste le poteau visible (destructibilite).
      if (light.broken) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
        continue;
      }
      const flicker = 0.7 + Math.sin(game.elapsed * light.flickerSpeed + light.flicker) * 0.15;
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, light.radius);
      const color = light.color;
      gradient.addColorStop(0, color + '55');
      gradient.addColorStop(0.5, color + '22');
      gradient.addColorStop(1, color + '00');
      ctx.fillStyle = gradient;
      ctx.globalAlpha = flicker;
      ctx.beginPath();
      ctx.arc(p.x, p.y, light.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // Poteau (petit cercle sombre au centre du halo, avec flash de degats)
      ctx.fillStyle = light.flash > 0 ? '#fff' : 'rgba(20,20,22,0.85)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
      if (light.flash > 0) light.flash -= 0.02;
    }
  }

  // Dessine les flaques de sang. Par defaut (overlayNear=false) dessine tout
  // sauf les flaques proches d'un obstacle (vehicule/destructible), qui sont
  // dessinees plus tard par-dessus ces obstacles (voir l'appel avec
  // overlayNear=true plus bas) : le sang doit rester visible meme quand un
  // kill se produit contre une voiture ou un element de decor, pas etre
  // cache dessous.
  function isNearObstacle(x, y, range=40) {
    for (const v of world.vehicles) if (Math.hypot(v.x-x, v.y-y) < range) return true;
    for (const d of world.destructibles) if (Math.hypot(d.x-x, d.y-y) < range) return true;
    return false;
  }
  function drawBloodSplats(overlayNear){
    for(const s of world.bloodSplats){
      const near = isNearObstacle(s.x, s.y);
      if (overlayNear === true && !near) continue;
      if (overlayNear !== true && near) continue;
      const p=worldToScreen(s.x,s.y),a=Math.min(1,s.life/s.maxLife)*0.6;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(s.angle||0);ctx.fillStyle=hexToRgba(s.color||'#8b0000',a);
      ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
      for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
      ctx.closePath();ctx.fill();
      // Gouttelettes satellites eparpillees autour de la flaque principale :
      // renforce l'effet "eclaboussure" plutot qu'une tache unique et propre.
      if (s.droplets) {
        for (const d of s.droplets) {
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    }
  }
  function drawBloodTrails(){for(const t of world.bloodTrails){const p=worldToScreen(t.x,t.y);ctx.fillStyle=hexToRgba(t.color||'#8b0000',t.life/2);ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}}

  // Batiments : ombre portee, degrade de facade (au lieu d'un aplat uni), et
  // silhouette de toit variee selon roofKind pour casser la lecture "boite plate"
  // qu'on avait avant (rectangle gris + carres de fenetres, sans profondeur).
  // Tas de gravats a l'emplacement d'un batiment effondre : silhouette
  // irreguliere de decombres (au lieu du rectangle net du batiment), pour
  // que sa destruction reste lisible durablement plutot que de laisser un
  // simple trou vide dans la ville.
  function drawBuildingRubble() {
    for (const r of world.buildingRubble) {
      const p = worldToScreen(r.x, r.y);
      if (p.x<-150||p.x>view.w+150||p.y<-150||p.y>view.h+150) continue;
      const rng = mulberry32(Math.floor(r.seed*1e9));
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(p.x+4, p.y+4, r.w*0.42, r.h*0.42, 0, 0, Math.PI*2); ctx.fill();
      const n = 10 + Math.floor(rng()*8);
      for (let i=0;i<n;i++) {
        const rx = p.x + (rng()-0.5)*r.w*0.85;
        const ry = p.y + (rng()-0.5)*r.h*0.85;
        const size = 6 + rng()*14;
        ctx.fillStyle = rng()<0.5 ? '#3a362e' : '#57503f';
        ctx.save();
        ctx.translate(rx, ry);
        ctx.rotate(rng()*Math.PI*2);
        ctx.fillRect(-size/2, -size/2, size, size*0.7);
        ctx.restore();
      }
      // Quelques eclats plus clairs (beton casse) pour varier la texture
      for (let i=0;i<5;i++) {
        const rx = p.x + (rng()-0.5)*r.w*0.7;
        const ry = p.y + (rng()-0.5)*r.h*0.7;
        ctx.fillStyle = 'rgba(160,150,130,0.5)';
        ctx.beginPath(); ctx.arc(rx, ry, 3+rng()*4, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // Batiments vus strictement du dessus : le rectangle visible EST le toit,
  // pas une facade. Avant, des "fenetres" y etaient dessinees comme sur un
  // immeuble vu de face, ce qui est incoherent en vue aerienne (priorite
  // rouge de la revue). Le toit a maintenant une vraie texture de materiau
  // (tar/gravier/beton), un rebord/gouttiere sur tout le pourtour, et des
  // petits equipements poses dessus (events, trappes, tuyaux) a la place
  // des fenetres.
  function drawBuildings(){
    for(const b of world.buildings){
      const p=worldToScreen(b.x,b.y);
      if(p.x<-220||p.x>view.w+220||p.y<-220||p.y>view.h+220)continue;
      const left=p.x-b.w/2, top=p.y-b.h/2;

      // Ombre portee au sol : lumiere ambiante venant du nord-ouest, donc
      // l'ombre s'etend vers le sud-est (decalage positif x/y), coherente
      // sur tous les batiments plutot qu'un decalage arbitraire.
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.fillRect(left+7,top+9,b.w,b.h);

      // Base du toit : degrade selon le materiau, plus sombre en bas-droite
      // (oppose a la source de lumiere) pour donner un leger volume malgre
      // la vue strictement aerienne.
      const facade = b.facade || '#23262b';
      const grad = ctx.createLinearGradient(left, top, left+b.w, top+b.h);
      grad.addColorStop(0, lightenHex(facade, 12));
      grad.addColorStop(1, darkenHex(facade, 12));
      ctx.fillStyle = grad;
      ctx.fillRect(left, top, b.w, b.h);

      drawRoofTexture(b, left, top);

      // Rebord/gouttiere sur tout le pourtour (remplace l'ancien liseret
      // rouge fin) : plus sombre que la surface, lit comme le bord releve
      // d'un toit-terrasse.
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 3;
      ctx.strokeRect(left+1.5, top+1.5, b.w-3, b.h-3);
      ctx.strokeStyle = 'rgba(255,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, b.w, b.h);

      drawBuildingRoof(b, left, top);

      // Petits equipements de toit (bouches d'aeration, trappe, tuyau) a la
      // place des fenetres : coherents avec une surface de toit reelle.
      for (const prop of b.roofProps || []) {
        drawRoofProp(prop, p.x + prop.rx, p.y + prop.ry);
      }
    }
  }

  // Texture de la surface du toit elle-meme (avant : aplat uni). Trois
  // materiaux pour casser l'uniformite entre batiments voisins.
  function drawRoofTexture(b, left, top) {
    ctx.save();
    ctx.beginPath(); ctx.rect(left, top, b.w, b.h); ctx.clip();
    if (b.roofMaterial === 'gravel') {
      // Gravier : semis de petits points, densite fixe par batiment (seed)
      const n = Math.floor((b.w*b.h)/70);
      const rng2 = mulberry32(Math.floor(b.roofSeed*1e9));
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      for (let i=0;i<n;i++) {
        const gx = left + rng2()*b.w, gy = top + rng2()*b.h;
        ctx.fillRect(gx, gy, 1.5, 1.5);
      }
    } else if (b.roofMaterial === 'tar') {
      // Goudron : bandes de lés legerement visibles (toits en membrane bitumee)
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      const step = 14;
      for (let x=left+step; x<left+b.w; x+=step) {
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top+b.h); ctx.stroke();
      }
    } else {
      // Beton : quelques fissures fines, plus clair et plus "propre" que le goudron
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      const rng2 = mulberry32(Math.floor(b.roofSeed*1e9)+1);
      for (let i=0;i<3;i++) {
        const sx = left+rng2()*b.w, sy = top+rng2()*b.h;
        ctx.beginPath(); ctx.moveTo(sx,sy);
        ctx.lineTo(sx+(rng2()-0.5)*30, sy+(rng2()-0.5)*30);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Petit equipement pose sur le toit (remplace les fenetres) : vu strictement
  // du dessus, donc rendu comme une forme plate + ombre courte, jamais une
  // elevation qui "monterait" sur l'ecran.
  function drawRoofProp(prop, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(prop.rot);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 2, 14, 12); // ombre courte vers le sud-est, coherente avec l'ombre du batiment (lumiere nord-ouest)
    if (prop.kind === 'vent') {
      // Bouche d'aeration : grille circulaire avec pales
      ctx.fillStyle = '#2c2c2c';
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      for (let a=0;a<4;a++){ const ang=a*Math.PI/2+prop.seed; ctx.beginPath(); ctx.moveTo(Math.cos(ang)*2,Math.sin(ang)*2); ctx.lineTo(Math.cos(ang)*6,Math.sin(ang)*6); ctx.stroke(); }
    } else if (prop.kind === 'hatch') {
