<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0A1628" />
<title>NEON RUSH — Infinite Tunnel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0A1628; color: #ffffff;
    font-family: 'Orbitron', ui-monospace, 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; z-index: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1.5rem;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(139, 92, 246, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse at center, rgba(10,22,40,0.55) 0%, rgba(10,22,40,0.95) 75%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: fadeIn 0.35s ease-out;
  }
  .overlay.hidden { display: none !important; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .title {
    font-size: clamp(2.2rem, 10vw, 4rem);
    letter-spacing: 0.28em;
    font-weight: 900;
    background: linear-gradient(90deg, #00D9FF 0%, #8B5CF6 50%, #FF2D78 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 24px rgba(0, 217, 255, 0.35));
    margin-bottom: 0.6rem; text-align: center;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.35)); }
    50%      { filter: drop-shadow(0 0 40px rgba(255, 45, 120, 0.5)); }
  }
  .subtitle {
    font-size: 0.75rem; letter-spacing: 0.45em;
    color: #8B5CF6; text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  .btn {
    padding: 1.1rem 3.2rem;
    background: transparent;
    border: 2px solid #00D9FF;
    color: #00D9FF;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-family: inherit; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 32px rgba(0, 217, 255, 0.35),
                inset 0 0 22px rgba(0, 217, 255, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    position: relative;
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
  }
  .btn:hover, .btn:active {
    transform: translateY(-2px) scale(1.03);
    background: rgba(0, 217, 255, 0.08);
    box-shadow: 0 0 60px rgba(0, 217, 255, 0.6),
                inset 0 0 32px rgba(0, 217, 255, 0.18);
  }
  .btn.magenta {
    border-color: #FF2D78; color: #FF2D78;
    box-shadow: 0 0 32px rgba(255, 45, 120, 0.35),
                inset 0 0 22px rgba(255, 45, 120, 0.08);
  }
  .btn.magenta:hover, .btn.magenta:active {
    background: rgba(255, 45, 120, 0.08);
    box-shadow: 0 0 60px rgba(255, 45, 120, 0.6),
                inset 0 0 32px rgba(255, 45, 120, 0.18);
  }
  .instructions {
    margin-top: 2.5rem;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    line-height: 2;
    text-transform: uppercase;
  }
  .instructions .accent { color: #00D9FF; }
  .hud {
    position: fixed; top: max(1rem, env(safe-area-inset-top, 0px)); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0.4rem clamp(0.8rem, 3.5vw, 1.6rem); z-index: 5;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    gap: 0.5rem;
  }
  .hud.hidden { display: none !important; }
  .hud-stats { display: flex; flex-direction: column; gap: 4px; }
  .stat-row { display: flex; align-items: baseline; gap: 0.5em; }
  .stat-row .label { width: 3.4em; }
  .speed-value { color: #FF2D78; text-shadow: 0 0 18px rgba(255, 45, 120, 0.75); }
  .best-value { color: #8B5CF6; text-shadow: 0 0 18px rgba(139, 92, 246, 0.7); }
  .speed-unit { font-size: 0.5em; letter-spacing: 0.05em; margin-left: 0.15em; opacity: 0.7; }
  .label {
    font-size: clamp(0.5rem, 2vw, 0.6rem); letter-spacing: 0.24em;
    color: rgba(0, 217, 255, 0.7);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .value {
    font-size: clamp(1.05rem, 5vw, 1.7rem); font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 18px rgba(0, 217, 255, 0.75);
    line-height: 1;
    white-space: nowrap;
  }
  .pause-btn {
    pointer-events: auto;
    width: 42px; height: 42px;
    flex-shrink: 0;
    background: rgba(10, 22, 40, 0.5);
    border: 2px solid rgba(0, 217, 255, 0.6);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(0, 217, 255, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .pause-btn:hover, .pause-btn:active {
    transform: scale(1.06);
    background: rgba(0, 217, 255, 0.12);
    box-shadow: 0 0 28px rgba(0, 217, 255, 0.5);
  }
  .pause-bar {
    width: 5px; height: 16px;
    background: #00D9FF;
    border-radius: 1px;
    box-shadow: 0 0 8px rgba(0, 217, 255, 0.9);
  }
  .wave-timer {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: max(4.6rem, calc(env(safe-area-inset-top, 0px) + 3.6rem));
    width: min(60%, 260px); height: 5px;
    background: rgba(255,255,255,0.12);
    border-radius: 3px; overflow: hidden; z-index: 5;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(255, 45, 120, 0.3);
  }
  .wave-timer.hidden { display: none !important; }
  .wave-timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #FF2D78, #8B5CF6);
    transform-origin: left; transform: scaleX(1);
    box-shadow: 0 0 10px rgba(255, 45, 120, 0.7);
  }
  .end-title {
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    letter-spacing: 0.4em;
    color: #FF2D78;
    text-shadow: 0 0 28px rgba(255, 45, 120, 0.6);
    margin-bottom: 2rem;
    text-transform: uppercase;
  }
  .revive-title { color: #00D9FF; text-shadow: 0 0 28px rgba(0,217,255,0.6); }
  .btn-small {
    margin-top: 1rem;
    padding: 0.7rem 2rem;
    font-size: 0.8rem;
    opacity: 0.75;
  }
  .revive-count { font-variant-numeric: tabular-nums; }
  .end-label {
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
  }
  .final-score {
    font-size: clamp(3rem, 14vw, 5.5rem);
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 36px rgba(0, 217, 255, 0.7);
    margin: 0.4rem 0 1.6rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .final-best {
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    color: #8B5CF6;
    margin-bottom: 2.2rem;
    text-transform: uppercase;
  }
  .final-best .best-num { color: #ffffff; font-weight: 700; margin-left: 0.5em; }
  .new-record {
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    color: #FF2D78;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    animation: blink 0.9s ease-in-out infinite;
  }
  .new-record.hidden { display: none; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .near-record {
    font-size: 0.95rem;
    letter-spacing: 0.28em;
    color: #C9A84C;
    text-shadow: 0 0 20px rgba(201, 168, 76, 0.7);
    text-transform: uppercase;
    margin-bottom: 1.4rem;
    text-align: center;
    animation: nearPulse 1.1s ease-in-out infinite;
  }
  .near-record.hidden { display: none; }
  .near-record .np-num { color: #ffffff; font-weight: 900; }
  @keyframes nearPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(201,168,76,0.4)); }
    50%      { transform: scale(1.06); filter: drop-shadow(0 0 18px rgba(201,168,76,0.8)); }
  }
  .end-wave {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 2rem;
  }
  .end-wave .ew-num { color: #8B5CF6; font-weight: 700; margin-left: 0.4em; }
  .end-wave.hidden { display: none; }
  .end-stats {
    display: flex; gap: 2.5rem; justify-content: center;
    margin-bottom: 2rem;
  }
  .end-stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .end-stat .es-num {
    font-size: 1.8rem; font-weight: 900; color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 16px rgba(0, 217, 255, 0.6);
  }
  .end-stat .es-lbl {
    font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .wave-banner {
    position: fixed; left: 0; right: 0; top: 38%;
    text-align: center; z-index: 6;
    pointer-events: none;
    opacity: 0;
  }
  .wave-banner.show { animation: waveIn 1.9s ease-out; }
  .wave-banner .wb-main {
    font-size: clamp(1.8rem, 8vw, 2.8rem);
    font-weight: 900; letter-spacing: 0.3em;
    color: #FF2D78;
    text-shadow: 0 0 30px rgba(255, 45, 120, 0.8);
    text-transform: uppercase;
  }
  .wave-banner .wb-sub {
    font-size: 0.7rem; letter-spacing: 0.45em;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase; margin-top: 0.5rem;
  }
  @keyframes waveIn {
    0%   { opacity: 0; transform: translateY(14px) scale(0.92); }
    15%  { opacity: 1; transform: translateY(0) scale(1); }
    80%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(1); }
  }
  .combo-wrap {
    position: fixed; top: 4.6rem; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    z-index: 5; pointer-events: none;
    opacity: 0; transition: opacity 0.2s ease;
  }
  .combo-wrap.show { opacity: 1; }
  .combo-mult {
    font-size: 2.6rem; font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #C9A84C;
    text-shadow: 0 0 22px rgba(201, 168, 76, 0.8);
    line-height: 1;
    transition: transform 0.12s ease;
  }
  .combo-mult.bump { transform: scale(1.35); }
  .combo-label {
    font-size: 0.55rem; letter-spacing: 0.4em;
    color: rgba(201, 168, 76, 0.7);
    text-transform: uppercase; margin-top: 3px;
  }
  .combo-bar {
    width: 76px; height: 3px; margin-top: 6px;
    background: rgba(255,255,255,0.12); border-radius: 2px;
    overflow: hidden;
  }
  .combo-bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #C9A84C, #FF2D78);
    transform-origin: left; transform: scaleX(1);
  }
  .toast-layer {
    position: fixed; inset: 0; z-index: 6;
    pointer-events: none; overflow: hidden;
  }
  .toast {
    position: absolute; left: 50%; top: 58%;
    transform: translate(-50%, 0);
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: #00D9FF; text-shadow: 0 0 16px rgba(0,217,255,0.9);
    white-space: nowrap;
    animation: toastRise 0.75s ease-out forwards;
  }
  .toast.gold { color: #C9A84C; text-shadow: 0 0 16px rgba(201,168,76,0.9); }
  @keyframes toastRise {
    0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
    20%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }
  .flash {
    position: fixed; inset: 0; z-index: 4;
    pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(0,217,255,0.18), transparent 60%);
  }
  .flash.fire { animation: flashPulse 0.28s ease-out; }
  @keyframes flashPulse { 0% { opacity: 1; } 100% { opacity: 0; } }
  .tap-zones {
    position: fixed; inset: 0; z-index: 3;
    display: none; pointer-events: none;
  }
  .tap-zones.mobile { display: block; }
  .tap-zone {
    position: absolute; top: 0; bottom: 0; width: 50%;
    opacity: 0; transition: opacity 0.12s ease;
  }
  .tap-left {
    left: 0;
    background: linear-gradient(90deg, rgba(0,217,255,0.14), transparent);
  }
  .tap-right {
    right: 0;
    background: linear-gradient(270deg, rgba(0,217,255,0.14), transparent);
  }
  .tap-zone.lit { opacity: 1; }
  .credit {
    position: fixed; bottom: 0.8rem; left: 0; right: 0;
    text-align: center;
    font-size: 0.6rem;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.22);
    z-index: 11;
    pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="game"></div>
<div class="hud hidden" id="hud">
  <div class="hud-stats">
    <div class="stat-row"><span class="label">Score</span><span class="value" id="scoreVal" data-testid="score-value">0</span></div>
    <div class="stat-row"><span class="label">Speed</span><span class="value speed-value" id="speedVal">0<span class="speed-unit">km/h</span></span></div>
    <div class="stat-row"><span class="label">Best</span><span class="value best-value" id="bestVal" data-testid="best-value">0</span></div>
  </div>
  <button class="pause-btn" id="pauseBtn" data-testid="pause-btn" aria-label="Pause">
    <span class="pause-bar"></span>
    <span class="pause-bar"></span>
  </button>
</div>
<div class="wave-timer hidden" id="waveTimer">
  <div class="wave-timer-fill" id="waveTimerFill"></div>
</div>
<div class="combo-wrap" id="comboWrap">
  <div class="combo-mult" id="comboMult">x2</div>
  <div class="combo-label">Combo</div>
  <div class="combo-bar"><div class="combo-bar-fill" id="comboBarFill"></div></div>
</div>
<div class="flash" id="flash"></div>
<div class="tap-zones" id="tapZones">
  <div class="tap-zone tap-left" id="tapLeft"></div>
  <div class="tap-zone tap-right" id="tapRight"></div>
</div>
<div class="toast-layer" id="toastLayer"></div>
<div class="overlay" id="startScreen" data-testid="start-screen">
  <div class="title">NEON RUSH</div>
  <div class="subtitle">Infinite Tunnel</div>
  <button class="btn" id="startBtn" data-testid="start-btn">Start</button>
  <div class="instructions">
    <div><span class="accent">&#9668; &#9658;</span> or <span class="accent">A / D</span></div>
    <div>Tap left / right on mobile</div>
    <div>Dodge &middot; Collect &middot; Survive</div>
  </div>
</div>
<div class="overlay hidden" id="reviveScreen" data-testid="revive-screen">
  <div class="end-title revive-title">Crashed</div>
  <div class="end-label">Score</div>
  <div class="final-score" id="reviveScore">0</div>
  <button class="btn" id="reviveBtn" data-testid="revive-btn">
    Revive <span class="revive-count" id="reviveCount">(3)</span>
  </button>
  <button class="btn magenta btn-small" id="reviveGiveUp" data-testid="giveup-btn">No thanks</button>
</div>
<div class="overlay hidden" id="endScreen" data-testid="end-screen">
  <div class="end-title">Game Over</div>
  <div class="new-record hidden" id="newRecord">&#9670; New Record &#9670;</div>
  <div class="near-record hidden" id="nearRecord"><span class="np-num" id="nearNum">0</span> pts from record</div>
  <div class="end-label">Score</div>
  <div class="final-score" id="finalScore" data-testid="final-score">0</div>
  <div class="final-best">Best<span class="best-num" id="finalBest">0</span></div>
  <div class="end-stats">
    <div class="end-stat"><span class="es-num" id="endWaveNum">0</span><span class="es-lbl">Waves</span></div>
    <div class="end-stat"><span class="es-num" id="endTopSpeed">0</span><span class="es-lbl">Top km/h</span></div>
  </div>
  <button class="btn magenta" id="restartBtn" data-testid="restart-btn">Play again</button>
</div>
<div class="overlay hidden" id="pauseScreen" data-testid="pause-screen">
  <div class="title" style="font-size: clamp(1.8rem, 8vw, 3rem);">Paused</div>
  <button class="btn" id="resumeBtn" data-testid="resume-btn">Resume</button>
  <button class="btn magenta btn-small" id="quitBtn" data-testid="quit-btn">Quit</button>
</div>
<div class="wave-banner" id="waveBanner">
  <div class="wb-main" id="waveBannerMain">Wave 1</div>
  <div class="wb-sub" id="waveBannerSub">Hold on</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function () {
  'use strict';
  // ============ Constants ============
  const CYAN    = 0x00D9FF;
  const PURPLE  = 0x8B5CF6;
  const MAGENTA = 0xFF2D78;
  const BG      = 0x0A1628;
  // Base tunnel dimensions (landscape reference). Width is adapted at runtime
  // to the screen aspect ratio so the tunnel never looks squashed in portrait.
  const TUNNEL_H     = 5;
  let   TUNNEL_W     = 6;           // recomputed in applyResponsiveLayout()
  let   FLOOR_Y      = -TUNNEL_H / 2;
  let   LANES        = [-1.8, 0, 1.8];
  const LANE_FACTOR  = 0.36;        // lane offset as a fraction of tunnel width
  const RING_SPACING = 4;
  const RING_COUNT   = 40;
  const TUNNEL_LEN   = RING_COUNT * RING_SPACING;
  const START_SPEED = 0.55;
  // Cruise speed is reached FAST at the start (a couple of seconds), then the
  // cap creeps up by +1% every 5 seconds for a slow, endless progression.
  // A high safety ceiling keeps the game humanly playable; raise CRUISE_MAX_CAP
  // (or remove the clamp) if you want it to climb forever.
  const CRUISE_BASE   = 0.78;    // cruise speed reached at the start
  const CRUISE_STEP   = 0.01;    // +1% of CRUISE_BASE per interval
  const CRUISE_STEP_SEC = 5;     // every 5 seconds
  const CRUISE_MAX_CAP = 1.35;   // safety ceiling (playability). Raise/remove to taste.
  const MAX_SPEED   = CRUISE_MAX_CAP; // used elsewhere as the absolute reference
  const SHIP_Z      = 1.0;
  // Responsive state
  let aspect      = window.innerWidth / window.innerHeight;
  let isPortrait  = aspect < 1;
  // ============ DOM ============
  const container   = document.getElementById('game');
  const startScreen = document.getElementById('startScreen');
  const endScreen   = document.getElementById('endScreen');
  const hud         = document.getElementById('hud');
  const scoreEl     = document.getElementById('scoreVal');
  const speedEl     = document.getElementById('speedVal');
  const bestEl      = document.getElementById('bestVal');
  const finalScoreEl= document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const newRecordEl = document.getElementById('newRecord');
  const reviveScreen= document.getElementById('reviveScreen');
  const reviveScoreEl= document.getElementById('reviveScore');
  const reviveBtn   = document.getElementById('reviveBtn');
  const reviveCountEl= document.getElementById('reviveCount');
  const reviveGiveUp= document.getElementById('reviveGiveUp');
  const nearRecordEl= document.getElementById('nearRecord');
  const nearNumEl   = document.getElementById('nearNum');
  const endWaveNumEl= document.getElementById('endWaveNum');
  const endTopSpeedEl= document.getElementById('endTopSpeed');
  const pauseBtn    = document.getElementById('pauseBtn');
  const pauseScreen = document.getElementById('pauseScreen');
  const resumeBtn   = document.getElementById('resumeBtn');
  const quitBtn     = document.getElementById('quitBtn');
  const waveTimerEl = document.getElementById('waveTimer');
  const waveTimerFill= document.getElementById('waveTimerFill');
  const waveBanner  = document.getElementById('waveBanner');
  const waveBannerMain = document.getElementById('waveBannerMain');
  const waveBannerSub  = document.getElementById('waveBannerSub');
  const comboWrap   = document.getElementById('comboWrap');
  const comboMultEl = document.getElementById('comboMult');
  const comboBarEl  = document.getElementById('comboBarFill');
  const flashEl     = document.getElementById('flash');
  const toastLayer  = document.getElementById('toastLayer');
  const tapZonesEl  = document.getElementById('tapZones');
  const tapLeftEl   = document.getElementById('tapLeft');
  const tapRightEl  = document.getElementById('tapRight');
  // ============ Three.js core ============
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(BG, 22, 95);
  const camera = new THREE.PerspectiveCamera(72, aspect, 0.1, 220);
  const baseCam = new THREE.Vector3(0, FLOOR_Y + 2.0, 5.2);
  camera.position.copy(baseCam);
  camera.lookAt(0, FLOOR_Y + 0.6, -14);
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(BG, 1);
  container.appendChild(renderer.domElement);
  // ============ Faux bloom : glow additif ============
  // WebGL ne gère pas linewidth de façon fiable. On simule le halo néon en
  // superposant, pour chaque tracé, un coeur vif (blending additif) plus des
  // halos larges translucides construits par décalage géométrique. L'addition

        const r = rings[i];
        r.group.position.z += speed;
        if (r.group.position.z > 7) r.group.position.z -= TUNNEL_LEN;
        const ph = colorPhase + r.group.position.z * 0.015;
        const col = ringColorAt(ph);
        r.coreMat.color.copy(col);
        const op = 0.55 + 0.4 * (Math.sin(pulseT * 3 + i * 0.4) * 0.5 + 0.5);
        r.coreMat.opacity = op;
        r.haloMats.forEach(m => { m.color.copy(col); m.opacity = op * 0.22; });
      }
      const arr = pGeo.attributes.position.array;
      const pSpeed = speed * 1.4;
      for (let i = 0; i < PCOUNT; i++) {
        arr[i*3+2] += pSpeed;
        if (arr[i*3+2] > 8) {
          arr[i*3]   = (Math.random() - 0.5) * TUNNEL_W * 1.3;
          arr[i*3+1] = (Math.random() - 0.5) * TUNNEL_H * 1.3;
          arr[i*3+2] = -TUNNEL_LEN + Math.random() * 20;
        }
      }
      pGeo.attributes.position.needsUpdate = true;
      // Sol défilant (damier rétro) — même recyclage que les anneaux.
      for (let i = 0; i < floorLines.length; i++) {
        const fl = floorLines[i];
        fl.position.z += speed;
        if (fl.position.z > 8) fl.position.z -= TUNNEL_LEN;
      }
      obsCooldown -= speed;
      if (obsCooldown <= 0) {
        spawnObstacle(inWave);
        // Gap between obstacles, driven by the two knobs at the top of the file
        // (OBSTACLE_GAP_CALM / OBSTACLE_GAP_WAVE). Converted from seconds to
        // distance via current speed so reaction time stays constant at any speed.
        const fps = 60;
        const gapSec = Math.max(REACT_FLOOR, inWave ? OBSTACLE_GAP_WAVE : OBSTACLE_GAP_CALM);
        const jitter = inWave ? 0.2 : 0.6;
        obsCooldown = speed * fps * gapSec + Math.random() * (speed * fps * jitter);
      }
      orbCooldown -= speed;
      if (orbCooldown <= 0) {
        if (!inWave) spawnOrb();       // no orbs during a wave
        orbCooldown = 12 + Math.random() * 18;
      }
      if ((distance % 0.7) < speed) spawnTrailNode();
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.group.position.z += speed;
        if (invincible <= 0 && o.group.position.z > SHIP_Z - 0.6 && o.group.position.z < SHIP_Z + 0.6 && o.lanes[currentLane]) {
          die();
          break;
        }
        // Near-miss: obstacle just passed the ship without collision, and an
        // adjacent lane was blocked = genuine close call.
        if (!o.scored && o.group.position.z > SHIP_Z + 0.6) {
          o.scored = true;
          const left  = currentLane > 0 && o.lanes[currentLane - 1];
          const right = currentLane < 2 && o.lanes[currentLane + 1];
          if (left || right) {
            addCombo();
            scorePoints(NEARMISS_BASE, false, 'Near miss');
            fireFlash();
            playNearMiss();
          }
        }
        if (o.group.position.z > 10) {
          scene.remove(o.group);
          obstacles.splice(i, 1);
        }
      }
      for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        o.mesh.position.z += speed;
        o.mesh.rotation.y += dt * 3.5;
        o.mesh.position.y = FLOOR_Y + 1.05 + Math.sin(pulseT * 4 + i) * 0.1;
        if (!o.collected && o.mesh.position.z > SHIP_Z - 0.6 && o.mesh.position.z < SHIP_Z + 0.6 && o.lane === currentLane) {
          o.collected = true;
          addCombo();
          scorePoints(ORB_BASE, true, null);
          playOrbSound();
          scene.remove(o.mesh);
          orbs.splice(i, 1);
          continue;
        }
        // Orbe manquée : elle dépasse le vaisseau sans avoir été prise → casse le combo.
        if (!o.collected && o.mesh.position.z > SHIP_Z + 0.6) {
          o.collected = true; // évite double comptage
          breakCombo();
        }
        if (o.mesh.position.z > 10) {
          scene.remove(o.mesh);
          orbs.splice(i, 1);
        }
      }
    } else {
      // Revive screen countdown: auto game-over if the player doesn't decide.
      if (state === 'revive' && reviveCountdown > 0) {
        reviveCountdown -= dt;
        reviveCountEl.textContent = '(' + Math.max(0, Math.ceil(reviveCountdown)) + ')';
        if (reviveCountdown <= 0) endGame();
      }
      colorPhase += dt * 0.06;
      for (let i = 0; i < rings.length; i++) {
        const r = rings[i];
        r.group.position.z += 0.08;
        if (r.group.position.z > 7) r.group.position.z -= TUNNEL_LEN;
        const col = ringColorAt(colorPhase + r.group.position.z * 0.015);
        r.coreMat.color.copy(col);
        const op = 0.6 + 0.3 * (Math.sin(pulseT * 2 + i * 0.3) * 0.5 + 0.5);
        r.coreMat.opacity = op;
        r.haloMats.forEach(m => { m.color.copy(col); m.opacity = op * 0.22; });
      }
      const arr = pGeo.attributes.position.array;
      for (let i = 0; i < PCOUNT; i++) {
        arr[i*3+2] += 0.08;
        if (arr[i*3+2] > 8) {
          arr[i*3]   = (Math.random() - 0.5) * TUNNEL_W * 1.3;
          arr[i*3+1] = (Math.random() - 0.5) * TUNNEL_H * 1.3;
          arr[i*3+2] = -TUNNEL_LEN + Math.random() * 20;
        }
      }
      pGeo.attributes.position.needsUpdate = true;
      for (let i = 0; i < floorLines.length; i++) {
        const fl = floorLines[i];
        fl.position.z += 0.08;
        if (fl.position.z > 8) fl.position.z -= TUNNEL_LEN;
      }
    }
    for (let i = trailNodes.length - 1; i >= 0; i--) {
      const n = trailNodes[i];
      n.mesh.position.z += speed * 1.1;
      n.life -= dt * 2.5;
      n.mesh.material.opacity = Math.max(0, n.life * 0.7);
      n.mesh.scale.setScalar(1 + (1 - n.life) * 0.8);
      n.mesh.lookAt(camera.position);
      if (n.life <= 0 || n.mesh.position.z > 12) {
        scene.remove(n.mesh);
        trailNodes.splice(i, 1);
      }
    }
    if (explosion) {
      explosion.life -= dt * 1.1;
      const pos = explosion.mesh.geometry.attributes.position;
      for (let i = 0; i < explosion.vels.length; i++) {
        pos.array[i*3]   += explosion.vels[i].x;
        pos.array[i*3+1] += explosion.vels[i].y;
        pos.array[i*3+2] += explosion.vels[i].z;
        explosion.vels[i].multiplyScalar(0.94);
      }
      pos.needsUpdate = true;
      explosion.mesh.material.opacity = Math.max(0, explosion.life);
      if (explosion.life <= 0) {
        scene.remove(explosion.mesh);
        explosion = null;
      }
    }
    let camX = baseCam.x, camY = baseCam.y;
    if (state === 'playing') camX += shipGroup.position.x * 0.18;
    if (shake > 0) {
      camX += (Math.random() - 0.5) * shake * 0.55;
      camY += (Math.random() - 0.5) * shake * 0.55;
      shake = Math.max(0, shake - dt * 3.2);
    }
    camera.position.set(camX, camY, baseCam.z);
  }
  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, clock.getDelta());
    update(dt);
    renderer.render(scene, camera);
  }
  loop();
})();
</script>
